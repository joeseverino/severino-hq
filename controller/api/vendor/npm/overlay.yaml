overlay: 1.0.0
info:
  title: NPM's wire types
  version: 1.0.0
actions:
  # NPM answers a boolean as true/false or 1/0, by release and database.
  - target: $..[?(@.type == 'boolean')]
    update:
      x-go-type: Flag
  # Ids are whole numbers, written as a number or a decimal string.
  - target: $.components.schemas.id
    update:
      x-go-type: ID
  - target: $.components.schemas.access_list_id
    update:
      x-go-type: ID
  # Read back, a certificate id is a number; "new" is only ever sent.
  - target: $.components.schemas.certificate_id
    update:
      x-go-type: ID
  # NPM's own values HQ never reads: a proxy host's are carried forward on
  # update as NPM wrote them, and a certificate's meta holds its key.
  - target: $..properties.meta
    update:
      x-go-type: json.RawMessage
  - target: $..properties.locations
    update:
      x-go-type: json.RawMessage
  # One string whichever pattern it matches.
  - target: $.components.schemas.address
    update:
      x-go-type: string
  - target: $.components.schemas.forwarding_host
    update:
      x-go-type: string
  - target: $.components.schemas['stream-object'].properties.forwarding_host
    update:
      x-go-type: string
  # The access list endpoint answers a list, each entry carrying the items and
  # clients its expand names, and takes several expansions joined by commas.
  - target: $.components.schemas['access-list-object'].properties
    update:
      items:
        $ref: '#/components/schemas/access_items'
      clients:
        $ref: '#/components/schemas/access_clients'
  - target: $.paths['/nginx/access-lists'].get.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/nginx/access-lists'].get.responses['200'].content['application/json']
    update:
      schema:
        type: array
        items:
          $ref: '#/components/schemas/access-list-object'
  - target: $.paths['/nginx/access-lists'].get.parameters[0].schema
    remove: true
  - target: $.paths['/nginx/access-lists'].get.parameters[0]
    update:
      explode: false
      schema:
        type: array
        items:
          type: string
          enum: [owner, items, clients, proxy_hosts]
  # oapi-codegen writes a schema's examples into the generated doc comments,
  # and the vendors' examples are addresses and hostnames HQ never sends.
  - target: $..example
    remove: true
  - target: $..examples
    remove: true
