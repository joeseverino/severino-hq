# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.9.0/configuration-schema.json
package: npmapi
output: npm.gen.go
generate:
  models: true
  client: true
output-options:
  client-type-name: API
  response-type-suffix: Reply
  # An optional field is left out when unset, nullable or not, so a value the
  # other side reads as unknown is never sent as null or a zero value.
  struct-tags:
    tags:
      - name: json
        template: '{{.FieldName}}{{if or .OmitEmpty .IsOptional}},omitempty{{end}}{{if .OmitZero}},omitzero{{end}}'
  overlay:
    path: ../../api/vendor/npm/overlay.yaml
  skip-prune: false
  # The operations HQ calls.
  include-operation-ids:
    - createCertificate
    - createProxyHost
    - deleteCertificate
    - deleteProxyHost
    - getAccessLists
    - getCertificates
    - getDeadHosts
    - getProxyHosts
    - getRedirectionHosts
    - getStreams
    - requestToken
    - updateProxyHost
    - uploadCertificate
    - validateCertificates
