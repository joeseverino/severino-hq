# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: adguardapi
output: adguard.gen.go
generate:
  models: true
output-options:
  overlay:
    path: ../../api/vendor/adguard/overlay.yaml
  include-operation-ids:
    - clientsStatus
    - dnsInfo
    - filteringStatus
    - getQueryLogConfig
    - queryLog
    - rewriteAdd
    - rewriteDelete
    - rewriteList
    - rewriteSettingsGet
    - rewriteUpdate
    - status
