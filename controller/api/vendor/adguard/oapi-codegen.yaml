# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.9.0/configuration-schema.json
package: adguardapi
output: adguard.gen.go
generate:
  models: true
  client: true
  server-urls: true
output-options:
  # The spec's own schemas are named Client and GetQueryLogConfigResponse.
  client-type-name: API
  response-type-suffix: Reply
  overlay:
    path: ../../api/vendor/adguard/overlay.yaml
  include-operation-ids:
    - clientsStatus
    - dnsInfo
    - filteringStatus
    - getQueryLogConfig
    - queryLog
    - rewriteAdd
    - rewriteDelete
    - rewriteList
    - rewriteSettingsGet
    - rewriteUpdate
    - status
