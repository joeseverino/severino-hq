# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.9.0/configuration-schema.json
package: cfapi
output: cloudflare.gen.go
generate:
  models: true
  client: true
  server-urls: true
output-options:
  client-type-name: API
  response-type-suffix: Reply
  # An optional field is left out when unset, nullable or not, so a value the
  # other side reads as unknown is never sent as null or a zero value.
  struct-tags:
    tags:
      - name: json
        template: '{{.FieldName}}{{if or .OmitEmpty .IsOptional}},omitempty{{end}}{{if .OmitZero}},omitzero{{end}}'
  overlay:
    path: ../../api/vendor/cloudflare/overlay.yaml
  skip-prune: true
  prefer-skip-optional-pointer: true
  name-normalizer: ToCamelCaseWithInitialisms
  include-operation-ids:
    - accounts-list-accounts
    - access-applications-list-access-applications
    - access-service-tokens-list-service-tokens
    - certificate-packs-list-certificate-packs
    - cloudflare-tunnel-configuration-get-configuration
    - cloudflare-tunnel-list-cloudflare-tunnel-connections
    - cloudflare-tunnel-list-cloudflare-tunnels
    - d1-get-database
    - d1-list-databases
    - d1-query-database
    - dns-records-for-a-zone-create-dns-record
    - dns-records-for-a-zone-delete-dns-record
    - dns-records-for-a-zone-list-dns-records
    - dns-records-for-a-zone-update-dns-record
    - getWorkerVersion
    - getZoneRuleset
    - listZoneRulesets
    - page-rules-list-page-rules
    - pages-project-get-projects
    - registrar-domain-registration-list
    - user-api-tokens-verify-token
    - web-analytics-list-sites
    - worker-deployments-list-deployments
    - worker-script-list-workers
    - zone-settings-get-single-setting
    - zones-get
