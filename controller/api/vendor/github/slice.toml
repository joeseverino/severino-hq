# What ../slice.py keeps of GitHub's REST description; the operations are oapi-codegen.yaml's.
strip = ["readOnly", "writeOnly", "format", "default"]
drop-examples = true
sends = ["apps/create-installation-access-token", "checks/create", "checks/update", "issues/create-comment"]

[decodes]
"actions/get-github-actions-default-workflow-permissions-repository" = ["actions-get-default-workflow-permissions"]
"actions/get-github-actions-permissions-repository" = ["actions-repository-permissions"]
"actions/get-job-for-workflow-run" = ["job"]
"actions/get-pending-deployments-for-run" = ["pending-deployment"]
"actions/list-artifacts-for-repo" = ["artifact"]
"actions/list-repo-variables" = ["actions-variable"]
"actions/list-repo-workflows" = ["workflow"]
"actions/list-self-hosted-runners-for-repo" = ["runner"]
"actions/list-workflow-runs" = ["workflow-run"]
"actions/list-workflow-runs-for-repo" = ["workflow-run"]
"activity/list-repos-starred-by-user" = ["starred-repository"]
"apps/create-installation-access-token" = ["installation-token"]
"apps/get-authenticated" = ["integration"]
"apps/get-repo-installation" = ["installation"]
"apps/list-installations" = ["installation"]
"apps/list-repos-accessible-to-installation" = ["repository"]
"checks/list-for-ref" = ["check-run"]
"code-scanning/list-alerts-for-repo" = ["code-scanning-alert-items"]
"dependabot/list-alerts-for-repo" = ["dependabot-alert"]
"issues/list-comments" = ["issue-comment"]
"pulls/list" = ["pull-request-simple"]
"rate-limit/get" = ["rate-limit-overview"]
"repos/check-automated-security-fixes" = ["check-automated-security-fixes"]
"repos/get" = ["full-repository"]
"repos/get-all-environments" = ["environment"]
"repos/get-branch-rules" = ["repository-rule-detailed"]
"repos/get-commit" = ["commit"]
"repos/get-content" = ["content-directory", "content-file"]
"repos/get-latest-release" = ["release"]
"repos/list-collaborators" = ["collaborator"]
"repos/list-deploy-keys" = ["deploy-key"]
"repos/list-deployment-statuses" = ["deployment-status"]
"repos/list-deployments" = ["deployment"]
"repos/list-pull-requests-associated-with-commit" = ["pull-request-simple"]
"repos/list-releases" = ["release"]
"secret-scanning/list-alerts-for-repo" = ["secret-scanning-alert"]
"security-advisories/list-repository-advisories" = ["repository-advisory"]
"users/get-by-username" = ["public-user"]

[keep]
"actions-get-default-workflow-permissions" = ["default_workflow_permissions", "can_approve_pull_request_reviews"]
"actions-repository-permissions" = ["allowed_actions", "sha_pinning_required"]
"actions-variable" = ["name"]
"app-permissions" = ["actions", "administration", "checks", "contents", "deployments", "metadata", "packages", "pull_requests", "secret_scanning_alerts", "security_events", "vulnerability_alerts"]
"artifact" = ["name", "expired", "expires_at", "workflow_run"]
"check-automated-security-fixes" = ["enabled"]
"check-run" = ["id", "status", "conclusion", "started_at", "name"]
"code-scanning-alert-items" = ["rule"]
"code-scanning-alert-rule-summary" = ["severity", "security_severity_level"]
"collaborator" = ["login", "role_name"]
"commit" = ["sha", "html_url", "commit", "author"]
"content-file" = ["content"]
"dependabot-alert" = ["security_advisory"]
"dependabot-alert-security-advisory" = ["severity"]
"deploy-key" = ["title", "created_at", "read_only", "last_used"]
"deployment" = ["id", "sha", "environment", "created_at"]
"deployment-branch-policy-settings" = ["protected_branches", "custom_branch_policies"]
"deployment-status" = ["state", "target_url", "log_url"]
"environment" = ["name", "protection_rules", "deployment_branch_policy"]
"full-repository" = ["private", "html_url", "default_branch", "visibility", "pushed_at"]
"installation" = ["id", "account"]
"installation-token" = ["token"]
"integration" = ["slug"]
"issue-comment" = ["body"]
"job" = ["steps"]
"nullable-git-user" = ["name", "date"]
"nullable-simple-user" = ["login"]
"pending-deployment" = ["environment"]
"public-user" = ["login", "name", "bio", "html_url", "avatar_url", "followers", "following", "public_repos", "public_gists", "created_at", "company", "location", "blog", "twitter_username", "hireable"]
"pull-request-simple" = ["html_url", "number", "title", "user", "updated_at", "merged_at", "head", "draft"]
"rate-limit" = ["remaining", "reset"]
"rate-limit-overview" = ["resources"]
"release" = ["html_url", "tag_name", "published_at"]
"repository" = ["full_name", "html_url", "description", "language", "stargazers_count"]
"repository-advisory" = ["ghsa_id", "cve_id", "html_url", "summary", "severity", "published_at"]
"repository-rule-detailed" = ["repository-rule-pull-request", "repository-rule-required-status-checks"]
"repository-rule-params-status-check-configuration" = ["context"]
"repository-rule-pull-request" = ["parameters"]
"repository-rule-required-status-checks" = ["parameters"]
"runner" = ["name", "status", "busy", "labels"]
"runner-label" = ["name"]
"secret-scanning-alert" = []
"simple-user" = ["login"]
"starred-repository" = ["starred_at", "repo"]
"team" = ["name"]
"workflow" = ["id", "name", "state"]
"workflow-run" = ["id", "name", "head_branch", "head_sha", "event", "status", "conclusion", "workflow_id", "html_url", "created_at", "updated_at"]
