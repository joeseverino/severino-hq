# What ../slice.py keeps of GitHub's REST description; the operations are oapi-codegen.yaml's.
strip = ["readOnly", "writeOnly", "format", "default"]
drop-examples = true
sends = ["apps/create-installation-access-token", "checks/create", "checks/update", "issues/create-comment", "pulls/merge"]
# GitHub answers each model bare, so the generated client decodes it, and
# [decodes] names only the variant of a union answer the provider reads.
answers = true
# The Dashboard's body alone is sent, so the rest of the issue stays as it is.
encodes = ["issues/update"]

[queries]
"actions/list-artifacts-for-repo" = ["per_page"]
"actions/list-repo-variables" = ["per_page"]
"actions/list-repo-workflows" = ["per_page"]
"actions/list-workflow-runs" = ["branch", "status", "per_page"]
"actions/list-workflow-runs-for-repo" = ["branch", "head_sha", "per_page"]
"activity/list-repos-starred-by-user" = ["per_page"]
"apps/list-installations" = ["per_page", "page"]
"apps/list-repos-accessible-to-installation" = ["per_page", "page"]
"checks/list-for-ref" = ["check_name", "app_id", "filter", "per_page"]
"checks/list-for-suite" = ["per_page"]
"code-scanning/list-alerts-for-repo" = ["state", "per_page"]
"dependabot/list-alerts-for-repo" = ["state", "per_page"]
"git/get-tree" = ["recursive"]
"issues/list-comments" = ["per_page"]
"issues/list-for-repo" = ["state", "sort", "per_page"]
"pulls/list" = ["state", "per_page"]
"pulls/list-files" = ["per_page"]
"repos/list-collaborators" = ["per_page"]
"repos/list-deploy-keys" = ["per_page"]
"repos/list-deployment-statuses" = ["per_page"]
"repos/list-deployments" = ["per_page"]
"repos/get-content" = ["ref"]
"repos/list-releases" = ["per_page"]
"secret-scanning/list-alerts-for-repo" = ["state", "per_page"]
"security-advisories/list-repository-advisories" = ["state", "sort", "direction", "per_page"]

[decodes]
"activity/list-repos-starred-by-user" = ["starred-repository"]
"repos/get-content" = ["content-file"]
"users/get-by-username" = ["public-user"]

