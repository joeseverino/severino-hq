# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: runtime
output: ../runtime/bridge.gen.go
generate:
  models: true
  # Request builders for every operation: the bridge's paths and parameters
  # reach the controller as code, never as strings it spells itself.
  client: true
output-options:
  skip-prune: true
  prefer-skip-optional-pointer: true
  name-normalizer: ToCamelCaseWithInitialisms
  additional-initialisms:
    - OK
