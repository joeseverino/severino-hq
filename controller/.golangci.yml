# golangci-lint for the controller (lint:controller; per-linter counts with
# `mise run audit:go`). Generated files carry the standard "Code generated ...
# DO NOT EDIT." line, which exclusions.generated leaves out.
version: "2"

# Every checkout on a machine shares golangci-lint's lock, so a run that
# finds another checkout's holding it waits its turn instead of failing.
run:
  allow-serial-runners: true

linters:
  # errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  # nilerr stays off: each place the controller returns nil beside an error is
  # a read whose absence is the answer (a missing directory left out of a
  # backup, an optional NPM list, an ACME account not yet made) or a stop on
  # cancellation, and each says so where it does it.
  enable:
    - errorlint
    - forbidigo
    - gocritic
    - modernize
    - perfsprint
    - revive
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # os.Root's twins of os.Remove and os.RemoveAll, which the preset below
        # excludes for the same reason.
        - (*os.Root).Remove
        - (*os.Root).RemoveAll
    forbidigo:
      # Matches the method through its receiver's type, so a renamed import
      # or a decoder held in a field is still caught.
      analyze-types: true
      forbid:
        # Strict JSON is jsonv2.Unmarshal with RejectUnknownMembers(true): it
        # refuses duplicate and case-variant names, invalid UTF-8 and trailing
        # data, all of which v1's strict decoder lets through.
        - pattern: ^json\.Decoder\.DisallowUnknownFields$
          pkg: ^encoding/json$
          msg: decode strict JSON with jsonv2.Unmarshal(data, &v, jsonv2.RejectUnknownMembers(true))
        # A log a binary writes strikes every secret the process has learned,
        # which only mask.Logger's writer does; a handler built anywhere else
        # writes them as they are.
        - pattern: ^slog\.(New|NewTextHandler|NewJSONHandler)$
          pkg: ^log/slog$
          msg: build the logger with mask.Logger (controller/internal/mask)
        # A file staged beside its destination and renamed over it is only
        # whole after a power cut when the file and its directory are synced,
        # which atomicfile does and a hand-rolled temporary file forgets.
        - pattern: ^os\.CreateTemp$
          msg: put a file in place whole with atomicfile.Create or atomicfile.WriteFile (controller/internal/atomicfile)
        # A program the controller starts gets only the environment it is
        # handed, which hostcore.Process enforces: an exec.Cmd left with a nil
        # Env inherits every variable, credentials included.
        - pattern: ^exec\.Command(Context)?$
          pkg: ^os/exec$
          msg: start a program with hostcore.Process (or hostcore.Command), which gives it only the environment it is handed
    govet:
      settings:
        # A subtest that stops its parent (t.Fatal, FailNow or Skip on the t
        # outside its t.Run) fails the wrong test, and from a goroutine that
        # is not its test's.
        testinggoroutine:
          subtest: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        # Asks to name results that share a type, as in (string, string, error).
        # The controller names a function's results in its doc comment, and
        # named results invite the bare return.
        - unnamedResult
  exclusions:
    generated: strict
    warn-unused: true
    presets:
      # golangci-lint's own exclusion of errcheck on Close, Flush, os.Remove,
      # os.RemoveAll and the print family: cleanup on a path already failing,
      # and writes to a terminal or log, where no caller could act on the error.
      - std-error-handling
    rules:
      # revive's exported rule asks every exported name for a doc comment. The
      # controller's packages are its own, never imported elsewhere, and most
      # of what they export is a record of a provider's reading whose comment
      # would restate its name. The rest of the rule, a comment's form and a
      # name that stutters, still holds.
      - linters: [revive]
        text: "exported (.+) should have comment( \\(or a comment on this block\\))? or be unexported"
      # mask.Logger is the one place a logger is built; a test builds its own
      # to read what a value prints.
      - linters: [forbidigo]
        path: (^internal/mask/mask\.go$|_test\.go$)
        text: mask\.Logger
      # hostcore.Process is the one place a program is started; a test starts
      # its own fakes.
      - linters: [forbidigo]
        path: (^internal/hostcore/process\.go$|_test\.go$)
        text: hostcore\.Process

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
