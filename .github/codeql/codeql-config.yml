name: "Severino HQ"

# The full quality suite, minus the import-cycle rules that misread this codebase.
queries:
  - uses: security-and-quality

query-filters:
  # py/cyclic-import counts an import wherever it sits, including inside a
  # function. Deferring an import to call time is how this codebase breaks
  # registry cycles on purpose (capabilities compose plugin specs, which may
  # themselves declare connections) and each of those deliberate deferrals is
  # commented where it sits. The rule reports them anyway, at note severity,
  # with no form the code can take that would satisfy it short of re-siting
  # settled design.
  #
  # Dismissing them one at a time does not hold: a dismissal is tied to an
  # alert, and moving the line raises a new one. Excluded here so the finding
  # stops recurring, rather than being triaged forever.
  - exclude:
      id: py/cyclic-import
  # py/unsafe-cyclic-import counts a `lazy` import (PEP 810) as one that runs
  # with its module. The extractor records the keyword (`isLazy()` in
  # python-all's AstGenerated.qll) and nothing reads it: Imports/Cyclic.qll
  # takes any import outside a function as import-time (`is_import_time`), so
  # every cycle closed only by a lazy import, which waits for first use, is
  # reported as one that can fail. The promise the rule makes, no module
  # imports itself back while it runs, is held lazy-aware by
  # hq/platform/application/tests/test_import_cycles.py.
  - exclude:
      id: py/unsafe-cyclic-import
  # py/uninitialized-local-variable reads a PEP 695 type parameter (`def
  # display[T](...)`) as a local used before it is bound. Ruff's F821 and F823
  # hold the rule it makes, on every file.
  - exclude:
      id: py/uninitialized-local-variable
  # py/implicit-string-concatenation-in-list is Ruff's ISC004, which holds it
  # on every file in the gates a change runs before it is pushed.
  - exclude:
      id: py/implicit-string-concatenation-in-list

# The type checker's settings shim, for the host's mypy and each extension's.
# django-stubs reads a settings module's names statically, so it re-exports
# the host's settings with `import *`; the file never runs inside HQ.
paths-ignore:
  - hq/config/settings_typecheck.py
# The SDK as an extension calls it, for mypy alone: it never runs, and some of
# its calls are wrong on purpose, as the cases mypy must refuse.
  - tests/sdk_consumer
