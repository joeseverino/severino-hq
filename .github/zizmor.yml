# lint:workflows runs zizmor offline at its default persona. Each entry is a
# finding that is a deliberate choice, with the reason beside it; one
# confined to a step is ignored by a comment on that step's line instead.
rules:
  # actions/cache saves on every run, a pull request's too; a cache is written
  # by actions/cache/save, on the default branch alone (CacheWriterTests).
  forbidden-uses:
    config:
      deny:
        - actions/cache
  # jactionlint, at the newest release mise offers, refuses a `$/` reference, and
  # the two uses of the host's uv action under ./host/ name the host checked
  # out at the commit the job resolved, which the running workflow's own commit
  # need not be.
  self-repository:
    disable: true
