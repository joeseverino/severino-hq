version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      django:
        patterns:
          - "Django"
          - "django-*"
        update-types:
          - "minor"
          - "patch"
      runtime:
        patterns:
          - "*"
        exclude-patterns:
          - "Django"
          - "django-*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # The composed image pins its own base and uv by digest.
  - package-ecosystem: "docker"
    directory: "/composition"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # The composite actions pin their own steps, so they are watched with the
  # workflows that call them.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
