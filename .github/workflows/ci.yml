name: CI

# Every gate a change passes, as one graph. On a pull request the image is
# also checked and composed with the extensions (compose.yml), and Ready posts
# HQ's review from the results: the one check the ruleset requires. On main,
# Release starts Compose once the gates pass; Deploy (deploy.yml) is never
# reached from a pull request.
#
# The gates themselves are declared once, as mise tasks in their job's file
# under tasks/ (or mise-tasks/): each job below runs the aggregate of its name,
# and `mise run ci` runs the same list on a developer's machine. A gate is
# added there, never here.
#
# The file keeps its name: the host image is signed by it, and what verifies
# that signature (Compose, and the deploy script on the host) pins this path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to main whose pull request already passed with this exact tree is
  # not checked twice: Checks, Tests and Browser stand on that run, and Image
  # promotes the pull request's image instead of building another. Anything
  # less than proof (tools/pipeline/proven-on-pr.sh) and every gate runs.
  proven:
    name: Proven on its pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Unproven is the safe answer, so an error here runs every gate rather
    # than holding the push.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    outputs:
      pr: ${{ steps.proof.outputs.pr }}
      digest: ${{ steps.proof.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Cosign
        uses: ./.github/actions/cosign
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the pull request that proved this tree
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/pipeline/proven-on-pr.sh | tee -a "$GITHUB_OUTPUT"
          pr="$(sed -n 's/^pr=//p' "$GITHUB_OUTPUT" | tail -1)"
          if [ -n "$pr" ]; then
            echo "Proven on #$pr: its checks passed on this exact tree, and its image is promoted." >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: Checks
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      # Dependency review comments on a pull request only when it fails.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # HQ's review opens the moment a pull request's checks start, so the one
      # row the merge box waits on is HQ's from the first second. Ready moves
      # it to its verdict. A fork's pull request has no secrets, and no review.
      - name: Mint a token for HQ's review
        id: app
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Open HQ's review
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 -m tools.pipeline.ci_report check "Severino HQ · Review" "$HEAD_SHA" in_progress "Checking"
          "CI, CodeQL and the build of HQ are running. This becomes the verdict when they finish."
      - uses: ./.github/actions/toolchain
        with:
          # The structural bar builds its Go inspector from the controller's
          # module, and checks:openapi lints with Redocly from npm.
          go: true
          npm: true
      - name: Checks
        # Every gate named checks:* (tasks/checks.toml, mise-tasks/checks/)
        # and drift:*. Each runs to the end, and the last lines of this step
        # name every one that failed.
        run: mise run -c checks
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  tests:
    name: Tests
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PythonVersionTests holds this to tools/pipeline/toolchain.env: a matrix cannot read it.
        python: ["3.15"]
    env:
      # `mise run tests` walks this list; a leg is one interpreter.
      TEST_PYTHONS: ${{ matrix.python }}
      # A test held this long prints its id and every stack, well inside the
      # job's timeout (docs/Development.md).
      HQ_TEST_STALL_SECONDS: "180"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          python: ${{ matrix.python }}
          # The live bridge tests build the controller.
          go: true
      - name: Tests
        # Every gate named tests:* (tasks/tests.toml, mise-tasks/tests/).
        run: mise run tests

  # Real-browser layout invariants over synthetic example.* pages
  # (hq/platform/core/tests/browser/). Every request the page makes is answered in
  # process; the browser reaches nothing. One job per browser:* gate, side by
  # side.
  browser:
    name: Browser (${{ matrix.gate }})
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Playwright's image for the release uv.lock pins carries its browsers and
    # their system libraries, so a leg installs nothing from apt or a browser
    # CDN (BrowserInstallTests holds the two versions together). As its CI
    # guide runs it: the runner's user, which owns the workspace, and the
    # host's IPC namespace, without which Chromium runs out of shared memory.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.0-noble@sha256:684df257a1fa0ef3fa288239819984008f560e8f8db5b635ee9e2a50cbcd2e23
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        gate: [layout, layout-chromium, navigation, demo]
    env:
      # A test or class fixture held this long prints its id, every stack and
      # Playwright's log, with time left before the job's timeout.
      HQ_TEST_STALL_SECONDS: "180"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Browser
        # This leg's browser:* gate. GateReferenceTests holds the legs to the
        # gates tasks/browser.toml declares, so the matrix cannot fall behind it.
        env:
          GATE: browser:${{ matrix.gate }}
        run: mise run "$GATE"
      # A failed rule saves the page as it stood (tests/browser/gate.py writes each
      # into its own hq-browser-failure-* folder in the runner's temp).
      - name: Failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ matrix.gate }}
          path: /tmp/hq-browser-failure-*
          if-no-files-found: ignore

  # The Go controller: format, generated types against their specs, vet, and
  # the unit tests under the race detector.
  controller:
    name: Controller
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          go: true
      - name: Controller
        # Every gate named controller:* (tasks/controller.toml).
        run: mise run -c controller

  # The one writer of the caches the jobs above restore, on every push to main
  # so it runs when they stand on their pull request's run. A branch reads
  # main's caches and writes none, so a pull request adds no entries. Release
  # does not wait for it.
  caches:
    name: Caches
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          go: true
          npm: true
          save: true
      - name: Fill the caches
        if: >-
          steps.toolchain.outputs.uv-hit != 'true' ||
          steps.toolchain.outputs.go-hit != 'true' ||
          steps.toolchain.outputs.npm-hit != 'true'
        run: mise run ci:caches
      - if: steps.toolchain.outputs.uv-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.uv-path }}
          key: ${{ steps.toolchain.outputs.uv-key }}
      - if: steps.toolchain.outputs.go-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.go-path }}
          key: ${{ steps.toolchain.outputs.go-key }}
      - if: steps.toolchain.outputs.npm-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.npm-path }}
          key: ${{ steps.toolchain.outputs.npm-key }}

  # Code scanning, on every pull request and push to main: main's analysis is
  # what a pull request's is compared with. Release does not wait for it.
  codeql:
    name: CodeQL
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          # The suite is named in the config, beside the rules it filters.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:python"

  image:
    name: Image
    # On a pull request the image is published as soon as it is built, so its
    # checks and its composition start at once. On main it is checked before
    # it is published and signed, and only Release composes it.
    #
    # Same-repository pull requests only: a fork's token cannot write packages,
    # and handing one the ability to push an image under this name is not a
    # thing to arrange by accident.
    needs: proven
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing below. The workflow's own OIDC identity is what ends up
      # in the certificate, which is the whole point: the signature says which
      # workflow, in which repository, at which commit, produced this image.
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.digest }}
    env:
      # The commit the image is tagged for. On a pull request `GITHUB_SHA` is
      # the merge commit, while the push to main that merges it looks for the
      # pull request's head, the branch tip (tools/pipeline/proven-on-pr.sh).
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Set when this tree's image was proven on its pull request: promoted,
      # not rebuilt.
      PROVEN: ${{ needs.proven.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Layers cached between runs: most changes touch the application, not
      # its dependencies, so those layers are reused rather than rebuilt.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PROVEN == ''
      - uses: ./.github/actions/toolchain
        if: env.PROVEN == ''
      # A promotion runs one tool, so it installs that one rather than the
      # toolchain the build and its checks need.
      - name: Read the pinned mise
        id: mise
        if: env.PROVEN != ''
        run: echo "version=$(.github/actions/toolchain/mise-version.sh mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned crane
        if: env.PROVEN != ''
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ steps.mise.outputs.version }}
          install_args: crane
          cache: false
      - name: Build the production image
        id: build
        if: env.PROVEN == ''
        env:
          IMAGE_BUILD_CACHE: --cache-from type=gha,scope=host-image --cache-to type=gha,scope=host-image,mode=max
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:sha-${HEAD_SHA::12}"
          mise run image:build --tag "$image" --revision "$HEAD_SHA"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # On main only: a pull request's image is checked by Image checks,
      # alongside its composition.
      - name: Every check an image must pass
        # Every gate named image:verify:* (tasks/image.toml), against the image just built.
        if: env.PROVEN == '' && github.event_name == 'push'
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: mise run -c image
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: ./.github/actions/cosign
      - name: Publish
        id: publish
        if: env.PROVEN == ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          # `latest` follows main and nothing else. A pull request publishes
          # an image so it can be checked and composed; it does not get to move
          # the tag that says what the host currently is.
          if [ "${{ github.event_name }}" = "push" ]; then
            docker tag "$IMAGE" "${IMAGE%:*}:latest"
            docker push "${IMAGE%:*}:latest"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
      # An admitted extension wheel carries a signature naming the workflow
      # that produced it, and the composition refuses to install one that does
      # not. This signs the image those wheels are installed into, the other
      # half of that check.
      #
      # Signed by digest, not by tag: a tag is a pointer somebody can move, and
      # a signature over a pointer proves nothing about what it points at now.
      - name: Promote the image its pull request proved
        # The same manifest under this commit's tag, so the tag names the
        # digest that is signed: `crane tag` PUTs the bytes it fetched by
        # digest. Each tag is read back and must name that digest.
        id: promote
        if: env.PROVEN != ''
        run: |
          set -euo pipefail
          for tag in "sha-${HEAD_SHA::12}" latest; do
            crane tag "$PROVEN" "$tag"
            resolved=$(crane digest "${PROVEN%@*}:$tag")
            if [ "$resolved" != "${PROVEN#*@}" ]; then
              echo "::error::$tag resolves to $resolved, not ${PROVEN#*@}"
              exit 1
            fi
          done
          echo "digest=$PROVEN" >> "$GITHUB_OUTPUT"
      - name: Sign
        # On a promotion too: Compose deploys only an image signed by this
        # workflow on main, and the pull request's signature is not that.
        env:
          DIGEST: ${{ steps.publish.outputs.digest || steps.promote.outputs.digest }}
        run: cosign sign --yes "$DIGEST"

  # A pull request's image, checked from the registry while its composition
  # runs: the same gates main runs inside Image before it publishes.
  image-checks:
    name: Image checks
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image by digest
        run: docker pull --quiet "$IMAGE"
      - uses: ./.github/actions/toolchain
      - name: Every check an image must pass
        # Every gate named image:verify:* (tasks/image.toml).
        run: mise run -c image

  # A pull request's composition: this image plus every admitted extension,
  # each extension's tests run inside it (compose.yml). It publishes and signs
  # nothing: those steps belong to a dispatch on main. A fork's pull request
  # has no image and no secrets, so it is not composed here: main composes it
  # before anything is published.
  compose:
    name: Composition
    needs: image
    if: >-
      !cancelled() && needs.image.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/compose.yml
    # What compose.yml's job declares, which a caller must grant: it signs
    # and publishes only on a dispatch on main, never from here.
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    with:
      host-image: ${{ needs.image.outputs.image }}
    secrets:
      HQ_APP_CLIENT_ID: ${{ secrets.HQ_APP_CLIENT_ID }}
      HQ_APP_KEY: ${{ secrets.HQ_APP_KEY }}
      COMPOSITION_EXTENSIONS: ${{ secrets.COMPOSITION_EXTENSIONS }}

  ready:
    name: Ready
    needs: [proven, checks, tests, browser, controller, codeql, image, image-checks, compose]
    # Moves HQ's review to its verdict from the results of every job above:
    # ready to merge, or held, why and what fixes it. That review is the one
    # check the ruleset requires, accepted only from HQ's app, so a gate added
    # or removed here never touches the repository's settings.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # To read this run's jobs, and a failed job's log.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A fork's pull request has no secrets, so it gets the plain answer and
      # no verdict from HQ's app.
      - name: Mint a token for HQ's verdict
        id: app
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Say a fork's pull request is not composed
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          message="A fork's pull request cannot read the extensions, so it is not built or composed here; main composes it before anything is published."
          echo "::notice title=Not composed::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
      - name: HQ's verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
          # A same-repository pull request is composed, so these must pass,
          # not be skipped.
          REQUIRED: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'image image-checks compose' || '' }}
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_RUN: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m tools.pipeline.ci_report verdict

  # On main, CI starts the build of HQ for this commit once every gate has
  # passed, and names the commit, so what Compose builds is exactly what CI
  # checked. Nothing else about a push starts it. CodeQL is not waited for:
  # code scanning holds a merge, not a release. Image checks and Composition
  # run only for a pull request: on a push, Image checks what it builds or
  # promotes the image its pull request checked, and Compose follows this job.
  release:
    name: Release
    needs: [proven, checks, tests, browser, controller, image]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: image
        run: python3 -m tools.pipeline.ci_report verdict
      - name: Mint a token to start Compose
        id: compose
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      - name: Start Compose for this commit
        env:
          GH_TOKEN: ${{ steps.compose.outputs.token }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run compose.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit="$COMMIT" -f reason="CI passed on main" -f force=true
