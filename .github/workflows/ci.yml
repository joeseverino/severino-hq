name: CI

# Everything a change has to pass, on every pull request and every push to
# main: Checks, Tests, Browser, Controller and Image, and Ready, which writes HQ's review:
# the one check the ruleset requires, from HQ's app alone. CodeQL runs in its
# own workflow (codeql.yml), a pull request's
# composition with the extensions in Compose (compose.yml), and production is
# Deploy's (deploy.yml), which a pull request never reaches.
#
# The file keeps its name: the host image is signed by it, and what verifies
# that signature (Compose, and the deploy script on the host) pins this path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to main whose pull request already passed with this exact tree is
  # not checked twice: Checks, Tests and Browser stand on that run, and Image
  # promotes the pull request's image instead of building another. Anything
  # less than proof (scripts/proven-on-pr.sh) and every gate runs.
  proven:
    name: Proven on its pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Unproven is the safe answer, so an error here runs every gate rather
    # than holding the push.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    outputs:
      pr: ${{ steps.proof.outputs.pr }}
      digest: ${{ steps.proof.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the pull request that proved this tree
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/proven-on-pr.sh | tee -a "$GITHUB_OUTPUT"
          pr="$(sed -n 's/^pr=//p' "$GITHUB_OUTPUT" | tail -1)"
          if [ -n "$pr" ]; then
            echo "Proven on #$pr: its checks passed on this exact tree, and its image is promoted." >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    name: Checks
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      # Dependency review comments on a pull request only when it fails.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # HQ's review opens the moment a pull request's checks start, so the one
      # row the merge box waits on is HQ's from the first second. Ready moves
      # it to its verdict. A fork's pull request has no secrets, and no review.
      - name: Mint a token for HQ's review
        id: app
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Open HQ's review
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          scripts/hq-check.sh "Severino HQ · Review" "$HEAD_SHA" in_progress "Checking"
          "CI, CodeQL and the build of HQ are running. This becomes the verdict when they finish."
      - id: toolchain
        uses: ./.github/actions/toolchain
      # The runtime pins too: django-stubs loads the host's settings for mypy.
      - name: Install the hashed runtime and tool pins
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes --no-deps -r requirements-tools.txt
      - name: Install the pinned shellcheck
        # The runner image ships its own, at a version the local gate does
        # not run.
        env:
          VERSION: ${{ steps.toolchain.outputs.shellcheck-version }}
          SHA256: ${{ steps.toolchain.outputs.shellcheck-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          echo "${SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xJf "$archive" --strip-components=1 -C /usr/local/bin "shellcheck-v${VERSION}/shellcheck"
          shellcheck --version
      - name: ruff
        id: ruff
        run: ruff check . && echo "no findings under $(ruff --version)" | tee "$RUNNER_TEMP/gate-ruff"
      - name: mypy
        id: mypy
        # The architectural seams, typed strictly. mypy.ini names them and says
        # how to widen the set.
        run: python -m mypy && echo "the typed seams pass $(python -m mypy --version)" | tee "$RUNNER_TEMP/gate-mypy"
      - name: The test matrix and the README badges state the toolchain
        id: badges
        # Neither the matrix below nor static markdown can read toolchain.env,
        # so both are verified against it: the Python versions a reader sees,
        # and the ones Tests runs, are the ones declared.
        env:
          DECLARED: ${{ steps.toolchain.outputs.python-versions }}
        run: |
          set -euo pipefail
          . ./scripts/toolchain.env
          # shellcheck disable=SC2086  # the version list is meant to split
          expected="$(printf '%s\n' $PYTHON_VERSIONS | paste -sd'|' -)"
          claimed="$(sed -nE 's/.*badge\/python-(.*)-blue.*/\1/p' README.md | head -1 \
                     | sed 's/%20%7C%20/|/g')"
          if [ "$expected" != "$claimed" ]; then
            echo "::error::README python badge says '$claimed'; the toolchain declares '$expected'."
            exit 1
          fi
          matrix="$(yq -o=json -I=0 '.jobs.tests.strategy.matrix.python' .github/workflows/ci.yml)"
          if [ "$matrix" != "$DECLARED" ]; then
            echo "::error::Tests runs $matrix; scripts/toolchain.env declares $DECLARED."
            exit 1
          fi
          echo "the matrix and the badge state the toolchain: ${expected//|/, }" | tee "$RUNNER_TEMP/gate-badges"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: scripts/openapi/package-lock.json
      - run: npm --prefix scripts/openapi ci
      - name: OpenAPI contracts
        id: openapi
        run: |
          scripts/check-openapi.sh
          echo "both OpenAPI descriptions pass specification lint" | tee "$RUNNER_TEMP/gate-openapi"
      - name: Each lockfile is what its .in file compiles to
        id: lockfile
        # Each header names the command that produces its lockfile. Regenerated
        # here with the pinned uv and compared, so the committed pins are always
        # the command's output and nothing else.
        run: |
          set -euo pipefail
          for lock in requirements.txt requirements-tools.txt requirements-browser.txt requirements-dev.txt; do
            command="$(sed -n 's/^#    uv pip compile /uv pip compile /p' "$lock")"
            case "$command" in
              *"--output-file $lock "*) ;;
              *) echo "::error::$lock does not name a command that writes it"; exit 1 ;;
            esac
            # Compiled on top of a copy, so uv keeps the committed pins: this
            # asks whether the file is the command's output, not whether newer
            # releases exist. That is Dependabot's job, not a red build's.
            fresh="$(mktemp)"
            cp "$lock" "$fresh"
            # shellcheck disable=SC2086  # the recorded command is meant to split
            ${command/--output-file $lock /--output-file $fresh } --quiet
            if ! diff -u <(grep -v '^#' "$lock") <(grep -v '^#' "$fresh"); then
              echo "::error::$lock differs from what its header command produces. Rerun: $command"
              exit 1
            fi
          done
          echo "every requirements lockfile is the output of its header command" | tee "$RUNNER_TEMP/gate-lockfile"
      - name: The workflows are valid
        id: workflows
        # The version toolchain.env pins, so CI and the local gate agree. With
        # shellcheck on the PATH (installed above) it also checks every run:
        # block as shell.
        env:
          VERSION: ${{ steps.toolchain.outputs.actionlint-version }}
          SHA256: ${{ steps.toolchain.outputs.actionlint-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum --check --quiet
          tar -xzf "$archive" -C /usr/local/bin actionlint
          actionlint -color
          set -- .github/workflows/*.yml
          echo "$# workflows pass actionlint ${VERSION}, run: blocks included" | tee "$RUNNER_TEMP/gate-workflows"
      - name: Every action is pinned to a commit, with its version beside it
        id: pins
        # A tag can be moved after review; a commit cannot. The version comment
        # is what Dependabot rewrites with the commit and what a reader checks,
        # so one without the other is a pin nobody can read.
        run: |
          set -euo pipefail
          bad="$(grep -rnE '^[[:space:]-]*uses:[[:space:]]' .github/workflows .github/actions \
                 | grep -vE 'uses:[[:space:]]+\./' \
                 | grep -vE '@[0-9a-f]{40} # v[0-9]+(\.[0-9]+){0,2}$' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo "::error::pin every action to a full commit SHA followed by '# vX.Y.Z'"
            exit 1
          fi
          echo "every action is pinned to a commit, with its version" | tee "$RUNNER_TEMP/gate-pins"
      - name: Every job has a timeout
        id: timeouts
        # Without one a hung job holds its runner for GitHub's six-hour default.
        # A job that calls a reusable workflow cannot take one; the workflow it
        # calls is checked instead.
        run: |
          set -euo pipefail
          missing="$(for f in .github/workflows/*.yml; do
            yq '.jobs | to_entries | .[] | select(.value.uses == null and .value."timeout-minutes" == null) | .key' "$f" \
              | sed "s|^|$f: |"
          done)"
          if [ -n "$missing" ]; then
            printf '%s\n' "$missing"
            echo "::error::every job needs timeout-minutes"
            exit 1
          fi
          echo "every job has timeout-minutes" | tee "$RUNNER_TEMP/gate-timeouts"
      - name: Every hosted job runs on the declared runner image
        id: runners
        # The same reasoning as the badge check: workflow YAML cannot read
        # toolchain.env, so it is verified against it. A job left on
        # `ubuntu-latest` would move to a new OS on GitHub's schedule.
        run: |
          set -euo pipefail
          . ./scripts/toolchain.env
          stray="$(grep -HnE '^[[:space:]]*runs-on:' .github/workflows/*.yml \
                   | grep -v 'self-hosted' \
                   | grep -v "runs-on: ${RUNNER_IMAGE}\$" || true)"
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo "::error::hosted jobs must run on ${RUNNER_IMAGE} (scripts/toolchain.env)."
            exit 1
          fi
          echo "every hosted job runs on ${RUNNER_IMAGE}" | tee "$RUNNER_TEMP/gate-runners"
      - name: Shell safety
        id: shell
        run: |
          set -euo pipefail
          . ./scripts/toolchain.env
          # shellcheck disable=SC2086  # both lists are meant to split
          set -- $SHELL_SOURCES
          # Each parsed by the shell its first line names.
          for f; do
            case "$(head -n 1 "$f")" in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done
          # shellcheck disable=SC2086
          shellcheck -x $SHELL_SOURCES
          # shellcheck disable=SC2086
          for suite in $SHELL_SUITES; do "$suite"; done
          # shellcheck disable=SC2086
          echo "$(echo $SHELL_SOURCES | wc -w | tr -d ' ') scripts parse and pass shellcheck; $(echo $SHELL_SUITES | wc -w | tr -d ' ') suites pass" \
            | tee "$RUNNER_TEMP/gate-shell"
      # Production-posture check: DEBUG off, real host. --fail-level WARNING
      # turns Django's security advisories into hard failures. The env below
      # mirrors a real prod config so the check validates how settings.py
      # translates it, not CI artifacts. The key is a throwaway >50-char value
      # only to satisfy the strength check (W009).
      - name: Django deployment check
        id: deploycheck
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef"
          DJANGO_ALLOWED_HOSTS: "hq.example.com"
          SEVERINO_OIDC_ISSUER: "https://sso.example.com"
          DJANGO_BEHIND_TLS_PROXY: "1"
          DJANGO_SESSION_COOKIE_SECURE: "1"
          DJANGO_CSRF_COOKIE_SECURE: "1"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
          DJANGO_HSTS_PRELOAD: "1"
        run: |
          python manage.py check --deploy --fail-level WARNING
          echo "production settings raise no security warning" | tee "$RUNNER_TEMP/gate-deploycheck"
      - name: pip-audit
        id: audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt requirements-tools.txt requirements-browser.txt requirements-dev.txt
      - name: Dependency review
        id: dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      - name: Structural bar
        id: structural
        # No new near-duplicate outside tests; the largest files did not grow.
        run: |
          set -eu
          CODEBASE_MEMORY_BIN="$(scripts/install-scan-tools.sh codebase-memory-mcp)" \
            scripts/structural-bar.sh
          echo "no new near-duplicate, and the largest files did not grow" | tee "$RUNNER_TEMP/gate-structural"
      - name: Scorecard
        id: scorecard
        # Scorecard's action reads only the default branch, so a change that
        # would lower a check is caught here, by the same script a local run
        # uses. CodeQL is its own job below.
        env:
          CHECK_PYTHON: python
        run: |
          scripts/security-scan.sh scorecard
          echo "every file-based check at 10" | tee "$RUNNER_TEMP/gate-scorecard"
      - name: Gate summary
        # One table on the run's summary page, built from GitHub's own record
        # of each step's outcome, so a failed check is a failed row rather than
        # a missing one. Each check leaves a one-line detail when it passes.
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          rows="$(printf '%s' "$STEPS" | jq -r 'to_entries[] | select(.key != "toolchain" and .key != "app") | "\(.key)\t\(.value.outcome)"')"
          total="$(printf '%s\n' "$rows" | grep -c . || true)"
          failed="$(printf '%s\n' "$rows" | grep -c $'\tfailure' || true)"
          {
            echo "## Checks"
            echo
            if [ "$failed" -eq 0 ]; then echo "All ${total} checks passed."
            else echo "**${failed} of ${total} checks failed.**"; fi
            echo
            echo "| Check | Result | Detail |"
            echo "| --- | --- | --- |"
            printf '%s\n' "$rows" | while IFS=$'\t' read -r id outcome; do
              detail="$(cat "$RUNNER_TEMP/gate-$id" 2>/dev/null | tail -1 || true)"
              case "$outcome" in
                success) result="pass" ;;
                failure) result="**fail**"; detail="see the step log" ;;
                *) result="$outcome"; detail="${detail:-not run}" ;;
              esac
              echo "| \`$id\` | $result | ${detail//|/\\|} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Checks holds this to scripts/toolchain.env: a matrix cannot read it.
        python: ["3.13", "3.14"]
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          python: ${{ matrix.python }}
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install --require-hashes --no-deps -r requirements-tools.txt
      - name: Public plugin contract
        env:
          SEVERINO_HQ_PLUGINS: example_hq_plugin.plugin:plugin
        run: |
          python manage.py check
          python manage.py plugins
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py api_openapi --check
      - name: Tests with coverage gate
        env:
          COVERAGE_FLOOR: ${{ steps.toolchain.outputs.coverage-floor }}
          OLDEST: ${{ steps.toolchain.outputs.oldest-python }}
          PYTHON: ${{ matrix.python }}
        # Parallel across the runner's cores, as scripts/check.sh runs it
        # locally; core/test_runner.py is what makes workers safe on the WAL
        # database. Coverage follows the workers (.coveragerc) and is combined
        # before it is judged. Each test's logs are shown only if it fails, and
        # the ten slowest tests are named so a slow one is noticed, not endured.
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/tests.log"
          coverage run manage.py test --parallel auto --durations 10 2>&1 | tee "$log"
          coverage combine --quiet
          coverage report --fail-under="$COVERAGE_FLOOR"
          pct="$(coverage report --format=total --precision=2)"
          ran="$(sed -nE 's/^Ran ([0-9]+) tests? in ([0-9.]+)s$/\1 tests in \2s/p' "$log")"
          {
            echo "### Python ${PYTHON}: ${ran}, coverage ${pct}% (floor ${COVERAGE_FLOOR}%)"
            if [ "$PYTHON" = "$OLDEST" ]; then
              echo
              echo "<details><summary>Slowest tests</summary>"
              echo
              echo "| Seconds | Test |"
              echo "| ---: | --- |"
              sed -n '/^Slowest test durations/,/^$/p' "$log" | grep -E '^[0-9.]+s ' \
                | sed -E 's/^([0-9.]+)s +[^ ]+ \(([^)]+)\).*/| \1 | <code>\2<\/code> |/'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The README badge states the coverage actually measured
        # The README is static, so the badge is verified rather than
        # generated. The same script runs in scripts/ci-local.sh.
        if: matrix.python == steps.toolchain.outputs.oldest-python
        run: scripts/coverage-badge.sh

  # Real-browser layout invariants over synthetic example.* pages
  # (core/browser_tests.py). Every request the page makes is answered in
  # process; the browser reaches nothing. scripts/ci-local.sh runs the same.
  browser:
    name: Browser
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,testserver"
      SEVERINO_LOG_LEVEL: CRITICAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install --require-hashes -r requirements-browser.txt
      # Keyed on the hashed lock: Playwright pins its Chromium build, so a new
      # pin is a new browser and a new cache entry.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}
      - name: Install Chromium and its system libraries
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Browser layout gate
        run: python manage.py test core.browser_tests --noinput --parallel 1

  # The Go controller: format, generated types against their specs, vet, and
  # the unit tests under the race detector.
  controller:
    name: Controller
    needs: proven
    if: ${{ !cancelled() && needs.proven.outputs.digest == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: Controller checks
        run: controller/scripts/check.sh

  image:
    name: Image
    # Alongside the other gates, not after them: on a pull request Compose
    # starts with this run and composes as soon as the image exists. On main
    # Compose starts only once every gate has passed (Ready), so an image from
    # a failing commit is never composed for production.
    #
    # Also on pull requests: the composition (the only environment that runs
    # this application the way production does, with DEBUG off and the
    # extensions loaded) is built on top of this image, so a pull request
    # needs one to be composed and checked before it merges.
    #
    # Same-repository pull requests only: a fork's token cannot write packages,
    # and handing one the ability to push an image under this name is not a
    # thing to arrange by accident.
    needs: proven
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing below. The workflow's own OIDC identity is what ends up
      # in the certificate, which is the whole point: the signature says which
      # workflow, in which repository, at which commit, produced this image.
      id-token: write
    env:
      # The commit the composition will look for. On a pull request
      # `GITHUB_SHA` is the merge commit, while Compose composes the pull
      # request's head: the branch tip. Tagging by the merge commit would
      # publish an image the composition then could not find, and the failure
      # would read as "no such image" rather than "these two disagree about
      # which commit this is".
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Set when this tree's image was proven on its pull request: promoted,
      # not rebuilt.
      PROVEN: ${{ needs.proven.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Layers cached between runs: most changes touch the application, not
      # its dependencies, so those layers are reused rather than rebuilt.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PROVEN == ''
      - name: Build the production image
        id: build
        if: env.PROVEN == ''
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}:sha-${HEAD_SHA::12}"
          # The security archive's release date keys the layer that applies
          # Debian's fixes, so a cached layer is reused until Debian publishes.
          # Unreachable, the day keys it instead: rebuilt at most daily.
          security_release="$(curl -fsSL --retry 3 https://deb.debian.org/debian-security/dists/bookworm-security/InRelease 2>/dev/null \
            | sed -n 's/^Date: //p' || true)"
          if [ -z "$security_release" ]; then
            security_release="$(date -u +%F)"
            echo "::warning title=Debian security date unknown::deb.debian.org did not answer; the upgrade layer is keyed on ${security_release} instead."
          fi
          # The source label is the standard OCI one: GHCR links the package to
          # this repository by it, and the controller reads which repository
          # delivers it from the image it runs. The tree label is what a push
          # to main compares to promote this image (scripts/proven-on-pr.sh).
          docker buildx build --load \
            --cache-from type=gha,scope=host-image \
            --cache-to type=gha,scope=host-image,mode=max \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$HEAD_SHA" \
            --label "dev.severino.hq.tree=$(git rev-parse 'HEAD^{tree}')" \
            --build-arg "HQ_SOURCE=https://github.com/${{ github.repository }}" \
            --build-arg "HQ_REVISION=$HEAD_SHA" \
            --build-arg "DEBIAN_SECURITY_RELEASE=$security_release" \
            -t "$image" .
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: It runs Python 3.14 without package managers
        if: env.PROVEN == ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import importlib.util, shutil, sys; sys.exit(0 if sys.version_info[:2] == (3, 14) and importlib.util.find_spec('pip') is None and shutil.which('pip') is None and shutil.which('uv') is None else 1)"
      - name: It comes up healthy
        if: env.PROVEN == ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: scripts/image-health.sh "$IMAGE"
      - name: It cannot import development layers
        if: env.PROVEN == ''
        # requirements-dev.txt is never installed in the image; this proves it.
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import importlib.util, sys; sys.exit(importlib.util.find_spec('debug_toolbar') is not None)"
          echo "the image does not contain debug_toolbar"
      - name: It carries the controller
        if: env.PROVEN == ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          usage="$(docker run --rm --entrypoint /usr/local/bin/hq-controller "$IMAGE" -help 2>&1 || true)"
          case "$usage" in
            *-apply*) echo "the image carries hq-controller" ;;
            *) echo "$usage" >&2; exit 1 ;;
          esac
      # Scans the exact artifact about to be published: a fixable HIGH or
      # CRITICAL in the image stops it here.
      - name: Scan
        if: env.PROVEN == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish
        id: publish
        if: env.PROVEN == ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          # `latest` follows main and nothing else. A pull request builds an
          # image so it can be composed and checked; it does not get to move
          # the tag that says what the host currently is.
          if [ "${{ github.event_name }}" = "push" ]; then
            docker tag "$IMAGE" "${IMAGE%:*}:latest"
            docker push "${IMAGE%:*}:latest"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
      # An admitted extension wheel carries a signature naming the workflow
      # that produced it, and the composition refuses to install one that does
      # not. This signs the image those wheels are installed into, the other
      # half of that check.
      #
      # Signed by digest, not by tag: a tag is a pointer somebody can move, and
      # a signature over a pointer proves nothing about what it points at now.
      - name: Promote the image its pull request proved
        # The same manifest under this commit's tag, so the tag names the
        # digest that is signed (scripts/retag.sh).
        id: promote
        if: env.PROVEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/retag.sh "$PROVEN" "sha-${HEAD_SHA::12}" latest
          echo "digest=$PROVEN" >> "$GITHUB_OUTPUT"
      - name: Sign
        # On a promotion too: Compose deploys only an image signed by this
        # workflow on main, and the pull request's signature is not that.
        env:
          DIGEST: ${{ steps.publish.outputs.digest || steps.promote.outputs.digest }}
        run: cosign sign --yes "$DIGEST"

  ready:
    name: Ready
    needs: [proven, checks, tests, browser, controller, image]
    # Waits for every gate, and on a pull request for the same commit's Compose
    # and CodeQL too, then moves HQ's review to its verdict: ready to merge, or
    # held, why and what fixes it. That review is the one check the ruleset
    # requires, accepted only from HQ's app, so a gate added or removed here
    # never touches the repository's settings.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # To read this run's, Compose's and CodeQL's jobs, and a failed job's log.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A fork's pull request has no secrets and is not composed, so it gets
      # the plain answer below and no verdict from HQ's app.
      - name: Mint a token for HQ's verdict
        id: app
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: HQ's verdict
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMPOSED: "true"
          THIS_RUN: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/hq-verdict.sh
      - name: Every gate passed
        if: steps.app.outputs.token == ''
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed="$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            printf '%s\n' "$failed"
            echo "::error::Not ready: every gate above must pass."
            exit 1
          fi
          echo "Every gate passed."
      # On main, CI starts the build of HQ for this commit once every gate has
      # passed, and names the commit, so what Compose builds is exactly what
      # CI checked. Nothing else about a push starts it.
      - name: Mint a token to start Compose
        id: compose
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      - name: Start Compose for this commit
        if: steps.compose.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.compose.outputs.token }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run compose.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit="$COMMIT" -f reason="CI passed on main" -f force=true
