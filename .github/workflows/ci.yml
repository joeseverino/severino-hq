name: ci

# Push to main is the deploy trigger. Every gate below must pass before the
# self-hosted deploy job runs: a red commit physically cannot reach the box.
# Pull requests run the checks only (no build, no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reads scripts/toolchain.env and re-emits it as job outputs, so the matrix,
  # the ruff pin and the coverage floor are declared in one file that
  # scripts/ci-local.sh reads directly.
  toolchain:
    name: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python-versions: ${{ steps.read.outputs.python-versions }}
      oldest-python: ${{ steps.read.outputs.oldest-python }}
      ruff-version: ${{ steps.read.outputs.ruff-version }}
      shellcheck-version: ${{ steps.read.outputs.shellcheck-version }}
      coverage-floor: ${{ steps.read.outputs.coverage-floor }}
      coverage-version: ${{ steps.read.outputs.coverage-version }}
      uv-version: ${{ steps.read.outputs.uv-version }}
      actionlint-version: ${{ steps.read.outputs.actionlint-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          set -euo pipefail
          . ./scripts/toolchain.env
          # shellcheck disable=SC2086  # the version list is meant to split
          versions="$(printf '%s\n' $PYTHON_VERSIONS | jq -Rrc '[.]' | jq -sc 'add')"
          {
            echo "python-versions=$versions"
            # shellcheck disable=SC2086
            echo "oldest-python=$(printf '%s\n' $PYTHON_VERSIONS | head -1)"
            echo "ruff-version=$RUFF_VERSION"
            echo "shellcheck-version=$SHELLCHECK_VERSION"
            echo "coverage-floor=$COVERAGE_FLOOR"
            echo "coverage-version=$COVERAGE_VERSION"
            echo "uv-version=$UV_VERSION"
            echo "actionlint-version=$ACTIONLINT_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "matrix: $versions"

  lint:
    name: lint
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.toolchain.outputs.oldest-python }}
      - run: pip install ruff==${{ needs.toolchain.outputs.ruff-version }}
      - name: Install the pinned shellcheck
        # The runner image ships its own, which is how the local gate and this
        # one came to disagree about the same file.
        run: |
          set -euo pipefail
          version="${{ needs.toolchain.outputs.shellcheck-version }}"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${version}/shellcheck"
          shellcheck --version
      - name: ruff
        id: ruff
        run: ruff check . && echo "no findings under ruff ${{ needs.toolchain.outputs.ruff-version }}" | tee "$RUNNER_TEMP/gate-ruff"
      - name: The README badges state what is actually tested
        id: badges
        # Static markdown cannot be generated, so it is verified: the Python
        # versions a reader sees are the versions the matrix runs.
        run: |
          set -euo pipefail
          . ./scripts/toolchain.env
          # shellcheck disable=SC2086  # the version list is meant to split
          expected="$(printf '%s\n' $PYTHON_VERSIONS | paste -sd'|' -)"
          claimed="$(sed -nE 's/.*badge\/python-(.*)-blue.*/\1/p' README.md | head -1 \
                     | sed 's/%20%7C%20/|/g')"
          if [ "$expected" != "$claimed" ]; then
            echo "::error::README python badge says '$claimed'; the matrix runs '$expected'."
            exit 1
          fi
          echo "the python badge states the matrix: ${expected//|/, }" | tee "$RUNNER_TEMP/gate-badges"
      - name: requirements.txt is what requirements.in compiles to
        id: lockfile
        # The header names the command that produces the lockfile, and the file
        # had drifted from it. Regenerated here with the pinned uv and compared,
        # so the committed pins are always the command's output and nothing else.
        run: |
          set -euo pipefail
          pip install uv==${{ needs.toolchain.outputs.uv-version }}
          command="$(sed -n 's/^#    uv pip compile /uv pip compile /p' requirements.txt)"
          [ -n "$command" ] || { echo "::error::requirements.txt does not name its command"; exit 1; }
          # Compiled on top of a copy, so uv keeps the committed pins: this asks
          # whether the file is the command's output, not whether newer
          # releases exist: that is Dependabot's job, not a red build's.
          fresh="$(mktemp)"
          cp requirements.txt "$fresh"
          # shellcheck disable=SC2086  # the recorded command is meant to split
          ${command/--output-file requirements.txt/--output-file $fresh} --quiet
          if ! diff -u <(grep -v '^#' requirements.txt) <(grep -v '^#' "$fresh"); then
            echo "::error::requirements.txt differs from what its header command produces. Rerun: $command"
            exit 1
          fi
          echo "requirements.txt is the output of its header command" | tee "$RUNNER_TEMP/gate-lockfile"
      - name: The workflows are valid
        id: workflows
        # actionlint was pinned in toolchain.env and run only by
        # scripts/check.sh when it happened to be installed, so nothing held CI
        # to it. With shellcheck on the PATH (installed above) it also checks
        # every run: block as shell.
        run: |
          set -euo pipefail
          version="${{ needs.toolchain.outputs.actionlint-version }}"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -color
          set -- .github/workflows/*.yml
          echo "$# workflows pass actionlint ${version}, run: blocks included" | tee "$RUNNER_TEMP/gate-workflows"
      - name: Every action is pinned to a commit, with its version beside it
        id: pins
        # A tag can be moved after review; a commit cannot. The version comment
        # is what Dependabot rewrites with the commit and what a reader checks,
        # so one without the other is a pin nobody can read.
        run: |
          set -euo pipefail
          bad="$(grep -rnE '^[[:space:]-]*uses:[[:space:]]' .github/workflows .github/actions \
                 | grep -vE 'uses:[[:space:]]+\./' \
                 | grep -vE '@[0-9a-f]{40} # v[0-9]+(\.[0-9]+){0,2}$' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo "::error::pin every action to a full commit SHA followed by '# vX.Y.Z'"
            exit 1
          fi
          echo "every action is pinned to a commit, with its version" | tee "$RUNNER_TEMP/gate-pins"
      - name: Every job has a timeout
        id: timeouts
        # Without one a hung job holds its runner for GitHub's six-hour default.
        # A job that calls a reusable workflow cannot take one; the workflow it
        # calls is checked instead.
        run: |
          set -euo pipefail
          missing="$(for f in .github/workflows/*.yml; do
            yq '.jobs | to_entries | .[] | select(.value.uses == null and .value."timeout-minutes" == null) | .key' "$f" \
              | sed "s|^|$f: |"
          done)"
          if [ -n "$missing" ]; then
            printf '%s\n' "$missing"
            echo "::error::every job needs timeout-minutes"
            exit 1
          fi
          echo "every job has timeout-minutes" | tee "$RUNNER_TEMP/gate-timeouts"
      - name: Every hosted job runs on the declared runner image
        id: runners
        # The same reasoning as the badge check: workflow YAML cannot read
        # toolchain.env, so it is verified against it. A job left on
        # `ubuntu-latest` would move to a new OS on GitHub's schedule.
        run: |
          set -euo pipefail
          . ./scripts/toolchain.env
          stray="$(grep -HnE '^[[:space:]]*runs-on:' .github/workflows/*.yml \
                   | grep -v 'self-hosted' \
                   | grep -v "runs-on: ${RUNNER_IMAGE}\$" || true)"
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo "::error::hosted jobs must run on ${RUNNER_IMAGE} (scripts/toolchain.env)."
            exit 1
          fi
          echo "every hosted job runs on ${RUNNER_IMAGE}" | tee "$RUNNER_TEMP/gate-runners"
      - name: Shell safety
        id: shell
        run: |
          set -euo pipefail
          . ./scripts/toolchain.env
          # shellcheck disable=SC2086  # both lists are meant to split
          set -- $SHELL_SOURCES
          for f; do
            case "$f" in
              *backup.sh|*ci-local.sh) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done
          # shellcheck disable=SC2086
          shellcheck -x $SHELL_SOURCES
          # shellcheck disable=SC2086
          for suite in $SHELL_SUITES; do "$suite"; done
          # shellcheck disable=SC2086
          echo "$(echo $SHELL_SOURCES | wc -w | tr -d ' ') scripts parse and pass shellcheck; $(echo $SHELL_SUITES | wc -w | tr -d ' ') suites pass" \
            | tee "$RUNNER_TEMP/gate-shell"
      - name: Gate summary
        # One table on the run's summary page, built from GitHub's own record
        # of each step's outcome, so a failed check is a failed row rather than
        # a missing one. Each check leaves a one-line detail when it passes.
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          rows="$(printf '%s' "$STEPS" | jq -r 'to_entries[] | "\(.key)\t\(.value.outcome)"')"
          total="$(printf '%s\n' "$rows" | grep -c . || true)"
          failed="$(printf '%s\n' "$rows" | grep -c $'\tfailure' || true)"
          {
            echo "## Gate"
            echo
            if [ "$failed" -eq 0 ]; then echo "All ${total} checks passed."
            else echo "**${failed} of ${total} checks failed.**"; fi
            echo
            echo "| Check | Result | Detail |"
            echo "| --- | --- | --- |"
            printf '%s\n' "$rows" | while IFS=$'\t' read -r id outcome; do
              detail="$(cat "$RUNNER_TEMP/gate-$id" 2>/dev/null | tail -1 || true)"
              case "$outcome" in
                success) result="pass" ;;
                failure) result="**fail**"; detail="see the step log" ;;
                *) result="$outcome"; detail="${detail:-not run}" ;;
              esac
              echo "| \`$id\` | $result | ${detail//|/\\|} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.toolchain.outputs.python-versions) }}
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install coverage==${{ needs.toolchain.outputs.coverage-version }}
      - run: python manage.py check
      - name: Public plugin contract
        env:
          SEVERINO_HQ_PLUGINS: example_hq_plugin.plugin:plugin
        run: |
          python manage.py check
          python manage.py plugins
      - run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage gate
        env:
          COVERAGE_FLOOR: ${{ needs.toolchain.outputs.coverage-floor }}
        # Parallel across the runner's cores, as scripts/check.sh already runs it
        # locally; core/test_runner.py is what makes workers safe on the WAL
        # database. Coverage follows the workers (.coveragerc) and is combined
        # before it is judged. Each test's logs are shown only if it fails, and
        # the ten slowest tests are named so a slow one is noticed, not endured.
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/tests.log"
          coverage run manage.py test --parallel auto --durations 10 2>&1 | tee "$log"
          coverage combine --quiet
          coverage report --fail-under="$COVERAGE_FLOOR"
          pct="$(coverage report --format=total --precision=2)"
          ran="$(sed -nE 's/^Ran ([0-9]+) tests? in ([0-9.]+)s$/\1 tests in \2s/p' "$log")"
          {
            echo "### Python ${{ matrix.python-version }}: ${ran}, coverage ${pct}% (floor ${COVERAGE_FLOOR}%)"
            if [ "${{ matrix.python-version }}" = "${{ needs.toolchain.outputs.oldest-python }}" ]; then
              echo
              echo "<details><summary>Slowest tests</summary>"
              echo
              echo "| Seconds | Test |"
              echo "| ---: | --- |"
              sed -n '/^Slowest test durations/,/^$/p' "$log" | grep -E '^[0-9.]+s ' \
                | sed -E 's/^([0-9.]+)s +[^ ]+ \(([^)]+)\).*/| \1 | <code>\2<\/code> |/'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The README badge states the coverage actually measured
        # The README is static, so the badge is verified rather than
        # generated. The same script runs in scripts/ci-local.sh.
        if: matrix.python-version == needs.toolchain.outputs.oldest-python
        run: scripts/coverage-badge.sh

  security:
    name: security
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.toolchain.outputs.oldest-python }}
      - run: pip install --require-hashes -r requirements.txt
      # Production-posture check: DEBUG off, real host. --fail-level WARNING
      # turns Django's security advisories into hard failures. The env below
      # mirrors a real prod config so the check validates how settings.py
      # translates it, not CI artifacts. The key is a throwaway >50-char value
      # only to satisfy the strength check (W009).
      - name: Django deployment check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef"
          DJANGO_ALLOWED_HOSTS: "hq.example.com"
          SEVERINO_OIDC_ISSUER: "https://sso.example.com"
          DJANGO_BEHIND_TLS_PROXY: "1"
          DJANGO_SESSION_COOKIE_SECURE: "1"
          DJANGO_CSRF_COOKIE_SECURE: "1"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
          DJANGO_HSTS_PRELOAD: "1"
        run: python manage.py check --deploy --fail-level WARNING
      - name: pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  container-pr:
    name: container
    needs: [lint, test, security]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build -t severino-hq:pr-${{ github.sha }} .
      - name: Prove container readiness
        env:
          IMAGE: severino-hq:pr-${{ github.sha }}
        run: |
          cleanup() {
            docker rm --force severino-hq-pr >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name severino-hq-pr \
            --publish 127.0.0.1:8000:8000 \
            --health-interval 2s \
            --health-timeout 3s \
            --health-retries 5 \
            --health-start-period 1s \
            --env DJANGO_SECRET_KEY=ci-only-container-key-0123456789abcdef0123456789abcdef \
            --env DJANGO_ALLOWED_HOSTS=127.0.0.1 \
            "$IMAGE"
          ready=0
          for _attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' severino-hq-pr)"
            if [ "$status" = healthy ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs severino-hq-pr
            exit 1
          fi
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: severino-hq:pr-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  build:
    name: build
    needs: [lint, test, security]
    # Also on pull requests, and that is the point. The composition (the only
    # environment that runs this application the way production does, with
    # DEBUG off and the extensions loaded) can only be built on top of a host
    # image. While this job ran on main alone, there was no host image for a
    # pull request, so the composition could not be checked until after the
    # merge that created it. Three separate failures reached main that way, each
    # costing a merge and a rebuild to find something a pull request could have
    # told us.
    #
    # Same-repository pull requests only: a fork's token cannot write packages,
    # and handing one the ability to push an image under this name is not a
    # thing to arrange by accident.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing below. The workflow's own OIDC identity is what ends up
      # in the certificate, which is the whole point: the signature says which
      # workflow, in which repository, at which commit, produced this image.
      id-token: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build and push
        id: build
        env:
          # The commit the composition will look for. On a pull request
          # `GITHUB_SHA` is the merge commit, while the `workflow_run` event
          # that starts the composition reports `head_sha`: the branch tip.
          # Tagging by the merge commit would publish an image the composition
          # then could not find, and the failure would read as "no such image"
          # rather than "these two disagree about which commit this is".
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="sha-${HEAD_SHA::12}"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          # `latest` follows main and nothing else. A pull request builds an
          # image so it can be composed and checked; it does not get to move
          # the tag that says what the host currently is.
          if [ "${{ github.event_name }}" = "push" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
      # An admitted extension wheel already carries a signature naming the
      # workflow that produced it, and the composition refuses to install one
      # that does not. The image those wheels are installed *into* carried
      # nothing, so the part of the system that runs everything was the one
      # part taken on trust. This is the other half of that check.
      #
      # Signed by digest, not by tag: a tag is a pointer somebody can move, and
      # a signature over a pointer proves nothing about what it points at now.
      - name: Sign the host image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$DIGEST"

  scan:
    name: scan
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # Scans the exact artifact about to ship, between build and deploy.
      # Fails the pipeline on a fixable HIGH/CRITICAL in the image.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

