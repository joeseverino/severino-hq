name: ci

# Push to main is the deploy trigger. Every gate below must pass before the
# self-hosted deploy job runs — a red commit physically cannot reach the box.
# Pull requests run the checks only (no build, no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.18
      - run: ruff check .
      - name: No private extension names in the public tree
        # The extensions are private repositories; this one is public. Their
        # inventory is kept in the COMPOSITION_EXTENSIONS variable rather than
        # committed, and a test already asserts the committed inventory file
        # stays empty. Nothing stopped the names appearing in prose, though --
        # a doc, a comment, a commit message -- and that is how one reached
        # this repository.
        #
        # Checked against the variable, so this file never has to name the
        # thing it is protecting. Matched on the repository and identifier
        # forms only (`severino-x`, `severino.x`, `severino_x`), not the bare
        # word: bare words appear in ordinary English -- the MIT licence says
        # "FITNESS FOR A PARTICULAR PURPOSE" -- and a check with false
        # positives gets switched off.
        env:
          COMPOSITION_EXTENSIONS: ${{ vars.COMPOSITION_EXTENSIONS }}
        run: |
          set -euo pipefail
          if [ -z "${COMPOSITION_EXTENSIONS:-}" ]; then
            echo "COMPOSITION_EXTENSIONS is unset; nothing to check against"
            exit 0
          fi
          names=$(printf '%s' "$COMPOSITION_EXTENSIONS" \
            | jq -r '[.extensions[] | (.repository | split("/") | last), .id]
                     | unique | .[]' \
            | grep -v '^$' || true)
          found=0
          for name in $names; do
            stem=${name##*/}
            for form in "$stem" "${stem//-/.}" "${stem//-/_}"; do
              hits=$(git grep -Iril -e "$form" -- . ':!LICENSE' || true)
              if [ -n "$hits" ]; then
                echo "::error::a private extension identifier appears in tracked files"
                printf '%s\n' "$hits" | sed 's/^/  /'
                found=1
              fi
            done
          done
          [ "$found" -eq 0 ] || exit 1
          echo "no private extension identifiers in the tracked tree"
      - name: Shell safety
        run: |
          sh -n scripts/deploy-image.sh scripts/install-controller.sh \
            scripts/controller-ssh.sh scripts/provision-controller-ssh.sh \
            scripts/refresh-secrets.sh scripts/render-controller-env.sh \
            scripts/run-controller.sh scripts/test-render-controller-env.sh \
            scripts/test-edge-controller.sh scripts/test-deploy-image.sh \
            scripts/test-backup.sh \
            deploy/targets/severino-hq-edge-controller \
            deploy/targets/severino-hq-edge-dispatch \
            deploy/targets/severino-hq-cpanel-controller
          bash -n scripts/backup.sh
          shellcheck scripts/deploy-image.sh scripts/install-controller.sh \
            scripts/controller-ssh.sh scripts/provision-controller-ssh.sh \
            scripts/refresh-secrets.sh scripts/render-controller-env.sh \
            scripts/run-controller.sh scripts/test-render-controller-env.sh \
            scripts/test-edge-controller.sh scripts/test-deploy-image.sh \
            scripts/backup.sh scripts/test-backup.sh \
            deploy/targets/severino-hq-edge-controller \
            deploy/targets/severino-hq-edge-dispatch \
            deploy/targets/severino-hq-cpanel-controller
          scripts/test-render-controller-env.sh
          scripts/test-edge-controller.sh
          scripts/test-deploy-image.sh
          scripts/test-backup.sh

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install coverage
      - run: python manage.py check
      - name: Public plugin contract
        env:
          SEVERINO_HQ_PLUGINS: example_hq_plugin.plugin:plugin
        run: |
          python manage.py check
          python manage.py plugins
      - run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage gate
        run: |
          coverage run manage.py test --verbosity 2
          coverage report --fail-under=70
          pct="$(coverage report --format=total 2>/dev/null || echo '')"
          if [ "${{ matrix.python-version }}" = "3.12" ] && [ -n "$pct" ]; then
            echo "### Test coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
          fi

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      # Production-posture check: DEBUG off, real host. --fail-level WARNING
      # turns Django's security advisories into hard failures. The env below
      # mirrors a real prod config so the check validates how settings.py
      # translates it — not CI artifacts. The key is a throwaway >50-char value
      # only to satisfy the strength check (W009).
      - name: Django deployment check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef"
          DJANGO_ALLOWED_HOSTS: "hq.example.com"
          DJANGO_BEHIND_TLS_PROXY: "1"
          DJANGO_SESSION_COOKIE_SECURE: "1"
          DJANGO_CSRF_COOKIE_SECURE: "1"
          DJANGO_HSTS_SECONDS: "31536000"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "1"
          DJANGO_HSTS_PRELOAD: "1"
        run: python manage.py check --deploy --fail-level WARNING
      - name: pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  container-pr:
    name: container
    needs: [lint, test, security]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build -t severino-hq:pr-${{ github.sha }} .
      - name: Prove container readiness
        env:
          IMAGE: severino-hq:pr-${{ github.sha }}
        run: |
          cleanup() {
            docker rm --force severino-hq-pr >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name severino-hq-pr \
            --publish 127.0.0.1:8000:8000 \
            --health-interval 2s \
            --health-timeout 3s \
            --health-retries 5 \
            --health-start-period 1s \
            --env DJANGO_SECRET_KEY=ci-only-container-key-0123456789abcdef0123456789abcdef \
            --env DJANGO_ALLOWED_HOSTS=127.0.0.1 \
            "$IMAGE"
          ready=0
          for _attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' severino-hq-pr)"
            if [ "$status" = healthy ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs severino-hq-pr
            exit 1
          fi
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: severino-hq:pr-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  build:
    name: build
    needs: [lint, test, security]
    # Also on pull requests, and that is the point. The composition -- the only
    # environment that runs this application the way production does, with
    # DEBUG off and the extensions loaded -- can only be built on top of a host
    # image. While this job ran on main alone, there was no host image for a
    # pull request, so the composition could not be checked until after the
    # merge that created it. Three separate failures reached main that way, each
    # costing a merge and a rebuild to find something a pull request could have
    # told us.
    #
    # Same-repository pull requests only: a fork's token cannot write packages,
    # and handing one the ability to push an image under this name is not a
    # thing to arrange by accident.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push
        id: build
        env:
          # The commit the composition will look for. On a pull request
          # `GITHUB_SHA` is the merge commit, while the `workflow_run` event
          # that starts the composition reports `head_sha` -- the branch tip.
          # Tagging by the merge commit would publish an image the composition
          # then could not find, and the failure would read as "no such image"
          # rather than "these two disagree about which commit this is".
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="sha-${HEAD_SHA::12}"
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          # `latest` follows main and nothing else. A pull request builds an
          # image so it can be composed and checked; it does not get to move
          # the tag that says what the host currently is.
          if [ "${{ github.event_name }}" = "push" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

  scan:
    name: scan
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Scans the exact artifact about to ship, between build and deploy.
      # Fails the pipeline on a fixable HIGH/CRITICAL in the image.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.build.outputs.image }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

