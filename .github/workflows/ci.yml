name: CI

# Every gate a change passes, as one graph. On a pull request the image is
# also checked and composed with the extensions (compose.yml), and Ready
# passes only when every job did: the one check the ruleset requires. Lint,
# Test and Browser run on a pull request only where its change reaches them
# (Legs, below); a push to main runs them all. On main,
# Release starts Compose once the gates pass; Deploy (deploy.yml) is never
# reached from a pull request.
#
# The gates themselves are declared once, as mise tasks in their job's file
# under mise-tasks/: each gate job below is named for the task it runs
# (lint, test, browser, build, scan), and `mise run check` runs the same list
# on a developer's machine. A gate is added there, never here.
#
# The file keeps its name: the host and worker images are signed by it, and
# what verifies that signature (Compose, and the deploy script on the host)
# pins this path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to main whose pull request already passed with this exact tree is
  # not checked twice: Build promotes the pull request's image instead of
  # building another, and Lint, Test and Browser stand on that run when it
  # left none of them out. Anything less than proof
  # (tools/pipeline/proven-on-pr.sh) and every gate runs.
  proven:
    name: Proven on its pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Unproven is the safe answer, so an error here runs every gate rather
    # than holding the push.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: read
    outputs:
      pr: ${{ steps.proof.outputs.pr }}
      digest: ${{ steps.proof.outputs.digest }}
      runner: ${{ steps.proof.outputs.runner }}
      gates: ${{ steps.proof.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned mise
        id: mise
        run: echo "version=$(.github/actions/toolchain/mise-version.sh mise.toml)" >> "$GITHUB_OUTPUT"
      # The cosign mise.lock records, which the host verifies with too.
      - name: Install the pinned cosign
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          version: ${{ steps.mise.outputs.version }}
          install_args: cosign
          cache: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Find the pull request that proved this tree
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/pipeline/proven-on-pr.sh | tee -a "$GITHUB_OUTPUT"
          pr="$(sed -n 's/^pr=//p' "$GITHUB_OUTPUT" | tail -1)"
          if [ -n "$pr" ]; then
            echo "Proven on #$pr: its checks passed on this exact tree, and its image is promoted." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Which of Lint, Test, Test's Go tests and Browser a pull request's change
  # can affect. Each declares what it reads as the `sources` of the task it
  # runs, and tools/pipeline/legs.py asks mise's --affected which of those the
  # change touches; a changed path none declares runs every leg. A leg left out
  # is skipped, which Ready passes. A push to main skips this job, and a job
  # that fails here leaves its outputs empty: either way every leg runs.
  legs:
    name: Legs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      lint: ${{ steps.legs.outputs.lint }}
      test: ${{ steps.legs.outputs.test }}
      controller: ${{ steps.legs.outputs.controller }}
      browser: ${{ steps.legs.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      - name: Read the pinned mise
        id: mise
        run: echo "version=$(.github/actions/toolchain/mise-version.sh mise.toml)" >> "$GITHUB_OUTPUT"
      # mise alone: --affected reads the task definitions and installs nothing.
      - name: Install the pinned mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          version: ${{ steps.mise.outputs.version }}
          install: false
          cache: false
      - name: The legs this change reaches
        id: legs
        run: python3 -m tools.pipeline.legs HEAD^1 HEAD

  lint:
    name: Lint
    needs: [proven, legs]
    if: ${{ !cancelled() && needs.proven.outputs.gates != 'passed' && needs.legs.outputs.lint != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit and its first parent: on a pull request the base its
          # merge commit merges into, on main the commit before the squash.
          # lint:openapi-breaking compares the API document with that one.
          fetch-depth: 2
      - uses: ./.github/actions/toolchain
        with:
          # The structural bar builds its Go inspector from the controller's
          # module, and lint:openapi lints with Redocly from npm.
          go: true
          npm: true
      - name: Lint
        # Every gate named lint:* (mise-tasks/lint.toml, mise-tasks/lint/).
        # Each runs to the end, and the last lines of this step name every one
        # that failed.
        env:
          CHECK_BASE: HEAD^1
        run: mise run lint
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # The review is read in the job summary, so the job needs no write.
        with:
          fail-on-severity: high

  test:
    name: Test
    needs: [proven, legs]
    if: ${{ !cancelled() && needs.proven.outputs.gates != 'passed' && needs.legs.outputs.test != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PythonVersionTests holds this to tools/pipeline/toolchain.env: a matrix cannot read it.
        python: ["3.15"]
    env:
      # `mise run test` walks this list; a leg is one interpreter.
      TEST_PYTHONS: ${{ matrix.python }}
      # The Go tests, left out where the change reaches none of what they read.
      MISE_TASK_SKIP: ${{ needs.legs.outputs.controller == 'false' && 'test:controller' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          python: ${{ matrix.python }}
          # The live bridge tests build the controller, and test:controller
          # runs its race tests.
          go: true
          # `mise run test` installs the lint tools a test label can reach.
          npm: true
      - name: Install nft
        # test:controller loads every egress table in `nft -c`, through the
        # runner's passwordless sudo, and the runner image ships no nft.
        if: needs.legs.outputs.controller != 'false'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nftables
      - name: Test
        # Every gate named test:* (mise-tasks/test.toml, mise-tasks/test/).
        run: mise run test

  # Real-browser layout invariants over synthetic example.* pages
  # (hq/platform/core/tests/browser/). Every request the page makes is answered in
  # process; the browser reaches nothing. Each browser:* gate is a leg, an
  # engine's gate split into shares side by side, each its `shard` of the
  # pages and tests (hq/platform/core/tests/browser/shards.py). Named without
  # the matrix: GitHub appends each leg's gate and share itself, and a job
  # skipped before its matrix expands shows its name as written.
  browser:
    name: Browser
    needs: [proven, legs]
    if: ${{ !cancelled() && needs.proven.outputs.gates != 'passed' && needs.legs.outputs.browser != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Playwright's image for the release uv.lock pins carries its browsers and
    # their system libraries, so a leg installs nothing from apt or a browser
    # CDN (BrowserInstallTests holds the two versions together). As its CI
    # guide runs it: the runner's user, which owns the workspace, and the
    # host's IPC namespace, without which Chromium runs out of shared memory.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-resolute@sha256:e0006b47eb8c8eb548acebc35ece5968a331051c8f33ae5cd45e9cafd65fdc83
      options: --user 1001 --ipc=host
    strategy:
      fail-fast: false
      matrix:
        # GateReferenceTests holds the gates to those mise-tasks/browser.toml
        # declares, and each split gate's shares to 1/n through n/n.
        include:
          - { gate: webkit, shard: 1/7 }
          - { gate: webkit, shard: 2/7 }
          - { gate: webkit, shard: 3/7 }
          - { gate: webkit, shard: 4/7 }
          - { gate: webkit, shard: 5/7 }
          - { gate: webkit, shard: 6/7 }
          - { gate: webkit, shard: 7/7 }
          - { gate: chromium, shard: 1/2 }
          - { gate: chromium, shard: 2/2 }
          - { gate: demo }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          # Every browser gate installs tools/lint's npm project for axe-core.
          npm: true
      - name: Browser
        # This leg's browser:* gate, and its share of it.
        env:
          GATE: browser:${{ matrix.gate }}
          HQ_BROWSER_SHARD: ${{ matrix.shard }}
        run: mise run "$GATE"
      # A failed rule saves the page as it stood (tests/browser/gate.py writes each
      # into the checkout's var/browser-failures/).
      - name: Failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-${{ matrix.gate }}-${{ strategy.job-index }}
          path: var/browser-failures/
          if-no-files-found: ignore

  # The one writer of the caches the jobs above restore, on every push to main
  # so it runs when they stand on their pull request's run. A branch reads
  # main's caches and writes none, so a pull request adds no entries. Release
  # does not wait for it.
  caches:
    name: Caches
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          go: true
          npm: true
          save: true
      - name: Fill the caches
        if: >-
          steps.toolchain.outputs.uv-hit != 'true' ||
          steps.toolchain.outputs.go-hit != 'true' ||
          steps.toolchain.outputs.npm-hit != 'true'
        run: mise run ci:caches
      - if: steps.toolchain.outputs.uv-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.uv-path }}
          key: ${{ steps.toolchain.outputs.uv-key }}
      - if: steps.toolchain.outputs.go-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.go-path }}
          key: ${{ steps.toolchain.outputs.go-key }}
      - if: steps.toolchain.outputs.npm-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.toolchain.outputs.npm-path }}
          key: ${{ steps.toolchain.outputs.npm-key }}

  # The one writer of the registry layer caches Build reads (the host image's
  # and, at the same ref with -runner, the worker's), on every push to
  # main, since a push whose tree its pull request proved promotes rather than
  # builds. A cache entry maps a step to a layer on its writer's word, so no
  # pull request writes one. The image built here is thrown away with the
  # runner; Release does not wait for it, and a newer push cancels it with
  # the rest of the run.
  build-cache:
    name: Build cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      BUILD_CACHE: ghcr.io/${{ github.repository }}/build-cache:main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Write the layer cache
        run: mise run build --no-verify --cache "$BUILD_CACHE" --cache-write

  # Code scanning, on every pull request and push to main: main's analysis is
  # what a pull request's is compared with. Release does not wait for it.
  # CodeQL's own action uploads what it finds, which the ruleset and the
  # review comments read; scan:alerts then fails the job on any alert GitHub
  # holds open on the analyzed ref. `mise run scan` runs the same queries on a
  # developer's machine.
  scan:
    name: Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          # The suite is named in the config, beside the rules it filters.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
      - uses: ./.github/actions/toolchain
      - name: No open alert
        # On the ref the analysis was uploaded for, GITHUB_REF.
        run: mise run scan:alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODEQL_SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}

  build:
    name: Build
    # On a pull request the image is published as soon as it is built, so its
    # checks and its composition start at once. On main it is checked before
    # it is published and signed, and only Release composes it.
    #
    # Same-repository pull requests only: a fork's token cannot write packages,
    # and handing one the ability to push an image under this name is not a
    # thing to arrange by accident.
    needs: proven
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing below. The workflow's own OIDC identity is what ends up
      # in the certificate, which is the whole point: the signature says which
      # workflow, in which repository, at which commit, produced this image.
      id-token: write
    # The host image and the automation worker's image (the Dockerfile's
    # runner stage), built from one tree and published, promoted, signed and
    # attested together: a release pins the worker image CI built beside its
    # host image.
    outputs:
      image: ${{ steps.publish.outputs.digest }}
      runner: ${{ steps.publish.outputs.runner }}
    env:
      # The commit the image is tagged for. On a pull request `GITHUB_SHA` is
      # the merge commit, while the push to main that merges it looks for the
      # pull request's head, the branch tip (tools/pipeline/proven-on-pr.sh).
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Set when this tree's images were proven on its pull request: promoted,
      # not rebuilt. proven-on-pr.sh names both or neither.
      PROVEN: ${{ needs.proven.outputs.digest }}
      PROVEN_RUNNER: ${{ needs.proven.outputs.runner }}
      # Written by Build cache alone, with the worker's at the ref plus -runner;
      # a missing or unreadable one builds cold.
      BUILD_CACHE: ghcr.io/${{ github.repository }}/build-cache:main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        if: env.PROVEN == ''
      # A promotion runs Trivy and cosign, so it installs those rather than
      # the toolchain the build and its checks need. Both are lazy in
      # mise.toml, so a build installs them here too.
      - name: Read the pinned mise
        id: mise
        run: echo "version=$(.github/actions/toolchain/mise-version.sh mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Trivy and cosign
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          version: ${{ steps.mise.outputs.version }}
          install_args: trivy cosign
          cache: false
      # Before the build too, which reads the layer cache: a package that may be private.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build the production images
        id: build
        if: env.PROVEN == ''
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY:sha-${HEAD_SHA::12}"
          runner="ghcr.io/$GITHUB_REPOSITORY/runner:sha-${HEAD_SHA::12}"
          mise run build --tag "$image" --runner-tag "$runner" --revision "$HEAD_SHA" --no-verify --cache "$BUILD_CACHE"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
      # On main only: a pull request's images are checked by Build verify,
      # alongside its composition.
      - name: Every check an image must pass
        # Every gate named image:verify:* (mise-tasks/image.toml), against the images just built.
        if: env.PROVEN == '' && github.event_name == 'push'
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          RUNNER_IMAGE: ${{ steps.build.outputs.runner }}
        run: mise run build
      - name: Publish
        id: publish
        if: env.PROVEN == ''
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          RUNNER_IMAGE: ${{ steps.build.outputs.runner }}
        run: |
          set -euo pipefail
          # The worker's image first: Compose looks it up once the host
          # image is there (tools/pipeline/host-image.sh).
          docker push "$RUNNER_IMAGE"
          runner=$(docker buildx imagetools inspect "$RUNNER_IMAGE" \
            --format '{{.Manifest.Digest}}')
          echo "runner=${RUNNER_IMAGE%:*}@$runner" >> "$GITHUB_OUTPUT"
          docker push "$IMAGE"
          # `latest` follows main and nothing else. A pull request publishes
          # an image so it can be checked and composed; it does not get to move
          # the tag that says what the host currently is.
          if [ "${{ github.event_name }}" = "push" ]; then
            docker tag "$IMAGE" "${IMAGE%:*}:latest"
            docker push "${IMAGE%:*}:latest"
          fi
          digest=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${IMAGE%:*}@$digest" >> "$GITHUB_OUTPUT"
      # An admitted extension wheel carries a signature naming the workflow
      # that produced it, and the composition refuses to install one that does
      # not. This signs the image those wheels are installed into, the other
      # half of that check.
      #
      # Signed by digest, not by tag: a tag is a pointer somebody can move, and
      # a signature over a pointer proves nothing about what it points at now.
      - name: Promote the images its pull request proved
        # The same manifest under this commit's tag, so the tag names the
        # digest that is signed: from one source, `imagetools create
        # --prefer-index=false` pushes the bytes it fetched by digest, an index
        # or a single manifest alike, where the default wraps a single manifest
        # in a new index. Each tag is read back and must name that digest.
        # Only the host image carries `latest`.
        id: promote
        if: env.PROVEN != ''
        run: |
          set -euo pipefail
          promote() {
            local proven=$1 tag resolved
            shift
            for tag do
              docker buildx imagetools create --prefer-index=false \
                --tag "${proven%@*}:$tag" "$proven"
              resolved=$(docker buildx imagetools inspect "${proven%@*}:$tag" \
                --format '{{.Manifest.Digest}}')
              if [ "$resolved" != "${proven#*@}" ]; then
                echo "::error::${proven%@*}:$tag resolves to $resolved, not ${proven#*@}"
                exit 1
              fi
            done
          }
          promote "$PROVEN_RUNNER" "sha-${HEAD_SHA::12}"
          promote "$PROVEN" "sha-${HEAD_SHA::12}" latest
          echo "digest=$PROVEN" >> "$GITHUB_OUTPUT"
          echo "runner=$PROVEN_RUNNER" >> "$GITHUB_OUTPUT"
      - name: Sign
        # On a promotion too: Compose composes only images signed by this
        # workflow on main, and the pull request's signature is not that.
        env:
          DIGEST: ${{ steps.publish.outputs.digest || steps.promote.outputs.digest }}
          RUNNER: ${{ steps.publish.outputs.runner || steps.promote.outputs.runner }}
        run: |
          set -euo pipefail
          for image in "$RUNNER" "$DIGEST"; do cosign sign --yes "$image"; done
      # What each image holds, as Trivy reads it (Debian packages, Python
      # distributions, each Go binary's modules), in CycloneDX, signed by the
      # same workflow identity as the image and stored beside it in the
      # registry. Rekor's entry keeps only the envelope's hashes, so the list
      # is exactly as visible as the image. Trivy needs no vulnerability
      # database for an SBOM.
      - name: Attest the SBOMs
        env:
          DIGEST: ${{ steps.publish.outputs.digest || steps.promote.outputs.digest }}
          RUNNER: ${{ steps.publish.outputs.runner || steps.promote.outputs.runner }}
        run: |
          set -euo pipefail
          for image in "$RUNNER" "$DIGEST"; do
            trivy image --quiet --format cyclonedx --output sbom.cdx.json "$image"
            cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$image"
          done

  # A pull request's images, checked from the registry while its composition
  # runs: the same gates main runs inside Build before it publishes. IMAGE
  # and RUNNER_IMAGE name them, so `mise run build` checks them without
  # building others.
  build-verify:
    name: Build verify
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      RUNNER_IMAGE: ${{ needs.build.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull the images by digest
        # The worker's smoke runs with --pull never, as hq-host runs it.
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE"
          docker pull --quiet "$RUNNER_IMAGE"
      - uses: ./.github/actions/toolchain
      - name: Every check an image must pass
        # Every gate named image:verify:* (mise-tasks/image.toml).
        run: mise run build

  # A pull request's composition: this image plus every admitted extension,
  # each extension's tests run inside it (compose.yml). It publishes and signs
  # nothing: those steps belong to a dispatch on main. A fork's pull request
  # has no image and no secrets, so it is not composed here: main composes it
  # before anything is published.
  compose:
    name: Composition
    needs: build
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/compose.yml
    # What compose.yml's job declares, which a caller must grant: it signs
    # and publishes only on a dispatch on main, never from here.
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    with:
      host-image: ${{ needs.build.outputs.image }}
      runner-image: ${{ needs.build.outputs.runner }}
    secrets:
      HQ_APP_CLIENT_ID: ${{ secrets.HQ_APP_CLIENT_ID }}
      HQ_APP_KEY: ${{ secrets.HQ_APP_KEY }}
      COMPOSITION_EXTENSIONS: ${{ secrets.COMPOSITION_EXTENSIONS }}

  ready:
    name: Ready
    needs: [proven, legs, lint, test, browser, scan, build, build-verify, compose]
    # The one check the ruleset requires, accepted only from GitHub Actions:
    # it passes when every job above passed, so a gate added or removed here
    # never touches the repository's settings.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say a fork's pull request is not composed
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          message="A fork's pull request cannot read the extensions, so it is not built or composed here; main composes it before anything is published."
          echo "::notice title=Not composed::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          # A same-repository pull request is composed, so these must pass,
          # not be skipped.
          REQUIRED: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'build build-verify compose' || '' }}
        # Each job's result, in this run's summary; a job that did not pass
        # fails this one. Skipped passes, unless the job is required: a gate
        # skips itself only where it does not apply.
        run: &verdict |
          set -euo pipefail
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          unmet="$(jq -r --arg required "$REQUIRED" '
            ($required | split(" ")) as $must | to_entries[]
            | select(.value.result != "success" and (.value.result != "skipped" or (.key | IN($must[]))))
            | "\(.key): \(.value.result)"' <<<"$RESULTS")"
          if [ -n "$unmet" ]; then
            echo "$unmet"
            echo "::error title=Not passing::$(echo "$unmet" | paste -sd, -)"
            exit 1
          fi

  # On main, CI starts the build of HQ for this commit once every gate has
  # passed, and names the commit, so what Compose builds is exactly what CI
  # checked. Nothing else about a push starts it. Scan is not waited for:
  # code scanning holds a merge, not a release. Build verify and Composition
  # run only for a pull request: on a push, Build checks what it builds or
  # promotes the image its pull request checked, and Compose follows this job.
  release:
    name: Release
    needs: [proven, lint, test, browser, build]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUIRED: build
        run: *verdict
      - name: Mint a token to start Compose
        id: compose
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      - name: Start Compose for this commit
        env:
          GH_TOKEN: ${{ steps.compose.outputs.token }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run compose.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit="$COMMIT" -f reason="CI passed on main" -f force=true
