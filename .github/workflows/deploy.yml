name: Deploy

# Production, and nothing else. Started by Compose once it has published HQ
# for a commit on main, handed that commit; or by a person, to redeploy or roll
# back: choose "Run workflow" and give it the commit.
#
#   Resolve  finds the signed image for the commit, and records a deployment
#            of that commit to the production environment
#   Approve  waits for a person. A newer release takes its place in the wait
#   Deploy   on the self-hosted runner, once approved: hands the image to
#            root's hq-host, which verifies its signature, refuses one that
#            drops an extension, recreates, waits for health, rolls back if
#            it fails
#   Report   sets the deployment's status to the outcome deploy/outcomes.json
#            declares for the deploy's exit: live, live with a check after it
#            failed, not deployed, a rollback that failed, interrupted after
#            hq-host began, or not approved
#
# The deployment is GitHub's own record of where a commit stands: on the
# commit, the merged pull request and the environment's page. It is created
# here rather than by the environment's job, which would record the commit
# main was at when this run started, and call it a success once approved.
#
# Only a dispatch starts it, so no pull request, and no run of anything else,
# can reach the self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit on main to deploy. Blank deploys main as it is now.
        required: false
        default: ""
      compose_run:
        description: The Compose run that published it, when Compose started this.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.find.outputs.image }}
      commit: ${{ steps.find.outputs.commit }}
      deployment: ${{ steps.record.outputs.deployment }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Find the signed composition for the commit
        id: find
        env:
          # A given commit is input: passed as data, never interpolated.
          ASKED: ${{ inputs.commit }}
          MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit="${ASKED:-$MAIN}"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Not a commit::Give the full 40-character commit to deploy."
            exit 1
          fi
          tag="ghcr.io/${GITHUB_REPOSITORY}/composition:${commit}"
          if ! digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null) \
             || [ -z "$digest" ]; then
            echo "::error title=Never composed::No image of HQ was published for ${commit:0:12}. Run Compose for it first."
            exit 1
          fi
          echo "image=${tag%:*}@$digest" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "deploying ${tag%:*}@$digest, composed from ${commit:0:12}"
      # HQ's app, asked for deployments only and for this repository only, so
      # the job's own token stays read-only and the write lives one step.
      # zizmor warns that the file holds an anchor, and still audits the step
      # in each job that uses it, reporting every finding at this line, so the
      # anchor costs no audit.
      - &deployments-token
        name: Mint a token that can only write deployments
        id: deployments
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          permission-deployments: write
      - name: Record the deployment
        id: record
        env:
          GH_TOKEN: ${{ steps.deployments.outputs.token }}
          COMMIT: ${{ steps.find.outputs.commit }}
          IMAGE: ${{ steps.find.outputs.image }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPOSE_RUN: ${{ inputs.compose_run }}
        # No required contexts: CI passed before Compose published this
        # image, and this run's own jobs are checks on the commit still
        # running. A commit is deployed as it is, never merged with main.
        run: |
          set -euo pipefail
          deployment="$(jq -n --arg ref "$COMMIT" --arg image "$IMAGE" '{
              ref: $ref, environment: "production", production_environment: true,
              auto_merge: false, required_contexts: [], payload: {image: $image},
              description: "Waiting for approval"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          jq -n --arg log "$RUN_URL" '{state: "queued", log_url: $log, description: "Waiting for approval"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment/statuses" --input - --silent
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          {
            echo "Deploys \`$IMAGE\`, composed from ${COMMIT:0:12}."
            if [[ "$COMPOSE_RUN" =~ ^[0-9]+$ ]]; then
              echo
              echo "Published by [Compose run $COMPOSE_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$COMPOSE_RUN)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve
    needs: resolve
    if: success() && needs.resolve.outputs.image != ''
    # The approval, apart from the deploy it allows. One release waits at a
    # time and it is the newest: a later run takes this group and the older
    # wait is cancelled, so the queue holds the build that includes everything
    # and a superseded release ends as cancelled, not as a refusal. Cancelling
    # a wait changes nothing on the host. The Deploy job can still be
    # cancelled: pending in its group behind a newer one, before it begins; by
    # a person cancelling the run or its own timeout, once hq-host is running.
    # A lost runner fails it. Report tells these apart by whether the deploy
    # step began.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The environment's reviewers hold this job; the deployment it would
    # record is Resolve's.
    environment:
      name: production
      deployment: false
    concurrency:
      group: deploy-awaiting-approval
      cancel-in-progress: true
    permissions: {}
    steps:
      - *deployments-token
      - name: Approved
        env:
          GH_TOKEN: ${{ steps.deployments.outputs.token }}
          DEPLOYMENT: ${{ needs.resolve.outputs.deployment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg log "$RUN_URL" '{state: "in_progress", log_url: $log, description: "Approved: deploying"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT/statuses" --input - --silent

  deploy:
    name: Deploy
    needs: [resolve, approve]
    if: success() && needs.resolve.outputs.image != ''
    # Self-hosted runner ON the homelab. It dials out to GitHub; GitHub never
    # connects in. Only this job runs there, only for main, and it holds no
    # key of HQ's app.
    runs-on: [self-hosted, severino-hq]
    # Allows for the release's rehearsal, bounded in controller/host/rehearse.go.
    timeout-minutes: 40
    # Approved in the job before this one, which is what holds the
    # environment's protection. One deploy at a time: a newer one waits for
    # one that has started rather than cancelling it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Only to pull the image: the token is handed to root for that and kept
    # nowhere on this machine.
    permissions:
      packages: read
    # Kept when the step fails, so Report can say whether the release stands.
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - name: Deploy exact image with health rollback
        id: deploy
        # Same deploy path and rollback as a host release: it pulls, recreates,
        # waits for health, activates the controller, and restores the previous
        # image if any step fails.
        #
        # Run through sudo against the root-owned copy; this runner keeps no
        # checkout. That is what lets it hold no docker access and no general
        # sudo: everything privileged happens inside a program the runner
        # cannot edit, and the only thing crossing the boundary is one image
        # reference. The signature is verified there, as root, and not here:
        # root does not trust this runner, so a check made here would protect
        # nothing and need a registry credential on this machine to make.
        #
        # The registry token goes over stdin, not as an argument: arguments are
        # readable in the process table while the command runs. Root writes it
        # to a directory of this deploy's alone and removes it after.
        #
        # hq-host's exit status is the deploy's outcome, as deploy/outcomes.json
        # declares each; Report reads it there. The step fails on any but live.
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          status=0
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" \
            | sudo /usr/local/lib/severino-hq/deploy/bin/hq-host deploy "$IMAGE" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

  report:
    name: Report
    needs: [resolve, approve, deploy]
    # Whatever the deploy did, its deployment says so. On a hosted runner, so
    # the homelab one holds no token that can write to the repository.
    if: always() && needs.resolve.outputs.deployment != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # actions: read, to see whether the deploy step began.
    permissions:
      actions: read
      contents: read
    steps:
      - *deployments-token
      # The deploy outcomes, and the module that reads which release
      # production ran before, and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy
            tools/pipeline
      - name: Set the deployment's status
        env:
          GH_TOKEN: ${{ steps.deployments.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYMENT: ${{ needs.resolve.outputs.deployment }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          STATUS: ${{ needs.deploy.outputs.status }}
          RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTIONS_TOKEN: ${{ github.token }}
          # The Deploy job and its hq-host step, as GitHub's record of the run names them.
          DEPLOY_JOB: Deploy
          DEPLOY_STEP: Deploy exact image with health rollback
        # The outcome is the one deploy/outcomes.json declares for hq-host's
        # exit status, or not-deployed for a status it names nowhere. With no
        # status, hq-host never answered: not-approved for a deploy job that
        # never ran or was cancelled before its step began, not-deployed for
        # one that failed before it began, and interrupted for one whose step
        # began, since hq-host may have stopped, rolled back or still be
        # running. Whether the step began is GitHub's record of the run's
        # steps, which the runner reports as each starts and which outlives a
        # lost runner, where a job's outputs are evaluated on the runner at its
        # end. Unread, it is taken to have begun, so no deployment claims the
        # previous image on a guess. A release that went live is a success
        # whatever failed after it, since GitHub, release:report and HQ read
        # the newest success as what production runs; its description says a
        # check failed. The summary is public, so it names no host: an image,
        # commits and links.
        run: |
          set -euo pipefail
          began=""
          if [ -z "$STATUS" ] && [ "$RESULT" != skipped ]; then
            if jobs=$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --paginate --slurp); then
              began=$(jq -r --arg job "$DEPLOY_JOB" --arg step "$DEPLOY_STEP" '
                [.[].jobs[] | select(.name == $job) | .steps[]?
                 | select(.name == $step and .started_at != null and .conclusion != "skipped")]
                | length > 0' <<<"$jobs") || began=""
            fi
            if [ -z "$began" ]; then
              echo "::warning title=Deploy step not read::Whether hq-host began was not read, so the deploy is reported as interrupted."
            fi
          fi
          outcome=$(jq -c --arg status "$STATUS" --arg result "$RESULT" --arg began "$began" '
            .outcomes as $declared
            | if $status != "" then ([$declared[] | select(.exit == ($status | tonumber))][0] // $declared["not-deployed"])
              elif $result == "skipped" then $declared["not-approved"]
              elif $began == "false" then (if $result == "failure" then $declared["not-deployed"] else $declared["not-approved"] end)
              else $declared["interrupted"] end' deploy/outcomes.json)
          state=$(jq -r .state <<<"$outcome")
          description=$(jq -r .description <<<"$outcome")
          production=$(jq -r .production <<<"$outcome")
          check_failed=$(jq -r .check_failed <<<"$outcome")
          jq -n --arg state "$state" --arg log "$RUN_URL" --arg description "$description" \
            '{state: $state, log_url: $log, description: $description}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT/statuses" --input - --silent
          {
            echo "### $description"
            if [ "$production" = release ]; then
              echo
              if previous=$(python3 -m tools.pipeline.production previous "$COMMIT"); then
                if [ -n "$previous" ]; then
                  echo "Changes since the release production ran before: [${previous:0:12}...${COMMIT:0:12}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$COMMIT)"
                else
                  echo "No earlier release was live, so there is nothing to compare."
                fi
              else
                echo "The release production ran before was not read; this step's log says why."
              fi
              echo
              echo "To verify the image production runs was signed by Compose on main:"
              echo
              echo '```sh'
              echo "cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/compose.yml@refs/heads/main $IMAGE"
              echo '```'
            fi
            if [ "$production" = unknown ]; then
              echo
              echo "Read what production runs with \`hq-host verify\` on the deploy host before deploying again."
            fi
            if [ "$production" != release ] && { [ "$check_failed" = true ] || [ "$production" = unknown ]; }; then
              echo
              echo "What the deploy, sync and installer printed is in /var/log/severino-hq on the deploy host."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
