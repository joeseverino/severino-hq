name: Renovate

# Proposes updates to every pin the repository keeps, as .github/renovate.json
# says. It runs here, under HQ's GitHub App narrowed to this repository, so no
# outside service holds a write to it, and its pull requests run CI as any
# other does. Every six hours so a security fix opens within the day; the
# configuration's schedule keeps everything else to Monday.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/renovate
      # The host runs the same image, so the one declaration is read here.
      - name: Read the Renovate image
        id: image
        run: echo "ref=$(cat deploy/renovate/image)" >> "$GITHUB_OUTPUT"
      - name: Mint a token for Renovate
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Branches and their commits, the pull requests, the Dependency
          # Dashboard issue, the stability status, the workflows it pins, and
          # the alerts a security fix answers.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
          permission-workflows: write
          permission-vulnerability-alerts: read
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app.outputs.token }}
          renovate-image: ${{ steps.image.outputs.ref }}
          # The global configuration the host's runs take too: the commands
          # and executions a run may make, and its commits through the API,
          # signed by GitHub as the App.
          configurationFile: deploy/renovate/config.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The configuration is committed, so there is nothing to onboard.
          RENOVATE_REQUIRE_CONFIG: required
