name: Renovate

# Proposes updates to every pin the repository keeps, as .github/renovate.json
# says. It runs here, under HQ's GitHub App narrowed to this repository, so no
# outside service holds a write to it, and its pull requests run CI as any
# other does. Every six hours so a security fix opens within the day; the
# configuration's schedule keeps everything else to Monday.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Update dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Mint a token for Renovate
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Branches and their commits, the pull requests, the Dependency
          # Dashboard issue, the stability status, the workflows it pins, and
          # the alerts a security fix answers.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
          permission-workflows: write
          permission-vulnerability-alerts: read
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.132.5@sha256:2c801b47ce82c349453e554188abe4fa0b51bde333cfea54e67ad8a88d525087
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The configuration is committed, so there is nothing to onboard.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits through the API, signed by GitHub as the App.
          RENOVATE_PLATFORM_COMMIT: enabled
          # mise.lock is regenerated by mise itself.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          # The one post-upgrade command the configuration runs.
          RENOVATE_ALLOWED_COMMANDS: '["^node tools/dev/vendor-scalar\\.mjs$"]'
