name: Compose

# Builds HQ, the one image production runs: this host plus every admitted
# extension, verified as one application. Extensions verify and admit
# themselves and build no image of their own, so deploying one never replaces
# the others.
#
# On a pull request it is a job of CI (ci.yml), handed the image CI just
# published: it composes and verifies, and Ready reads its result. On main it
# is started by events only: CI passing on a commit, an extension's admission,
# or by hand. There it publishes and signs, and Deploy (deploy.yml) takes it
# from there.
#
# The file keeps its name: the composition is signed by it, and the deploy
# script on the host pins this path.

on:
  # A pull request composes and verifies (DEBUG off, the extensions loaded, as
  # production assembles it) before merge. It does not publish and cannot
  # deploy: only a dispatch on main is a release.
  workflow_call:
    inputs:
      host-image:
        description: The host image CI built in this run, by digest.
        type: string
        required: true
    secrets:
      HQ_APP_CLIENT_ID:
        required: true
      HQ_APP_KEY:
        required: true
      COMPOSITION_EXTENSIONS:
        required: true
  # Everything else is a dispatch naming what to compose: CI once a push to
  # main has passed every gate, an extension's admission, or a person. Each is
  # started by what came before it, so no run of anything else can start one.
  workflow_dispatch:
    inputs:
      commit:
        description: The commit on main whose host image to compose. Blank composes main as it is now.
        required: false
        default: ""
      reason:
        description: Why this composition is being built
        required: false
        default: manual rebuild
      force:
        description: Rebuild even when nothing changed. An admission passes false.
        type: boolean
        required: false
        default: true
      admission-run:
        description: >-
          The admission run that started this composition. It is still
          finishing when it dispatches, so its repository is composed from it
          rather than from an older finished run. Blank for any other trigger.
        required: false
        default: ""

# Read-only by default; each job declares what it needs beyond this.
permissions:
  contents: read

concurrency:
  # Never two compositions at once *for the same target*: they would race for
  # the same image tag and the deploy that finished second would silently win.
  # Keyed by the branch being composed, so a pull request's composition neither
  # queues behind main's nor delays it: they build different tags and only
  # one of them can deploy.
  # A pull request's newer push supersedes its older composition, which only
  # verifies; main's never cancels, since it publishes and deploys.
  group: composition-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Whether this composition is entitled to publish and deploy: a dispatch on
  # main, and nothing else. A pull request composes and verifies and stops
  # there. Decided once, because the publish step and the dispatch of Deploy
  # must agree about it.
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
  PYTHONUNBUFFERED: "1"
  # What a failure withholds from the public log: sealed for the operator by
  # the last steps. Outside the workspace, so no build context can include it.
  WITHHELD_DIR: /tmp/severino-hq-withheld

jobs:
  compose:
    name: Build HQ
    # A fork's pull request is not composed: reading the extensions' admission
    # artifacts needs a secret a fork cannot have. CI does not call this for
    # one, and this holds should anything else.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Read-only, so "Resolve the host image" can ask whether the host build
      # it is waiting for has already failed, and a failure can name its step.
      actions: read
      # Keyless signing of the published composition. Granted to this job
      # alone: the deploy job verifies signatures and never makes one, and a
      # self-hosted runner has no business holding an identity that can.
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the toolchain pins
        id: pins
        run: |
          set -euo pipefail
          . ./tools/pipeline/toolchain.env
          {
            echo "cordon-commit=$CORDON_COMMIT"
            echo "trivy=$TRIVY_VERSION"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Read the composition set
        # A secret, and never interpolated into the script body. Actions
        # expands `${{ … }}` into the text of the step it echoes, and masks only
        # secret values, so anything private reaches the log through the
        # environment or not at all.
        env:
          COMPOSITION_EXTENSIONS: ${{ secrets.COMPOSITION_EXTENSIONS }}
        run: python3 -m tools.pipeline.composition_set write composition-set.json

      - name: Mask the extension names for the rest of the job
        # Every spelling of every extension, so no later step's output names
        # one in this public log, including output from commands not yet written.
        run: python3 -m tools.pipeline.composition_set mask composition-set.json

      - name: Authenticate to GHCR
        # Once, for every registry read and the push at the end.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the host image
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch payloads are untrusted input: passed as data, never
          # interpolated into the script.
          HOST_REF: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          GIVEN: ${{ inputs.host-image }}
          REPOSITORY: ${{ github.repository }}
        # Derived from the commit being composed, so there is no pin to bump by
        # hand and no way for the composition to be built on a stale host.
        run: tools/pipeline/host-image.sh "$REPOSITORY" "$HOST_REF" "$GIVEN"

      # Installed once for the whole job: the host image is verified with it
      # below, every extension admission is verified with it before install,
      # and the published composition is signed with it at the end.
      - name: Install Cosign
        uses: ./.github/actions/cosign

      - name: Verify the host image was built by this repository
        # Every extension wheel is verified against a declared signer before it
        # is installed, and so is the image it is installed into. An image CI
        # handed over by digest was built by this same run.
        if: inputs.host-image == ''
        env:
          HOST_IMAGE: ${{ steps.host.outputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: tools/pipeline/host-signature.sh "$REPOSITORY" "$HOST_IMAGE"

      # HQ's app, asked for read access only: a token minted per run
      # for the extensions' admissions and branches, that lapses within the
      # hour, where a personal token would have to be renewed by hand before it
      # lapsed. Scoped by the installation rather than by listing repositories,
      # so no private repository's name is written into this public log.
      - name: Mint a token that can only read the extensions
        id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-contents: read

      - name: Find the latest admission for each extension
        env:
          # Only the extensions' signed admission bundles and wheels are read.
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          ADMISSION_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.admission-run || '' }}
        # One list call per extension repository and nothing downloaded: the
        # newest successful admission run, shared by every extension that
        # repository holds. This is the whole input to "has anything
        # changed?", and it is deliberately the cheapest question that can
        # answer it (tools/pipeline/admissions.sh). It can be conservative in one
        # direction only (a re-run that produced an identical wheel looks like
        # a change and rebuilds) which is the safe direction to be wrong in.
        #
        # Written to a file rather than a step output. An output is read back by
        # interpolation, which puts its contents into the text of the step that
        # reads it, and these lines name the private repositories.
        run: tools/pipeline/admissions.sh find composition-set.json admissions.txt

      - name: Find coordinated extension branches
        # A pull request whose branch name an extension also carries is a
        # coordinated change: the two must be verified together, so that
        # extension is built from its branch instead of reusing its admission.
        # Verify only. The resulting image is local to this job, carries no
        # lock, and no step that publishes can reach it.
        id: coordinated
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          BRANCH: ${{ github.head_ref }}
        run: tools/pipeline/coordinated-branches.sh composition-set.json "$BRANCH" coordinated.txt

      - name: Check out each extension as this pull request meets it
        # Its coordinated branch when one was found above, else its default
        # branch: what each will be checked and admitted with once this
        # merges. Without .git, so no copy carries the reader token.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: tools/pipeline/extension-branches.sh checkout composition-set.json coordinated.txt

      - name: Build the extension installer
        # The host's Python ABI and uv, holding none of this job's
        # credentials: where extension code is checked and built below.
        if: github.event_name == 'pull_request'
        run: |
          docker build -f composition/Dockerfile --target installer-base \
            -t "severino-hq-installer:$GITHUB_SHA" .

      - name: Check each extension against this host
        # The checks an extension passes before admission (plugin-checks.yml),
        # run with this pull request's host. The composition below reuses
        # wheels admitted against main, so only this step sees a host change
        # that breaks an extension before it merges.
        if: github.event_name == 'pull_request'
        run: tools/pipeline/check-extensions.sh composition-set.json "severino-hq-installer:$GITHUB_SHA"

      - name: Decide whether anything changed
        id: fingerprint
        env:
          FORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.force }}
          HOST_IMAGE: ${{ steps.host.outputs.image }}
        # Only an admission's dispatch asks not to rebuild what is already
        # published: a second admission of the same commit is not news. The
        # host build, a pull request and a hand-run rebuild always build.
        run: tools/pipeline/composition-fingerprint.sh "$HOST_IMAGE" admissions.txt policy/plugin-admission-v1.json

      - name: Nothing to do
        # Only an admission's dispatch stops here. Every other trigger rebuilds
        # even when the inputs match, because a hand-run rebuild asking for
        # exactly that is the one case where "nothing changed" is not an answer.
        if: steps.fingerprint.outputs.build == 'false'
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          {
            echo "### Composition already current"
            echo
            echo "Host image, extension wheels and admission policy are unchanged"
            echo "since \`fp-$FINGERPRINT\` was published."
            echo "Nothing was built and nothing was deployed."
          } >> "$GITHUB_STEP_SUMMARY"

      # On main, HQ's production row opens here: the one row on the commit that
      # says where it is, moved on by Deploy and closed by its Report.
      # The same token starts Deploy once HQ is published, below.
      - name: Mint a token for HQ's production row
        id: production
        if: env.IS_RELEASE == 'true' && steps.fingerprint.outputs.build == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-actions: write

      - name: Say on the commit that HQ is being built
        if: steps.production.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
          HEAD_SHA: ${{ steps.host.outputs.sha }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 -m tools.pipeline.ci_report check "Severino HQ · Production" "$HEAD_SHA" in_progress "Building HQ"
          "The host and every admitted extension are being built and tested as one application."

      - name: Download admitted artifacts
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        # The run ids were resolved above to answer "anything changed?", so
        # they are reused rather than looked up a second time. Each extension's
        # own artifact, by its id: several may come from one run.
        if: >-
          steps.fingerprint.outputs.build == 'true'
        run: tools/pipeline/admissions.sh fetch admissions.txt artifacts

      - name: Check out exact Cordon verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          steps.fingerprint.outputs.build == 'true'
        with:
          repository: joeseverino/cordon
          ref: ${{ steps.pins.outputs.cordon-commit }}
          path: cordon

      - name: Install pinned Cordon dependencies
        if: >-
          steps.fingerprint.outputs.build == 'true'
        run: npm ci --prefix cordon --ignore-scripts

      - name: Verify every admission against the declared signer
        if: >-
          steps.fingerprint.outputs.build == 'true'
        # The host verifies each signature itself rather than trusting an entry
        # an extension produced. The identity checked is the one declared in
        # composition-set.json, so an extension cannot widen who is
        # allowed to sign for it by editing its own repository.
        #
        # With coordinated branches, an extension on one is built from it
        # instead, and every other admission was signed under the base
        # branch's policy, so that is the policy it is verified against.
        env:
          CANDIDATE: ${{ steps.coordinated.outputs.found == 'true' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -m tools.pipeline.verify_admissions

      - name: Merge locks and stage the build context
        if: >-
          steps.coordinated.outputs.found != 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        # Every value that names an extension passes between steps as a file:
        # a step's env block is printed in its public log.
        env:
          CORDON_LOCK: ./cordon/admission/lock.mjs
        # The arguments are words by construction (the collect step admits only
        # plain file names), so they are split here on purpose and never globbed.
        run: |
          set -f
          mkdir -p "$WITHHELD_DIR"
          # shellcheck disable=SC2046
          if ! python3 -m tools.pipeline.compose_plugins $(cat build/compose-args) --out build/composition \
            2> "$WITHHELD_DIR/compose-plugins.log"; then
            echo "::error title=Composition refused::The admitted set does not compose. The reason is in this run's sealed failure logs."
            exit 1
          fi
          # Shipped inside the image, under its signature: what a deploy may
          # drop from the release it replaces.
          jq -c '(.retired // []) | unique' composition-set.json > build/composition/plugin-retired.json

      - name: Build composed image
        # Skipped by an admission's dispatch that found nothing to do, and by a
        # coordinated change, which builds the candidate below instead.
        if: >-
          steps.coordinated.outputs.found != 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        env:
          HQ_IMAGE: ${{ steps.host.outputs.image }}
          HOST_SHA: ${{ steps.host.outputs.sha }}
        run: |
          staged=build/composition
          docker build -f composition/Dockerfile \
            --build-arg HQ_IMAGE="$HQ_IMAGE" \
            --build-arg PLUGIN_POLICY_SHA256="$(cat "$staged/policy-sha256")" \
            --build-arg SEVERINO_HQ_PLUGIN_REFERENCES="$(cat "$staged/references")" \
            --build-arg HQ_REVISION="$HOST_SHA" \
            -t "ghcr.io/${{ github.repository }}/composition:$HOST_SHA" .

      - name: Build coordinated extension branches
        # Branch code is unreviewed, and this job holds a registry credential
        # and an OIDC identity. So it builds in a throwaway Python installer
        # with no token, credential file or docker socket, from a copy with no
        # .git. This is the same Python ABI as the verified host image.
        if: github.event_name == 'pull_request' && steps.coordinated.outputs.found == 'true'
        run: tools/pipeline/extension-branches.sh build composition-set.json coordinated.txt "severino-hq-installer:$GITHUB_SHA"

      - name: Stage the candidate
        if: github.event_name == 'pull_request' && steps.coordinated.outputs.found == 'true'
        run: |
          set -euo pipefail
          args=()
          for wheel in candidate-wheels/*.whl; do args+=(--wheel "$wheel"); done
          python3 -m tools.pipeline.compose_plugins --candidate "${args[@]}" --out build/candidate

      - name: Build the candidate image
        # Admission off: these wheels are unsigned branch builds. The tag has no
        # registry, so no push in this workflow can publish it.
        if: github.event_name == 'pull_request' && steps.coordinated.outputs.found == 'true'
        env:
          HQ_IMAGE: ${{ steps.host.outputs.image }}
          INSTALLER_IMAGE: severino-hq-installer:${{ github.sha }}
        run: |
          set -euo pipefail
          staged=build/candidate
          docker build -f - -t "severino-hq-candidate:$GITHUB_SHA" \
            --build-arg HQ_IMAGE="$HQ_IMAGE" \
            --build-arg INSTALLER_IMAGE="$INSTALLER_IMAGE" \
            --build-arg SEVERINO_HQ_PLUGIN_REFERENCES="$(cat "$staged/references")" . <<'DOCKERFILE'
          ARG HQ_IMAGE
          ARG INSTALLER_IMAGE
          FROM ${INSTALLER_IMAGE} AS installer
          COPY build/candidate/*.whl build/candidate/digests /tmp/plugin/
          RUN set -eu; \
              awk 'NF { \
                  if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/) exit 1; \
                  print "/tmp/plugin/" $2 " --hash=sha256:" $1 }' /tmp/plugin/digests > /tmp/plugin/requirements.txt; \
              expected=$(grep -c . /tmp/plugin/requirements.txt); \
              found=$(find /tmp/plugin -maxdepth 1 -type f -name '*.whl' | wc -l); \
              test "$expected" -eq "$found"; \
              uv pip install --quiet --python /usr/local/bin/python --prefix /install \
                --no-cache --no-deps --require-hashes -r /tmp/plugin/requirements.txt
          FROM ${HQ_IMAGE} AS runtime
          ARG SEVERINO_HQ_PLUGIN_REFERENCES
          USER root
          COPY --from=installer /install /usr/local
          RUN ! command -v pip && ! python -c 'import pip'
          ENV SEVERINO_HQ_PLUGINS=${SEVERINO_HQ_PLUGIN_REFERENCES} \
              SEVERINO_HQ_REQUIRE_PLUGIN_ADMISSION=0
          RUN DJANGO_SECRET_KEY="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')" \
              python manage.py collectstatic --noinput --clear --verbosity 0
          USER severino
          DOCKERFILE

      - name: Name the composed image the checks below run
        # The candidate a coordinated change built here, else the composition
        # of the host commit: named once, for every check after it.
        id: candidate
        if: >-
          steps.fingerprint.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.coordinated.outputs.found == 'true' && format('severino-hq-candidate:{0}', github.sha) || format('ghcr.io/{0}/composition:{1}', github.repository, steps.host.outputs.sha) }}
        run: echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Verify the composition as one application
        # Skipped only by an admission's dispatch that found nothing to do.
        if: >-
          steps.fingerprint.outputs.build == 'true'
        # Per-plugin admission proves each wheel against the host in isolation.
        # This second layer is deliberately after assembly: only the real image
        # can expose duplicate routes/capabilities, migration conflicts, missing
        # host-owned dependencies, or a test that wrongly assumes its plugin is
        # the only contributor to a global surface.
        #
        # The log gets totals and failing host test ids only: an extension's
        # tests name its models, routes and fixtures (tools/pipeline/composed-suite.sh).
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: tools/pipeline/composed-suite.sh "$IMAGE"

      - name: The composed image comes up healthy
        # As production boots it, before anything is published: the suite above
        # runs the code, this runs the container.
        if: >-
          steps.fingerprint.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: tools/pipeline/image-health.sh "$IMAGE"

      # The scan caches its database by the day under this key, and saves it
      # wherever it caches. Only main's composition caches; a pull request's
      # restores main's newest and saves nothing.
      - name: Restore the vulnerability database
        if: >-
          steps.fingerprint.outputs.build == 'true' && github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.pins.outputs.date }}
          restore-keys: cache-trivy-

      - name: Scan composed image
        # Skipped only by an admission's dispatch that found nothing to do.
        # JSON to a file rather than the table: the table lists every package,
        # extensions included, and wraps a long name past its mask.
        id: scan
        if: >-
          steps.fingerprint.outputs.build == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ steps.pins.outputs.trivy }}
          cache: ${{ github.ref == 'refs/heads/main' }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          image-ref: ${{ steps.candidate.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-composed.json
          exit-code: "1"

      - name: Name what the scan found
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          jq -r '.Results[]?.Vulnerabilities[]?
            | "::error title=\(.Severity) \(.VulnerabilityID)::\(.Severity) \(.VulnerabilityID) in \(.PkgName) \(.InstalledVersion), fixed in \(.FixedVersion)"' \
            trivy-composed.json | sort -u

      # A pull request has already had the only thing it was here for: the
      # image was built and its suite was run inside it. Publishing is what
      # makes an image deployable, so a pull request does not.
      - name: Publish by digest
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        id: publish
        env:
          HOST_SHA: ${{ steps.host.outputs.sha }}
          FINGERPRINT_TAG: ${{ steps.fingerprint.outputs.tag }}
        run: |
          image="ghcr.io/${{ github.repository }}/composition:$HOST_SHA"
          docker push "$image"
          # The fingerprint tag is what the next admission's dispatch reads to decide
          # there is nothing to do. Pushed after the image itself, so a failed
          # push never leaves a claim that this composition was published.
          docker tag "$image" "$FINGERPRINT_TAG"
          docker push "$FINGERPRINT_TAG"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"

      # The artifact production actually runs. Every input to it is now signed
      # and verified (the host image by the step near the top of this job,
      # each extension wheel by its admission bundle) and this is the output
      # those checks were for. Deploy verifies this signature before it
      # recreates the container, so an image pushed to this name by anything
      # other than this workflow cannot become production.
      - name: Sign the published composition
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
        run: cosign sign --yes "$IMAGE"

      # Deploy is started by the composition it deploys, and by nothing else
      # but a person: it is handed the commit, and a link back to this run.
      - name: Start Deploy for this commit
        if: env.IS_RELEASE == 'true' && steps.publish.outputs.image != ''
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
          COMMIT: ${{ steps.host.outputs.sha }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit="$COMMIT" -f compose_run="$THIS_RUN"

      - name: Read the pinned mise
        id: mise
        if: failure()
        run: |
          version="$(.github/actions/toolchain/mise-version.sh mise.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the pinned age
        if: failure()
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          MISE_LOCKED: "1"
        with:
          version: ${{ steps.mise.outputs.version }}
          install_args: age
          # One small tool, on a failure: no cache entry of its own.
          cache: false
      - name: Seal the withheld output
        id: seal
        if: failure()
        run: |
          set -euo pipefail
          tools/pipeline/seal-failure-logs.sh "$WITHHELD_DIR" failure-logs.tar.age
          if [ -f failure-logs.tar.age ]; then echo "sealed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the sealed output
        if: failure() && steps.seal.outputs.sealed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs
          path: failure-logs.tar.age
          retention-days: 14

      - name: Name the step that failed
        id: failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SEALED: ${{ steps.seal.outputs.sealed }}
        run: |
          set -euo pipefail
          step="$(python3 -m tools.pipeline.ci_report failed-step "Build HQ" 2>/dev/null | head -1 || true)"
          echo "step=${step:-a step}" >> "$GITHUB_OUTPUT"
          {
            echo "### Not built: ${step:-a step} failed"
            echo
            echo "Nothing was published; production still runs the previous image."
            if [ "$SEALED" = true ]; then
              echo
              echo "Withheld output, for the operator: \`mise run failure-logs ${GITHUB_RUN_ID}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say on the commit that HQ could not be built
        if: failure() && steps.production.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
          HEAD_SHA: ${{ steps.host.outputs.sha }}
          FAILED_STEP: ${{ steps.failed.outputs.step }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 -m tools.pipeline.ci_report check "Severino HQ · Production" "$HEAD_SHA" completed "Not deployed: ${FAILED_STEP} failed"
          "Nothing was published, so production still runs the previous image."
          failure
