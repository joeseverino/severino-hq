name: Compose and deploy extensions

# Builds the one image production runs: this host plus every admitted
# extension. Extensions verify and admit themselves, then trigger this; they no
# longer build or deploy an image of their own. That is the point -- when each
# extension shipped its own image, deploying one replaced the others.
#
# Triggered by an extension after a successful admission, or by hand to
# rebuild the current set (for example after a host release).

on:
  # After the host image exists, never in parallel with it being built. On a
  # plain push this raced the build and resolved a tag that was not published
  # yet.
  #
  # No branch filter, deliberately. This used to be `branches: [main]`, so the
  # composition -- the only place this application is assembled the way
  # production assembles it, DEBUG off and the extensions loaded -- was first
  # built from a commit that had already been merged. Three failures reached
  # main that way, each costing a merge and a rebuild to learn something a pull
  # request could have said. A pull request now composes and verifies; it does
  # not publish and it does not deploy.
  workflow_run:
    workflows: [ci]
    types: [completed]
  # `workflow_run` does not fire for a run that was itself triggered by
  # `pull_request` -- GitHub declines to let pull-request code start a
  # default-branch workflow, which is the right call and also means the
  # composition cannot be reached that way. Removing the branch filter above
  # was therefore necessary and not sufficient; this is the trigger that fires.
  #
  # It starts as soon as the pull request does, so it can outrun the host image
  # it needs. "Resolve the host image" waits for that image rather than
  # assuming it, which is a wait measured against the same commit both
  # workflows agree on.
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [extension-admitted]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this composition is being rebuilt
        required: false
        default: manual rebuild

permissions:
  contents: read
  packages: write

concurrency:
  # Never two compositions at once *for the same target*: they would race for
  # the same image tag and the deploy that finished second would silently win.
  # Keyed by the branch being composed, so a pull request's composition neither
  # queues behind main's nor delays it -- they build different tags and only
  # one of them can deploy.
  group: composition-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  # Whether this composition is entitled to publish and deploy. A pull request
  # composes and verifies and stops there; only main, an extension's admission
  # dispatch, or a hand-run rebuild goes further. Decided once here rather than
  # re-derived at each step, because the two places that must agree about it
  # are the publish step and the deploy job.
  IS_RELEASE: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' }}
  CORDON_COMMIT: a5f2f2d2c11e33abe1be6ab04e5961f3c2f4a739
  PYTHONUNBUFFERED: "1"

jobs:
  compose:
    name: Compose admitted extensions
    # A failed host build must not be composed onto. And a fork's pull request
    # is not composed at all: reading the extensions' admission artifacts needs
    # a secret a fork cannot have, so it would fail on the download step with a
    # permissions error that looks like a broken pipeline rather than a fork
    # doing exactly what forks are supposed to do.
    if: >-
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read the composition set
        # The set is supplied by the COMPOSITION_EXTENSIONS repository variable,
        # not committed. This host repository is public and the extensions are
        # not, so their names must not appear in it. composition-set.json
        # documents the shape only.
        run: |
          set -euo pipefail
          printf '%s' '${{ vars.COMPOSITION_EXTENSIONS }}' > composition-set.json
          if ! jq -e '.extensions | length > 0' composition-set.json >/dev/null 2>&1; then
            echo "::error::COMPOSITION_EXTENSIONS must list at least one extension"; exit 1
          fi
          jq -r '.extensions | length as $n | "composing \($n) extension(s)"' composition-set.json

      - name: Download admitted artifacts
        env:
          # Fine-grained token with read access to the private extension repos'
          # Actions artifacts. The extensions stay private; only their signed
          # admission bundles and wheels are read.
          GH_TOKEN: ${{ secrets.EXTENSION_ARTIFACTS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for repo in $(jq -r '.extensions[].repository' composition-set.json); do
            run=$(gh run list --repo "$repo" --workflow admit-plugin.yml \
                    --branch main --status success --limit 1 \
                    --json databaseId -q '.[0].databaseId')
            if [ -z "$run" ]; then
              echo "::error::$repo has no successful admission on main"; exit 1
            fi
            gh run download "$run" --repo "$repo" -D "artifacts/$(basename "$repo")"
          done

      - name: Check out exact Cordon verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: joeseverino/cordon
          ref: ${{ env.CORDON_COMMIT }}
          path: cordon

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Install pinned Cordon dependencies
        run: npm ci --prefix cordon --ignore-scripts

      - name: Verify every admission against the declared signer
        id: collect
        # The host verifies each signature itself rather than trusting an entry
        # an extension produced. The identity checked is the one declared in
        # composition-set.json, so an extension cannot widen who is
        # allowed to sign for it by editing its own repository.
        run: |
          set -euo pipefail
          policy_sha=$(openssl dgst -sha256 policy/plugin-admission-v1.json | awk '{print $NF}')
          args=""
          count=$(jq '.extensions | length' composition-set.json)
          for index in $(seq 0 $((count - 1))); do
            repo=$(jq -r ".extensions[$index].repository" composition-set.json)
            workflow=$(jq -r ".extensions[$index].workflow" composition-set.json)
            plugin_id=$(jq -r ".extensions[$index].id" composition-set.json)
            dir="artifacts/$(basename "$repo")"
            statement=$(find "$dir" -name admission.json -print -quit)
            bundle=$(find "$dir" -name admission.sigstore.json -print -quit)
            wheel=$(find "$dir" -name '*.whl' -print -quit)
            if [ -z "$statement" ] || [ -z "$bundle" ] || [ -z "$wheel" ]; then
              echo "::error::$repo is missing its admission statement, bundle or wheel"; exit 1
            fi
            entry="$dir/verified-entry.json"
            node cordon/admission/verify.mjs \
              --statement "$statement" \
              --bundle "$bundle" \
              --artifact "$wheel" \
              --identity "https://github.com/$repo/$workflow@refs/heads/main" \
              --issuer https://token.actions.githubusercontent.com \
              --repository "$repo" \
              --workflow "$workflow" \
              --host severino-hq \
              --plugin-id "$plugin_id" \
              --policy-sha "$policy_sha" > "$entry"
            args="$args --entry $entry --wheel $wheel"
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Merge locks and stage the build context
        id: compose
        env:
          CORDON_LOCK: ./cordon/admission/lock.mjs
        run: python scripts/compose-plugins.py ${{ steps.collect.outputs.args }} --out build/composition

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the host image
        id: host
        # Derived from the commit being composed, so there is no pin to bump by
        # hand and no way for the composition to be built on a stale host.
        run: |
          set -euo pipefail
          ref="${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.client_payload.host_sha || github.sha }}"
          image="ghcr.io/${{ github.repository }}:sha-${ref:0:12}"
          # On a pull request this workflow and the host build start together,
          # so the image may not exist yet. Waited for rather than assumed:
          # failing instantly here would report "no such image" for a build that
          # is simply still running, which is the least useful true statement
          # available. 20 minutes is well past a host build and well short of
          # the job timeout.
          digest=""
          for attempt in $(seq 1 60); do
            if digest=$(docker buildx imagetools inspect "$image" \
                          --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'); then
              [ -n "$digest" ] && break
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "waiting for the host image $image to be published..."
            fi
            sleep 20
          done
          if [ -z "$digest" ]; then
            echo "::error title=Host image never appeared::$image was not published \
          within 20 minutes. The host build for this commit failed or was skipped; \
          the composition has nothing to compose onto."
            exit 1
          fi
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"
          echo "host image: ${image%:*}@$digest"

      - name: Build composed image
        env:
          HQ_IMAGE: ${{ steps.host.outputs.image }}
        run: |
          docker build -f composition/Dockerfile \
            --build-arg HQ_IMAGE="$HQ_IMAGE" \
            --build-arg PLUGIN_WHEEL_DIGESTS="${{ steps.compose.outputs.digests }}" \
            --build-arg PLUGIN_POLICY_SHA256="${{ steps.compose.outputs.policy_sha256 }}" \
            --build-arg SEVERINO_HQ_PLUGIN_REFERENCES="${{ steps.compose.outputs.references }}" \
            -t ghcr.io/${{ github.repository }}/composition:${{ github.sha }} .

      - name: Verify the composition as one application
        # Per-plugin admission proves each wheel against the host in isolation.
        # This second layer is deliberately after assembly: only the real image
        # can expose duplicate routes/capabilities, migration conflicts, missing
        # host-owned dependencies, or a test that wrongly assumes its plugin is
        # the only contributor to a global surface.
        run: |
          image=ghcr.io/${{ github.repository }}/composition:${{ github.sha }}
          docker run --rm --entrypoint python \
            --env DJANGO_SECRET_KEY=ci-only-composition-key-0123456789abcdef0123456789abcdef \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            "$image" manage.py check
          docker run --rm --entrypoint python \
            --env DJANGO_SECRET_KEY=ci-only-composition-key-0123456789abcdef0123456789abcdef \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            "$image" manage.py test --verbosity 1

      - name: Scan composed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/${{ github.repository }}/composition:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Authenticate to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request has already had the only thing it was here for: the
      # image was built and its suite was run inside it. Publishing is what
      # makes an image deployable, so a pull request does not.
      - name: Publish by digest
        if: env.IS_RELEASE == 'true'
        id: publish
        run: |
          image=ghcr.io/${{ github.repository }}/composition:${{ github.sha }}
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy composition
    needs: compose
    # Belt and braces with the publish step above: that one produces nothing
    # for a pull request, and this one refuses to run for it at all. Either
    # alone would do; both, because a self-hosted runner executing code from an
    # unmerged branch is the failure you do not get to fix afterwards.
    # Spelled out rather than reading the IS_RELEASE env above: a job-level
    # `if` cannot see the `env` context. Same condition, and the pair are kept
    # adjacent in review by both carrying this note.
    if: >-
      needs.compose.result == 'success' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main') ||
       github.event_name == 'repository_dispatch' ||
       github.event_name == 'workflow_dispatch')
    # Self-hosted runner ON the homelab. It dials out to GitHub; GitHub never
    # connects in. NEVER trigger a self-hosted job from pull_request.
    runs-on: [self-hosted, severino-hq]
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Sync deploy checkout
        run: git -C /opt/apps/severino-hq pull --ff-only
      - name: Deploy exact image with health rollback
        # Same deploy path and rollback as a host release: it pulls, recreates,
        # waits for health, activates the controller, and restores the previous
        # image if any step fails.
        run: /opt/apps/severino-hq/scripts/deploy-image.sh "${{ needs.compose.outputs.image }}"
      - name: Reclaim disk
        if: always()
        run: |
          docker image prune -af --filter "until=24h" || true
          docker builder prune -af || true
