name: Compose

# Builds HQ, the one image production runs: this host plus every admitted
# extension, verified as one application. Extensions verify and admit
# themselves and build no image of their own, so deploying one never replaces
# the others.
#
# On a pull request it is a job of CI (ci.yml), handed the image CI just
# published: it composes and verifies, and Ready reads its result. On main it
# is started by events only: CI passing on a commit, an extension's admission,
# or by hand. There it publishes and signs, and Deploy (deploy.yml) takes it
# from there.
#
# The composed suite runs once per release, on the pull request. A verified
# composition is pushed under a pr- tag and signed as that pull request's,
# which no deploy accepts. A release whose commit and admitted set equal what
# that pull request composed promotes the same digest instead of building
# and verifying it again (tools/pipeline/proven-on-pr.sh); anything less
# builds and verifies in full.
#
# The file keeps its name: the composition is signed by it, and the deploy
# script on the host pins this path.

on:
  # A pull request composes and verifies (DEBUG off, the extensions loaded, as
  # production assembles it) before merge. It cannot deploy: only a dispatch
  # on main is a release.
  workflow_call:
    inputs:
      host-image:
        description: The host image CI built in this run, by digest.
        type: string
        required: true
      runner-image:
        description: The automation worker's image CI built beside it, by digest.
        type: string
        required: true
    secrets:
      HQ_APP_CLIENT_ID:
        required: true
      HQ_APP_KEY:
        required: true
      COMPOSITION_EXTENSIONS:
        required: true
  # Everything else is a dispatch naming what to compose: CI once a push to
  # main has passed every gate, an extension's admission, or a person. Each is
  # started by what came before it, so no run of anything else can start one.
  workflow_dispatch:
    inputs:
      commit:
        description: The commit on main whose host image to compose. Blank composes main as it is now.
        required: false
        default: ""
      reason:
        description: Why this composition is being built
        required: false
        default: manual rebuild
      force:
        description: Rebuild even when nothing changed. An admission passes false.
        type: boolean
        required: false
        default: true
      admission-run:
        description: >-
          The admission run that started this composition. It is still
          finishing when it dispatches, so its repository is composed from it
          rather than from an older finished run. Blank for any other trigger.
        required: false
        default: ""

# Read-only by default; each job declares what it needs beyond this.
permissions:
  contents: read

concurrency:
  # Never two compositions at once *for the same target*: they would race for
  # the same image tag and the deploy that finished second would silently win.
  # Keyed by the branch being composed, so a pull request's composition neither
  # queues behind main's nor delays it: they build different tags and only
  # one of them can deploy.
  # A pull request's newer push supersedes its older composition, which only
  # verifies; main's never cancels, since it publishes and deploys.
  group: composition-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Whether this composition is entitled to publish and deploy: a dispatch on
  # main, and nothing else. A pull request composes and verifies and stops
  # there. Decided once, because the publish step and the dispatch of Deploy
  # must agree about it.
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
  PYTHONUNBUFFERED: "1"
  # What a failure withholds from the public log: sealed for the operator by
  # the last steps. Outside the workspace, so no build context can include it.
  WITHHELD_DIR: /tmp/severino-hq-withheld

jobs:
  # The checks an extension passes before admission, run with this pull
  # request's host, and the composition of any extension branch the change
  # carries (extensions.yml). A job of its own: it needs no host image of its
  # own making, so it runs beside Build HQ rather than ahead of its suite, and
  # the extension code it runs shares no job with Build HQ's registry
  # credential and signing identity.
  extensions:
    name: Extensions
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/extensions.yml
    # What extensions.yml's job declares, which a caller must grant.
    permissions:
      contents: read
      packages: read
      actions: read
    with:
      host-image: ${{ inputs.host-image }}
      runner-image: ${{ inputs.runner-image }}
    secrets:
      HQ_APP_CLIENT_ID: ${{ secrets.HQ_APP_CLIENT_ID }}
      HQ_APP_KEY: ${{ secrets.HQ_APP_KEY }}
      COMPOSITION_EXTENSIONS: ${{ secrets.COMPOSITION_EXTENSIONS }}

  compose:
    name: Build HQ
    # A fork's pull request is not composed: reading the extensions' admission
    # artifacts needs a secret a fork cannot have. CI does not call this for
    # one, and this holds should anything else.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Read-only, so "Resolve the host image" can ask whether the host build
      # it is waiting for has already failed, and a failure can name its step;
      # and so a release can read the run of the pull request it merged.
      actions: read
      # Which pull request merged the commit a release composes.
      pull-requests: read
      # Keyless signing of the published composition. Granted to this job
      # alone: the deploy job verifies signatures and never makes one, and a
      # self-hosted runner has no business holding an identity that can.
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the toolchain pins
        id: pins
        run: |
          set -euo pipefail
          . ./tools/pipeline/toolchain.env
          {
            echo "cordon-commit=$CORDON_COMMIT"
            echo "mise=$(.github/actions/toolchain/mise-version.sh mise.toml)"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Read the composition set
        # A secret, and never interpolated into the script body. Actions
        # expands `${{ … }}` into the text of the step it echoes, and masks only
        # secret values, so anything private reaches the log through the
        # environment or not at all.
        env:
          COMPOSITION_EXTENSIONS: ${{ secrets.COMPOSITION_EXTENSIONS }}
        run: python3 -m tools.pipeline.composition_set write composition-set.json

      - name: Mask the extension names for the rest of the job
        # Every spelling of every extension, so no later step's output names
        # one in this public log, including output from commands not yet written.
        run: python3 -m tools.pipeline.composition_set mask composition-set.json

      - name: Authenticate to GHCR
        # Once, for every registry read and the push at the end.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Resolve the host image
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch payloads are untrusted input: passed as data, never
          # interpolated into the script.
          HOST_REF: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          GIVEN: ${{ inputs.host-image }}
          GIVEN_RUNNER: ${{ inputs.runner-image }}
          REPOSITORY: ${{ github.repository }}
        # Derived from the commit being composed, so there is no pin to bump by
        # hand and no way for the composition to be built on a stale host. The
        # automation worker's image is the one CI built beside it.
        run: tools/pipeline/host-image.sh "$REPOSITORY" "$HOST_REF" "$GIVEN" "$GIVEN_RUNNER"

      # Installed once for the whole job: the host image is verified with it
      # below, every extension admission is verified with it before install,
      # and the published composition is signed and attested with it at the end.
      # The release mise.lock records, which the host verifies with too.
      - name: Install the pinned cosign
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          version: ${{ steps.pins.outputs.mise }}
          install_args: cosign
          cache: false

      - name: Verify the host and worker images were built by this repository
        # Every extension wheel is verified against a declared signer before it
        # is installed, and so is the image it is installed into, and the
        # worker image the composition pins. Images CI handed over by digest
        # were built by this same run.
        if: inputs.host-image == ''
        env:
          HOST_IMAGE: ${{ steps.host.outputs.image }}
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
          REPOSITORY: ${{ github.repository }}
        run: tools/pipeline/host-signature.sh "$REPOSITORY" "$HOST_IMAGE" "$RUNNER_IMAGE"

      # HQ's app, asked for read access only: a token minted per run
      # for the extensions' admissions and branches, that lapses within the
      # hour, where a personal token would have to be renewed by hand before it
      # lapsed. Scoped by the installation rather than by listing repositories,
      # so no private repository's name is written into this public log.
      - name: Mint a token that can only read the extensions
        id: reader
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app] scoped by the installation (see Build HQ's reader)
          permission-actions: read
          permission-contents: read

      - name: Find the latest admission for each extension
        env:
          # Only the extensions' signed admission bundles and wheels are read.
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          ADMISSION_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.admission-run || '' }}
        # One list call per extension repository and nothing downloaded: the
        # newest successful admission run, shared by every extension that
        # repository holds. This is the whole input to "has anything
        # changed?", and it is deliberately the cheapest question that can
        # answer it (tools/pipeline/admissions.sh). It can be conservative in one
        # direction only (a re-run that produced an identical wheel looks like
        # a change and rebuilds) which is the safe direction to be wrong in.
        #
        # Written to a file rather than a step output. An output is read back by
        # interpolation, which puts its contents into the text of the step that
        # reads it, and these lines name the private repositories.
        run: tools/pipeline/admissions.sh find composition-set.json admissions.txt

      - name: Find coordinated extension branches
        # A pull request whose branch name an extension also carries is a
        # coordinated change: the two are verified together by the
        # Extensions job, which builds that extension from its branch, so
        # nothing below composes the admitted set.
        id: coordinated
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          BRANCH: ${{ github.head_ref }}
        run: tools/pipeline/coordinated-branches.sh composition-set.json "$BRANCH" coordinated.txt

      - name: Decide whether anything changed
        # Not for a coordinated change, so every step that builds below,
        # which waits on its answer, skips.
        id: fingerprint
        if: steps.coordinated.outputs.found != 'true'
        env:
          FORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.force }}
          HOST_IMAGE: ${{ steps.host.outputs.image }}
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
        # Only an admission's dispatch asks not to rebuild what is already
        # published: a second admission of the same commit is not news. The
        # host build, a pull request and a hand-run rebuild always build.
        run: tools/pipeline/composition-fingerprint.sh "$HOST_IMAGE" "$RUNNER_IMAGE" admissions.txt policy/plugin-admission-v1.json

      - name: Nothing to do
        # Only an admission's dispatch stops here. Every other trigger rebuilds
        # even when the inputs match, because a hand-run rebuild asking for
        # exactly that is the one case where "nothing changed" is not an answer.
        if: steps.fingerprint.outputs.build == 'false'
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          {
            echo "### Composition already current"
            echo
            echo "Host image, extension wheels and admission policy are unchanged"
            echo "since \`fp-$FINGERPRINT\` was published."
            echo "Nothing was built and nothing was deployed."
          } >> "$GITHUB_STEP_SUMMARY"

      # As HQ's app, which starts Deploy once HQ is published, below.
      - name: Mint a token to start Deploy
        id: production
        if: env.IS_RELEASE == 'true' && steps.fingerprint.outputs.build == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Download admitted artifacts
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        # The run ids were resolved above to answer "anything changed?", so
        # they are reused rather than looked up a second time. Each extension's
        # own artifact, by its id: several may come from one run.
        if: >-
          steps.fingerprint.outputs.build == 'true'
        run: tools/pipeline/admissions.sh fetch admissions.txt artifacts

      - name: Check out exact Cordon verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          steps.fingerprint.outputs.build == 'true'
        with:
          persist-credentials: false
          repository: joeseverino/cordon
          ref: ${{ steps.pins.outputs.cordon-commit }}
          path: cordon

      - name: Install pinned Cordon dependencies
        if: >-
          steps.fingerprint.outputs.build == 'true'
        run: npm ci --prefix cordon --ignore-scripts

      - name: Verify every admission against the declared signer
        if: >-
          steps.fingerprint.outputs.build == 'true'
        # The host verifies each signature itself rather than trusting an entry
        # an extension produced. The identity checked is the one declared in
        # composition-set.json, so an extension cannot widen who is
        # allowed to sign for it by editing its own repository.
        run: python3 -m tools.pipeline.verify_admissions

      - name: Merge locks and stage the build context
        if: >-
          steps.fingerprint.outputs.build == 'true'
        # Every value that names an extension passes between steps as a file:
        # a step's env block is printed in its public log.
        env:
          CORDON_LOCK: ./cordon/admission/lock.ts
        # The arguments are words by construction (the collect step admits only
        # plain file names), so they are split here on purpose and never globbed.
        run: |
          set -f
          mkdir -p "$WITHHELD_DIR"
          # shellcheck disable=SC2046
          if ! python3 -m tools.pipeline.compose_plugins $(cat build/compose-args) --out build/composition \
            2> "$WITHHELD_DIR/compose-plugins.log"; then
            echo "::error title=Composition refused::The admitted set does not compose. The reason is in this run's sealed failure logs."
            exit 1
          fi
          # Shipped inside the image, under its signature: what a deploy may
          # drop from the release it replaces.
          jq -c '(.retired // []) | unique' composition-set.json > build/composition/plugin-retired.json

      - name: Name what this composition is made of
        # One digest over the host and worker images and every staged input,
        # each wheel's digest among them: the composition's label, and what a
        # release compares with its pull request's.
        id: identity
        if: >-
          steps.fingerprint.outputs.build == 'true'
        env:
          HQ_IMAGE: ${{ steps.host.outputs.image }}
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
        run: |
          set -euo pipefail
          identity="$(tools/pipeline/composition-identity.sh "$HQ_IMAGE" "$RUNNER_IMAGE" build/composition)"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "composition $identity"

      - name: Find the composition its pull request verified
        # The digest the merged pull request's Composition job verified and
        # recorded in its passing run, signed by that job, of this commit's
        # tree and this identity. Anything less, or an error here, builds and
        # verifies in full below: unproven is the safe answer.
        id: proven
        if: env.IS_RELEASE == 'true' && steps.identity.outputs.identity != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.host.outputs.sha }}
          COMPOSITION: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          tools/pipeline/proven-on-pr.sh "$COMMIT" > "$RUNNER_TEMP/proven.txt"
          image="$(sed -n 's/^composition=//p' "$RUNNER_TEMP/proven.txt")"
          pr="$(sed -n 's/^pr=//p' "$RUNNER_TEMP/proven.txt")"
          if [ -n "$image" ]; then
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "Promoted the composition #$pr verified, \`$image\`: the same commit tree and admitted set." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build composed image
        # Skipped by an admission's dispatch that found nothing to do, by a
        # coordinated change, and by a release that promotes its pull
        # request's composition.
        if: >-
          steps.fingerprint.outputs.build == 'true' && steps.proven.outputs.image == ''
        env:
          HQ_IMAGE: ${{ steps.host.outputs.image }}
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
          HOST_SHA: ${{ steps.host.outputs.sha }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          staged=build/composition
          docker build -f composition/Dockerfile \
            --build-arg HQ_IMAGE="$HQ_IMAGE" \
            --build-arg RUNNER_IMAGE="$RUNNER_IMAGE" \
            --build-arg PLUGIN_POLICY_SHA256="$(cat "$staged/policy-sha256")" \
            --build-arg SEVERINO_HQ_PLUGIN_REFERENCES="$(cat "$staged/references")" \
            --build-arg HQ_REVISION="$HOST_SHA" \
            --build-arg HQ_COMPOSITION="$IDENTITY" \
            -t "ghcr.io/${{ github.repository }}/composition:$HOST_SHA" .

      - name: Verify the composition as one application
        # Skipped by an admission's dispatch that found nothing to do, and by
        # a release that promotes what its pull request verified here.
        if: >-
          steps.fingerprint.outputs.build == 'true' && steps.proven.outputs.image == ''
        # Per-plugin admission proves each wheel against the host in isolation.
        # This second layer is deliberately after assembly: only the real image
        # can expose duplicate routes/capabilities, migration conflicts, missing
        # host-owned dependencies, or a test that wrongly assumes its plugin is
        # the only contributor to a global surface.
        #
        # The log gets totals and failing host test ids only: an extension's
        # tests name its models, routes and fixtures (tools/pipeline/composed-suite.sh).
        env:
          IMAGE: ghcr.io/${{ github.repository }}/composition:${{ steps.host.outputs.sha }}
        run: tools/pipeline/composed-suite.sh "$IMAGE"

      - name: The composed image comes up healthy
        # As production boots it, before anything is published: the suite above
        # runs the code, this runs the container.
        if: >-
          steps.fingerprint.outputs.build == 'true' && steps.proven.outputs.image == ''
        env:
          IMAGE: ghcr.io/${{ github.repository }}/composition:${{ steps.host.outputs.sha }}
        run: tools/pipeline/image-health.sh "$IMAGE"

      # The scan's vulnerability database, kept by the day under this key.
      # Only main's composition saves it; a pull request's restores main's
      # newest and saves nothing.
      - name: Restore the vulnerability database
        id: trivy-db
        if: >-
          steps.fingerprint.outputs.build == 'true' && steps.proven.outputs.image == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.pins.outputs.date }}
          restore-keys: cache-trivy-

      - name: Install the pinned Trivy
        if: >-
          steps.fingerprint.outputs.build == 'true'
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          version: ${{ steps.pins.outputs.mise }}
          install_args: trivy
          cache: false
      - name: Scan composed image
        # Skipped where the suite is, above. One analysis is the gate and the
        # SBOM attested below; a finding is named by its ID, never by the
        # package table (mise-tasks/image/trivy).
        id: scan
        if: >-
          steps.fingerprint.outputs.build == 'true' && steps.proven.outputs.image == ''
        env:
          IMAGE: ghcr.io/${{ github.repository }}/composition:${{ steps.host.outputs.sha }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          # Trivy is the one tool this task runs, installed above.
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run image:trivy "$IMAGE" --sbom sbom.cdx.json

      - name: Scan the worker image
        # The image the composition pins as its automation worker, by the same
        # gate, its SBOM and reports in a directory of their own.
        if: >-
          steps.fingerprint.outputs.build == 'true' && steps.proven.outputs.image == ''
        env:
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run image:trivy "$RUNNER_IMAGE" --sbom runner/sbom.cdx.json

      - name: Save the vulnerability database
        if: >-
          steps.trivy-db.outcome == 'success' && github.ref_name == github.event.repository.default_branch &&
          steps.trivy-db.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: ${{ steps.trivy-db.outputs.cache-primary-key }}

      # A pull request's composition, once its suite, boot and scan passed:
      # pushed under a pr- tag, which no commit's release is named by, and
      # signed and attested as this pull request's, which no deploy accepts
      # (Source.Signer, controller/host/deploy.go). The digest pushed is
      # recorded in this run, where its release finds it.
      - name: Publish the verified composition for its merge
        id: verified
        if: >-
          github.event_name == 'pull_request' && steps.scan.outcome == 'success'
        env:
          HOST_SHA: ${{ steps.host.outputs.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY/composition:$HOST_SHA"
          verified="${image%:*}:pr-$HOST_SHA"
          docker tag "$image" "$verified"
          # The digest the push reports, since GHCR may not yet answer a read
          # of a tag it has just accepted.
          digest=$(docker push "$verified" | tee /dev/stderr \
            | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)
          echo "image=${verified%:*}@${digest:?the push reported no digest}" >> "$GITHUB_OUTPUT"
      - name: Sign and attest the verified composition as this pull request's
        if: steps.verified.outputs.image != ''
        env:
          IMAGE: ${{ steps.verified.outputs.image }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"
          mkdir -p "$RUNNER_TEMP/verified"
          printf '%s\n' "$IMAGE" > "$RUNNER_TEMP/verified/verified-composition"
      - name: Record the verified composition in this run
        if: steps.verified.outputs.image != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composition
          path: ${{ runner.temp }}/verified/verified-composition

      # The SBOMs a promotion attests, of the digests its pull request
      # scanned, read as Build reads a promoted host image's. Trivy needs no
      # vulnerability database for an SBOM.
      - name: Read the promoted composition's SBOMs
        if: steps.proven.outputs.image != ''
        env:
          IMAGE: ${{ steps.proven.outputs.image }}
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
        run: |
          set -euo pipefail
          mkdir -p runner
          trivy image --quiet --format cyclonedx --output sbom.cdx.json "$IMAGE"
          trivy image --quiet --format cyclonedx --output runner/sbom.cdx.json "$RUNNER_IMAGE"

      # Publishing under the commit's tag and signing as main is what makes a
      # composition deployable, so only a release does. A promotion pushes the
      # pull request's verified manifest under these tags, byte for byte:
      # `imagetools create --prefer-index=false` pushes what it fetched by
      # digest, and the digest each push reports must be that one.
      - name: Publish by digest
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        id: publish
        env:
          HOST_SHA: ${{ steps.host.outputs.sha }}
          FINGERPRINT_TAG: ${{ steps.fingerprint.outputs.tag }}
          PROVEN: ${{ steps.proven.outputs.image }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}/composition:$HOST_SHA"
          if [ -n "$PROVEN" ]; then
            for tag in "$image" "$FINGERPRINT_TAG"; do
              docker buildx imagetools create --prefer-index=false \
                --metadata-file "$RUNNER_TEMP/promote.json" --tag "$tag" "$PROVEN"
              pushed=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/promote.json")
              if [ "$pushed" != "${PROVEN#*@}" ]; then
                echo "::error::$tag was pushed as $pushed, not ${PROVEN#*@}"
                exit 1
              fi
            done
            echo "image=$PROVEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker push "$image"
          # The fingerprint tag is what the next admission's dispatch reads to decide
          # there is nothing to do. Pushed after the image itself, so a failed
          # push never leaves a claim that this composition was published.
          docker tag "$image" "$FINGERPRINT_TAG"
          docker push "$FINGERPRINT_TAG"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"

      # The artifacts production actually runs: the composition, and the
      # automation worker's image it pins. Every input to them is now signed
      # and verified (the host and worker images by the step near the top of
      # this job, each extension wheel by its admission bundle) and these are
      # the outputs those checks were for. Deploy verifies the composition's
      # signature before it recreates the container, and the release verifies
      # the worker image's before it pulls it, so an image pushed to either
      # name by anything other than this workflow cannot become production.
      - name: Sign the published composition and its worker image
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
        # The worker image first, so a signed composition never pins an
        # unsigned one.
        run: |
          set -euo pipefail
          for image in "$RUNNER_IMAGE" "$IMAGE"; do cosign sign --yes "$image"; done
      # What each holds, as the scans above read it (Debian packages, Python
      # distributions, extensions included, each Go binary's modules), in
      # CycloneDX, signed by the same workflow identity as the image and
      # stored beside it in the registry: the list attested is the list
      # scanned, or for a promotion the list of what its pull request scanned. Its subject is the published digest; the list itself names
      # the image by the tag it was scanned under.
      - name: Attest the SBOMs
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          RUNNER_IMAGE: ${{ steps.host.outputs.runner }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate runner/sbom.cdx.json "$RUNNER_IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"

      # Deploy is started by the composition it deploys, and by nothing else
      # but a person: it is handed the commit, and a link back to this run.
      - name: Start Deploy for this commit
        if: env.IS_RELEASE == 'true' && steps.publish.outputs.image != ''
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
          COMMIT: ${{ steps.host.outputs.sha }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit="$COMMIT" -f compose_run="$THIS_RUN"

      - name: Install the pinned age
        if: failure()
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          version: ${{ steps.pins.outputs.mise }}
          install_args: age
          # One small tool, on a failure: no cache entry of its own.
          cache: false
      - name: Seal the withheld output
        id: seal
        if: failure()
        run: |
          set -euo pipefail
          tools/pipeline/seal-failure-logs.sh "$WITHHELD_DIR" failure-logs.tar.age
          if [ -f failure-logs.tar.age ]; then echo "sealed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload the sealed output
        if: failure() && steps.seal.outputs.sealed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs
          path: failure-logs.tar.age
          retention-days: 14

      - name: Name the step that failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SEALED: ${{ steps.seal.outputs.sealed }}
        run: |
          set -euo pipefail
          # This job's failed steps; called from another workflow it is "Caller / Build HQ".
          step="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$GITHUB_RUN_ATTEMPT" --json jobs \
            --jq '.jobs[] | select(.name == "Build HQ" or (.name | endswith(" / Build HQ"))) | .steps[]
              | select(.conclusion == "failure") | .name' 2>/dev/null | head -1 || true)"
          {
            echo "### Not built: ${step:-a step} failed"
            echo
            echo "Nothing was published; production still runs the previous image."
            if [ "$SEALED" = true ]; then
              echo
              echo "Withheld output, for the operator: \`mise run failure-logs ${GITHUB_RUN_ID}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
