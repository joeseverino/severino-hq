name: Compose

# Builds HQ, the one image production runs: this host plus every admitted
# extension, verified as one application. Extensions verify and admit
# themselves and build no image of their own, so deploying one never replaces
# the others.
#
# Started by events only: CI finishing on a commit (ci.yml), an extension's
# admission, or by hand. On a pull request it composes and verifies, and CI's
# Ready waits for it. On main it publishes and signs, and Deploy (deploy.yml)
# takes it from there.
#
# The file keeps its name: the composition is signed by it, and the deploy
# script on the host pins this path.

on:
  # A pull request composes and verifies (DEBUG off, the extensions loaded, as
  # production assembles it) before merge. It does not publish and cannot
  # deploy. It starts with the pull request, so it can outrun the host image it
  # needs; "Resolve the host image" waits for that image rather than assuming it.
  pull_request:
    branches: [main]
  # Everything else is a dispatch naming what to compose: CI once a push to
  # main has passed every gate, an extension's admission, or a person. Each is
  # started by what came before it, so no run of anything else can start one.
  workflow_dispatch:
    inputs:
      commit:
        description: The commit on main whose host image to compose. Blank composes main as it is now.
        required: false
        default: ""
      reason:
        description: Why this composition is being built
        required: false
        default: manual rebuild
      force:
        description: Rebuild even when nothing changed. An admission passes false.
        type: boolean
        required: false
        default: true

# Read-only by default; each job declares what it needs beyond this.
permissions:
  contents: read

concurrency:
  # Never two compositions at once *for the same target*: they would race for
  # the same image tag and the deploy that finished second would silently win.
  # Keyed by the branch being composed, so a pull request's composition neither
  # queues behind main's nor delays it: they build different tags and only
  # one of them can deploy.
  group: composition-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Whether this composition is entitled to publish and deploy: a dispatch on
  # main, and nothing else. A pull request composes and verifies and stops
  # there. Decided once, because the publish step and the dispatch of Deploy
  # must agree about it.
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
  CORDON_COMMIT: a5f2f2d2c11e33abe1be6ab04e5961f3c2f4a739
  PYTHONUNBUFFERED: "1"

jobs:
  compose:
    name: Build HQ
    # A fork's pull request is not composed: reading the extensions' admission
    # artifacts needs a secret a fork cannot have, so it would fail on the
    # download step with a permissions error that looks like a broken pipeline
    # rather than a fork doing exactly what forks are supposed to do.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Read-only, and only so "Resolve the host image" can ask whether the host
      # build it is waiting for has already failed.
      actions: read
      # Keyless signing of the published composition. Granted to this job
      # alone: the deploy job verifies signatures and never makes one, and a
      # self-hosted runner has no business holding an identity that can.
      id-token: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the composition set
        # A secret, and never interpolated into the script body. Actions
        # expands `${{ … }}` into the text of the step it echoes, and masks only
        # secret values, so anything private reaches the log through the
        # environment or not at all.
        env:
          COMPOSITION_EXTENSIONS: ${{ secrets.COMPOSITION_EXTENSIONS }}
        run: |
          set -euo pipefail
          if [ -z "${COMPOSITION_EXTENSIONS:-}" ]; then
            echo "::error::COMPOSITION_EXTENSIONS must be set as a repository" \
                 "secret. A repository variable cannot hold it: this log is" \
                 "public and only a secret is masked."
            exit 1
          fi
          printf '%s' "$COMPOSITION_EXTENSIONS" > composition-set.json
          if ! jq -e '.extensions | length > 0' composition-set.json >/dev/null 2>&1; then
            echo "::error::COMPOSITION_EXTENSIONS must list at least one extension"; exit 1
          fi
          jq -r '.extensions | length as $n | "composing \($n) extension(s)"' composition-set.json

      - name: Mask the extension names for the rest of the job
        # Later steps shell out to gh, uv, and Django, and those echo
        # repository names, wheel filenames, app labels and (when a test fails)
        # table and column names. This repository is public and so are its
        # logs. Masking once here covers every later step, including output
        # from commands not yet written.
        #
        # Every spelling, because the same extension appears as a repository
        # path, a bare name, a Python package, a table prefix and the path it
        # mounts at. A URL is none of the other four, so it needs its own.
        run: |
          set -euo pipefail
          jq -r '
            .extensions[]
            | .id, .repository,
              (.repository | split("/") | last),
              (.id | split(".") | last)
          ' composition-set.json \
            | tr -d '\r' | sed '/^$/d' | sort -u \
            | while read -r name; do
                echo "::add-mask::${name}"
                echo "::add-mask::${name//-/_}"
                echo "::add-mask::${name//_/-}"
              done

      - name: Authenticate to GHCR
        # Before the two steps that ask the registry a question, not before the
        # one that pushes: resolving the host image and checking whether this
        # composition was already published are both reads, and both happen on
        # every tick including the ones that build nothing.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the host image
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch payloads are untrusted input: passed as data, never
          # interpolated into the script.
          HOST_REF: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
        # Derived from the commit being composed, so there is no pin to bump by
        # hand and no way for the composition to be built on a stale host.
        run: |
          set -euo pipefail
          if ! [[ "$HOST_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid host ref::The host ref is not a full commit SHA."
            exit 1
          fi
          ref="$HOST_REF"
          image="ghcr.io/${{ github.repository }}:sha-${ref:0:12}"
          # On a pull request this workflow and the host build start together,
          # so the image may not exist yet. Waited for rather than assumed:
          # failing instantly here would report "no such image" for a build that
          # is simply still running, which is the least useful true statement
          # available. 20 minutes is well past a host build and well short of
          # the job timeout.
          digest=""
          # Polled every five seconds: on a pull request this waits for a build
          # that started at the same moment, and any longer interval is time
          # spent after the image is already there.
          for attempt in $(seq 1 240); do
            if digest=$(docker buildx imagetools inspect "$image" \
                          --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'); then
              [ -n "$digest" ] && break
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "waiting for the host image $image to be published..."
            fi
            # Every two minutes, ask whether there is still a build to wait for.
            # A host build that already failed will never publish, so waiting
            # the full twenty minutes reports a timeout instead of the failure
            # that caused it, and holds this branch's composition slot while
            # the corrected commit queues behind it.
            if [ $((attempt % 24)) -eq 0 ]; then
              # The Image job, not the run: CI's Ready waits for this
              # composition, so the run as a whole cannot conclude first.
              ci_run=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$ref&per_page=30" \
                --jq '[.workflow_runs[] | select(.name == "CI") | .id] | first' 2>/dev/null || true)
              host_ci=""
              if [ -n "$ci_run" ]; then
                host_ci=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name == "Image") | .conclusion] | map(select(. != null)) | first' \
                  2>/dev/null || true)
              fi
              case "$host_ci" in
                failure|cancelled|timed_out|skipped)
                  echo "::error title=Host build $host_ci::The host build for \
          ${ref:0:12} concluded '$host_ci', so $image will never be published. \
          Fix the host build; the composition has nothing to compose onto."
                  exit 1
                  ;;
              esac
            fi
            sleep 5
          done
          if [ -z "$digest" ]; then
            echo "::error title=Host image never appeared::$image was not published \
          within 20 minutes. The host build for this commit failed or was skipped; \
          the composition has nothing to compose onto."
            exit 1
          fi
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
          echo "host image: ${image%:*}@$digest"

      # Installed once for the whole job: the host image is verified with it
      # below, every extension admission is verified with it before install,
      # and the published composition is signed with it at the end.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the host image was built by this repository
        # Every extension wheel is verified against a declared signer before it
        # is installed, and so is the image it is installed into: a tag derived
        # from a commit says who should have built it, not who did.
        #
        # The identity is pinned to this repository's own `ci` workflow, so an
        # image pushed to the same name by anything else fails here rather than
        # becoming the base of a production composition.
        env:
          HOST_IMAGE: ${{ steps.host.outputs.image }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A release composes only onto a host built from main. Anything else
          # never publishes, so it may also compose onto a pull-request build.
          if [ "$IS_RELEASE" = true ]; then
            signer_ref='refs/heads/main$'
          else
            signer_ref='refs/(heads/main|pull/[0-9]+/merge)$'
          fi
          # Retried, because the host build pushes the image and signs it in
          # two steps and this job is watching for the push. On a pull request
          # the two workflows run concurrently, so the manifest can exist for a
          # few seconds before its signature does, which is indistinguishable
          # from an unsigned image on the first attempt and is not one.
          for attempt in $(seq 1 12); do
            if cosign verify \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                 --certificate-identity-regexp \
                   "^https://github\.com/${REPOSITORY}/\.github/workflows/ci\.yml@${signer_ref}" \
                 "$HOST_IMAGE" > /dev/null 2>&1; then
              echo "host image signature verified"
              exit 0
            fi
            [ "$attempt" -eq 1 ] && echo "waiting for the host image signature..."
            sleep 15
          done
          echo "::error title=Host image is not signed::No signature by this \
          repository's ci workflow appeared for the host image within three \
          minutes. An image published under this name by anything else must \
          not become the base of a composition."
          exit 1

      # HQ's app, asked for read access only: a token minted per run
      # for the extensions' admissions and branches, that lapses within the
      # hour, where a personal token would have to be renewed by hand before it
      # lapsed. Scoped by the installation rather than by listing repositories,
      # so no private repository's name is written into this public log.
      - name: Mint a token that can only read the extensions
        id: reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: read
          permission-contents: read

      - name: Find the latest admission for each extension
        env:
          # Only the extensions' signed admission bundles and wheels are read.
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        # One list call per extension and nothing downloaded. This is the whole
        # input to "has anything changed?", and it is deliberately the cheapest
        # question that can answer it: a new wheel cannot exist without a new
        # admission run, so an unchanged set of run ids means an unchanged set
        # of wheels. It can be conservative in one direction only (a re-run
        # that produced an identical wheel looks like a change and rebuilds)
        # which is the safe direction to be wrong in.
        #
        # Written to a file rather than a step output. An output is read back by
        # interpolation, which puts its contents into the text of the step that
        # reads it, and these lines name the private repositories.
        run: |
          set -euo pipefail
          : > admissions.txt
          while read -r repo; do
            run=$(gh run list --repo "$repo" --workflow admit-plugin.yml \
                    --branch main --status success --limit 1 \
                    --json databaseId -q '.[0].databaseId')
            if [ -z "$run" ]; then
              echo "::error::an extension has no successful admission on main"; exit 1
            fi
            printf '%s=%s\n' "$repo" "$run" >> admissions.txt
          done < <(jq -r '.extensions[].repository' composition-set.json | sort)
          wc -l < admissions.txt | xargs printf 'resolved %s admission(s)\n'

      - name: Find coordinated extension branches
        # A pull request whose branch name an extension also carries is a
        # coordinated change: the two must be verified together, so that
        # extension is built from its branch instead of reusing its admission.
        # Verify only. The resulting image is local to this job, carries no
        # lock, and no step that publishes can reach it.
        id: coordinated
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::The pull request branch name has characters this step does not accept."
            exit 1
          fi
          : > coordinated.txt
          while read -r repo; do
            if sha=$(gh api "repos/$repo/branches/$BRANCH" --jq .commit.sha 2>api-error.txt); then
              printf '%s=%s\n' "$repo" "$sha" >> coordinated.txt
            elif ! grep -q 'HTTP 404' api-error.txt; then
              # Not "no such branch": the answer is unknown, and guessing
              # either way would verify the wrong composition.
              echo "::error::Could not ask an extension repository for branch $BRANCH."
              exit 1
            fi
          done < <(jq -r '.extensions[].repository' composition-set.json | sort)
          rm -f api-error.txt
          count=$(grep -c . coordinated.txt || true)
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "coordinated extension branches named $BRANCH: $count"

      - name: Decide whether anything changed
        id: fingerprint
        env:
          FORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.force }}
          HOST_IMAGE: ${{ steps.host.outputs.image }}
        run: |
          set -euo pipefail
          # What a composition IS: this host image, these admitted wheels, this
          # policy. Two runs agreeing on all three produce the same image, so
          # there is nothing to build and nothing to deploy.
          #
          # Asked before anything is downloaded or verified, because the answer
          # is almost always "nothing", and an idle tick that downloads and
          # verifies is a chance to fail at something nobody is waiting for.
          fingerprint=$(printf '%s\n%s\n%s\n' \
            "$HOST_IMAGE" \
            "$(sha256sum admissions.txt | cut -d' ' -f1)" \
            "$(openssl dgst -sha256 policy/plugin-admission-v1.json | awk '{print $NF}')" \
            | sha256sum | cut -c1-32)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

          tag="ghcr.io/${{ github.repository }}/composition:fp-$fingerprint"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Recorded as a tag rather than a file or a variable: the registry
          # already holds the only copy of the truth that matters, and a tag
          # that exists is proof the exact same composition was published.
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            changed=false
            echo "composition fp-$fingerprint is already published."
          else
            changed=true
            echo "composition fp-$fingerprint has not been built before."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # Only an admission's dispatch asks not to rebuild what is already
          # published: a second admission of the same commit is not news. The
          # host build, a pull request and a hand-run rebuild always build.
          if [ "$changed" = false ] && [ "$FORCE" = false ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        # Only an admission's dispatch stops here. Every other trigger rebuilds
        # even when the inputs match, because a hand-run rebuild asking for
        # exactly that is the one case where "nothing changed" is not an answer.
        if: steps.fingerprint.outputs.build == 'false'
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: |
          {
            echo "### Composition already current"
            echo
            echo "Host image, extension wheels and admission policy are unchanged"
            echo "since \`fp-$FINGERPRINT\` was published."
            echo "Nothing was built and nothing was deployed."
          } >> "$GITHUB_STEP_SUMMARY"

      # On main, HQ's production row opens here: the one row on the commit that
      # says where it is, moved on by Deploy and closed by its Report.
      # The same token starts Deploy once HQ is published, below.
      - name: Mint a token for HQ's production row
        id: production
        if: env.IS_RELEASE == 'true' && steps.fingerprint.outputs.build == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.HQ_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-actions: write

      - name: Say on the commit that HQ is being built
        if: steps.production.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
          HEAD_SHA: ${{ steps.host.outputs.sha }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          scripts/hq-check.sh "Severino HQ · Production" "$HEAD_SHA" in_progress "Building HQ"
          "The host and every admitted extension are being built and tested as one application."

      - name: Download admitted artifacts
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        # The run ids were resolved above to answer "anything changed?", so
        # they are reused rather than looked up a second time.
        if: >-
          steps.fingerprint.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while IFS='=' read -r repo run; do
            [ -n "$repo" ] || continue
            gh run download "$run" --repo "$repo" -D "artifacts/$(basename "$repo")"
          done < admissions.txt

      - name: Check out exact Cordon verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          steps.fingerprint.outputs.build == 'true'
        with:
          repository: joeseverino/cordon
          ref: ${{ env.CORDON_COMMIT }}
          path: cordon

      - name: Install pinned Cordon dependencies
        if: >-
          steps.fingerprint.outputs.build == 'true'
        run: npm ci --prefix cordon --ignore-scripts

      - name: Verify every admission against the declared signer
        id: collect
        if: >-
          steps.fingerprint.outputs.build == 'true'
        # The host verifies each signature itself rather than trusting an entry
        # an extension produced. The identity checked is the one declared in
        # composition-set.json, so an extension cannot widen who is
        # allowed to sign for it by editing its own repository.
        #
        # With coordinated branches, an extension on one is built from it
        # instead, and every other admission was signed under the base
        # branch's policy, so that is the policy it is verified against.
        env:
          CANDIDATE: ${{ steps.coordinated.outputs.found == 'true' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          policy_sha=$(openssl dgst -sha256 policy/plugin-admission-v1.json | awk '{print $NF}')
          if [ "$CANDIDATE" = true ]; then
            git fetch --quiet --depth 1 origin "$BASE_SHA"
            policy_sha=$(git show FETCH_HEAD:policy/plugin-admission-v1.json \
                           | openssl dgst -sha256 | awk '{print $NF}')
            mkdir -p candidate-wheels
          fi
          args=""
          count=$(jq '.extensions | length' composition-set.json)
          for index in $(seq 0 $((count - 1))); do
            repo=$(jq -r ".extensions[$index].repository" composition-set.json)
            workflow=$(jq -r ".extensions[$index].workflow" composition-set.json)
            plugin_id=$(jq -r ".extensions[$index].id" composition-set.json)
            if [ "$CANDIDATE" = true ] \
               && awk -F= -v r="$repo" '$1 == r { found = 1 } END { exit !found }' coordinated.txt; then
              continue
            fi
            dir="artifacts/$(basename "$repo")"
            statement=$(find "$dir" -name admission.json -print -quit)
            bundle=$(find "$dir" -name admission.sigstore.json -print -quit)
            wheel=$(find "$dir" -name '*.whl' -print -quit)
            if [ -z "$statement" ] || [ -z "$bundle" ] || [ -z "$wheel" ]; then
              echo "::error::$repo is missing its admission statement, bundle or wheel"; exit 1
            fi
            # These paths become words of the next step's command line, so each
            # is held to a wheel's own name (PEP 427): nothing a shell reads.
            for path in "$statement" "$bundle" "$wheel"; do
              if [[ ! "$path" =~ ^[A-Za-z0-9._/+-]+$ ]]; then
                echo "::error::$repo ships an artifact whose name is not a plain file name"; exit 1
              fi
            done
            if [[ ! "$(basename "$wheel")" =~ ^[A-Za-z0-9_.]+-[A-Za-z0-9_.+]+(-[0-9][A-Za-z0-9_.]*)?-[A-Za-z0-9_.]+-[A-Za-z0-9_.]+-[A-Za-z0-9_.]+\.whl$ ]]; then
              echo "::error::$repo ships a wheel whose name is not a wheel's"; exit 1
            fi
            entry="$dir/verified-entry.json"
            # cordon names the field that differs but not the values; say both,
            # so a policy mismatch shows which side moved.
            signed_policy=$(jq -r '.policy.sha256' "$statement")
            if [ "$signed_policy" != "$policy_sha" ]; then
              echo "::error::$repo was admitted under policy $signed_policy; this composition's policy is $policy_sha"; exit 1
            fi
            node cordon/admission/verify.mjs \
              --statement "$statement" \
              --bundle "$bundle" \
              --artifact "$wheel" \
              --identity "https://github.com/$repo/$workflow@refs/heads/main" \
              --issuer https://token.actions.githubusercontent.com \
              --repository "$repo" \
              --workflow "$workflow" \
              --host severino-hq \
              --plugin-id "$plugin_id" \
              --policy-sha "$policy_sha" > "$entry"
            args="$args --entry $entry --wheel $wheel"
            if [ "$CANDIDATE" = true ]; then cp "$wheel" candidate-wheels/; fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Merge locks and stage the build context
        id: compose
        if: >-
          steps.coordinated.outputs.found != 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        env:
          CORDON_LOCK: ./cordon/admission/lock.mjs
          ARGS: ${{ steps.collect.outputs.args }}
        # ARGS is words by construction (the collect step admits only plain
        # file names), so it is split here on purpose and never globbed.
        run: |
          set -f
          # shellcheck disable=SC2086
          python scripts/compose-plugins.py $ARGS --out build/composition

      - name: Build composed image
        # Skipped by an admission's dispatch that found nothing to do, and by a
        # coordinated change, which builds the candidate below instead.
        if: >-
          steps.coordinated.outputs.found != 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        env:
          HQ_IMAGE: ${{ steps.host.outputs.image }}
          WHEEL_DIGESTS: ${{ steps.compose.outputs.digests }}
          POLICY_SHA256: ${{ steps.compose.outputs.policy_sha256 }}
          PLUGIN_REFERENCES: ${{ steps.compose.outputs.references }}
          HOST_SHA: ${{ steps.host.outputs.sha }}
        run: |
          docker build -f composition/Dockerfile \
            --build-arg HQ_IMAGE="$HQ_IMAGE" \
            --build-arg PLUGIN_WHEEL_DIGESTS="$WHEEL_DIGESTS" \
            --build-arg PLUGIN_POLICY_SHA256="$POLICY_SHA256" \
            --build-arg SEVERINO_HQ_PLUGIN_REFERENCES="$PLUGIN_REFERENCES" \
            -t "ghcr.io/${{ github.repository }}/composition:$HOST_SHA" .

      - name: Build coordinated extension branches
        # Branch code is unreviewed, and this job holds a registry credential
        # and an OIDC identity. So it builds in a throwaway Python installer
        # with no token, credential file or docker socket, from a copy with no
        # .git. This is the same Python ABI as the verified host image.
        if: github.event_name == 'pull_request' && steps.coordinated.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          HQ_IMAGE: ${{ steps.host.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p candidate-wheels candidates
          chmod 0777 candidate-wheels
          docker build -f composition/Dockerfile --target installer-base \
            --build-arg HQ_IMAGE="$HQ_IMAGE" \
            -t "severino-hq-installer:$GITHUB_SHA" .
          while IFS='=' read -r repo sha; do
            [ -n "$repo" ] || continue
            dir="candidates/$(basename "$repo")"
            gh repo clone "$repo" "$dir" -- --quiet
            git -C "$dir" checkout --quiet --detach "$sha"
            rm -rf "$dir/.git"
            chmod -R a+rwX "$dir"
            docker run --rm --network bridge --user 10001:10001 \
              --env HOME=/tmp --env UV_PYTHON_DOWNLOADS=never \
              --volume "$PWD/$dir:/src" --volume "$PWD/candidate-wheels:/out" \
              --entrypoint uv "severino-hq-installer:$GITHUB_SHA" \
              build --python /usr/local/bin/python --no-cache --wheel --out-dir /out /src
          done < coordinated.txt

      - name: Stage the candidate
        id: candidate
        if: github.event_name == 'pull_request' && steps.coordinated.outputs.found == 'true'
        run: |
          set -euo pipefail
          args=()
          for wheel in candidate-wheels/*.whl; do args+=(--wheel "$wheel"); done
          python scripts/compose-plugins.py --candidate "${args[@]}" --out build/candidate

      - name: Build the candidate image
        # Admission off: these wheels are unsigned branch builds. The tag has no
        # registry, so no push in this workflow can publish it.
        if: github.event_name == 'pull_request' && steps.coordinated.outputs.found == 'true'
        env:
          HQ_IMAGE: ${{ steps.host.outputs.image }}
          DIGESTS: ${{ steps.candidate.outputs.digests }}
          REFERENCES: ${{ steps.candidate.outputs.references }}
          INSTALLER_IMAGE: severino-hq-installer:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f - -t "severino-hq-candidate:$GITHUB_SHA" \
            --build-arg HQ_IMAGE="$HQ_IMAGE" \
            --build-arg INSTALLER_IMAGE="$INSTALLER_IMAGE" \
            --build-arg PLUGIN_WHEEL_DIGESTS="$DIGESTS" \
            --build-arg SEVERINO_HQ_PLUGIN_REFERENCES="$REFERENCES" . <<'DOCKERFILE'
          ARG HQ_IMAGE
          ARG INSTALLER_IMAGE
          FROM ${INSTALLER_IMAGE} AS installer
          ARG PLUGIN_WHEEL_DIGESTS
          COPY build/candidate/*.whl /tmp/plugin/
          RUN set -eu; \
              printf '%s\n' "${PLUGIN_WHEEL_DIGESTS}" | awk 'NF { \
                  if (NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-f]+$/) exit 1; \
                  print "/tmp/plugin/" $2 " --hash=sha256:" $1 }' > /tmp/plugin/requirements.txt; \
              expected=$(grep -c . /tmp/plugin/requirements.txt); \
              found=$(find /tmp/plugin -maxdepth 1 -type f -name '*.whl' | wc -l); \
              test "$expected" -eq "$found"; \
              uv pip install --python /usr/local/bin/python --prefix /install \
                --no-cache --no-deps --require-hashes -r /tmp/plugin/requirements.txt
          FROM ${HQ_IMAGE} AS runtime
          ARG SEVERINO_HQ_PLUGIN_REFERENCES
          USER root
          COPY --from=installer /install /usr/local
          RUN ! command -v pip && ! python -c 'import pip'
          ENV SEVERINO_HQ_PLUGINS=${SEVERINO_HQ_PLUGIN_REFERENCES} \
              SEVERINO_HQ_REQUIRE_PLUGIN_ADMISSION=0
          USER severino
          DOCKERFILE

      - name: Verify the composition as one application
        # Skipped only by an admission's dispatch that found nothing to do.
        if: >-
          steps.fingerprint.outputs.build == 'true'
        # Per-plugin admission proves each wheel against the host in isolation.
        # This second layer is deliberately after assembly: only the real image
        # can expose duplicate routes/capabilities, migration conflicts, missing
        # host-owned dependencies, or a test that wrongly assumes its plugin is
        # the only contributor to a global surface.
        #
        # Log level raised for the run. At INFO the application writes a line
        # per request, which a suite exercising every composed page turns into
        # a list of everything the composition serves. Masking is the backstop.
        # Failures are unaffected: the test runner reports those itself.
        env:
          IMAGE: ${{ steps.coordinated.outputs.found == 'true' && format('severino-hq-candidate:{0}', github.sha) || format('ghcr.io/{0}/composition:{1}', github.repository, steps.host.outputs.sha) }}
        run: |
          image="$IMAGE"
          docker run --rm --entrypoint python \
            --env DJANGO_SECRET_KEY=ci-only-composition-key-0123456789abcdef0123456789abcdef \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            --env SEVERINO_LOG_LEVEL=WARNING \
            "$image" manage.py check
          docker run --rm --entrypoint python \
            --env DJANGO_SECRET_KEY=ci-only-composition-key-0123456789abcdef0123456789abcdef \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            --env SEVERINO_LOG_LEVEL=WARNING \
            "$image" manage.py test --verbosity 1 --parallel auto

      - name: Scan composed image
        # Skipped only by an admission's dispatch that found nothing to do.
        if: >-
          steps.fingerprint.outputs.build == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.coordinated.outputs.found == 'true' && format('severino-hq-candidate:{0}', github.sha) || format('ghcr.io/{0}/composition:{1}', github.repository, steps.host.outputs.sha) }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Authenticate to GHCR
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request has already had the only thing it was here for: the
      # image was built and its suite was run inside it. Publishing is what
      # makes an image deployable, so a pull request does not.
      - name: Publish by digest
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        id: publish
        env:
          HOST_SHA: ${{ steps.host.outputs.sha }}
          FINGERPRINT_TAG: ${{ steps.fingerprint.outputs.tag }}
        run: |
          image="ghcr.io/${{ github.repository }}/composition:$HOST_SHA"
          docker push "$image"
          # The fingerprint tag is what the next admission's dispatch reads to decide
          # there is nothing to do. Pushed after the image itself, so a failed
          # push never leaves a claim that this composition was published.
          docker tag "$image" "$FINGERPRINT_TAG"
          docker push "$FINGERPRINT_TAG"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "image=${image%:*}@$digest" >> "$GITHUB_OUTPUT"

      # The artifact production actually runs. Every input to it is now signed
      # and verified (the host image by the step near the top of this job,
      # each extension wheel by its admission bundle) and this is the output
      # those checks were for. Deploy verifies this signature before it
      # recreates the container, so an image pushed to this name by anything
      # other than this workflow cannot become production.
      - name: Sign the published composition
        if: >-
          env.IS_RELEASE == 'true' &&
          (steps.fingerprint.outputs.build == 'true')
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
        run: cosign sign --yes "$IMAGE"

      # Deploy is started by the composition it deploys, and by nothing else
      # but a person: it is handed the commit, and a link back to this run.
      - name: Start Deploy for this commit
        if: env.IS_RELEASE == 'true' && steps.publish.outputs.image != ''
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
          COMMIT: ${{ steps.host.outputs.sha }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit="$COMMIT" -f compose_run="$THIS_RUN"

      - name: Say on the commit that HQ could not be built
        if: failure() && steps.production.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.production.outputs.token }}
          HEAD_SHA: ${{ steps.host.outputs.sha }}
          CHECK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          scripts/hq-check.sh "Severino HQ · Production" "$HEAD_SHA" completed "Not deployed: HQ could not be built"
          "A step of the build failed, so nothing was published and production still runs the previous image. Open the run for the step that failed."
          failure
