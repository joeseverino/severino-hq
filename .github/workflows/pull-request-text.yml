name: pull request text

# A pull request's title and description are public the moment they are saved,
# and they are not files, so nothing in ci.yml sees them. This runs on every
# edit as well as every push. It cannot un-publish text; it makes the leak loud
# before merge, and says where to delete the revision.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  # A newer push to the same ref makes this run's answer irrelevant.
  group: pull-request-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-names:
    name: private names
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No private extension names in the title or description
        # Passed through the environment, never interpolated into the script:
        # a description is untrusted text and must not become shell.
        env:
          COMPOSITION_EXTENSIONS: ${{ secrets.COMPOSITION_EXTENSIONS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if ! printf '%s\n%s\n' "${PR_TITLE}" "${PR_BODY:-}" \
              | sh scripts/check-private-names.sh text "this pull request's title or description"; then
            echo "Edit it out, then delete the old revision: 'edited' above the description, choose the revision, Delete revision from history."
            exit 1
          fi
