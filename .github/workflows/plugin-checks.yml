name: plugin checks

# The reusable pre-admission gate. Every extension repository calls this instead
# of copying it, so the pinned action SHAs, the Python matrix and the secret
# scan live in exactly one place -- this one, where Dependabot already keeps
# them current.
#
# This workflow deliberately does NOT sign anything. A job that runs from a
# reusable workflow is issued a Sigstore identity naming *this* file, not the
# caller's, so the signing job has to stay in the calling repository. See
# .github/actions/admit-plugin/action.yml for the half that does.

on:
  workflow_call:
    inputs:
      hq-ref:
        description: >-
          Host ref the contract check runs against. Callers normally pass their
          HQ_COMMIT variable falling back to main.
        required: false
        type: string
        default: main
      python-versions:
        description: >-
          JSON array of Python versions to test against. Overridable so an
          extension that cannot support the newest interpreter narrows one
          input instead of forking this file.
        required: false
        type: string
        default: '["3.12", "3.13", "3.14"]'
      plugin-reference:
        description: >-
          Manifest reference, for example example_notes.plugin:plugin. When set
          with django-app, the host-owned golden-path check replaces a copied
          scripts/check.sh.
        required: false
        type: string
        default: ""
      django-app:
        description: Django application label and src package directory.
        required: false
        type: string
        default: ""

env:
  HOST_REPOSITORY: joeseverino/severino-hq
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out HQ contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.HOST_REPOSITORY }}
          ref: ${{ inputs.hq-ref }}
          path: host
      - name: Report whether the host pin is current
        # A stale pin does not fail here -- pinning behind the host is a
        # legitimate state. It surfaces as an ImportError for a name the pinned
        # contract has not got yet, which reads like a bug in the extension and
        # sends you debugging the wrong repository. Saying so up front turns
        # that into one line.
        run: |
          set -euo pipefail
          pinned="$(git -C host rev-parse HEAD)"
          current="$(git -C host ls-remote origin refs/heads/main | cut -f1)"
          if [ "$pinned" != "$current" ]; then
            behind="$(git -C host rev-list --count "$pinned..$current" 2>/dev/null || echo '?')"
            echo "::notice title=Host pin is behind::Testing against ${pinned:0:7}; \
          main is ${current:0:7} ($behind commits ahead). If a name is missing \
          from the host contract, bump HQ_COMMIT before debugging this repo: \
          hq pin --rerun"
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Verify package and host contract
        env:
          HQ_ROOT: host
          PLUGIN_REFERENCE: ${{ inputs.plugin-reference }}
          DJANGO_APP: ${{ inputs.django-app }}
        run: |
          if [ -n "$PLUGIN_REFERENCE" ] && [ -n "$DJANGO_APP" ]; then
            host/scripts/check-plugin.sh \
              --plugin-root . \
              --plugin-reference "$PLUGIN_REFERENCE" \
              --django-app "$DJANGO_APP"
          elif [ -z "$PLUGIN_REFERENCE" ] && [ -z "$DJANGO_APP" ]; then
            echo "::warning::Using legacy plugin-owned scripts/check.sh; pass plugin-reference and django-app to use the host contract."
            ./scripts/check.sh
          else
            echo "::error::plugin-reference and django-app must be supplied together"
            exit 2
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
