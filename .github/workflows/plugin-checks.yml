name: plugin checks

# The reusable pre-admission gate. Every extension repository calls this instead
# of copying it, so the pinned action SHAs, the Python matrix and the secret
# scan live in exactly one place: this one, where Renovate already keeps
# them current.
#
# This workflow deliberately does NOT sign anything. A job that runs from a
# reusable workflow is issued a Sigstore identity naming *this* file, not the
# caller's, so the signing job has to stay in the calling repository. See
# .github/actions/admit-plugin/action.yml for the half that does.

on:
  workflow_call:
    inputs:
      hq-ref:
        description: >-
          Host ref the contract check runs against. Empty (the default)
          resolves to the host branch named like the calling branch when the
          host has one, so a coordinated change checks against its host half,
          and to main otherwise.
        required: false
        type: string
        default: ""
      python-versions:
        description: >-
          JSON array of Python versions to test against. Overridable so an
          extension that cannot support the newest interpreter narrows one
          input instead of forking this file.
        required: false
        type: string
        # PYTHON_VERSIONS (tools/pipeline/toolchain.env), held to it by PythonVersionTests.
        default: '["3.15"]'
      package-dir:
        description: >-
          Directory of the package to check, relative to the repository root.
          A repository holding several extensions calls this once per package;
          the default is one extension at the root.
        required: false
        type: string
        default: .
      secret-scan:
        description: >-
          Whether to scan the repository for secrets. The scan covers the
          whole repository, so a caller checking several packages runs it on
          one call only.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  HOST_REPOSITORY: joeseverino/severino-hq
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the host ref
        id: hq
        # An explicit hq-ref wins. Otherwise a host branch with this branch's
        # name is the other half of a coordinated change, and main is the rest.
        # An unanswered lookup fails rather than falling back to main, which
        # would check a coordinated change against the wrong host.
        env:
          REQUESTED: ${{ inputs.hq-ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref="$REQUESTED"
          if [ -z "$ref" ]; then
            ref=main
            if [ "$BRANCH" != main ] && [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              status=0
              git ls-remote --exit-code --heads "https://github.com/$HOST_REPOSITORY.git" \
                "refs/heads/$BRANCH" >/dev/null || status=$?
              case "$status" in
                0) ref="$BRANCH"
                   echo "::notice title=Coordinated host branch::Checking against host branch $BRANCH." ;;
                2) ;;
                *) echo "::error::Could not ask the host repository for branch $BRANCH."; exit 1 ;;
              esac
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out HQ contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HOST_REPOSITORY }}
          ref: ${{ steps.hq.outputs.ref }}
          path: host
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up the host's uv
        uses: ./host/.github/actions/uv
        with:
          host: host
      # uv verifies every artifact against the locks; the cache only saves the download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles(format('{0}/uv.lock', inputs.package-dir), 'host/uv.lock') }}
      - name: Verify package and host contract
        # The identity comes from the package itself (tools/pipeline/plugin_identity.py).
        env:
          HQ_ROOT: host
          PACKAGE_DIR: ${{ inputs.package-dir }}
          PLUGIN_REPOSITORY: ${{ github.repository }}
        run: host/mise-tasks/plugin/check --plugin-root "$PACKAGE_DIR"

  secret-scan:
    name: Secret scan
    if: inputs.secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
