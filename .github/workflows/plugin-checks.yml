name: plugin checks

# The reusable pre-admission gate. Every extension repository calls this instead
# of copying it, so the pinned action SHAs, the Python matrix and the secret
# scan live in exactly one place: this one, where Dependabot already keeps
# them current.
#
# This workflow deliberately does NOT sign anything. A job that runs from a
# reusable workflow is issued a Sigstore identity naming *this* file, not the
# caller's, so the signing job has to stay in the calling repository. See
# .github/actions/admit-plugin/action.yml for the half that does.

on:
  workflow_call:
    inputs:
      hq-ref:
        description: >-
          Host ref the contract check runs against. Empty (the default)
          resolves to the host branch named like the calling branch when the
          host has one, so a coordinated change checks against its host half,
          and to main otherwise.
        required: false
        type: string
        default: ""
      python-versions:
        description: >-
          JSON array of Python versions to test against. Overridable so an
          extension that cannot support the newest interpreter narrows one
          input instead of forking this file.
        required: false
        type: string
        default: '["3.14"]'

permissions:
  contents: read

env:
  HOST_REPOSITORY: joeseverino/severino-hq
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the host ref
        id: hq
        # An explicit hq-ref wins. Otherwise a host branch with this branch's
        # name is the other half of a coordinated change, and main is the rest.
        # An unanswered lookup fails rather than falling back to main, which
        # would check a coordinated change against the wrong host.
        env:
          REQUESTED: ${{ inputs.hq-ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref="$REQUESTED"
          if [ -z "$ref" ]; then
            ref=main
            if [ "$BRANCH" != main ] && [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              status=0
              git ls-remote --exit-code --heads "https://github.com/$HOST_REPOSITORY.git" \
                "refs/heads/$BRANCH" >/dev/null || status=$?
              case "$status" in
                0) ref="$BRANCH"
                   echo "::notice title=Coordinated host branch::Checking against host branch $BRANCH." ;;
                2) ;;
                *) echo "::error::Could not ask the host repository for branch $BRANCH."; exit 1 ;;
              esac
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out HQ contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HOST_REPOSITORY }}
          ref: ${{ steps.hq.outputs.ref }}
          path: host
      - name: Report whether the host pin is current
        id: pin
        # A pin behind the host is legitimate, so it does not fail here. It
        # surfaces as an ImportError for a name the pinned contract lacks,
        # which reads like a bug in the extension. A warning, unlike a notice,
        # shows on the checks list and the job summary.
        env:
          REF: ${{ steps.hq.outputs.ref }}
        run: |
          set -euo pipefail
          pinned="$(git -C host rev-parse HEAD)"
          current="$(git -C host ls-remote origin "refs/heads/$REF" | cut -f1)"
          if [ -z "$current" ]; then
            current="$(git -C host ls-remote origin refs/heads/main | cut -f1)"
          fi
          behind=0
          if [ "$pinned" != "$current" ]; then
            behind="$(git -C host rev-list --count "$pinned..$current" 2>/dev/null || echo '?')"
            echo "::warning title=Host pin is behind::Testing against ${pinned:0:7}; \
          the branch head is ${current:0:7} ($behind commits ahead). If a name is \
          missing from the host contract, run against the default hq-ref before \
          debugging this repo."
          fi
          {
            echo "pinned=$pinned"
            echo "current=$current"
            echo "behind=$behind"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Read the host resolver pin
        id: host-uv
        run: echo "version=$(python host/scripts/dependency_config.py pin uv)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          version: ${{ steps.host-uv.outputs.version }}
      - name: Verify package and host contract
        # The identity comes from the package itself (scripts/plugin-identity.py).
        id: contract
        env:
          HQ_ROOT: host
        run: host/scripts/check-plugin.sh --plugin-root .

      # A host pin behind its branch fails as a missing name, which reads as a
      # broken extension. Said at the failure, where it is read.
      - name: Explain a failure against a stale host pin
        if: failure() && steps.pin.outputs.behind != '0'
        env:
          BEHIND: ${{ steps.pin.outputs.behind }}
          PINNED: ${{ steps.pin.outputs.pinned }}
          CURRENT: ${{ steps.pin.outputs.current }}
        run: |
          echo "::error title=Host pin is $BEHIND commits behind::\
          These checks ran against host $PINNED, not the \
          branch head ($CURRENT). An ImportError or \
          ModuleNotFoundError for something the host has since gained is this, \
          not a fault in this repository. Re-run against the default hq-ref \
          before debugging further."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
