name: Demo

# On each push to main, once a week and by hand: builds the demo, checks it
# (browser:demo), and publishes the checked folder to GitHub Pages. The
# weekly run keeps the pages' dates and ages current while nothing lands. The
# custom domain is set in the repository's Pages settings.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time; a newer push waits for the current one.
concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  # Named for the task it runs, as every gate job is.
  browser:
    name: Browser (demo)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # In Playwright's image, with its browsers, as CI's browser job runs.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - name: Build and check
        run: mise run browser:demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: var/demo

  publish:
    name: Publish
    needs: browser
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Can publish Pages; cannot write to the repository.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
