name: scorecard

# OpenSSF Scorecard: an outside, repeatable measure of this repository's
# supply-chain practices: pinned actions, token permissions, branch
# protection, signed releases and the rest. Findings land in code scanning,
# and the published result backs the README badge.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload findings to code scanning, and prove to the public API that
      # this workflow produced the result it publishes.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif
