name: Scorecard

# OpenSSF Scorecard: an outside, repeatable measure of this repository's
# supply-chain practices: pinned actions, token permissions, branch
# protection, signed releases and the rest. Findings land in code scanning,
# and the published result backs the README badge.
#
# Weekly, and when branch protection changes: a pull request that would lower
# a check is already held by CI's lint job (lint:scorecard), which runs the same checks, so a run
# on every push would only add a second row to each commit.
on:
  branch_protection_rule:
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload findings to code scanning, and prove to the public API that
      # this workflow produced the result it publishes.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
