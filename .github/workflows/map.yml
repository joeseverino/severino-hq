name: Map

# The map of the tests that ran each line of a pushed commit, which fast
# selects from (tools/gate/testmap.py, docs/Development.md). Its own workflow,
# so CI's run on a pull request ends with its checks; a push of any branch
# records one, so a pull request's head has its map. A map only narrows fast's
# selection, so no check waits on it.
on:
  push:

permissions:
  contents: read

concurrency:
  group: map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each share records its test modules, chosen as a browser gate's shares are
  # (hq/platform/core/tests/browser/shards.py), so the shares together run
  # the whole suite once.
  record:
    name: Record
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        share: [1/6, 2/6, 3/6, 4/6, 5/6, 6/6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          # The live bridge tests build the controller.
          go: true
          # A test label can reach the lint tools.
          npm: true
      - name: Record this share
        env:
          HQ_MAP_SHARE: ${{ matrix.share }}
        run: mise run fast:map
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-data-${{ strategy.job-index }}
          path: var/coverage/map/data.*
          retention-days: 1
          if-no-files-found: error

  map:
    name: Map
    needs: record
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: map-data-*
          path: var/coverage/map
          merge-multiple: true
      - name: Write the map
        run: mise run fast:map --write
      # fast finds a map by the commit its run checked out (tools/gate/chain.py, fetch_map), and
      # reads one only a few commits back, so a short retention keeps every map it can use.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-map
          path: var/coverage/map/map.json
          retention-days: 7
          if-no-files-found: error
      # The same recording holds each test's lines, read for the tests whose
      # lines others cover: a report read now and then, so main's alone.
      - name: Audit the tests
        if: github.ref == 'refs/heads/main'
        run: mise run audit:tests
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-audit
          path: var/audit/tests/report.json
          retention-days: 7
          if-no-files-found: error
