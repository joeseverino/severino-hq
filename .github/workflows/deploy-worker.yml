name: Deploy Worker

# The inbound-events Worker (worker/), deployed to Cloudflare by
# `mise run worker:deploy` once a person approves: on each push to main that
# changes it, or by hand. The Worker is the public verifier in front of HQ,
# so its token lives on an environment of its own whose reviewers hold the
# job, and the job holds nothing else.
#
# The environment's secrets are the token, the account and the hostname. The
# account and the hostname are secrets, though neither grants anything, so
# GitHub masks them in this public repository's run logs. The Worker's own
# secrets are never here: they are set on the Worker once and every deploy
# keeps them (worker:deploy --with-secrets, docs/Security.md).
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "mise-tasks/worker/**"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer one waiting takes the place of an older.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: inbound-worker
    env:
      # node and the npm it carries, which install and run the pinned wrangler.
      MISE_ENABLE_TOOLS: node
      # No package install script runs in a job that holds a secret.
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned mise
        id: mise
        run: echo "version=$(.github/actions/toolchain/mise-version.sh mise.toml)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned node
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          version: ${{ steps.mise.outputs.version }}
          install_args: node
          cache: false
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HQ_INBOUND_HOSTNAME: ${{ secrets.HQ_INBOUND_HOSTNAME }}
        run: mise run worker:deploy
