name: Admit an HQ extension
description: >-
  Build, scan, attest and Sigstore-sign an extension wheel, retain the signed
  admission bundle as a private run artifact, then start the host's composition.

# WHY THIS IS A COMPOSITE ACTION AND NOT A REUSABLE WORKFLOW
# ---------------------------------------------------------
# The host verifies each admission with
#   cosign verify-blob --certificate-identity \
#     "https://github.com/<repo>/<workflow>@refs/heads/main"
# and Fulcio derives that certificate identity from the OIDC `job_workflow_ref`
# claim: the workflow file the *job* actually runs from.
#
# A composite action runs inside the calling job, so `job_workflow_ref` stays
# the caller's own .github/workflows/admit-plugin.yml and the identity is
# unchanged. A `workflow_call` job does not: it would be signed as
# severino-hq/.github/workflows/<whatever>.yml, every extension would share one
# signer identity, and the signature would stop proving which repository built
# the wheel. composition/extensions.json exists to prevent that widening, so
# the signing steps live here, in an action.
#
# Everything that does not sign lives in ../../workflows/plugin-checks.yml.
#
# ONE REPOSITORY IS ONE TRUST DOMAIN
# ----------------------------------
# Several extensions may live in one repository, each its own package, plugin
# and wheel. They share one signer: that repository and its admission
# workflow, so whoever can sign for one can sign for every one beside it. The
# caller admits each package as one leg of a matrix, one run for all of them,
# and each leg retains its own artifact, `admission-<plugin id>`, which is how
# Compose finds it. The run starts the host's composition once: every leg
# passes `dispatch: "false"`, and a final job that needs them all starts it,
# naming this run as `admission-run` exactly as the steps below do, and marks
# the commit as waiting for production.

# The plugin id and distribution are read from the package
# (tools/pipeline/plugin_identity.py), never passed: a caller that repeats them can
# drift from what the wheel declares.
inputs:
  package-dir:
    description: >-
      Directory of the package to admit, relative to the repository root: its
      pyproject.toml, uv.lock and src/ are read from there. The default is a
      repository holding one extension at its root.
    required: false
    default: .
  dispatch:
    description: >-
      Whether this admission starts the host's composition and marks the
      commit as waiting for production. A repository admitting several
      packages passes "false" on every leg and does both once, in a final job
      that needs every leg.
    required: false
    default: "true"
  workflow-path:
    description: >-
      Path of the CALLING workflow file inside the calling repository. This is
      recorded as source.workflow and is half of the signer identity the host
      checks, so it must match the caller's real path and the `workflow` field
      declared for this extension in COMPOSITION_EXTENSIONS. Only override it
      if the caller is not at the default path.
    required: false
    default: .github/workflows/admit-plugin.yml
  app-client-id:
    description: Client ID of HQ's app, the caller's HQ_APP_CLIENT_ID secret.
    required: true
  app-private-key:
    description: >-
      That app's private key: the caller's HQ_APP_KEY secret, on an
      environment limited to main.
      Used once, to mint a token that can only start a workflow in the host
      repository and expires within the hour.
    required: true

runs:
  using: composite
  steps:
    - name: Read where the package is
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
        DISPATCH: ${{ inputs.dispatch }}
      run: |
        set -euo pipefail
        # A path inside the checkout, and nothing a shell or a path could read
        # as more: no absolute path and no parent segment.
        if [[ ! "$PACKAGE_DIR" =~ ^[A-Za-z0-9._/-]+$ || "$PACKAGE_DIR" == /* \
              || "/$PACKAGE_DIR/" == */../* ]]; then
          echo "::error::package-dir must be a relative path inside the repository."
          exit 1
        fi
        case "$DISPATCH" in
          true | false) ;;
          *) echo "::error::dispatch must be true or false."; exit 1 ;;
        esac
        echo "PACKAGE_DIR=${PACKAGE_DIR%/}" >> "$GITHUB_ENV"

    - name: Resolve the host commit this admission is built against
      id: host
      shell: bash
      env:
        HOST_REPOSITORY: ${{ github.action_repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # An admission is built against host main, resolved here to one exact
        # commit so the admission records which. A change that needs an
        # unreleased host lands as coordinated branches, verified together
        # before either merges, never as a pin.
        set -euo pipefail
        resolved="$(gh api "repos/${HOST_REPOSITORY}/commits/main" --jq .sha)"
        if [[ ! "$resolved" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Could not resolve ${HOST_REPOSITORY} main to a commit."
          exit 1
        fi
        echo "Building against ${HOST_REPOSITORY} main at ${resolved}."
        echo "sha=${resolved}" >> "$GITHUB_OUTPUT"
        echo "repository=${HOST_REPOSITORY}" >> "$GITHUB_OUTPUT"
        echo "owner=${HOST_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
        echo "name=${HOST_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

    - name: Check out the plugin
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check out exact HQ source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.host.outputs.repository }}
        ref: ${{ steps.host.outputs.sha }}
        path: host

    - name: Read the extension's identity from its package
      id: identity
      shell: bash
      # -P: the extension's checkout is the working directory, and none of it is imported.
      run: PYTHONPATH=host python3 -P -m tools.pipeline.plugin_identity "$PACKAGE_DIR" --repository "$GITHUB_REPOSITORY" | tee -a "$GITHUB_OUTPUT"

    - name: Read the host's toolchain pins
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        cd host
        . ./tools/pipeline/toolchain.env
        # shellcheck disable=SC2086  # the version list is meant to split
        echo "python=$(printf '%s\n' $PYTHON_VERSIONS | tail -1)" >> "$GITHUB_OUTPUT"
        echo "cordon-commit=$CORDON_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Check out exact Cordon verifier
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: joeseverino/cordon
        ref: ${{ steps.pins.outputs.cordon-commit }}
        path: cordon

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ steps.pins.outputs.python }}

    - uses: ./host/.github/actions/uv
      with:
        host: host

    - name: Build the immutable wheel
      shell: bash
      run: |
        set -euo pipefail
        (cd "$PACKAGE_DIR" && uv lock --check)
        uv build --wheel --out-dir dist "$PACKAGE_DIR"
        test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

    - name: Audit locked dependencies
      uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
      with:
        inputs: ${{ inputs.package-dir }}

    - name: Generate wheel SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: dist
        format: spdx-json
        output-file: wheel.spdx.json
        upload-artifact: false

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Emit and sign admission
      shell: bash
      # Inputs are passed through the environment rather than interpolated into
      # the script, so a manifest value can never become shell syntax.
      env:
        POLICY_PATH: host/policy/plugin-admission-v1.json
        PLUGIN_ID: ${{ steps.identity.outputs.plugin-id }}
        DISTRIBUTION: ${{ steps.identity.outputs.distribution }}
        WORKFLOW_PATH: ${{ inputs.workflow-path }}
        HOST_ID: severino-hq
        # What the checked-out host speaks, which the approval must name.
        PLUGIN_API_VERSION: ${{ steps.identity.outputs.plugin-api-version }}
      run: |
        wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
        version=$(python -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' \
          "$PACKAGE_DIR/pyproject.toml")
        node cordon/admission/evidence.mjs --policy "$POLICY_PATH" > evidence.json
        node cordon/admission/create.mjs \
          --artifact "$wheel" \
          --repository "$GITHUB_REPOSITORY" \
          --commit "$GITHUB_SHA" \
          --workflow "$WORKFLOW_PATH" \
          --plugin-id "$PLUGIN_ID" \
          --plugin-version "$version" \
          --distribution "$DISTRIBUTION" \
          --host "$HOST_ID" \
          --plugin-api-version "$PLUGIN_API_VERSION" \
          --policy "$POLICY_PATH" \
          --checks evidence.json \
          --sbom wheel.spdx.json \
          --dependency-lock "$PACKAGE_DIR/uv.lock" > admission.json
        cosign sign-blob --yes --bundle admission.sigstore.json admission.json

    - name: Retain private provenance
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # Named by plugin id: Compose reads each listed extension's own
        # artifact from its repository's run by this name, so packages
        # admitted in one run never collide.
        name: admission-${{ steps.identity.outputs.plugin-id }}
        path: |
          admission.json
          admission.sigstore.json
          evidence.json
          wheel.spdx.json
          ${{ inputs.package-dir }}/uv.lock
          dist/*.whl
        if-no-files-found: error
        retention-days: 90

    # The admission is retained above, so the composition it starts can read
    # it. Last, so a failed dispatch fails this run where it happened: nothing
    # waits on a schedule to notice. The input names no extension, because the
    # host repository is public and its run list is too.
    - name: Mint a token that can only start the host's composition
      id: dispatch
      if: inputs.dispatch == 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.host.outputs.owner }}
        repositories: ${{ steps.host.outputs.name }}
        permission-actions: write

    - name: Start the host's composition
      if: inputs.dispatch == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.dispatch.outputs.token }}
        HOST_REPOSITORY: ${{ steps.host.outputs.repository }}
      run: |
        set -euo pipefail
        # This run is still finishing, so it is named: Compose composes this
        # repository from it rather than from its last finished admission.
        gh workflow run compose.yml --repo "$HOST_REPOSITORY" --ref main \
          -f reason="extension admitted" -f force=false -f admission-run="$GITHUB_RUN_ID"
        echo "Composition started; its deploy waits for approval in severino-hq."

    # HQ's check on this commit, in this (private) repository: the same check
    # the host's commits carry. HQ's controller marks it live once production
    # runs this commit, and comments once on its merged pull request.
    - name: Mint a token for HQ's check on this commit
      id: report
      if: inputs.dispatch == 'true'
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write

    - name: Say on this commit that production waits for it
      if: inputs.dispatch == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.report.outputs.token }}
        COMPOSE_RUNS: ${{ github.server_url }}/${{ steps.host.outputs.repository }}/actions/workflows/compose.yml
      run: |
        set -euo pipefail
        gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
          -f name="Severino HQ · Production" -f head_sha="$GITHUB_SHA" \
          -f status=queued -f details_url="$COMPOSE_RUNS" \
          -f "output[title]=Waiting for its composition and approval" \
          -f "output[summary]=Admitted and signed. The host is composing it; the deploy waits for approval." >/dev/null
