name: Toolchain
description: >-
  Set up Python and mise: the pinned tools (mise.toml, mise.lock) and the
  runner every gate goes through. The oldest Python the test matrix runs,
  unless a job names its own.

# A step, not a job: every job that needs the toolchain reads the same files
# itself, so a pull request's checks list carries no row that only passes
# values along. A local run reads the same files through `mise run`.
#
# The caches are restored here and written by one job, CI's Caches on main,
# which every branch can read: a job that only restores leaves no entry of its
# own behind. That job saves each cache this action missed: mise's downloads
# here, the rest from the keys and paths below.

inputs:
  python:
    description: The Python version to set up. Blank sets up the oldest the matrix runs.
    required: false
    default: ""
  go:
    description: Restore Go's module and build caches, for a job that builds the controller.
    required: false
    default: "false"
  npm:
    description: Restore npm's downloads, for a job that installs an npm project under tools/.
    required: false
    default: "false"
  save:
    description: Save mise's downloads once it has installed them, when they were not cached. Only the Caches job does.
    required: false
    default: "false"

outputs:
  uv-path:
    value: ${{ steps.caches.outputs.uv-path }}
  uv-key:
    value: ${{ steps.caches.outputs.uv-key }}
  uv-hit:
    value: ${{ steps.uv.outputs.cache-hit }}
  go-path:
    value: ${{ steps.caches.outputs.go-path }}
  go-key:
    value: ${{ steps.caches.outputs.go-key }}
  go-hit:
    value: ${{ steps.go.outputs.cache-hit }}
  npm-path:
    value: ${{ steps.caches.outputs.npm-path }}
  npm-key:
    value: ${{ steps.caches.outputs.npm-key }}
  npm-hit:
    value: ${{ steps.npm.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: read
      shell: bash
      run: |
        set -euo pipefail
        . ./tools/pipeline/toolchain.env
        mise="$("$GITHUB_ACTION_PATH/mise-version.sh" mise.toml)"
        {
          echo "oldest-python=${PYTHON_VERSIONS%% *}"
          echo "mise=$mise"
        } >> "$GITHUB_OUTPUT"

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python || steps.read.outputs.oldest-python }}
    # mise's downloads, never its installed tools: mise checks each download
    # against mise.lock before it installs it, so a cache cannot change what
    # runs. The key is the lock, the one list of what is downloaded. A job that
    # reads the caches falls back to the newest one of an older lock, since
    # every tool verifies what it takes; the job that writes them starts from
    # nothing, so a saved cache never carries what no lock names.
    - id: mise-downloads
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/mise/downloads-cas
        key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
        restore-keys: ${{ inputs.save != 'true' && format('mise-downloads-{0}-{1}-', runner.os, runner.arch) || '' }}
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        version: ${{ steps.read.outputs.mise }}
        cache: false
    - if: inputs.save == 'true' && steps.mise-downloads.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/mise/downloads-cas
        key: ${{ steps.mise-downloads.outputs.cache-primary-key }}

    # What decides each cache: uv's downloads by the Python and uv.lock (uv
    # verifies every artifact against the lock), Go's modules and compiled
    # packages by its release (mise's, from mise.lock) and go.sum, npm's
    # downloads by every npm project's lock under tools/.
    - id: caches
      shell: bash
      env:
        PYTHON: ${{ inputs.python || steps.read.outputs.oldest-python }}
        UV_LOCK: ${{ hashFiles('uv.lock') }}
        GO_SUM: ${{ hashFiles('controller/go.sum') }}
        NPM_LOCK: ${{ hashFiles('tools/*/package-lock.json') }}
        GO: ${{ inputs.go }}
        FALLBACK: ${{ inputs.save != 'true' }}
      run: |
        set -euo pipefail
        # The key a reading job falls back to: the key without its lock's hash.
        fallback() { if [ "$FALLBACK" = true ]; then echo "${1%-*}-"; fi; }
        {
          echo "uv-path=$HOME/.cache/uv"
          echo "uv-key=uv-$RUNNER_OS-$PYTHON-$UV_LOCK"
          echo "uv-fallback=$(fallback "uv-$RUNNER_OS-$PYTHON-$UV_LOCK")"
          echo "npm-path=$HOME/.npm"
          echo "npm-key=npm-$RUNNER_OS-$NPM_LOCK"
          echo "npm-fallback=$(fallback "npm-$RUNNER_OS-$NPM_LOCK")"
          if [ "$GO" = true ]; then
            echo "go-key=go-$RUNNER_OS-$(go env GOVERSION)-$GO_SUM"
            echo "go-fallback=$(fallback "go-$RUNNER_OS-$(go env GOVERSION)-$GO_SUM")"
            echo "go-path<<EOF"
            go env GOMODCACHE GOCACHE
            echo "EOF"
          fi
        } >> "$GITHUB_OUTPUT"
    - id: uv
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caches.outputs.uv-path }}
        key: ${{ steps.caches.outputs.uv-key }}
        restore-keys: ${{ steps.caches.outputs.uv-fallback }}
    - id: go
      if: inputs.go == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caches.outputs.go-path }}
        key: ${{ steps.caches.outputs.go-key }}
        restore-keys: ${{ steps.caches.outputs.go-fallback }}
    - id: npm
      if: inputs.npm == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caches.outputs.npm-path }}
        key: ${{ steps.caches.outputs.npm-key }}
        restore-keys: ${{ steps.caches.outputs.npm-fallback }}
