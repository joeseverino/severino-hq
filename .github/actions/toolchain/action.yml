name: Toolchain
description: >-
  Set up Python and mise: the pinned tools (mise.toml, mise.lock) and the
  runner every gate goes through. The oldest Python the test matrix runs,
  unless a job names its own.

# A step, not a job: every job that needs the toolchain reads the same files
# itself, so a pull request's checks list carries no row that only passes
# values along. A local run reads the same files through `mise run`.

inputs:
  python:
    description: The Python version to set up. Blank sets up the oldest the matrix runs.
    required: false
    default: ""

outputs:
  python-versions:
    description: The test matrix, as a JSON list.
    value: ${{ steps.read.outputs.python-versions }}
  oldest-python:
    description: The oldest version the matrix runs.
    value: ${{ steps.read.outputs.oldest-python }}

runs:
  using: composite
  steps:
    - id: read
      shell: bash
      run: |
        set -euo pipefail
        . ./scripts/toolchain.env
        # shellcheck disable=SC2086  # the version list is meant to split
        versions="$(printf '%s\n' $PYTHON_VERSIONS | jq -Rrc '[.]' | jq -sc 'add')"
        {
          echo "python-versions=$versions"
          # shellcheck disable=SC2086
          echo "oldest-python=$(printf '%s\n' $PYTHON_VERSIONS | head -1)"
          echo "mise=$(sed -n 's/^min_version = "\(.*\)"$/\1/p' mise.toml)"
        } >> "$GITHUB_OUTPUT"
        # Nothing installs that mise.lock does not record. The CodeQL bundle is
        # the local mirror of codeql.yml and age belongs to Compose; neither is
        # a gate of these jobs.
        {
          echo "MISE_LOCKED=1"
          echo "MISE_DISABLE_TOOLS=github:github/codeql-action,age"
        } >> "$GITHUB_ENV"

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python || steps.read.outputs.oldest-python }}
    - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
      with:
        version: ${{ steps.read.outputs.mise }}
        cache_save_post: true
    # uv verifies every artifact against uv.lock; the cache only saves the download.
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ inputs.python || steps.read.outputs.oldest-python }}-${{ hashFiles('uv.lock') }}
