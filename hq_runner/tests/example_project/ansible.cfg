# What a project's own configuration could do were it read: enable callbacks
# of its own, one from a collection it keeps beside itself, and look for
# roles somewhere else. The worker never reads it. ansible-runner names the
# callback path itself, which outranks callback_plugins here; nothing names
# the collections path but this.
[defaults]
callback_plugins = ./callback_plugins
callbacks_enabled = example_loud, example.smoke.loud
collections_path = ./collections
roles_path = ./elsewhere
