# The type checker over HQ's architectural seams: the security, capability,
# plugin, resource and integration-spec contracts, the provider vocabulary,
# registry and provider modules, the controller's handler registry, the plugin
# SDK, and the two machine adapters. Run as `python -m mypy` (scripts/ci-local.sh, CI's lint job).
#
# Widening it: add a module to `files` and to the strict section below, run
# `python -m mypy`, and fix what it reports. Code outside `files` is still read
# for the types it exports (follow_imports = silent) but its own errors are not
# reported until it is added.
[mypy]
python_version = 3.12
files =
    application/security.py,
    application/integration_specs.py,
    application/plugins.py,
    application/capabilities.py,
    application/resources.py,
    application/sensitivity.py,
    control_plane/connection_kinds.py,
    control_plane/credential_reads.py,
    control_plane/names.py,
    control_plane/provider_adapters/cloudflare.py,
    control_plane/provider_adapters/declarations.py,
    control_plane/provider_adapters/portainer.py,
    control_plane/provider_adapters/tailscale.py,
    control_plane/provider_adapters/tls.py,
    control_plane/provider_spec.py,
    control_plane/providers.py,
    controller_runtime/commands.py,
    controller_runtime/connection_env.py,
    controller_runtime/handlers.py,
    hq_sdk,
    hq_api,
    hq_mcp
# Tests and migrations are not seams.
exclude = (^|/)(tests\.py|test_[^/]*\.py|migrations/)
follow_imports = silent
plugins = mypy_django_plugin.main
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
check_untyped_defs = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool

[mypy.plugins.django-stubs]
django_settings_module = config.settings_typecheck

# Strict: every function in a seam states its types.
[mypy-application.security,application.integration_specs,application.plugins,application.capabilities,application.resources,application.sensitivity,control_plane.connection_kinds,control_plane.credential_reads,control_plane.names,control_plane.provider_adapters.cloudflare,control_plane.provider_adapters.declarations,control_plane.provider_adapters.portainer,control_plane.provider_adapters.tailscale,control_plane.provider_adapters.tls,control_plane.provider_spec,control_plane.providers,controller_runtime.commands,controller_runtime.connection_env,controller_runtime.handlers,hq_sdk.*,hq_api.*,hq_mcp.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
disallow_any_generics = True
warn_return_any = True
