# The type checker over HQ's architectural seams: the security, capability,
# plugin, resource and integration-spec contracts, the plugin SDK, and the two
# machine adapters. Run as `python -m mypy` (scripts/ci-local.sh, CI's lint job).
#
# Widening it: add a module to `files` and to the strict section below, run
# `python -m mypy`, and fix what it reports. Code outside `files` is still read
# for the types it exports (follow_imports = silent) but its own errors are not
# reported until it is added.
[mypy]
python_version = 3.12
files =
    application/security.py,
    application/integration_specs.py,
    application/plugins.py,
    application/capabilities.py,
    application/resources.py,
    hq_sdk,
    hq_api,
    hq_mcp
# Tests and migrations are not seams.
exclude = (^|/)(tests\.py|test_[^/]*\.py|migrations/)
follow_imports = silent
plugins = mypy_django_plugin.main
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
strict_equality = True
check_untyped_defs = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool

[mypy.plugins.django-stubs]
django_settings_module = config.settings_typecheck

# Strict: every function in a seam states its types.
[mypy-application.security,application.integration_specs,application.plugins,application.capabilities,application.resources,hq_sdk.*,hq_api.*,hq_mcp.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
disallow_any_generics = True
warn_return_any = True
