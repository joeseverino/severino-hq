# Severino HQ: homelab Docker Compose.
#
# Uses host networking so the MCP boundary receives the real socket peer
# instead of Docker's bridge gateway address. Nginx Proxy Manager reaches the
# browser UI at <host-LAN-IP>:8000; MCP clients connect directly to the host's
# Tailscale IP on the same port.
#
# Volumes:
#   data/    SQLite DB
#   media/   Uploaded receipt files (private: never publicly exposed)
#   exports/ Generated exports
#   static/  Collected static files
#
# No env_file: production secrets come from the 1Password-rendered file the
# entrypoint sources (see docs/SECRETS.md). The on-host .env holds
# only non-secret compose interpolation values (the two *_FILE_HOST paths).
#
# The image runs as UID/GID 10001. `chown -R 10001:10001` the host bind
# mounts before first boot (or use docker volumes, as below, and let the
# container manage permissions).

services:
  app:
    build: .
    # Local dev builds severino-hq:latest. CI/CD overrides this to the GHCR
    # image (SEVERINO_IMAGE=ghcr.io/joeseverino/severino-hq:sha-…) so the
    # homelab `docker compose pull && up -d --no-build` deploys the exact,
    # already-tested-and-scanned artifact instead of rebuilding on the box.
    image: ${SEVERINO_IMAGE:-severino-hq:latest}
    container_name: severino-hq
    network_mode: host
    restart: unless-stopped
    # The process already runs as an unprivileged user and binds a high port,
    # so it needs no Linux capabilities and no way to acquire more. Both are
    # free here: nothing in the image asks for either, so dropping them changes
    # what an exploited process could reach without changing what HQ can do.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Nothing HQ does at runtime writes to the image. State lives in the four
    # volumes below and the doorbell directory; migrations and collectstatic
    # write into those. A read-only root means an exploited process cannot
    # leave anything behind for the next boot to run: the difference between
    # an incident and a persistent one. The controller is a separate
    # `docker run` from the same image and is unaffected by this.
    read_only: true
    # /tmp exists for anything that names it. noexec/nosuid because a
    # temporary file here has no business being either.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    # A runaway request loop should degrade HQ, not the DNS server and the
    # reverse proxy sharing this VM.
    pids_limit: 512
    # The same argument as pids_limit, for the other resource a runaway request
    # exhausts first. Generous for what HQ does; small enough that the VM keeps
    # answering DNS while HQ is having a bad time.
    mem_limit: 1g
    environment:
      # Inside the container we always use these paths; the .env file may
      # override them for non-container deploys.
      SEVERINO_DATABASE_PATH: /data/severino.sqlite3
      # Python's tempfile default, on disk. A request body is spooled here
      # whole and a file upload is written here again, so an upload of N bytes
      # needs 2N of temporary space, which a RAM-backed /tmp both caps and
      # charges to mem_limit. /data is already writable and executable to this
      # process, so this adds no location an exploited process lacked. The
      # entrypoint empties it on boot.
      TMPDIR: /data/tmp
      SEVERINO_MEDIA_ROOT: /media
      SEVERINO_EXPORTS_ROOT: /exports
      DJANGO_STATIC_ROOT: /static
      # Provider HTTPS keeps normal public roots and adds the homelab CA.
      HQ_CONTROLLER_CA_FILE: /run/secrets/severino_controller_ca.pem
      # A file HQ replaces when it queues controller work. It carries nothing
      # (not what to do, not who asked) so the host may watch it and start the
      # controller without HQ gaining any way to reach out.
      SEVERINO_CONTROLLER_DOORBELL: /run/severino-hq/controller-doorbell
      # The same, for an image or digest a sweep found that HQ has not read.
      SEVERINO_REGISTRY_DOORBELL: /run/severino-hq/registry-doorbell
      # The Unix socket HQ serves the controller's bridge on: the contract
      # in controller/api, answered by the process that is already running, so
      # a controller call starts nothing. Not a network listener, and not
      # reachable through the one above: the directory is the volume below,
      # which only this account can enter, and each connection's peer is
      # checked. The launcher reads this path from the container and mounts
      # the same volume, read-only, into the controller's.
      SEVERINO_BRIDGE_SOCKET: /run/hq-bridge/bridge.sock
    volumes:
      - severino_data:/data
      - severino_media:/media
      - severino_exports:/exports
      - severino_static:/static
      # The bridge socket's directory. A volume, so it exists before the
      # container does on every boot, and takes its owner and 0700 mode from
      # the image's directory the first time it is mounted. It holds the
      # socket and nothing else.
      - severino_bridge:/run/hq-bridge
      # Somewhere both sides can see. `/run` is transient by design, which is
      # right for a doorbell: a stale one after a reboot would ring for work
      # that was claimed before it.
      - type: bind
        source: ${SEVERINO_CONTROLLER_RUN_DIR:-/run/severino-hq}
        target: /run/severino-hq
      # Production app env, rendered from 1Password by hq-secrets.
      # The entrypoint sources it when present; /dev/null keeps local dev on
      # plain shell/compose env without a real secrets mount.
      - type: bind
        source: ${SEVERINO_APP_ENV_FILE_HOST:-/dev/null}
        target: /run/secrets/severino_hq_env
        read_only: true
      - type: bind
        source: ${SEVERINO_CONTROLLER_CA_FILE_HOST:-/dev/null}
        target: /run/secrets/severino_controller_ca.pem
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  severino_data:
  severino_media:
  severino_exports:
  severino_static:
  severino_bridge:
