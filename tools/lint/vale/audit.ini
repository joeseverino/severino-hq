# Vale measures how easily HQ's docs read (mise run audit:docs-readability).
# Each Readability rule reports a number on every block it scopes, so the
# audit reads the numbers from Vale's JSON and fails nothing:
#
#   Grade      the document's Flesch-Kincaid grade level
#   Words      the document's words
#   Paragraph  each paragraph's words
#   ListItem   each list item's words, a paragraph of its own to a reader
#   Sentence   each sentence's words
#
# Code is ignored, so a command or an identifier counts as no words. This
# config is apart from .vale.ini, whose MinAlertLevel = error would drop every
# suggestion these rules make.
StylesPath = audit
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Readability
