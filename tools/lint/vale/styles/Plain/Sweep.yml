extends: substitution
message: "Say '%s' in place of '%s', HQ's own word"
level: error
ignorecase: true
nonword: true
scope: [shown, ~comment & ~code]
swap:
  '(?<![\w-])sweeps(?![\w-])': reads
  '(?<![\w-])swept(?![\w-])': read
  '(?<![\w-])sweeping(?![\w-])': reading
  '(?<![\w-])sweep(?![\w-])': read
