extends: substitution
message: "Say '%s' in place of '%s', HQ's own word"
level: error
ignorecase: true
nonword: true
scope: [shown, ~comment & ~code]
swap:
  '(?<![\w-])mints(?![\w-])': issues
  '(?<![\w-])minted(?![\w-])': issued
  '(?<![\w-])minting(?![\w-])': issuing
  '(?<![\w-])mint(?![\w-])': issue
