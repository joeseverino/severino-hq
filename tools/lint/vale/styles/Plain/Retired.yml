# Labels replaced by one name for one thing, matched as written. An absence
# is said in tone.Absent's words, which the absent filter takes.
extends: substitution
message: "Say '%s', the one name for it, in place of '%s'"
level: error
ignorecase: false
nonword: true
scope: [shown, ~comment & ~code]
swap:
  Action items: Needs you
  Command Center: Search
  Command center: Search
  Request fresh sweep: Refresh
  Read now and check again: Refresh
  Check again: Refresh
  Read now: Refresh
  Read them now: Refresh them
  Read all now: Refresh all
  Read everything now: Refresh all
  Refresh now: Refresh
  Reading…: Refreshing…
  Reading failed: Refresh failed
  Refresh controller readings: Refresh
  Run updates now: Update dependencies
  Run dependency updates now: Update dependencies
  Run the controller: Start the controller
  Run a pass now: Start it
  Apply HQ's settings: Apply HQ's config
  Apply again: Apply HQ's config
  Restore HQ's version: Apply HQ's config
  Request renewal: Renew certificate
  Open the deploy: Open deploy
  Sync the vault: Update docs
  Sync documentation: Update docs
  Topology: Map
  topology: map
  Not configured: Not set up
  Unchecked: Not checked
  Not managed by HQ: Not managed
  None managed here: Not managed
