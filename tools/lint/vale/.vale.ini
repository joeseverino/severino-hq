# Vale holds HQ's prose to its wording rules (mise run lint:prose).
#
#   HQ     source never narrates how the code came to be (History); what a
#          person reads has no em dash (Dash), no hedged plural (Hedge), no
#          praise (Hype) and no "not X, but Y" (Contrast). Each reads the raw
#          file. British spelling is test_spelling.py's, which reads every
#          text file, configuration included.
#   Plain  what the owner sees never shows HQ's names for its own parts
#          (Parts for the automation's), a retired label, or a setting to
#          type by hand, and holds no sentence past twenty words (Long), no
#          lede narrating the page (Narrate) and no "a person" or "someone"
#          standing back from who acts (Person). A file that still breaks
#          Long, Narrate, Person or Parts is counted in
#          hq/platform/core/prose_baseline.py. Shown is no rule: it lists
#          what Plain reads, for audit:prose-strings.
#
# Plain reads templates and the strings of hq/ that can reach a page. What
# Vale does not read in a template (an attribute, a literal a tag is handed)
# reaches the same rules through hq/platform/core/plain_words.py. Long,
# Narrate and Person also read what an agent or a client's author reads,
# everywhere in hq/: the Python view's description scope and the modules
# below that keep HQ's own nouns.
#
# Vale reads StylesPath from this file's directory, and matches each section's
# glob against a path as it was handed one, so lint:prose runs Vale from the
# repository root with --config naming this file.
StylesPath = styles
MinAlertLevel = error
# <code> is read, so Asked finds a setting's name there, and so is a
# template's language, masked as code below; Plain leaves code out.
IgnoredScopes = tt, kbd
# plain_words reads alt with the other attributes a browser shows.
SkippedScopes = script, style, pre, figure, alt

[formats]
# What plain_words hands Vale: one piece of shown text per paragraph.
shown = md

# A count is never put into a document, a script or a stylesheet.
[*.{md,js,css,go,sh}]
BasedOnStyles = HQ
HQ.Hedge = NO

# The host's messages that reach a page, which styles/config/views/Go.yml names.
[controller/**/*.go if not (.Name matches "_test\\.go$")]
BasedOnStyles = HQ, Plain
HQ.Hedge = NO
View = Go

# The template language is masked. A {% comment %} block is read as an HTML
# comment, which no scope reads wherever it stands, inside a paragraph or a
# link as much as between blocks. Each tag, value and short comment is read as
# code, except inside a start tag, where the HTML parser reads it as attributes
# (an attribute is plain_words' to read). Vale wraps a match in markup
# unescaped: a mask inside a start tag would end the tag early, and a start tag
# masked whole would leave its element open inside the mask, so every later
# block of the file would be read as inline text, a skipped one included.
[*.html]
BasedOnStyles = HQ, Plain
CommentDelimiters = {% comment %}, {% endcomment %}
TokenIgnores = (?<!<[a-zA-Z][^<>]*)(\{%[^<>]*?%\}|(?<![\w"'])\{%.*?%\}|\{\{.*?\}\}|\{#.*?#\})

[*.shown]
BasedOnStyles = HQ, Plain

[*.py]
BasedOnStyles = HQ
View = Python

# A test and the test runner hold a hedged plural as data; a test spells an em
# dash it needs as an escape, "\u2014". Django writes the migrations.
[*.py if .Path matches "(^|/)(tests|migrations)/" || .Name startsWith "test"]
HQ.Hedge = NO

[*.py if .Path matches "(^|/)migrations/"]
HQ.Dash = NO

# Plain reads hq/'s modules for the owner: not tests, migrations or management
# commands, and not a module written for whoever writes the code.
[hq/**/*.py if not (.Path matches "/(tests|migrations|management/commands)/" || .Name matches "^(test|testing\\.py$|bench\\.py$)|_testing\\.py$")]
BasedOnStyles = HQ, Plain
# ast-grep's expiry-worded-by-expiry-words holds every Python string to it.
Plain.Expiry = NO

# Text for a program or the person writing one. The machine API and MCP:
# errors and descriptions a client's author or an agent reads. The controller
# bridge and controller.py: refusals the controller logs or is answered. Model
# validation messages no page shows. Admission, declarations, settings and the
# outbound rule: errors HQ raises while it starts, read by whoever adds one.
# A token's refusals: read by whoever set its client up in the identity provider.
# HQ's own nouns stand there, as the API's, but the automation's parts take
# their one name (Parts), and the rules for every reader (Long, Narrate,
# Person) hold them; their tests are HQ's alone.
[{hq/platform/api/**/*.py,hq/platform/mcp/**/*.py,hq/config/**/*.py,hq/domains/control_plane/bridge_*.py,hq/domains/control_plane/provider_adapters/__init__.py,hq/domains/control_plane/provider_spec.py,hq/domains/control_plane/providers.py,hq/domains/control_plane/observations/contract.py,hq/domains/control_plane/models.py,hq/platform/application/integrations.py,hq/platform/application/plugin_admission.py,hq/platform/core/outbound.py,hq/platform/application/controller.py,hq/platform/application/tokens.py} if not (.Path matches "/tests/")]
BasedOnStyles = HQ
Plain.Long = YES
Plain.Narrate = YES
Plain.Parts = YES
Plain.Person = YES
Plain.Shown = YES

# Where a word stands, as data or for a client's author. The type name stored
# on every past audit row for an agent rule or a record; a new name would split
# that history in two.
[hq/platform/application/capability_policy.py]
Plain.Capability = NO

[hq/domains/control_plane/apps.py]
Plain.Resource = NO

# Linux's own word for a privilege a container can be given, as Docker's
# cap_add spells it.
[hq/platform/application/container_{hardening,standard}.py]
Plain.Capability = NO

# "Your internet provider" is the everyday name for the company that sells the
# connection.
[hq/platform/application/dns_findings.py]
Plain.Provider = NO

# Part of a literal log token the owner is told to search the journal for.
[hq/platform/application/render_status_findings.py]
Plain.Render = NO

# An error for a name that does not exist, and validation messages that list
# the request's own fields, read by whoever wrote the caller, in the API's own
# vocabulary.
[hq/platform/application/capabilities.py]
Plain.Capability = NO

[hq/platform/application/{cadence,infrastructure}.py]
Plain.Kind = NO

[hq/platform/application/{resources,resource_refusals}.py]
Plain.Resource = NO

# The domain page's notice that public DNS changes are off. Turning them on
# is a deploy-time choice HQ has no form for, so the notice names the one
# setting that does it.
[templates/control_plane/zone_detail.html]
Plain.Asked = NO

# The rules' own tests spell out what they refuse.
[hq/platform/core/tests/test_plain_words.py]
BasedOnStyles = NONE
