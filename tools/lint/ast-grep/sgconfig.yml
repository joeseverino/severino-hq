# ast-grep's project for lint:ast-grep: structural rules over every Python
# module in the repository, one file each under rules/, and each rule's cases
# under rule-tests/. A rule's scope is its own files: and ignores:, globs from
# the repository root in which `*` crosses directories. A rule for code HQ
# runs reads hq, hq_sdk and tools less their tests/, test_*.py and
# migrations/; a rule for test code reads tests/, test_*.py, testing.py and
# *_testing.py; a rule with neither reads every module.
ruleDirs:
  - rules
testConfigs:
  - testDir: rule-tests
