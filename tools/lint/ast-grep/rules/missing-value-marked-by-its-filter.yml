# A value filter that writes a figure or a moment (money, measured, seconds,
# bytes, when) draws the mark for a missing value itself, and shows a zero as
# 0, since the mark means no value. An {% if %} around it that draws
# {% empty_value %} otherwise shows the mark for a zero too. Extensions are
# held to it once their own have moved, so the rule reads the host's
# templates alone.
id: missing-value-marked-by-its-filter
language: html
severity: error
message: A value's missing mark drawn around a filter that draws it.
note: Write {{ x|money }} (or measured, seconds, bytes, when) alone, and {{ x|or_empty }} for any other value.
files:
  - "templates/**/*.html"
rule:
  kind: text
  regex: '\{%\s*if\s+[\w.]+\s*%\}\s*\{\{\s*[\w.]+\|(?:money|measured|seconds|bytes|when)\b[^}]*\}\}\s*\{%\s*else\s*%\}\s*\{%\s*empty_value\s*%\}'
