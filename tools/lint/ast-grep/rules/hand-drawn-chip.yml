# A chip is a name a record carries, drawn by the status part with chip=True
# in its own case and in no tone; a choice of the view's state is the switch
# part's chip, which holds its count beside it. So a template writes neither
# the `chip` nor the `scope-chip` class. No fix: the part takes the name.
id: hand-drawn-chip
language: html
severity: error
message: A chip drawn by hand, where the status part draws a name as a chip and the switch part a choice.
note: Write {% status name chip=True %}, or {% switch %}{% choice url=... %}name{% endchoice %}{% endswitch %} for a choice of the view.
files:
  - "**/templates/**/*.html"
ignores:
  - "templates/partials/_switch.html"
rule:
  kind: element
  has:
    any:
      - kind: start_tag
      - kind: self_closing_tag
    has:
      kind: attribute
      regex: '(?:^|\})class=["''](?:[^"'']*[\s}])?(?:scope-)?chip(?:[^\w-]|$)'
