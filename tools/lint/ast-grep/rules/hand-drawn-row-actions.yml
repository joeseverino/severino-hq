# A row's actions are the row actions part, drawn from hq_sdk.pages.PageAction,
# which draws the row's cell, so every row's verbs stand alike. A cell holds
# them by hand when it holds a {% button %} drawn as a button with words: a
# glyph (look="glyph": a row's order, its mark, a link out) is the row's own
# control, and css= draws a control that is not a button. The part itself
# draws the cell. No fix: the part reads the row's declared actions.
id: hand-drawn-row-actions
language: html
severity: error
message: A row's actions drawn by hand, where the row actions part draws them.
note: Write {% row_actions actions %} from hq_sdk.pages.PageAction, which draws the row's cell.
files:
  - "**/templates/**/*.html"
ignores:
  - "**/templates/partials/_row_actions.html"
rule:
  kind: element
  all:
    - has:
        kind: start_tag
        has:
          kind: tag_name
          regex: ^td$
    - has:
        stopBy: end
        kind: text
        regex: '\{%\s*button\b'
        not:
          regex: '\{%\s*button\b[^%]*\b(css=|look="([^"]*\s)?glyph[\s"])'
