# HQ reads an ISO instant or day through hq/platform/application/moments
# (moment, stamp_day), which agree on a trailing Z, a naive stamp, Go's zero
# day and what answers None; a datetime.fromisoformat or date.fromisoformat of
# its own is a parser that answers those its own way. The docs importer keeps
# one on purpose, since a bad date there is an error to raise rather than None.
# Test modules are left out (their names start with test), and the tests'
# helper modules are held.
id: instant-parsed-by-moment
language: python
severity: error
message: An ISO instant or day is parsed outside moments.
note: Parse through hq.platform.application.moments.moment or stamp_day, or tools/pipeline/ci_timings.when outside the app.
ignores:
  - "**/test_*.py"
  - "**/testing.py"
  - "**/migrations/**"
  - "hq/platform/application/moments.py"
  - "hq/domains/docs_index/importer.py"
rule:
  any:
    - pattern: datetime.fromisoformat
    - pattern: date.fromisoformat
