# Words in the muted voice are drawn by {% muted %} (value_tags.muted_frame),
# the one way a host page says a line or a paragraph quietly, so its markup
# has one owner. A class="muted" written by hand is a second way. An
# extension cannot write the class (it is not in
# hq_sdk.template_contract.CLASSES), so the rule reads the host's templates.
id: muted-said-by-muted-tag
language: html
severity: error
message: Muted words drawn by hand, where the muted tag draws them.
note: Write {% muted %}...{% endmuted %}, or {% muted element="p" css="..." %} for a paragraph and the classes of where it stands; a cell or a list item holds the tag.
files:
  - "templates/**/*.html"
rule:
  kind: element
  has:
    any:
      - kind: start_tag
      - kind: self_closing_tag
    has:
      kind: attribute
      regex: '(?:^|\})class=["''](?:[^"'']*[\s}])?muted(?:[^\w-]|$)'
