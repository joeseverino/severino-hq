# Who may use an entry is declared once, on the entry: an MCP tool, view or
# prompt and an API endpoint each declare an access (`requires`), which the
# door refuses every other caller by before anything runs. Past that, a use
# case or catalog that needs more refuses, or says `permitted`, through a
# spec's authorize and permitted_to. An MCP or API adapter that asks a
# permission in its body is a second rule, one the other doors never apply
# and the refusal path never records.
id: adapters-ask-no-permission
language: python
severity: error
message: An MCP or API adapter asks a principal's permission itself.
note: Pass the principal to the application function that reads or acts, and let it refuse; a catalog's `permitted` comes from the describe_* function given the principal.
files:
  - "hq/platform/mcp/**"
  - "hq/platform/api/**"
ignores:
  - "**/tests/**"
  - "**/test_*.py"
  - "**/migrations/**"
rule:
  kind: call
  has:
    field: function
    any:
      - kind: attribute
        has:
          field: attribute
          regex: ^(require|permits|authorize|permitted_to)$
