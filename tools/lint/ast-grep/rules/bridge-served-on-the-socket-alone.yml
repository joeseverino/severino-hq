# The controller bridge answers on the private Unix socket only, which the
# host's controller alone reaches; served by any other listener it would
# answer the network. So each bridge application (the controller's and the
# automation worker's), imported by its own name, is handed to
# unix_server.serving, or paired with its socket's setting for the loop that
# hands it there, and to nothing else; no string names its module for a server
# to import.
id: bridge-served-on-the-socket-alone
language: python
severity: error
message: A bridge application is reached other than by handing it to the Unix listener.
note: Serve it with `unix_server.serving(bridge_application, settings.SEVERINO_BRIDGE_SOCKET)` (hq/config/asgi.py).
files:
  - "hq/**"
ignores:
  - "**/tests/**"
  - "hq/domains/control_plane/bridge_application.py"
rule:
  any:
    - kind: string_content
      regex: \bbridge_application\b
    - kind: identifier
      regex: ^(worker_)?bridge_application$
      not:
        any:
          - inside:
              kind: import_from_statement
              stopBy: end
              has:
                stopBy: end
                kind: aliased_import
                has: {field: alias, regex: ^(worker_)?bridge_application$}
          - nthChild: 1
            inside:
              kind: tuple
              has:
                kind: attribute
                regex: ^settings\.SEVERINO_[A-Z_]*BRIDGE_SOCKET$
          - nthChild: 1
            inside:
              kind: argument_list
              inside:
                kind: call
                has: {field: function, regex: ^unix_server\.serving$}
