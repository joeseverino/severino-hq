# The contact inbox reads the controller's stored reading and queues a change
# for the controller, which alone holds the credential that reaches the
# provider. A token, secret, password or key setting named in the inbox's
# code is a credential the web process would hold.
id: contacts-read-no-credential-setting
language: python
severity: error
message: The contacts code names a credential setting.
note: Read the controller's reading and queue the change for the controller, which holds the credential.
files:
  - "hq/domains/contacts/**"
  - "hq/platform/application/contact_submissions.py"
ignores:
  - "**/tests/**"
rule:
  kind: string_content
  regex: (?i)_(TOKEN|SECRET|PASSWORD|API_KEY)$
