# A state drawn as a pill from Python is `status_pill` (status_tags.py), the
# same pill `{% status %}` draws, so its words are sentence case and its tone
# is named once. Markup spelling the pill's class by hand bypasses both.
id: status-pill-built-by-status-pill
language: python
severity: error
message: Python builds a status pill's markup by hand.
note: Call status_pill(label, tone=...) from hq.platform.core.templatetags.status_tags.
files:
  - "hq/**"
  - "hq_sdk/**"
ignores:
  - "**/tests/**"
  - "**/test*.py"
  - "**/*_tests.py"
  # A part's catalog example is a template, drawing the part inside the page
  # markup around it; no page receives it.
  - "hq/platform/core/part_examples/**"
  # A shape's examples are template source it refuses or keeps; no page
  # receives them.
  - "hq/platform/core/hand_drawn.py"
  # A file rule's cases are template source it refuses or passes; no page
  # receives them.
  - "hq/platform/application/file_rules.py"
rule:
  kind: string
  regex: class=\\?["']pill(\s|\\?["'])
