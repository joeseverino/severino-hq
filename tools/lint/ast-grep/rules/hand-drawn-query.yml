# An address gets its query from {% with_query %}, the template form of
# with_query (hq/platform/application/url_query.py), which joins the query
# the address already holds and encodes every value. One built by hand, by
# |add:"?..." or written after the {% url %} or {{ value }} that holds the
# address, leaves a value unencoded or puts a second "?" where one already
# stands. A link to the page itself (href="?all=1") adds to no address, so
# it stays. No fix: the values become the tag's.
id: hand-drawn-query
language: html
severity: error
message: A query added to an address by hand, where the with_query tag adds and encodes it.
note: Write {% with_query url name=value as named_url %} and link named_url, or {% with_query url name=value %} where the address stands.
files:
  - "**/templates/**/*.html"
rule:
  any:
    - kind: text
    - kind: attribute_value
  regex: '\|add:\s*["''][?&]|(?:\}\}|%\})(?:\?|&(?:amp;)?)[\w.-]+='
