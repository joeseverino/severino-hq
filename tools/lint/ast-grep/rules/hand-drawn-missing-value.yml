# A value that is not there is drawn as the one missing mark, by the tag or
# filter that draws the value: {{ x|or_empty }} for a plain value, a value
# filter (money, measured, seconds, bytes, when) for a figure or a moment,
# and {% present x %}...{% endpresent %} for a value shown in markup. Each
# tests what is missing as ui.no_value does, so a zero or a False shows. An
# {% if %} that draws {% empty_value %} in its other branch is a second
# test, and marks a zero as missing. The rule reads the branch that draws the
# mark, either way round, across lines.
id: hand-drawn-missing-value
language: html
severity: error
message: A missing value's mark drawn by an if, where the value's own tag or filter draws it.
note: Write {{ x|or_empty }} for a plain value, {{ x|money }} (or measured, seconds, bytes, when) alone for a figure or a moment, and {% present x %}...{% endpresent %} for a value shown in markup.
files:
  - "**/templates/**/*.html"
rule:
  kind: text
  any:
    - regex: '\{%\s*else\s*%\}\s*\{%\s*empty_value\s*%\}\s*\{%\s*endif\s*%\}'
    - regex: '\{%\s*if\s[^%]*%\}\s*\{%\s*empty_value\s*%\}\s*\{%\s*(?:else|elif)\s'
