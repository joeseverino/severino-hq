# A filter bar is the filter bar part, which draws its search, its count and
# its clear link alike on every list, and folds its choices where its row has
# no room; a choice of one is the select part. So a template writes neither
# the bar's class, a search field (the bar's search=) nor a select ({% select %}).
# The palette's combobox and the map's find, which send nothing, are parts of
# their own. No fix: the part takes what is filtered.
id: hand-drawn-filter-bar
language: html
severity: error
message: A filter bar, search field or select drawn by hand, where the filter bar and select parts draw it.
note: Write {% filter_bar search="..." query=q filtered=... clear=... %}{% choices %}{% select ... %}{% summary %}count{% endfilter_bar %}.
files:
  - "**/templates/**/*.html"
ignores:
  - "templates/partials/_filter_bar.html"
  - "templates/partials/_select.html"
  - "templates/partials/_command_center.html"
  - "templates/partials/_topology_map.html"
rule:
  kind: element
  has:
    all:
      - any:
          - kind: start_tag
          - kind: self_closing_tag
      - any:
          - has:
              kind: attribute
              regex: '(?:^|\})class=["''](?:[^"'']*[\s}])?filter-bar(?:[^\w-]|$)'
          - has:
              kind: tag_name
              regex: '^select$'
          - all:
              - has:
                  kind: tag_name
                  regex: '^input$'
              - has:
                  kind: attribute
                  regex: '^type=["'']?search\b'
