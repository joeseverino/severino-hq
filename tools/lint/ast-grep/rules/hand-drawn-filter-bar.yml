# A filter bar is the filter bar part, which draws its controls, its count and
# its clear link alike on every list, and folds its choices where its row has
# no room. A query form of a page's own that holds a choice (a GET form with a
# select) is that bar by another class. No fix: the part takes what is
# filtered.
id: hand-drawn-filter-bar
language: html
severity: error
message: A filter bar drawn by hand, where the filter bar part draws it.
note: Write {% filter_bar filtered=... clear=... %}search{% choices %}controls{% summary %}count{% endfilter_bar %}.
files:
  - "**/templates/**/*.html"
rule:
  kind: element
  any:
    - has:
        any:
          - kind: start_tag
          - kind: self_closing_tag
        has:
          kind: attribute
          regex: '(?:^|\})class=["''](?:[^"'']*[\s}])?filter-bar(?:[^\w-]|$)'
    - all:
        - has:
            kind: start_tag
            all:
              - has:
                  kind: tag_name
                  regex: '^form$'
              - has:
                  kind: attribute
                  regex: '^method=["'']?get\b'
        - has:
            kind: element
            stopBy: end
            has:
              kind: start_tag
              has:
                kind: tag_name
                regex: '^select$'
