# door_of_its_own (hq/platform/core/attribution.py) binds an operation as the
# outermost, whatever is bound around it. Only own_operation, for a record
# whose rows are its requester's wherever it runs (a job), and the example
# estate's doors, each bound as its real one binds it, open one; anything else would write
# rows outside the operation that reached it.
id: door-opened-by-runner-or-estate
language: python
severity: error
message: A door of its own is opened outside own_operation and the example estate's doors.
note: Bind the record with own_operation (hq.platform.core.attribution), or run the work as a job.
files:
  - "hq/**"
  - "hq_sdk/**"
ignores:
  - "**/tests/**"
  - "hq/platform/core/attribution.py"
  - "hq/platform/core/example_estate/doors.py"
rule:
  kind: call
  has:
    field: function
    any:
      - kind: identifier
        regex: ^door_of_its_own$
      - kind: attribute
        has:
          field: attribute
          regex: ^door_of_its_own$
