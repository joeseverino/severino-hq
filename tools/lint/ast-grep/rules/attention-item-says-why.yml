# Every item the queue shows says why it is as urgent as it is, in plain
# words: the panel behind its urgency leads with its why. A host rule's
# finding is worded from its evidence and its rule's bars
# (attention.finding_why); a Finding from hq_sdk.plugin is worded by no host
# rule, so one built with no why=, and no ** that could carry one, falls back
# to its title and is a problem a stranger cannot read. The plugin check runs
# it over an extension's src/ as well.
id: attention-item-says-why
language: python
severity: error
message: An attention item is built without saying why it is this urgent.
note: Give it why=, one sentence on what HQ read and what makes that this urgent (finding_model.Finding.why).
files:
  - "hq/**"
  - "demo/**"
  - "tools/**"
  - "src/**"
ignores:
  - "**/tests/**"
  - "**/test*.py"
  - "**/migrations/**"
rule:
  kind: call
  has:
    field: function
    regex: (^|\.)Finding$
  inside:
    stopBy: end
    kind: module
    has:
      kind: import_from_statement
      all:
        - has:
            field: module_name
            regex: ^hq_sdk\.plugin$
        - has:
            field: name
            regex: ^Finding$
  not:
    has:
      field: arguments
      any:
        - has:
            kind: dictionary_splat
        - has:
            kind: keyword_argument
            has:
              field: name
              regex: ^why$
