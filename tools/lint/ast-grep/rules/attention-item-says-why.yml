# Every item the queue shows says why it is as urgent as it is, in plain
# words: the panel behind its urgency leads with its why, and an item without
# one opens on its key alone. An Insight, or a Finding from hq_sdk.plugin
# (which no host rule words, so it says its own), built with no why=, and no
# ** that could carry one, is a problem a stranger cannot read. The plugin
# check runs it over an extension's src/ as well. A mail policy's stages are
# cards on a domain's page, never queued, so they carry none.
id: attention-item-says-why
language: python
severity: error
message: An attention item is built without saying why it is this urgent.
note: Give it why=, one sentence on what HQ read and what makes that this urgent (card_items.Insight.why, finding_model.Finding.why).
files:
  - "hq/**"
  - "demo/**"
  - "tools/**"
  - "src/**"
ignores:
  - "**/tests/**"
  - "**/test*.py"
  - "**/migrations/**"
  - "hq/platform/application/mail_policy.py"
utils:
  sdk-finding:
    all:
      - has:
          field: function
          regex: (^|\.)Finding$
      - inside:
          stopBy: end
          kind: module
          has:
            kind: import_from_statement
            all:
              - has:
                  field: module_name
                  regex: ^hq_sdk\.plugin$
              - has:
                  field: name
                  regex: ^Finding$
rule:
  kind: call
  any:
    - has:
        field: function
        regex: (^|\.)Insight$
    - matches: sdk-finding
  not:
    has:
      field: arguments
      any:
        - has:
            kind: dictionary_splat
        - has:
            kind: keyword_argument
            has:
              field: name
              regex: ^why$
