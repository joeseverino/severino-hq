# A list is the list part, so every one of a kind keeps the same markers,
# gaps and dots. A list with no class of its own is one, and so is one that
# writes a kind's class by hand. The switch and the relation list style the
# list they draw from the part around it. No fix: the part takes its items as
# the page writes them.
id: hand-drawn-list
language: html
severity: error
message: A list drawn by hand, where the list part draws it.
note: Write {% list kind="down|dots|prose|chips|codes|labeled" %}<li>...</li>{% endlist %}; numbered=True on prose for items read in order.
files:
  - "**/templates/**/*.html"
ignores:
  - "templates/partials/_list.html"
  - "templates/partials/_switch.html"
  - "templates/partials/_relation_list.html"
rule:
  kind: element
  has:
    kind: start_tag
    all:
      - has:
          kind: tag_name
          regex: '^(?:ul|ol)$'
      - any:
          - not:
              has:
                kind: attribute
                has:
                  kind: attribute_name
                  regex: '^class$'
          - has:
              kind: attribute
              all:
                - has:
                    kind: attribute_name
                    regex: '^class$'
                - has:
                    kind: quoted_attribute_value
                    regex: '(?:^|[\s"])(?:stack-list|dot-list|prose-list|link-chips|code-list|address-list)(?:[\s"]|$)'
