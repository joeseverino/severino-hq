# Steps are the steps part, which numbers the ones done in order and draws
# each step's icon or number alike on every page; a decision card's steps are
# that card's own part. So a template writes neither the `step-list` nor the
# `resolution-workflow` class. No fix: the part takes the steps.
id: hand-drawn-steps
language: html
severity: error
message: A list of steps drawn by hand, where the steps part draws it.
note: Write {% steps numbered=True %}{% step %}<strong>Install it</strong>...{% endstep %}{% endsteps %}.
files:
  - "**/templates/**/*.html"
ignores:
  - "templates/partials/_steps.html"
  - "templates/partials/_resolution_workflow.html"
rule:
  kind: element
  has:
    any:
      - kind: start_tag
      - kind: self_closing_tag
    has:
      kind: attribute
      regex: '(?:^|\})class=["''](?:[^"'']*[\s}])?(?:step-list|resolution-workflow)(?:[^\w-]|$)'
