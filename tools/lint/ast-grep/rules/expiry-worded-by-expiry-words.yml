# HQ says when something runs out one way, from moments.py's expiry_words. A
# phrase built by hand carries its own sign test, and one that forgets it says
# "expires in -4 days" of a certificate that already lapsed.
id: expiry-worded-by-expiry-words
language: python
severity: error
message: An expiry is worded outside moments.expiry_words.
note: Say it with expiry_words(when) from hq.platform.application.moments, which takes the moment or the days left.
files:
  - "hq/**"
  - "hq_sdk/**"
ignores:
  - "**/tests/**"
  - "**/migrations/**"
  - "**/test_*.py"
  - "**/moments.py"
# A docstring may quote the phrase it documents.
rule:
  kind: string
  regex: (?i)\bexpires (in|today)\b|\bexpired\b.*\bago\b
  not:
    inside:
      kind: expression_statement
