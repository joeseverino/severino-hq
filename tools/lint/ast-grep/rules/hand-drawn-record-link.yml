# The address a record lives at is its model's alone (get_absolute_url), and
# the entity tag names it: so a link to a record's page never spells the
# record's route and key in a {% url %}, nor writes the model's address into
# an href by hand. A download is a file of the record, never its page. No fix:
# the tag takes the record and the words the link shows.
id: hand-drawn-record-link
language: html
severity: error
message: A link to a record's page drawn by hand, where the entity tag names the record by the page its model declares.
note: Write {% entity row|record label=row.name %}, or row|record:"section" for a part of its page.
files:
  - "**/templates/**/*.html"
ignores:
  # A message of the contact form is a row the site's store holds, not a
  # model of HQ's, so its page has no model to declare it.
  - "templates/contacts/contact_list.html"
rule:
  kind: element
  has:
    kind: start_tag
    all:
      - has:
          kind: tag_name
          regex: (?i)^a$
      # Read on the start tag whole: a route quoted as its href is quoted
      # ends the href in the parse.
      - regex: '(?i)(?:^|[\s}])href=["'']?(?:[^"''>]*\{%\s*url\s+["''][^"'']+["'']\s+[^%\s]|\{\{\s*[\w.]+\.get_absolute_url\b)'
      - not:
          regex: '(?i)(?:^|[\s}])href=["'']?[^"''>]*\{%\s*url\s+["''][^"'']*(?:download|:file)["'']'
