# tools/ is development and CI code the image does not ship, so nothing
# outside it imports it. This is a rule rather than a Ruff ban, since the
# nested Ruff config tools/ would need replaces the root's banned-api whole
# and so would copy every other ban; pyproject.toml stays the one list.
id: tools-imported-only-by-tools
language: python
severity: error
message: Code outside tools/ imports tools, which the image does not ship.
note: Move what both use under hq, as tools/README.md says.
ignores:
  - "tools/**"
rule:
  any:
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^tools(\.|$)
    - kind: import_statement
      has:
        field: name
        regex: ^tools(\.|$)
