id: hand-drawn-stretched-shape
valid:
  - '<svg viewBox="0 0 10 10" preserveAspectRatio="none"><line class="chart-dot" x1="5" y1="5" x2="5" y2="5"></line><rect x="0" width="2" height="10"></rect></svg>'
  - '<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="2"></circle><text x="1" y="9">A</text></svg>'
  - '<svg class="chart-labels" aria-hidden="true"><text x="50%" y="100%">Jan 1</text></svg>'
invalid:
  - '<svg viewBox="0 0 10 10" preserveAspectRatio="none"><circle cx="5" cy="5" r="2"></circle></svg>'
  - '<svg preserveAspectRatio="none"><g><ellipse cx="5" cy="5" rx="2" ry="1"/></g></svg>'
  - |
    <svg class="line-chart"
         preserveAspectRatio="none">{% for mark in marks %}<text x="{{ mark.x }}" y="8">{{ mark.label }}</text>{% endfor %}</svg>
