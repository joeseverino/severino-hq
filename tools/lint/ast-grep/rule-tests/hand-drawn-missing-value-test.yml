id: hand-drawn-missing-value
valid:
  - '<td>{{ row.total_cost|money }}</td>'
  - '<td>{{ row.note|or_empty }}</td>'
  - '<td>{% present rule.line %}line {{ rule.line|breakable }}{% endpresent %}</td>'
  - '<td>{% if row.stale %}<strong>Out of date</strong>{% else %}{{ row.label|breakable }}{% endif %}</td>'
  - '<td>{% if not row.read %}{% muted %}not read{% endmuted %}{% else %}{{ row.count }}{% endif %}</td>'
  - '<td>{% for name in names %}{{ name }}{% empty %}{% empty_value %}{% endfor %}</td>'
  - "<span data-rtt>{% empty_value %}</span>"
invalid:
  - '<td>{% if row.total_cost %}{{ row.total_cost|money }}{% else %}{% empty_value %}{% endif %}</td>'
  - '<td>{% if job.last_run %}{{ job.last_run|when:"ago" }}{% else %}{% empty_value %}{% endif %}</td>'
  - '<td>{% if row.duration %}{{ row.duration|seconds }}{% else %}{% empty_value %}{% endif %}</td>'
  - '<td>{% if rule.line %}line {{ rule.line|breakable }}{% else %}{% empty_value %}{% endif %}</td>'
  - '<td>{% if service.project %}{% entity service.project.link %}{% else %}{% empty_value %}{% endif %}</td>'
  - '<td>{% if note.slug %}<code>{{ note.slug }}</code>{% else %}{% empty_value %}{% endif %}</td>'
  - '<td>{% if hop.name %}{{ hop.name }}{% elif hop.detail %}{{ hop.detail }}{% else %}{% empty_value %}{% endif %}</td>'
  - "<td>\n  {% if signal.evidence %}\n    {% status signal.label %}\n  {% else %}\n    {% empty_value %}\n  {% endif %}\n</td>"
  - '<td>{% if not job.runs %}{% empty_value %}{% else %}{{ job.runs }}{% endif %}</td>'
  - '<td>{% if not job.runs %}{% empty_value %}{% elif job.runs_unit %}<code>{{ job.runs }}</code>{% endif %}</td>'
  - '<td>{% if row.balance is None %}{% empty_value %}{% else %}{% status row.balance_text %}{% endif %}</td>'
