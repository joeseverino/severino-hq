id: hand-drawn-record-link
valid:
  - '{% entity row|record label=row.name %}'
  - '<strong>{% entity row|record:"updates" label=row.name %}</strong>'
  - '<a href="{% url ''projects:list'' %}">Projects</a>'
  - '<a class="subtle-link" href="{% url ''core:audit_list'' %}?about={{ resource.key|urlencode }}">Audit log</a>'
  - '<a href="{% url ''control_plane:report_download'' resource.key %}">Download JSON</a>'
  - '<a href="{% url ''receipts:file'' receipt.pk %}">receipt.pdf</a>'
  - '<img src="{% url ''avatar'' avatar %}" alt="">'
  - '<a href="{{ row.url }}">example</a>'
invalid:
  - '<a href="{% url ''control_plane:detail'' resource.key %}">example</a>'
  - '<a href="{% url ''control_plane:machine'' machine.name %}">example-host</a>'
  - '<a href="{% url ''control_plane:service'' service.hostname %}">example.com</a>'
  - '<a href="{% url ''zones:detail'' zone.zone %}">example.com</a>'
  - '<a href="{% url ''projects:detail'' project.slug %}">example-app</a>'
  - '<a href="{% url "example:widget-detail" row.doc_id %}">Example widget</a>'
  - '<a class="row-less" href="{% url ''example:detail'' row.pk %}#size">Correct the size</a>'
  - '<a href="{{ row.get_absolute_url }}"><strong>{{ row.label|breakable }}</strong></a>'
  - '<a href="{{ row.get_absolute_url }}#updates">2 open updates</a>'
  - "<a\n  href=\"{% url 'projects:detail'\n    project.slug %}\">example-app</a>"
  - '<A HREF="{{ row.get_absolute_url }}">example</A>'
  - '<a {% if on %}href="{% url ''projects:detail'' project.slug %}"{% endif %}>example-app</a>'
