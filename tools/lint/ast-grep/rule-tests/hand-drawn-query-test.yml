id: hand-drawn-query
valid:
  - '{% with_query audit_url awaiting=1 as held_url %}{% fact "Held" value=n url=held_url %}'
  - '<a href="{% with_query create_url kind=kind hostname=service.hostname %}">Add</a>'
  - '<a href="?all=1#every-action">Show the defaults</a>'
  - '{% status "HQ has none for" service.hostname|add:"." tone="neutral" %}'
  - '<p>Is it ready? {{ name }}</p>'
invalid:
  - '{% fact "Held" value=n url=audit_url|add:"?awaiting=1" %}'
  - "{% section \"Runs\" more_url=list_url|add:'?kind=running' %}"
  - '{% button "Test" url|add:"?source="|add:source|add:"&target="|add:target %}'
  - '<a href="{% url ''reports:expenses_csv'' %}?year={{ year }}">CSV</a>'
  - '<a href="{{ base }}&amp;page={{ n }}">Next</a>'
