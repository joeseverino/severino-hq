id: hand-drawn-run-state
snapshots:
  "<span class=\"job-state\" data-ask-label>{{ job.seen_state_display }}</span>":
    labels:
    - source: class="job-state"
      style: primary
      start: 6
      end: 23
  <span class="muted job-state">Running</span>:
    labels:
    - source: class="muted job-state"
      style: primary
      start: 6
      end: 29
  "<span>Started {% status \"Running\" tone=\"attention\" %}</span>":
    labels:
    - source: Started {% status "Running" tone="attention" %}
      style: primary
      start: 6
      end: 53
  "<span>{% if failed %}Refresh failed{% endif %}</span>":
    labels:
    - source: "{% if failed %}Refresh failed{% endif %}"
      style: primary
      start: 6
      end: 46
  "<strong data-ask-label>{{ job.seen_state_display }}</strong>":
    labels:
    - source: data-ask-label
      style: primary
      start: 8
      end: 22
