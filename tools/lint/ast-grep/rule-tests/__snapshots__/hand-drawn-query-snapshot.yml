id: hand-drawn-query
snapshots:
  "<a href=\"{% url 'reports:expenses_csv' %}?year={{ year }}\">CSV</a>":
    labels:
    - source: "{% url 'reports:expenses_csv' %}?year={{ year }}"
      style: primary
      start: 9
      end: 57
  "<a href=\"{{ base }}&amp;page={{ n }}\">Next</a>":
    labels:
    - source: "{{ base }}&amp;page={{ n }}"
      style: primary
      start: 9
      end: 36
