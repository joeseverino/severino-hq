    - source: <div class="notice"><p>A</p><p>B</p></div>
      style: primary
      start: 0
      end: 42
    - source: class="notice"
      style: secondary
      start: 5
      end: 19
    - source: <div class="notice">
      style: secondary
      start: 0
      end: 20
  <p class="notice">Sign in again.</p>:
    fixed: "{% notice %}Sign in again.{% endnotice %}"
