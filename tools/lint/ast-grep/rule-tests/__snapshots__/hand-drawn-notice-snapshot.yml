    fixed: <div class="notice notice-attention" role="status">A</div>
    labels:
    - source: <div class="notice notice-attention" role="status">A</div>
      style: primary
      start: 0
      end: 58
    - source: class="notice notice-attention"
      style: secondary
      start: 5
      end: 36
    - source: <div class="notice notice-attention" role="status">
      style: secondary
      start: 0
      end: 51
  <div class="notice"><p>A</p><p>B</p></div>:
    fixed: "{% notice %}<p>A</p><p>B</p>{% endnotice %}"
