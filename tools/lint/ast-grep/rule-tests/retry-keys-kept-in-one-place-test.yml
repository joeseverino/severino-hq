id: retry-keys-kept-in-one-place
valid:
  - 'from hq.platform.application.capabilities import run_capability'
  - |
    answer, replayed = run_capability(name, payload, principal=principal, idempotency_key=key)
  - 'patched = "hq.platform.application.idempotency.execute_once"'
  - 'declare(api_version=PLUGIN_API_VERSION)'
invalid:
  - 'from hq.platform.application.idempotency import execute_once'
  - 'lazy from hq.platform.application.idempotency import execute_once, request_fingerprint'
  - |
    result, replayed = execute_once(actor=actor, key=key, request_sha256=digest, operation=run)
  - 'request_fingerprint(name, envelope, api_version=2)'
  - 'idempotency.execute_once(actor=actor, key=key, request_sha256=digest, operation=run)'
