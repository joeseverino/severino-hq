id: hand-drawn-dot-list
valid:
  - '{% dot_list %}<li>A</li><li>B</li>{% enddot_list %}'
  - '{% dot_list muted=True %}<li>A</li>{% enddot_list %}'
  - '<ul class="dot-list-wide"></ul>'
  - '{% line_list names as name list="dot-list" %}<li>{{ name }}</li>{% endline_list %}'
  - '{% comment %}A run is a dot list, as css="dot-list" would draw it.{% endcomment %}'
invalid:
  - '<ul class="dot-list"><li>A</li></ul>'
  - '<ul class="page-title-meta dot-list"></ul>'
  - |
    <ul
      data-example
      class="row-meta dot-list">
      <li>A</li>
    </ul>
  - '<ul class="{% if quiet %}muted {% endif %}dot-list"></ul>'
  - '<th>{% muted element="ul" css="dot-list" %}<li>A</li>{% endmuted %}</th>'
  - '<td>{% include "example.html" with css="row-more dot-list" %}</td>'
