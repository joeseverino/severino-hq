id: hand-drawn-field
valid:
  - '{{ form }}'
  - '{{ field.as_field_group }}'
  - '{% button_row %}{% button "Back" url %}{% endbutton_row %}'
  - '<p class="help field-effect">Restarts it.</p>'
  - '<span class="form-actions-note">Saved.</span>'
  - '<div class="fields">x</div>'
invalid:
  - '<div class="field"><label for="x">X</label><input id="x"></div>'
  - '<p class="form-actions"><a href="/">Back</a></p>'
  - '<div class="form-actions save-bar">x</div>'
  - '<div class="field{% if field.errors %} has-errors{% endif %}">x</div>'
  - |
    <div
      class="compact field">x</div>
  - '<div class="wide {% if bar %}form-actions{% endif %}">x</div>'
