id: hand-drawn-row-actions
valid:
  - '<tr><td>{% row_actions actions %}</td></tr>'
  - '<tr><td>{% button "Move up" offer=press look="glyph" %}</td></tr>'
  - '<tr><td>{% button link.label link.url look="ghost glyph" icon="network" %}</td></tr>'
  - '<tr><td>{% button "Pin" offer=press css="example-pin" %}</td></tr>'
  - '<tr><td><a class="subtle-link" href="/a/">A</a></td></tr>'
invalid:
  - '<tr><td>{% button "A" offer=press %}</td></tr>'
  - '<tr><td class="row-actions">{% if a %}{% button "B" "/" %}{% endif %}</td></tr>'
  - '<tr><td>{% button "A" offer=press look="danger" %}</td></tr>'
  - '<tr><td>{% button "A" offer=press look="glyphs" %}</td></tr>'
