# Advisories that do not apply to the lint tools, each with its evidence and
# an expiry, after which the audit fails again and the evidence is read anew.

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
effectiveUntil = 2027-01-17
reason = "A ReDoS in picomatch's extglob parsing, with no patched release (4.0.7, the latest, is affected). picomatch is reached only through stylelint, run by lint:css on the one glob mise-tasks/lint.toml writes (static/css/**/*.css) and on HQ's own file names, so no pattern it parses comes from outside the repository."
