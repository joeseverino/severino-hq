# mypy's second pass, over every source module of hq and hq_sdk: code the
# types already rule out (a branch that never runs, a test that is always true
# or always false, an isinstance the declaration settles) is an error. Every
# body is checked, annotated or not, and nothing demands an annotation; the
# strict seams stay pyproject.toml's.
[tool.mypy]
files = ["hq", "hq_sdk"]
exclude = "(^|/)(tests/|tests\\.py|test_[^/]*\\.py|migrations/)"
follow_imports = "silent"
# The seams pass's plugin; a path here is read from this file's directory.
plugins = ["mypy_django.py", "mypy_sentence.py"]
# Its own cache: per-module options differ from the seams pass, and a shared
# cache would be rebuilt by each pass in turn.
cache_dir = ".mypy_cache/reach"
check_untyped_defs = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["redundant-expr", "truthy-bool"]
# What an unannotated module still fails on its own types. This pass is about
# reach alone; those codes are the seams pass's, module by module as each is
# held there.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "call-overload",
    "dict-item",
    "func-returns-value",
    "has-type",
    "import-untyped",
    "index",
    "list-item",
    "misc",
    "no-redef",
    "operator",
    "override",
    "return-value",
    "type-var",
    "union-attr",
    "valid-type",
    "var-annotated",
]

[tool.django-stubs]
django_settings_module = "hq.config.settings_typecheck"

# The modules that name Sentence: mypy holds each value one returns or binds to
# be a sentence (mypy_sentence.py, which refuses a module left off this list).
[[tool.mypy.overrides]]
module = [
    "hq.domains.control_plane.provider_spec",
    "hq.domains.control_plane.providers",
    "hq.domains.projects.views",
    "hq.platform.application.adoption",
    "hq.platform.application.app_update_approval",
    "hq.platform.application.asks",
    "hq.platform.application.cadence",
    "hq.platform.application.forms",
    "hq.platform.application.labels",
    "hq.platform.application.moments",
    "hq.platform.application.record_errors",
    "hq.platform.application.record_saves",
    "hq.platform.application.resource_operations",
    "hq.platform.application.resource_refusals",
]
enable_error_code = ["return-value", "assignment"]
