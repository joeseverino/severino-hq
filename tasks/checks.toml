# The Checks job: every checks:* gate here and under mise-tasks/checks/, and the
# drift:* gates (tasks/drift.toml).

["checks:ruff"]
description = "Ruff lints the Python and holds it to its format"
hide = true
run = ["uv run ruff check .", "uv run ruff format --check ."]

["checks:mypy"]
description = "mypy type-checks the seams pyproject.toml names"
hide = true
# django-stubs loads the host's settings.
extends = "django"
run = "uv run python -m mypy"

["checks:openapi"]
description = "Both OpenAPI descriptions pass specification lint"
hide = true
depends = ["setup:lint-tools"]
# Specification rules cover wire contracts. HTTP style recommendations do not
# apply to Django's canonical trailing slashes or the stdin/stdout bridge.
run = "redocly lint --extends=spec --format=summary hq/platform/api/hq-api.openapi.json controller/api/hq-controller.openapi.json controller/api/hq-connections.openapi.json"

["checks:deptry"]
description = "Host code imports only declared runtime dependencies and imports every one, or pyproject.toml says why not"
hide = true
# Host code is these two packages less their tests/ ([tool.deptry]).
run = "uv run deptry hq hq_sdk"

["checks:lockfile"]
description = "uv.lock matches pyproject.toml"
hide = true
run = "uv lock --check"

["checks:toolchain"]
description = "mise.lock checksums every pinned tool for each gate platform, mise's Go is go.mod's, no image borrows a build tool"
hide = true
run = "uv run python -m tools.pipeline.toolchain_lock"

["checks:mise-tasks"]
description = "Every task is valid: its usage spec parses, its dependencies exist, its timeout and globs are well formed"
hide = true
run = "mise tasks validate"

["checks:workflows"]
description = "The workflows are valid, run: blocks included, and pass zizmor's security audit"
hide = true
# zizmor runs offline, with no token, at its default persona; a deliberate
# finding is suppressed in .github/zizmor.yml with its reason.
run = ["actionlint -color", "zizmor --offline --strict-collection .github"]

["checks:source"]
description = "Run the tests tagged source, which read the repository rather than the running product"
# Tagged "source"; a whole-suite run leaves them out (hq/platform/core/test_runner.py),
# so no image or composed pass runs them. The stylesheet lint's tests run Stylelint.
extends = "django-heavy"
depends = ["setup:lint-tools"]
usage = 'arg "[labels]..." var=#true help="Test labels, dotted; only their tagged tests run. Every one by default"'
run = "uv run python manage.py test --tag source --noinput --parallel auto ${usage_labels:-}"

["checks:deploycheck"]
description = "Production settings raise no security warning"
hide = true
# DEBUG off, a real host. The values mirror a production configuration so the
# check judges how settings.py reads one. The key is a throwaway long enough
# for the strength check.
extends = "django"
env = { DJANGO_DEBUG = "0", DJANGO_SECRET_KEY = "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef", DJANGO_ALLOWED_HOSTS = "hq.example.com", SEVERINO_OIDC_ISSUER = "https://sso.example.com", DJANGO_BEHIND_TLS_PROXY = "1", DJANGO_SESSION_COOKIE_SECURE = "1", DJANGO_CSRF_COOKIE_SECURE = "1", DJANGO_HSTS_SECONDS = "31536000" }
run = "uv run python manage.py check --deploy --fail-level WARNING"

["checks:structural"]
description = "No new near-duplicate pair outside tests"
hide = true
usage = 'flag "--record" help="Rewrite the baseline from this tree instead of checking it"'
run = "uv run python -m tools.structural.bar"

["checks:css"]
description = "Stylelint holds the stylesheets to their contract: color and sizes from tokens, every custom property defined"
hide = true
depends = ["setup:lint-tools"]
run = "stylelint --config tools/lint/stylelint.config.mjs 'static/css/**/*.css'"
