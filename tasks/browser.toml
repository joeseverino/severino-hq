# The Browser job: each browser:* gate is one leg of it, the classes split for
# balance. A new browser test class is named in one of them
# (test_browser_gate_tasks). Layout's sweeps are classes of their own so one
# leg runs them side by side: Django gives a parallel worker a whole class.

["browser:demo"]
description = "Build the demo and check it in WebKit"
hide = true
depends = [{ task = "setup:browser", args = ["webkit"] }, "demo:build"]
extends = "heavy"
run = "uv run --group browser python -m unittest demo.check -v"

["browser:layout"]
description = "Real-browser layout invariants over the stress estate"
hide = true
depends = [{ task = "setup:browser", args = ["webkit"] }]
extends = "django-heavy"
usage = 'flag "--fallback-face" help="Draw every page in the system face, as a reader sees it before Inter loads"'
run = "HQ_BROWSER_FACE=${usage_fallback_face:+fallback} uv run --group browser python manage.py test hq.platform.core.tests.browser.sweeps.ScriptedSparseLayoutTests hq.platform.core.tests.browser.sweeps.ScriptedDenseLayoutTests hq.platform.core.tests.browser.components.ComponentLayoutTests hq.platform.core.tests.browser.sweeps.SettledSparseLayoutTests hq.platform.core.tests.browser.sweeps.UnscriptedSparseLayoutTests hq.platform.core.tests.browser.sweeps.SettledDenseLayoutTests hq.platform.core.tests.browser.sweeps.UnscriptedDenseLayoutTests hq.platform.core.tests.browser.sweeps.LongestValueLayoutTests hq.platform.core.tests.browser.page_errors.PageErrorBrowserTests --noinput --parallel auto"

# The layout gate in Chromium, so a break WebKit happens not to show still
# fails. CI runs it as a leg of its own; `mise run browser` leaves it out, since
# HQ is read in Safari. It runs browser:layout, so the two name one set of
# classes, and installs Chromium as a step rather than as a dependency, which
# a skipped task would still run.
["browser:layout-chromium"]
description = "browser:layout in Chromium: a CI leg, which mise run browser leaves out"
hide = true
env = { HQ_BROWSER_ENGINE = "chromium" }
run = [
  { task = "setup:browser", args = [
    "chromium",
  ] },
  "mise run --skip-deps browser:layout",
]

["browser:navigation"]
description = "Real-browser invariants over the example estate, the frame around a page and its fragments"
hide = true
depends = [{ task = "setup:browser", args = ["webkit"] }]
extends = "django-heavy"
usage = 'flag "--fallback-face" help="Draw every page in the system face, as a reader sees it before Inter loads"'
run = "HQ_BROWSER_FACE=${usage_fallback_face:+fallback} uv run --group browser python manage.py test hq.platform.core.tests.browser.estate.ExampleEstateBrowserTests hq.platform.core.tests.browser.estate.ExampleEstateDrawnTests hq.platform.core.tests.browser.estate.ExampleEstateControlTests hq.platform.core.tests.browser.reference.ReferenceBrowserTests hq.platform.core.tests.browser.fragments.FragmentBrowserTests --noinput --parallel auto"
