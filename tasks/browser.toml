# The Browser job: each browser:* gate is one leg of it, the classes split for
# balance. A new browser test class is named in one of them
# (test_browser_gate_tasks). Layout's sweeps are classes of their own so one
# leg runs them side by side: Django gives a parallel worker a whole class.

["browser:demo"]
description = "Build the demo and check it in WebKit"
depends = ["setup:webkit", "demo:build"]
extends = "heavy"
run = "uv run --group browser python -m unittest demo.check -v"

["browser:layout"]
description = "Real-browser layout invariants over the stress estate"
depends = ["setup:webkit"]
extends = "django-heavy"
usage = 'flag "--fallback-face" help="Withhold Inter, so every page is drawn in the next face of the font stack, the system face of the platform, as a reader whose Inter came late sees it, and a layout that holds only at the widths of Inter fails"'
run = "HQ_BROWSER_FACE=${usage_fallback_face:+fallback} uv run --group browser python manage.py test hq.platform.core.browser_tests.ScriptedSparseLayoutTests hq.platform.core.browser_tests.ScriptedDenseLayoutTests hq.platform.core.browser_tests.ComponentLayoutTests hq.platform.core.browser_tests.SettledSparseLayoutTests hq.platform.core.browser_tests.UnscriptedSparseLayoutTests hq.platform.core.browser_tests.SettledDenseLayoutTests hq.platform.core.browser_tests.UnscriptedDenseLayoutTests hq.platform.core.browser_tests.LongestValueLayoutTests --noinput --parallel auto"

# The layout gate in Chromium, so a break WebKit happens not to show still
# fails. CI runs it as a leg of its own; `mise run browser` leaves it out, since
# HQ is read in Safari. It runs browser:layout, so the two name one set of
# classes, and installs Chromium in its body rather than as a dependency, which
# a skipped task would still run.
["browser:layout-chromium"]
description = "browser:layout in Chromium: a CI leg, which mise run browser leaves out"
env = { HQ_BROWSER_ENGINE = "chromium" }
run = ["mise run setup:chromium", "mise run --skip-deps browser:layout"]

["browser:navigation"]
description = "Real-browser invariants over the example estate, the frame around a page and its fragments"
depends = ["setup:webkit"]
extends = "django-heavy"
usage = 'flag "--fallback-face" help="Withhold Inter, so every page is drawn in the next face of the font stack, the system face of the platform, as a reader whose Inter came late sees it, and a layout that holds only at the widths of Inter fails"'
run = "HQ_BROWSER_FACE=${usage_fallback_face:+fallback} uv run --group browser python manage.py test hq.platform.core.estate_browser_tests hq.platform.core.browser_tests.ReferenceBrowserTests hq.platform.core.browser_tests.FragmentBrowserTests --noinput --parallel auto"
