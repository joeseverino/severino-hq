# The Tests job: these and the suite under mise-tasks/tests/. Each runs on the
# interpreter UV_PYTHON names; `mise run tests` walks the matrix.

["tests:django"]
description = "Django's system checks"
extends = "django"
run = "uv run python manage.py check"

["tests:plugins"]
description = "The public plugin contract"
extends = "django"
env = { SEVERINO_HQ_PLUGINS = "tests.fixtures.example_hq_plugin.plugin:plugin" }
run = ["uv run python manage.py check", "uv run python manage.py plugins"]

["tests:migrations"]
description = "No model change without its migration"
extends = "django"
run = "uv run python manage.py makemigrations --check --dry-run"

["tests:api-properties"]
description = "Generated API cases through the real WSGI middleware"
extends = "django-heavy"
run = "uv run python manage.py test tests.fuzz.api_properties --noinput --parallel 1"

# Not a gate: the tests a developer names, as the gates run them. Whatever
# follows the labels reaches manage.py test as typed, so a later --parallel or
# -k wins. `--at <ref>` first runs them on the ref with this tree's test files
# laid over it, but the support files `--keep <path>` names (tools/gate/at.py).
# Only the run knows its tests' weight, so tools/gate/at.py takes the heavy
# turn itself, unless they are light; the timeout is the heavy template's.
[test]
description = "manage.py test on the labels named, as the gates run it: mise run test [--at <ref> [--keep <path>]...] <label>..."
extends = "django"
timeout = "30m"
run = "uv run --group browser python -m tools.gate.at"
