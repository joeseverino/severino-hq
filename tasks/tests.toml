# The Tests job: these and the suite under mise-tasks/tests/. Each runs on the
# interpreter UV_PYTHON names; `mise run tests` walks the matrix.

["tests:django"]
description = "Django's system checks"
extends = "django"
run = "uv run python manage.py check"

["tests:plugins"]
description = "The public plugin contract"
extends = "django"
env = { SEVERINO_HQ_PLUGINS = "tests.fixtures.example_hq_plugin.plugin:plugin" }
run = ["uv run python manage.py check", "uv run python manage.py plugins"]

["tests:migrations"]
description = "No model change without its migration"
extends = "django"
run = "uv run python manage.py makemigrations --check --dry-run"

["tests:api-properties"]
description = "Generated API cases through the real WSGI middleware"
extends = "django-heavy"
run = "uv run python manage.py test tests.fuzz.api_properties --noinput --parallel 1"

# Not a gate: the tests a developer names, as the gates run them.
# tools/gate/at.py reads what this usage parsed. Only the run knows its tests'
# weight, so it takes the heavy turn itself, unless they are light; the timeout
# is the heavy template's.
[test]
description = "Run the test labels named, as the gates run them, here or on another commit's code"
extends = "django"
timeout = "30m"
usage = '''
flag "--at <ref>" help="Run this tree's tests on the code at <ref>, to prove a new test fails without the fix (docs/Development.md)"
flag "--keep <path>" var=#true help="With --at, keep this support file as <ref> has it rather than laying this tree's over it; repeatable"
arg "[arguments]..." var=#true double_dash="automatic" help="Test labels, dotted, then any manage.py test options, passed as typed. Every test by default"
'''
run = "uv run --group browser python -m tools.gate.at"
