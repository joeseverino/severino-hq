# hq-host names this file (ANSIBLE_CONFIG), so no ansible.cfg of a working
# directory's is read. Each run's temporary paths are set by hq-host, which
# knows where that run may write (controller/host/setup.go).
[defaults]
# The collections the runner image ships, and nothing on Python's path.
collections_path = /usr/local/share/ansible/collections
collections_scan_sys_path = false
interpreter_python = auto_silent
retry_files_enabled = false
