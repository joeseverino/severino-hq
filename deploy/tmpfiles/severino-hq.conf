# The doorbell directory HQ and the controller share, made at every boot
# before docker starts, owned by the web account, which rings it.
d /run/severino-hq 0755 10001 10001 -
# Where the nightly backup writes its archives.
d /srv/severino-hq/backups 0700 root root -
# The unit socket's directory, the controller's account's alone: only the
# controller's container mounts it, so only a pass reaches root's hq-host unit.
d /run/severino-hq-unit 0700 10001 10001 -
# The automation worker's journal, its account's alone: the one place it
# writes that outlives a crash, so a run it was working is never run twice.
d /var/lib/severino-hq/automation 0700 10001 10001 -
# The registry of hq-host's runs in flight, root's, searchable and not
# listable, so a sandboxed run can register in it (controller/host/runs.go).
d /run/severino-hq-runs 0711 root root -
# The deploy lock, root's alone and mounted nowhere, so no other account can
# swap, plant or hold it. The file is made here because the unit socket's
# service, which takes it shared, sees /run read-only.
d /run/severino-hq-deploy 0700 root root -
f /run/severino-hq-deploy/deploy.lock 0600 root root -
# The renderer's output, root's alone: its units write there and nowhere else.
d /opt/apps/severino-hq/secrets 0700 root root -
