# The doorbell directory HQ and the controller share, made at every boot
# before docker starts, owned by the web account, which rings it.
d /run/severino-hq 0755 10001 10001 -
# Where the nightly backup writes its archives.
d /srv/severino-hq/backups 0700 root root -
# The unit socket's directory, the controller's account's alone: only the
# controller's container mounts it, so only a pass reaches root's hq-host unit.
d /run/severino-hq-unit 0700 10001 10001 -
