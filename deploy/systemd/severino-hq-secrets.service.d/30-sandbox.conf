# Widens severino-hq-.service.d/20-sandbox.conf for the renderer, by what it
# does and nothing wider.
[Service]
# Connect is on IPv4 loopback, in the host's network namespace.
PrivateNetwork=no
RestrictAddressFamilies=AF_INET
IPAddressAllow=127.0.0.1
# It gives the application environment to the web container's account
# (CAP_CHOWN), sets the mode of that account's file (CAP_FOWNER), and rewrites
# in place a 0400 file that account owns (CAP_DAC_OVERRIDE).
CapabilityBoundingSet=CAP_CHOWN CAP_FOWNER CAP_DAC_OVERRIDE
SystemCallFilter=@chown
