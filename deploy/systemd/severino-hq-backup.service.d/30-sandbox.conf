# Widens severino-hq-.service.d/20-sandbox.conf for the backup, which reads
# HQ's volumes as root.
[Service]
# The volumes are the web account's: root reads them, and SQLite writes its
# shared-memory file in the database's directory (CAP_DAC_OVERRIDE). SQLite
# gives each file it makes there to the database's owner (CAP_CHOWN), so one
# a run leaves behind is still HQ's to open.
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE
SystemCallFilter=@chown
