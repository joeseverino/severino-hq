# Widens severino-hq-.service.d/20-sandbox.conf for a dependency run.
[Service]
# nft loads the run's egress table into the host's own ruleset, over netlink
# and in the host's network namespace (CAP_NET_ADMIN).
PrivateNetwork=no
RestrictAddressFamilies=AF_NETLINK
CapabilityBoundingSet=CAP_NET_ADMIN
