# Widens severino-hq-.service.d/20-sandbox.conf for the listener, by what root
# does around its container and nothing wider: its container dials out
# through dockerd's network, never this unit's.
[Service]
# nft loads the listener's egress table into the host's own ruleset, over
# netlink and in the host's network namespace (CAP_NET_ADMIN).
PrivateNetwork=no
RestrictAddressFamilies=AF_NETLINK
# The run directory is given to the listener's account (CAP_CHOWN), and root
# removes it once the listener ends (CAP_DAC_OVERRIDE).
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_NET_ADMIN
SystemCallFilter=@chown
