# Widens severino-hq-.service.d/20-sandbox.conf for the listener, as for a
# glance: its container dials out through dockerd's network, never this
# unit's, which keeps none.
[Service]
# The run directory is given to the listener's account (CAP_CHOWN), and root
# removes it once the listener ends (CAP_DAC_OVERRIDE).
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE
SystemCallFilter=@chown
