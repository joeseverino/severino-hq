# Widens severino-hq-.service.d/20-sandbox.conf for a glance, which takes
# fewer of the controller's readings and none of its network ones.
[Service]
# The run directory is given to the pass's account (CAP_CHOWN), and root
# removes it, and the doorbell in the web account's directory, once the pass
# ends (CAP_DAC_OVERRIDE).
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE
SystemCallFilter=@chown
