# Widens severino-hq-.service.d/20-sandbox.conf for the automation worker, by
# what root does around its container and nothing wider.
[Service]
# nft loads the worker's egress table into the host's own ruleset, over
# netlink and in the host's network namespace (CAP_NET_ADMIN).
PrivateNetwork=no
RestrictAddressFamilies=AF_NETLINK
# The run directory is given to the worker's account (CAP_CHOWN), and root
# keeps its token current in it, removes it once the worker ends, and
# removes the doorbell in the web account's directory (CAP_DAC_OVERRIDE).
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_NET_ADMIN
SystemCallFilter=@chown
