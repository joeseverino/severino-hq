# The sandbox every service whose name begins severino-hq- runs in, by the
# same name rule as 10-on-failure.conf beside it: a unit added here is
# confined without naming it.
#
# A unit that needs more widens this in its own 30-sandbox.conf, which sorts
# after this file and says why. A list setting there adds to the one here (an
# address family, a capability, a system call group), and a plain setting
# replaces it. A unit that cannot run under it at all carries an empty
# 20-sandbox.conf of its own, which replaces this one for it. lint:units holds
# each unit to the exposure systemd-analyze scores it.
#
# Every unit here runs as root to reach docker's or systemd's socket, so its
# root has no capability, may not gain one, and sees only its own processes.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM

ProtectSystem=strict
# docker's CLI reads its configuration under root's home: an empty one is
# its default, where an unreadable one is a warning on every call.
ProtectHome=tmpfs
PrivateTmp=yes
PrivateDevices=yes
PrivateIPC=yes
ProtectProc=invisible
ProcSubset=pid
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes

# Docker's socket, systemd's and the journal's are files, which a private
# network namespace still reaches.
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX
IPAddressDeny=any
SocketBindDeny=any
