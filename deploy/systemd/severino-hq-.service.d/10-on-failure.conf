# Applies to every unit whose name begins severino-hq-: systemd also reads the
# drop-in directories made by truncating a unit's name after each dash
# (systemd.unit(5)), so a unit added here has this without naming it.
#
# A unit that fails asks HQ to read the state of this machine's units now,
# so the failure is a finding at once and not at the next sweep. What it starts
# is scheduled work like any other: one request on the bridge socket, done as a
# job. HQ stores the request and rings the controller's doorbell itself.
#
# Two units carry an empty drop-in of this same name in their own directory,
# which replaces this one for them: the unit this starts, and the controller.
[Unit]
OnFailure=severino-hq-job@units.read.service
