# Applies to every service whose name begins severino-hq-, by the same name
# rule as 10-on-failure.conf beside it.
#
# hq-host tells systemd why a run failed (sd_notify STATUS=), which systemd
# keeps as the unit's StatusText until it next starts, so the controller's
# read of the unit carries the reason with the failure. Only the main
# process, hq-host itself, may say it.
[Service]
NotifyAccess=main
