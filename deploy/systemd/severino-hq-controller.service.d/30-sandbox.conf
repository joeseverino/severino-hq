# Widens severino-hq-.service.d/20-sandbox.conf for a controller pass, by what
# root does around the pass's container and nothing wider.
[Service]
# The firewall reading lists the host's own nftables input chain, over
# netlink and in the host's network namespace (CAP_NET_ADMIN).
PrivateNetwork=no
RestrictAddressFamilies=AF_NETLINK
# The run directory, the certificate state and the sealing key are given to
# the pass's account (CAP_CHOWN), and root reads and removes what that
# account then owns and writes there (CAP_DAC_OVERRIDE).
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_NET_ADMIN
SystemCallFilter=@chown
