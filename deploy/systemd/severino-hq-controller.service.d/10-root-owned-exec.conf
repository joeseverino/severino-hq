# Shipped here and installed by scripts/install-controller.sh on every deploy
# (scripts/fix-root-ownership.sh on a first bring-up). Points a root unit at a
# root-owned copy of the script instead of the user-writable deploy checkout.
[Service]
ExecStart=
ExecStart=/usr/local/lib/severino-hq/scripts/run-controller.sh --apply
WorkingDirectory=/usr/local/lib/severino-hq
ReadOnlyPaths=/usr/local/lib/severino-hq
