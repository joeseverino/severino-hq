# Installed by scripts/fix-root-ownership.sh. Points a root unit at a
# root-owned copy of the script instead of the user-writable deploy
# checkout. Undo with: scripts/fix-root-ownership.sh --remove
[Service]
ExecStart=
ExecStart=/usr/local/lib/severino-hq/scripts/run-controller.sh --apply
WorkingDirectory=/usr/local/lib/severino-hq
ReadOnlyPaths=/usr/local/lib/severino-hq
