# Each derived file against its source, run by the Checks job, by `mise run
# fast` side by side, and by `mise run drift`. `mise run regen` rewrites them
# all.

[regen]
description = "Rewrite every derived file from its source (the API's and the controller's OpenAPI documents, the connection registry, hq_sdk/contract.json, docs/Connections.md, the Go types, the served font); `mise run drift` checks them instead"
# In the order each reads the last: the bridge contract feeds the Go types.
extends = "django-heavy"
run = [
  "uv run python manage.py sdk_contract",
  "uv run python manage.py api_openapi",
  "uv run python manage.py bridge_contract",
  "cd controller && go generate ./...",
  "uv run python manage.py connections_reference",
  "uv run python -m tools.fonts.subset",
]

["drift:sdk-contract"]
description = "hq_sdk's committed shape, text examples and docs/Plugins.md table are what the SDK offers"
hide = true
extends = "django"
run = "uv run python manage.py sdk_contract --check"

["drift:api-document"]
description = "The machine API's OpenAPI document is current"
hide = true
extends = "django"
run = "uv run python manage.py api_openapi --check"

["drift:bridge-contract"]
description = "The controller's contracts are the ones the registry derives"
hide = true
extends = "django"
run = "uv run python manage.py bridge_contract --check"

["drift:connections-reference"]
description = "docs/Connections.md is what the providers declare"
hide = true
extends = "django"
run = "uv run python manage.py connections_reference --check"

["drift:font"]
description = "The served font is its source cut to the characters HQ prints and the features its stylesheets use"
hide = true
run = "uv run python -m tools.fonts.subset --check"
