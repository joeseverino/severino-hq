# The Test job: these and the suite under mise-tasks/test/. Each Python gate
# runs on the interpreter UV_PYTHON names; `mise run test` walks the matrix and
# runs test:controller once beside it.

["test:plugins"]
description = "The public plugin contract"
hide = true
extends = "django"
env = { SEVERINO_HQ_PLUGINS = "tests.fixtures.example_hq_plugin.plugin:plugin" }
run = ["uv run python manage.py check", "uv run python manage.py plugins"]

# The check every extension's CI runs (plugin-checks.yml), on a package of the
# host's own, so a host change that breaks it fails here rather than in each
# extension once it reaches main.
["test:plugin-check"]
description = "The extension check on a packaged example extension, as an extension's CI runs it"
hide = true
run = "tools/pipeline/check-plugin.sh --plugin-root examples/extension"

["test:migrations"]
description = "No model change without its migration"
hide = true
tags = ["fast"]
sources = [
  "hq/**/*.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
extends = "django"
run = "uv run python manage.py makemigrations --check --dry-run"

["test:api-properties"]
description = "Generated API cases through the real WSGI middleware"
hide = true
# One module in one process: a narrow run, outside the heavy turn (tools/gate/turn.py).
extends = "django"
run = "uv run --group fuzz python manage.py test tests.fuzz.api_properties --noinput --parallel 1"

# Go does not vary with Python, so `mise run test` runs it once, outside the
# interpreter loop. gotestsum renders go test's JSON events as text, and writes
# them to the file GOTESTSUM_JSONFILE names, which `test --at --go` reads.
["test:controller"]
description = "The Go controller's tests under the race detector"
hide = true
extends = "heavy"
run = "gotestsum --format standard-quiet --raw-command -- go -C controller test -json -race ./..."
