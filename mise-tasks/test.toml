# The Test job: these and the suite under mise-tasks/test/. Each Python gate
# runs on the interpreter UV_PYTHON names; `mise run test` walks the matrix and
# runs test:controller once beside it.

["test:plugins"]
description = "The public plugin contract"
hide = true
extends = "django"
env = { SEVERINO_HQ_PLUGINS = "tests.fixtures.example_hq_plugin.plugin:plugin" }
run = ["uv run python manage.py check", "uv run python manage.py plugins"]

# The check every extension's CI runs (plugin-checks.yml), on a package of the
# host's own, so a host change that breaks it fails here rather than in each
# extension once it reaches main.
["test:plugin-check"]
description = "The extension check on a packaged example extension, as an extension's CI runs it"
hide = true
run = "tools/pipeline/check-plugin.sh --plugin-root examples/extension"

["test:migrations"]
description = "No model change without its migration"
hide = true
tags = ["fast"]
sources = [
  "hq/**/*.py",
  "manage.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
extends = "django"
run = "uv run python manage.py makemigrations --check --dry-run"

["test:api-properties"]
description = "Generated API cases through the real WSGI middleware"
hide = true
# Its modules in one process, outside the heavy turn and its shares, which fast
# still runs in the turn it holds for its tests (tools/gate/fast.py, HEAVY).
tags = ["fast", "heavy"]
# What its run reads, as a log of the files its processes open finds it: the
# whole of hq and hq_sdk, which Django loads to answer, its own modules, and the
# two data files the settings and the bridge open. The committed document is
# what the served one is held to (lint:drift-api-document), so it selects the
# suite too. No served answer runs a test module, so an edit there selects none
# but the token helper the suite signs its requests with.
sources = [
  "hq/**/*.py",
  "hq_sdk/**/*.py",
  "!hq/**/tests/**",
  "!hq_sdk/**/tests/**",
  "hq/platform/api/tests/tokens.py",
  "hq/domains/control_plane/bridge_base.json",
  "deploy/systemd/severino-hq-secrets.timer",
  "hq/platform/api/hq-api.openapi.json",
  "manage.py",
  "tests/__init__.py",
  "tests/fuzz/**",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
extends = "django"
run = "uv run --group fuzz python manage.py test tests.fuzz.api_properties tests.fuzz.api_links --noinput --parallel 1"

# Go does not vary with Python, so `mise run test` runs it once, outside the
# interpreter loop. gotestsum renders go test's JSON events as text, and writes
# them to the file GOTESTSUM_JSONFILE names, which `test --at --go` reads.
["test:controller"]
description = "The Go controller's tests under the race detector"
hide = true
extends = "heavy"
# A quick gate too: fast runs it when its sources moved, beside its tests in
# the heavy turn it holds for them (tools/gate/fast.py, heavy_gates).
tags = ["fast"]
# What the Go tests read, which tools/pipeline/legs.py and fast match a change
# against, so the Test job and fast leave them out when none moved: the
# controller, the units and host files under deploy/ its host checks hold to,
# the three files of elsewhere its tests open, and the bridge's hand-written
# messages, from which its contract and Go types are generated.
sources = [
  "controller/**/*",
  "hq/domains/control_plane/bridge_base.json",
  "deploy/**/*",
  "hq/config/controller-connections.json",
  "Dockerfile",
  ".github/renovate.json",
  ".github/workflows/ci.yml",
  ".github/actions/toolchain/**/*",
  "tools/lib/**/*",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
run = "gotestsum --format standard-quiet --raw-command -- go -C controller test -json -race ./..."
