# Read-only measurements (`mise run audit:<name>`), safe to hand to a tool or
# an agent that may only read: each writes nothing tracked (audit:memory
# measures on a throwaway database and keeps its run in the gitignored
# var/perf/), and takes values through `usage` alone, never passed-through
# arguments, so no flag can turn a read into a write. One whose body is more than a line is a file under
# mise-tasks/audit/. test_audit_tasks.py holds every audit: task to that.

["audit:imports"]
description = "The files that import the one given, string imports included, read-only"
hide = true
usage = 'arg "<path>" help="A Python file in the repository"'
run = '''uv run ruff analyze graph --direction dependents --detect-string-imports . | jq --arg path "${usage_path}" '.[$path]' '''

# Each run read by tools/pipeline/ci_timings.py, the module refusing any word that is not a
# run id, so the unquoted list can reach gh as nothing but ids.
["audit:ci-timings"]
description = "Where each CI run's time went: each job's and step's seconds, how long after its last step each job was marked done, and the critical path, read-only"
hide = true
usage = 'arg "<runs>" var=#true help="Run ids, as gh run list prints them (41175916328 41175858296)"'
run = 'uv run python -m tools.pipeline.ci_timings ${usage_runs}'

# tools/audit_image.py refuses any image word that is not a reference, so none
# reaches docker as a flag; it saves the image under var/audit/image/ and
# removes the archive once read.
["audit:image"]
description = "A built image's layers, each one's size, instruction and the parts of HQ its bytes hold, what a container sees by part, site-packages' largest, and dive's wasted bytes, read-only"
hide = true
extends = "heavy"
depends_post = ["image:docker stop"]
usage = 'arg "[image]" default="severino-hq:ci-local" help="The image, as docker names it; image:build tags the host image severino-hq:ci-local"'
run = 'mise run image:docker start && uv run python -m tools.audit_image "${usage_image}"'

["audit:go"]
description = "golangci-lint's findings in the Go controller counted per linter, read-only"
hide = true
dir = "controller"
usage = 'arg "[linters]" help="Linters to count, comma-separated, as --enable-only takes them (nilerr,gocritic); the configured set without"'
run = '''golangci-lint run --issues-exit-code=0 --output.text.path=/dev/null ${usage_linters:+--enable-only="${usage_linters}"} ./...'''
