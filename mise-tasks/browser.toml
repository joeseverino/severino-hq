# The Browser job: each browser:* gate is one leg of it, the classes split for
# balance. A new browser test class is named in one of them
# (test_browser_gate_tasks). Layout's sweeps are classes of their own so one
# leg runs them side by side: Django gives a parallel worker a whole class.

["browser:demo"]
description = "Build the demo and check it in WebKit"
hide = true
depends = [{ task = "setup:browser", args = ["webkit"] }, "demo:build"]
extends = "heavy"
run = "uv run --group browser python -m unittest demo.check -v"

# The layout invariants over the stress estate, in two legs that CI runs side
# by side, the classes split so each leg holds about half their time in CI,
# in WebKit and in Chromium.
["browser:layout-1"]
description = "Real-browser layout invariants over the stress estate, leg 1 of 2"
hide = true
extends = "django-browser"
vars.classes = """\
  hq.platform.core.tests.browser.sweeps.ScriptedSparseLayoutTests \
  hq.platform.core.tests.browser.components.ComponentLayoutTests \
  hq.platform.core.tests.browser.sweeps.LongestValueLayoutTests \
  hq.platform.core.tests.browser.sweeps.UnscriptedDenseLayoutTests"""

["browser:layout-2"]
description = "Real-browser layout invariants over the stress estate, leg 2 of 2"
hide = true
extends = "django-browser"
vars.classes = """\
  hq.platform.core.tests.browser.sweeps.ScriptedDenseFirstLayoutTests \
  hq.platform.core.tests.browser.sweeps.ScriptedDenseSecondLayoutTests \
  hq.platform.core.tests.browser.sweeps.UnscriptedSparseLayoutTests \
  hq.platform.core.tests.browser.sweeps.SettledDenseLayoutTests \
  hq.platform.core.tests.browser.sweeps.SettledSparseLayoutTests \
  hq.platform.core.tests.browser.page_errors.PageErrorBrowserTests"""

# The layout legs in Chromium, so a break WebKit happens not to show still
# fails. CI runs them as legs of their own; `mise run browser` leaves them out,
# since HQ is read in Safari. Each runs its WebKit leg, so the two name one set
# of classes, and installs Chromium as a step rather than as a dependency,
# which a skipped task would still run.
["browser:layout-chromium-1"]
description = "browser:layout-1 in Chromium: a CI leg, which mise run browser leaves out"
hide = true
env = { HQ_BROWSER_ENGINE = "chromium" }
run = [
  { task = "setup:browser", args = [
    "chromium",
  ] },
  "mise run --skip-deps browser:layout-1",
]

["browser:layout-chromium-2"]
description = "browser:layout-2 in Chromium: a CI leg, which mise run browser leaves out"
hide = true
env = { HQ_BROWSER_ENGINE = "chromium" }
run = [
  { task = "setup:browser", args = [
    "chromium",
  ] },
  "mise run --skip-deps browser:layout-2",
]

["browser:navigation"]
description = "Real-browser invariants over the example estate, the frame around a page and its fragments"
hide = true
extends = "django-browser"
vars.classes = """\
  hq.platform.core.tests.browser.estate.ExampleEstateBrowserTests \
  hq.platform.core.tests.browser.estate.ExampleEstateDrawnTests \
  hq.platform.core.tests.browser.estate.ExampleEstateControlTests \
  hq.platform.core.tests.browser.reference.ReferenceBrowserTests \
  hq.platform.core.tests.browser.fragments.FragmentBrowserTests"""
