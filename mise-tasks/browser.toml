# The Browser job: each browser:* gate is a leg of it. CI splits an engine's
# gate into shares that run side by side (HQ_BROWSER_SHARD, set by the job's
# matrix; hq/platform/core/tests/browser/shards.py), and run here it is whole.

["browser:demo"]
description = "Build the demo and check it in WebKit"
hide = true
depends = [{ task = "setup:browser", args = ["webkit"] }, "demo:build"]
extends = "heavy"
run = "uv run --group browser python -m unittest demo.check -v"

# Every browser test, in WebKit, which judges, as HQ is read in Safari: the
# whole package, whose modules are not named test*.py so the plain suite
# leaves them out. The pattern skips `__init__.py`, which discovery already
# loads as its package: matched again, a package's tests would run twice.
["browser:webkit"]
description = "Every real-browser test, over the stress estate, the example estate and the catalog, in WebKit"
hide = true
extends = "django-browser"
vars.labels = "hq.platform.core.tests.browser --pattern '[!_]*.py'"

# A second engine, so a break WebKit happens not to show still fails, over
# the narrow set that says it: every shared part, the example estate at a phone
# and a laptop (`estate.SECOND_OPINION_AT`), every probe proven able to fail, and
# the layout shifts only Chromium records (`probes/shifts.py`).
# `mise run browser` leaves this leg to CI.
["browser:chromium"]
description = "The second-engine set in Chromium: a CI leg, which mise run browser leaves out"
hide = true
extends = "django-browser"
env = { HQ_BROWSER_ENGINE = "chromium" }
depends = [{ task = "setup:browser", args = ["chromium"] }, "setup:lint-tools"]
vars.labels = """\
  hq.platform.core.tests.browser.catalog.CatalogLayoutTests \
  hq.platform.core.tests.browser.estate.ExampleEstateBrowserTests \
  hq.platform.core.tests.browser.planted.PlantedBrowserTests \
  hq.platform.core.tests.browser.components.ComponentLayoutTests.test_opening_every_row_a_reader_can_open_moves_nothing_they_did_not_ask_for"""
