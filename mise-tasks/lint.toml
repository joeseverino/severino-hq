# The Lint job: every lint:* gate here and under mise-tasks/lint/. A derived
# file's gate is lint:drift-<file>, held against its source; `mise run fix`
# rewrites them all.

["lint:ruff"]
description = "Ruff lints the Python and holds it to its format"
hide = true
run = ["uv run ruff check .", "uv run ruff format --check ."]

["lint:mypy"]
description = "mypy type-checks the seams pyproject.toml names and the browser test package's calls, then every source module for code its types rule out"
hide = true
# django-stubs loads the host's settings.
extends = "django"
run = [
  "uv run python -m mypy",
  "uv run python -m mypy --config-file tools/lint/mypy-reach.toml",
]

["lint:ast-grep"]
description = "ast-grep holds the source of hq, hq_sdk and tools to the structural rules in tools/lint/ast-grep/rules, every test and test-support module (test*.py, *_testing.py) to those in tools/lint/ast-grep/test-code/rules, and each rule to its own cases"
hide = true
# Two projects, since the source rules exclude the tests the test-code rules
# read. A rule's cases (rule-tests/) prove it refuses what it is for before
# its scan is trusted to find nothing.
run = [
  "ast-grep test -c tools/lint/ast-grep/sgconfig.yml --skip-snapshot-tests",
  "ast-grep test -c tools/lint/ast-grep/test-code/sgconfig.yml --skip-snapshot-tests",
  "ast-grep scan -c tools/lint/ast-grep/sgconfig.yml --globs '!**/tests/**' --globs '!**/test_*.py' --globs '!**/migrations/**' hq hq_sdk tools",
  "ast-grep scan -c tools/lint/ast-grep/test-code/sgconfig.yml --globs 'test*.py' --globs '*_testing.py' .",
]

["lint:openapi"]
description = "Both OpenAPI descriptions pass specification lint"
hide = true
depends = ["setup:lint-tools"]
# Specification rules cover wire contracts. HTTP style recommendations do not
# apply to Django's canonical trailing slashes or the stdin/stdout bridge.
# Stylish names each problem's file, line and column. HQ writes all three
# documents, so a problem is fixed in what declares them, never ignored.
env = { REDOCLY_SUPPRESS_UPDATE_NOTICE = "true" }
run = "redocly lint --extends=spec --format=stylish hq/platform/api/hq-api.openapi.json controller/api/hq-controller.openapi.json controller/api/hq-connections.openapi.json || { echo 'lint:openapi: each problem is at the file:line:column above. HQ writes these documents: fix the Python that declares the shape, then mise run fix.' >&2; exit 1; }"

["lint:deptry"]
description = "Host code imports only declared runtime dependencies and imports every one, or pyproject.toml says why not"
hide = true
# Host code is these two packages less their tests/ ([tool.deptry]).
run = "uv run deptry hq hq_sdk"

["lint:imports"]
description = "Each module imports only what pyproject.toml's import contracts allow it"
hide = true
run = "uv run lint-imports --no-cache"

["lint:lockfile"]
description = "uv.lock matches pyproject.toml"
hide = true
# uv's own hint, a plain uv lock, is refused under mise.toml's UV_LOCKED.
run = "uv lock --check || { echo 'lint:lockfile: write the lock with UV_LOCKED=0 uv lock, then commit uv.lock (docs/Development.md).' >&2; exit 1; }"

["lint:toolchain"]
description = "mise.lock checksums every pinned tool for each gate platform, mise renders Go from go.mod's toolchain line, no image borrows a build tool"
hide = true
run = "uv run python -m tools.pipeline.toolchain_lock"

["lint:mise-tasks"]
description = "Every task is valid: its usage spec parses, its dependencies exist, its timeout and globs are well formed"
hide = true
run = "mise tasks validate"

["lint:workflows"]
description = "The workflows are valid, run: blocks included, and pass zizmor's security audit"
hide = true
# zizmor runs offline, with no token, at its default persona; a deliberate
# finding is suppressed in .github/zizmor.yml with its reason.
# Named rather than found: found, jactionlint reads every action.yml under the
# checkout, the agents' worktrees in .claude/worktrees included.
run = [
  "jactionlint .github/workflows/*.yml .github/actions/*/action.yml",
  "zizmor --offline --strict-collection .github",
]

["lint:deploycheck"]
description = "Production settings raise no security warning"
hide = true
# DEBUG off, a real host. The values mirror a production configuration so the
# check judges how settings.py reads one. The key is a throwaway long enough
# for the strength check.
extends = "django"
env = { DJANGO_DEBUG = "0", DJANGO_SECRET_KEY = "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef", DJANGO_ALLOWED_HOSTS = "hq.example.com", SEVERINO_OIDC_ISSUER = "https://sso.example.com", DJANGO_BEHIND_TLS_PROXY = "1", DJANGO_SESSION_COOKIE_SECURE = "1", DJANGO_CSRF_COOKIE_SECURE = "1", DJANGO_HSTS_SECONDS = "31536000" }
run = "uv run python manage.py check --deploy --fail-level WARNING"

["lint:structural"]
description = "No new near-duplicate pair outside tests"
hide = true
usage = 'flag "--record" help="Rewrite the baseline from this tree instead of checking it"'
run = "uv run python -m tools.structural.bar"

["lint:complexity"]
description = "complexipy holds every function outside tests to cognitive complexity 20"
hide = true
# The bound and the tree are complexipy.toml's, which reads and writes no
# snapshot: every function over the bound fails.
run = "uv run complexipy"

["lint:css"]
description = "Stylelint holds the stylesheets to their contract: color and sizes from tokens, every custom property defined"
hide = true
depends = ["setup:lint-tools"]
run = "stylelint --config tools/lint/stylelint.config.mjs 'static/css/**/*.css'"

["lint:js"]
description = "ESLint holds the browser scripts to its recommended rules and the modern forms (const and let, strict equality), every name they use defined, no unsanitized markup sink, fetching, parsing and polling to fragment.js, and tables.js's layout reads to the places that say why"
hide = true
depends = ["setup:lint-tools"]
run = "eslint --config tools/lint/eslint.config.mjs --max-warnings 0 'static/js/**/*.js'"

# The Go controller's static half: format, generated types, the vendor slicer,
# golangci-lint and the advisory guard. Its race tests are test:controller.
["lint:controller"]
description = "The Go controller is formatted and linted, its generated types current"
hide = true
run = "controller/scripts/check.sh"

# Each derived file against its source, in the order fix:derived writes them.

["lint:drift-sdk-contract"]
description = "hq_sdk's committed shape, text examples and docs/Plugins.md table are what the SDK offers"
hide = true
extends = "django"
run = "uv run python manage.py sdk_contract --check"

["lint:drift-api-document"]
description = "The machine API's OpenAPI document is current"
hide = true
extends = "django"
run = "uv run python manage.py api_openapi --check"

# A recording the examples file must equal, written beside the gate's database
# rather than over the file.
["lint:drift-api-examples"]
description = "The machine API's recorded examples are what its tests receive"
hide = true
extends = "django"
run = 'recorded="$SEVERINO_DATABASE_PATH.examples.json"; HQ_API_RECORD_EXAMPLES_TO="$recorded" mise run fix:api-examples && diff -u hq/platform/api/openapi-examples.json "$recorded" || { echo "lint:drift-api-examples: the recording differs from hq/platform/api/openapi-examples.json, or did not finish; mise run fix:api-examples records it again" >&2; exit 1; }'

["lint:drift-bridge-contract"]
description = "The controller's contracts are the ones the registry derives"
hide = true
extends = "django"
run = "uv run python manage.py bridge_contract --check"

["lint:drift-connections-reference"]
description = "docs/Connections.md is what the providers declare"
hide = true
extends = "django"
run = "uv run python manage.py connections_reference --check"

["lint:drift-font"]
description = "The served font is its source cut to the characters HQ prints and the features its stylesheets use"
hide = true
run = "uv run python -m tools.fonts.subset --check"

["lint:shell:suite"]
description = "One shell suite under the shell named, or as its first line says for -: a run lint:shell makes of every suite"
quiet = true
hide = true
usage = '''
arg "<shell>" help="The shell to run the suite under, which the suite finds in SHELL_UNDER_TEST; - runs it as its first line says"
arg "<suite>" help="The suite, tests/shell/test-*.sh"
'''
run = 'if [ "$usage_shell" = - ]; then exec "$usage_suite"; fi; SHELL_UNDER_TEST="$usage_shell" exec "$usage_shell" "$usage_suite"'
