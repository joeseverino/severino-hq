  "tools/pipeline/toolchain.env",
]
outputs = []
run = "mise tasks validate"

["lint:workflows"]
description = "The workflows are valid, run: blocks included, and pass zizmor's security audit"
hide = true
tags = ["fast"]
sources = [
  ".github/workflows/**",
  ".github/actions/**",
  ".github/actionlint.yaml",
  ".github/zizmor.yml",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# zizmor runs offline, with no token, at its default persona; a deliberate
# finding is suppressed in .github/zizmor.yml with its reason.
# Named rather than found: found, jactionlint reads every action.yml under the
# checkout, the agents' worktrees in .claude/worktrees included.
run = [
  "jactionlint .github/workflows/*.yml .github/actions/*/action.yml",
  "zizmor --offline --strict-collection .github",
]

["lint:deploycheck"]
description = "Production settings raise no security warning"
hide = true
tags = ["fast"]
sources = [
  "**/*.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# DEBUG off, a real host. The values mirror a production configuration so the
# check judges how settings.py reads one. The key is a throwaway long enough
# for the strength check.
extends = "django"
env = { DJANGO_DEBUG = "0", DJANGO_SECRET_KEY = "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef", DJANGO_ALLOWED_HOSTS = "hq.example.com", SEVERINO_OIDC_ISSUER = "https://sso.example.com", DJANGO_BEHIND_TLS_PROXY = "1", DJANGO_SESSION_COOKIE_SECURE = "1", DJANGO_CSRF_COOKIE_SECURE = "1", DJANGO_HSTS_SECONDS = "31536000" }
run = "uv run python manage.py check --deploy --fail-level WARNING"

["lint:structural"]
description = "No new near-duplicate pair outside tests"
hide = true
tags = ["fast"]
sources = [
  "**/*.py",
  "**/*.go",
  "**/*.js",
  "**/*.mjs",
  "**/*.sh",
  "mise-tasks/**",
  "tools/structural/**",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
  "!**/test_*.py",
  "!**/tests.py",
  "!**/*_tests.py",
  "!**/tests/**",
  "!**/*_test.go",
]
outputs = []
usage = '''
flag "--record" help="Rewrite the baseline from this tree instead of checking it"
flag "--pairs" help="First print every pair outside tests with the classification that explains it, or unexplained, one per line, sorted"
'''
run = "uv run python -m tools.structural.bar"

["lint:complexity"]
description = "complexipy holds every function but a migration to cognitive complexity 20"
hide = true
tags = ["fast"]
sources = [
  "**/*.py",
  "complexipy.toml",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
