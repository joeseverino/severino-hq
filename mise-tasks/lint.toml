["lint:shell:suite"]
description = "One shell suite under the shell named, or as its first line says for -: a run lint:shell makes of every suite"
quiet = true
hide = true
usage = '''
arg "<shell>" help="The shell to run the suite under, which the suite finds in SHELL_UNDER_TEST; - runs it as its first line says"
arg "<suite>" help="The suite, tests/shell/test-*.sh"
'''
# A suite matches the words the tools it runs print, and mise colors them
# under GitHub Actions even with no terminal. Every mise a suite starts reads
# its project's config alone: under fast, the config environment is fast's,
# whose summary output keeps a passing run silent.
env = { NO_COLOR = "1" }
run = 'unset MISE_ENV; if [ "$usage_shell" = - ]; then exec "$usage_suite"; fi; SHELL_UNDER_TEST="$usage_shell" exec "$usage_shell" "$usage_suite"'
