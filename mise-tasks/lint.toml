# A recording the examples file must equal, written to a temporary file of its
# own rather than over the file.
["lint:drift-api-examples"]
description = "The machine API's recorded examples are what its tests receive"
hide = true
tags = ["fast"]
sources = [
  "**/*.py",
  "hq/platform/api/openapi-examples.json",
  "hq/domains/control_plane/bridge_base.json",
  "deploy/systemd/severino-hq-secrets.timer",
  "templates/**",
  "static/css/**",
  "static/js/**",
  "static/vendor/scalar/**",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
extends = "django"
run = 'recorded="$(mktemp)"; trap "rm -f \"$recorded\"" EXIT; HQ_API_RECORD_EXAMPLES_TO="$recorded" mise run fix:api-examples && diff -u hq/platform/api/openapi-examples.json "$recorded" || { echo "lint:drift-api-examples: the recording differs from hq/platform/api/openapi-examples.json, or did not finish; mise run fix:api-examples records it again" >&2; exit 1; }'

