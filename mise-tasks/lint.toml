# The Lint job: every lint:* gate here and under mise-tasks/lint/. A derived
# file's gate is lint:drift-<file>, held against its source; `mise run fix`
# rewrites them all.
#
# A quick gate, one `mise run fast` runs when a change affects it, is tagged
# fast. Its sources are the files it reads, then the dependencies, tool pins
# and task definitions every gate reads; `!` takes out a path its tool never
# reads, as the tool's own config says. outputs = [] keeps mise from skipping
# it as up to date. tools/gate/tests/test_fast_selection.py holds all of it,
# and tools/tests/test_drift_sources.py holds a drift gate's sources to every
# file of the checkout its run opens.

["lint:ruff"]
description = "Ruff lints the Python and holds it to its format"
hide = true
tags = ["fast"]
sources = [
  "**/*.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
run = ["uv run ruff check .", "uv run ruff format --check ."]

["lint:mypy"]
description = "mypy type-checks the seams pyproject.toml names and the browser test package's calls, then every source module for code its types rule out"
hide = true
tags = ["fast"]
sources = [
  "**/*.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# django-stubs loads the host's settings.
extends = "django"
run = [
  "uv run python -m mypy",
  "uv run python -m mypy --config-file tools/lint/mypy-reach.toml",
]

["lint:ast-grep"]
description = "ast-grep holds every Python module to the structural rules in tools/lint/ast-grep/rules, each over the scope its rule declares (code HQ runs: hq, hq_sdk and tools less their tests; test code: tests/, test_*.py, testing.py and *_testing.py; or every module), and each rule to its own cases"
hide = true
tags = ["fast"]
sources = [
  "**/*.py",
  "**/templates/**/*.html",
  "tools/lint/ast-grep/**",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# The scan reads the whole repository, since each rule's files: and ignores:
# say which modules it holds. A rule's cases (rule-tests/) prove it refuses
# what it is for before its scan is trusted to find nothing.
run = [
  "ast-grep test -c tools/lint/ast-grep/sgconfig.yml --skip-snapshot-tests",
  # The template rules' snapshots hold what each fix writes.
  "ast-grep test -c tools/lint/ast-grep/sgconfig.yml --filter '^hand-drawn-'",
  # A suppression no match needs any more fails, so each is removed as its page moves.
  "ast-grep scan -c tools/lint/ast-grep/sgconfig.yml --error=unused-suppression .",
]

["lint:openapi"]
description = "Both OpenAPI descriptions pass specification lint"
hide = true
tags = ["fast"]
sources = [
  "hq/platform/api/hq-api.openapi.json",
  "controller/api/*.openapi.json",
  "tools/lint/package*.json",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
depends = ["setup:lint-tools"]
# Specification rules cover wire contracts. HTTP style recommendations do not
# apply to Django's canonical trailing slashes or the stdin/stdout bridge.
# Stylish names each problem's file, line and column. HQ writes all three
# documents, so a problem is fixed in what declares them, never ignored.
env = { REDOCLY_SUPPRESS_UPDATE_NOTICE = "true" }
run = "redocly lint --extends=spec --format=stylish hq/platform/api/hq-api.openapi.json controller/api/hq-controller.openapi.json controller/api/hq-connections.openapi.json || { echo 'lint:openapi: each problem is at the file:line:column above. HQ writes these documents: fix the Python that declares the shape, then rewrite them: mise run manage -- api_openapi for hq-api, mise run manage -- bridge_contract for the two under controller/api.' >&2; exit 1; }"

["lint:openapi-breaking"]
description = "The machine API's document breaks no client of its base's, or its exemption file admits the break with a reason"
hide = true
tags = ["fast"]
sources = [
  "hq/platform/api/hq-api.openapi.json",
  "hq/platform/api/hq-api.breaking-exemptions.md",
  "tools/openapi_breaking.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# Only hq-api: the controller's two documents ship in the same image as both
# of their ends. The base is fast's; CI's lint job names the commit its
# change lands on in CHECK_BASE.
usage = 'arg "[base]" env="CHECK_BASE" help="The ref to compare with; default the branch HEAD lands on, then origin/main"'
run = 'uv run python -m tools.openapi_breaking "${usage_base:-}"'

