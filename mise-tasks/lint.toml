# The Go controller's static half: format, generated types, the vendor slicer,
# golangci-lint and the advisory guard. Its race tests are test:controller.
["lint:controller"]
description = "The Go controller is formatted and linted, its generated types current"
hide = true
tags = ["fast"]
sources = [
  "controller/**",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
run = "controller/scripts/check.sh"

# Every advisory whose vulnerable function the controller can reach, through
# its own calls and its tests' (-test), which fails only on exposure. Pinned
# in go.mod's tool block, hashed in go.sum, as the generator is: mise's
# registry has no govulncheck.
# It queries vuln.go.dev, so fast never selects it.
["lint:govulncheck"]
description = "No advisory the controller can reach, through its own calls or its tests'"
hide = true
dir = "controller"
run = "go tool govulncheck -test ./..."

# Each derived file against its source, in the order fix:derived writes them.

