# The Lint job: every lint:* gate here and under mise-tasks/lint/. A derived
# file's gate is lint:drift-<file>, held against its source; `mise run fix`
# rewrites them all.
#
# A quick gate, one `mise run fast` runs when a change affects it, is tagged
# fast: it reads the files a change touched, or the few its sources name. A
# gate whose input is the whole tree is untagged, left to this job and
# `mise run check`. A quick gate's sources are the files it reads, then the dependencies, tool pins
# and task definitions every gate reads; `!` takes out a path its tool never
# reads, as the tool's own config says. outputs = [] keeps mise from skipping
# it as up to date. tools/tests/test_drift_sources.py holds a drift gate's
# sources to every file of the checkout its run opens.

["lint:ruff"]
description = "Ruff lints the Python and holds it to its format"
hide = true
extends = "hk"
vars = { step = "ruff" }
usage = 'flag "--fix" help="Write the fixes the tool makes instead of checking: fast runs it first"'

["lint:mypy"]
description = "mypy type-checks the seams pyproject.toml names and the browser test package's calls, then every source module for code its types rule out"
hide = true
# Quick though it names the whole tree: mypy's cache (.mypy_cache, which a
# worktree copies) rechecks only a changed module and those whose imports'
# interfaces changed.
tags = ["fast", "heavy"]
sources = [
  "**/*.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# django-stubs loads the host's settings.
extends = "django"
run = [
  "uv run python -m mypy",
  "uv run python -m mypy --config-file tools/lint/mypy-reach.toml",
]

["lint:ast-grep"]
description = "ast-grep holds every Python module to the structural rules in tools/lint/ast-grep/rules, each over the scope its rule declares (code HQ runs: hq, hq_sdk and tools less their tests; test code: tests/, test_*.py, testing.py and *_testing.py; or every module), and each rule to its own cases"
hide = true
extends = "hk"
vars = { step = "ast-grep" }
usage = 'flag "--fix" help="Write the fixes the tool makes instead of checking: fast runs it first"'

["lint:spelling"]
description = "typos holds every file of the checkout to American English and its spelling, as _typos.toml says"
hide = true
extends = "hk"
vars = { step = "spelling" }

["lint:prose"]
description = "Vale holds the wording to tools/lint/vale's swaps: no em dash, and the one name a page gives each thing, in place of HQ's own words or a retired label"
hide = true
extends = "hk"
vars = { step = "prose" }
depends = ["setup:lint-tools"]

["lint:openapi"]
description = "Both OpenAPI descriptions pass specification lint"
hide = true
tags = ["fast"]
sources = [
  "hq/platform/api/hq-api.openapi.json",
  "controller/api/*.openapi.json",
  "tools/lint/package*.json",
  "tools/lint/redocly.yaml",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
depends = ["setup:lint-tools"]
# Specification rules cover wire contracts, and redocly.yaml adds the ones that
# hold each example to its schema. HTTP style recommendations do not apply to
# Django's canonical trailing slashes or the stdin/stdout bridge.
# Stylish names each problem's file, line and column. HQ writes all three
# documents, so a problem is fixed in what declares them, never ignored.
env = { REDOCLY_SUPPRESS_UPDATE_NOTICE = "true" }
run = "redocly lint --config=tools/lint/redocly.yaml --format=stylish hq/platform/api/hq-api.openapi.json controller/api/hq-controller.openapi.json controller/api/hq-connections.openapi.json || { echo 'lint:openapi: each problem is at the file:line:column above. HQ writes these documents: fix the Python that declares the shape, then rewrite them: mise run manage -- api_openapi for hq-api, mise run manage -- bridge_contract for the two under controller/api.' >&2; exit 1; }"

["lint:sdk-breaking"]
description = "hq_sdk keeps the shape its base offered extensions, or PLUGIN_API_VERSION moves with the break"
hide = true
# CI's lint job names the commit its change lands on in CHECK_BASE.
usage = 'arg "[base]" env="CHECK_BASE" help="The ref to compare with; default the branch HEAD lands on, then origin/main"'
run = 'uv run python -m tools.sdk_breaking "${usage_base:-}"'

["lint:deptry"]
description = "Host code imports only declared runtime dependencies and imports every one, or pyproject.toml says why not"
hide = true
# The code is these three packages less their tests/ ([tool.deptry]).
run = "uv run deptry hq hq_sdk hq_runner"

["lint:imports"]
description = "Each module imports only what pyproject.toml's import contracts allow it"
hide = true
run = "uv run lint-imports --no-cache"

["lint:lockfile"]
description = "uv.lock matches pyproject.toml"
hide = true
tags = ["fast"]
sources = [
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# uv's own hint, a plain uv lock, is refused under mise.toml's UV_LOCKED.
run = "uv lock --check || { echo 'lint:lockfile: write the lock with UV_LOCKED=0 uv lock, then commit uv.lock (docs/Development.md).' >&2; exit 1; }"

["lint:toolchain"]
description = "mise.lock checksums every pinned tool for each gate platform, mise renders Go from go.mod's toolchain line, no image borrows a build tool"
hide = true
tags = ["fast"]
sources = [
  "controller/go.mod",
  "Dockerfile",
  "composition/Dockerfile",
  "tools/pipeline/toolchain_lock.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
run = "uv run python -m tools.pipeline.toolchain_lock"

["lint:mise-tasks"]
description = "Every task is valid: its usage spec parses, its dependencies exist, its timeout and globs are well formed"
hide = true
tags = ["fast"]
sources = [
  "mise-tasks/**",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
run = "mise tasks validate"

["lint:workflows"]
description = "The workflows are valid, run: blocks included, and pass zizmor's security audit"
hide = true
tags = ["fast"]
sources = [
  ".github/workflows/**",
  ".github/actions/**",
  ".github/actionlint.yaml",
  ".github/zizmor.yml",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
# zizmor runs offline, with no token, at its default persona; a deliberate
# finding is suppressed in .github/zizmor.yml with its reason.
# Named rather than found: found, jactionlint reads every action.yml under the
# checkout, the agents' worktrees in .claude/worktrees included.
run = [
  "jactionlint .github/workflows/*.yml .github/actions/*/action.yml",
  "zizmor --offline --strict-collection .github",
]

["lint:deploycheck"]
description = "Production settings raise no security warning"
hide = true
# DEBUG off, a real host. The values mirror a production configuration so the
# check judges how settings.py reads one. The key is a throwaway long enough
# for the strength check.
extends = "django"
env = { DJANGO_DEBUG = "0", DJANGO_SECRET_KEY = "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef", DJANGO_ALLOWED_HOSTS = "hq.example.com", SEVERINO_OIDC_ISSUER = "https://sso.example.com", DJANGO_BEHIND_TLS_PROXY = "1", DJANGO_SESSION_COOKIE_SECURE = "1", DJANGO_CSRF_COOKIE_SECURE = "1", DJANGO_HSTS_SECONDS = "31536000" }
run = "uv run python manage.py check --deploy --fail-level WARNING"

["lint:structural"]
description = "No new near-duplicate pair outside tests"
hide = true
usage = '''
flag "--record" help="Rewrite the baseline from this tree instead of checking it"
flag "--pairs" help="First print every pair outside tests with the classification that explains it, or unexplained, one per line, sorted"
'''
run = "uv run python -m tools.structural.bar"

["lint:css"]
description = "Stylelint holds the stylesheets to their contract: color and sizes from tokens, every custom property defined, every feature at the browser floor or behind @supports"
hide = true
tags = ["fast"]
sources = [
  "static/css/**",
  "tools/lint/*.mjs",
  "tools/lint/package*.json",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
depends = ["setup:lint-tools"]
usage = 'flag "--fix" help="Write what the tool fixes itself, then report the rest: fast runs it first"'
run = 'stylelint --config tools/lint/stylelint.config.mjs $([ "${usage_fix:-}" != true ] || echo --fix) "static/css/**/*.css"'

["lint:js"]
description = "ESLint holds the browser scripts to its recommended rules and the modern forms (const and let, strict equality), every name they use defined, no unsanitized markup sink, fetching, parsing and polling to fragment.js, and tables.js's layout reads to the places that say why"
hide = true
tags = ["fast"]
sources = [
  "static/js/**",
  "tools/lint/eslint-suppressions.json",
  "tools/lint/*.mjs",
  "tools/lint/ast-grep/rules/markup-drawn-by-templates.yml",
  "tools/lint/package*.json",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
depends = ["setup:lint-tools"]
usage = 'flag "--fix" help="Write what the tool fixes itself, then report the rest: fast runs it first"'
run = 'eslint --config tools/lint/eslint.config.mjs --suppressions-location tools/lint/eslint-suppressions.json --max-warnings 0 $([ "${usage_fix:-}" != true ] || echo --fix) "static/js/**/*.js"'

# The Go controller's static half: format, generated types, the vendor slicer,
# golangci-lint and the advisory guard. Its race tests are test:controller.
["lint:controller"]
description = "The Go controller is formatted and linted, its generated types current"
hide = true
tags = ["fast"]
sources = [
  "controller/**",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
usage = 'flag "--fix" help="Format, modernize and regenerate the controller instead of checking: fast runs it first"'
# The bridge contract's fix writes the specs go generate reads.
wait_for = ["lint:drift-bridge-contract"]
# go generate's outputs, which fix:derived writes after every derived file.
vars = { writes = "controller/**/*.gen.go" }
run = "controller/scripts/check.sh"

# Every advisory whose vulnerable function the controller can reach, through
# its own calls and its tests' (-test), which fails only on exposure. Pinned
# in go.mod's tool block, hashed in go.sum, as the generator is: mise's
# registry has no govulncheck.
# It queries vuln.go.dev, so fast never selects it.
["lint:govulncheck"]
description = "No advisory the controller can reach, through its own calls or its tests'"
hide = true
dir = "controller"
run = "go tool govulncheck -test ./..."

# Each derived file against its source. A gate tagged derived is its file's
# one declaration (docs/Development.md, Derived files): vars.writes names each
# file it writes whole. fix:derived runs every one's fix mode, .gitattributes marks what
# they write, and tools/tests/test_drift_gates.py holds each to what its fix
# writes.

["lint:drift-shared-ui-reference"]
description = "docs/Shared-UI.md is what the host's templates offer an extension"
hide = true
extends = "drift"
vars = { command = "shared_ui_reference", writes = "docs/Shared-UI.md" }

["lint:drift-api-document"]
description = "The machine API's OpenAPI document is current"
hide = true
extends = "drift"
vars = { command = "api_openapi", writes = "hq/platform/api/hq-api.openapi.json" }

["lint:drift-bridge-contract"]
description = "The controller's contracts are the ones the registry derives"
hide = true
extends = "drift"
vars = { command = "bridge_contract", writes = "controller/api/hq-controller.openapi.json controller/api/hq-connections.openapi.json hq/config/controller-connections.json" }

["lint:drift-connections-reference"]
description = "docs/Connections.md is what the providers declare"
hide = true
extends = "drift"
vars = { command = "connections_reference", writes = "docs/Connections.md" }

["lint:drift-posture-reference"]
description = "docs/Posture.md's tables are what the checks declare"
hide = true
extends = "drift"
vars = { command = "posture_reference", writes = "docs/Posture.md" }

["lint:drift-procedure-schema"]
description = "The published JSON Schema of a procedure's sidecar is what ProcedureDeclaration validates"
hide = true
extends = "drift"
vars = { command = "procedure_schema", writes = "hq/platform/application/hq-procedure.schema.json" }

["lint:drift-font"]
description = "The served font is its source cut to the characters HQ prints and the features its stylesheets use"
hide = true
tags = ["fast", "derived"]
sources = [
  "tools/fonts/**",
  "static/fonts/**",
  "static/css/**",
  "tools/__init__.py",
  "tools/derived.py",
  "hq/__init__.py",
  "hq/platform/__init__.py",
  "hq/platform/core/__init__.py",
  "hq/platform/core/tests/__init__.py",
  "hq/platform/core/tests/task.py",
  "tests/__init__.py",
  "tests/mise_tasks.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
usage = 'flag "--fix" help="Rewrite the file instead of checking: fast runs it first"'
vars = { writes = "static/fonts/inter/inter-variable-latin.woff2" }
# The subsetter reads the fix flag itself.
run = "uv run python -m tools.fonts.subset"

["lint:drift-admission-policy"]
description = "The admission policy names the PLUGIN_API_VERSION the host speaks"
hide = true
tags = ["fast", "derived"]
sources = [
  "policy/plugin-admission-v1.json",
  "tools/pipeline/admission_policy.py",
  "tools/pipeline/plugin_identity.py",
  "tools/pipeline/__init__.py",
  "tools/__init__.py",
  "tools/derived.py",
  "hq/__init__.py",
  "hq/platform/__init__.py",
  "hq/platform/core/__init__.py",
  "hq/platform/core/tests/__init__.py",
  "hq/platform/core/tests/task.py",
  "tests/__init__.py",
  "tests/mise_tasks.py",
  "hq/platform/application/plugins.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
usage = 'flag "--fix" help="Rewrite the file instead of checking: fast runs it first"'
vars = { writes = "policy/plugin-admission-v1.json" }
# The writer reads the fix flag itself.
run = "uv run python -m tools.pipeline.admission_policy"

["lint:drift-gitattributes"]
description = ".gitattributes marks linguist-generated each file a task declares it writes"
hide = true
tags = ["fast", "derived"]
sources = [
  ".gitattributes",
  "tools/gitattributes.py",
  "tools/derived.py",
  "hq/__init__.py",
  "hq/platform/__init__.py",
  "hq/platform/core/__init__.py",
  "hq/platform/core/tests/__init__.py",
  "hq/platform/core/tests/task.py",
  "tools/__init__.py",
  "tests/__init__.py",
  "tests/mise_tasks.py",
  "pyproject.toml",
  "uv.lock",
  "mise.toml",
  "mise.lock",
  "mise-tasks/*.toml",
  "tools/pipeline/toolchain.env",
]
outputs = []
usage = 'flag "--fix" help="Rewrite the file instead of checking: fast runs it first"'
vars = { writes = ".gitattributes" }
# The writer reads the fix flag itself.
run = "uv run python -m tools.gitattributes"

["lint:shell:suite"]
description = "One shell suite under the shell named, or as its first line says for -: a run lint:shell makes of every suite"
quiet = true
hide = true
usage = '''
arg "<shell>" help="The shell to run the suite under, which the suite finds in SHELL_UNDER_TEST; - runs it as its first line says"
arg "<suite>" help="The suite, tests/shell/test-*.sh"
'''
# A suite matches the words the tools it runs print, and mise colors them
# under GitHub Actions even with no terminal. Every mise a suite starts reads
# its project's config alone: under fast, the config environment is fast's,
# whose summary output keeps a passing run silent.
env = { NO_COLOR = "1" }
run = 'unset MISE_ENV; if [ "$usage_shell" = - ]; then exec "$usage_suite"; fi; SHELL_UNDER_TEST="$usage_shell" exec "$usage_shell" "$usage_suite"'
