# The steps of what a developer runs by hand beside the servers: CI's caches,
# the derived files, the docs' pictures, an extension's contract check.

["ci:caches"]
description = "Fill the caches CI's jobs restore: every Python group, the Go controller's builds, the npm tools"
hide = true
extends = "heavy"
depends = ["setup:lint-tools"]
run = [
  "uv sync --all-groups",
  "go -C controller build ./... tool",
  "go -C controller test -race -run '^$' ./...",
  "go -C controller vet ./...",
]

# `mise run dev:look --docs`.
["dev:look:docs"]
description = "Redraw every docs screenshot from the showcase demo: mise run dev:look --docs"
hide = true
depends = [{ task = "setup:browser", args = ["webkit"] }, "demo:build"]
extends = "heavy"
run = "uv run --group browser python -m demo.screenshot"

# `mise run fix` writes every derived file, in the order each reads the last:
# the bridge contract feeds the Go types. lint:drift-* holds each. Each step
# is one process on an empty database, so none waits for the heavy turn.
["fix:derived"]
description = "Rewrite every derived file from its source (docs/Development.md, Derived files): mise run fix"
hide = true
extends = "django"
run = [
  "uv run python manage.py sdk_contract",
  "uv run python manage.py api_openapi",
  "uv run python manage.py bridge_contract",
  "cd controller && go generate ./...",
  "uv run python manage.py connections_reference",
  "uv run python -m tools.fonts.subset",
]

# A linter's suppressions file holds a count per file and rule that only
# falls: a rise is a new problem, which lint:css and lint:js refuse. ESLint's
# --prune-suppressions only lowers a count. Stylelint has no such flag, and its
# --suppress sets every count to what it finds, raising one too, so it rewrites
# the file only after a run with the file as it stands passes, when no count is
# below what it finds and the rewrite can only lower or drop one.
["fix:suppressions"]
description = "Lower each count in the linters' suppressions files that has fallen to what the linter finds; a risen count is left for lint:css or lint:js to refuse"
hide = true
depends = ["setup:lint-tools"]
run = [
  "if stylelint --config tools/lint/stylelint.config.mjs --suppress-location=tools/lint/stylelint-suppressions.json 'static/css/**/*.css' >/dev/null 2>&1; then stylelint --config tools/lint/stylelint.config.mjs --suppress --suppress-location=tools/lint/stylelint-suppressions.json 'static/css/**/*.css'; else echo 'fix:suppressions: lint:css finds a problem, so the stylesheets keep their counts until mise run lint:css passes'; fi",
  "eslint --config tools/lint/eslint.config.mjs --suppressions-location tools/lint/eslint-suppressions.json --prune-suppressions 'static/js/**/*.js' >/dev/null || echo 'fix:suppressions: lint:js finds a problem; mise run lint:js names it'",
]

# A docs figure is drawn from its source beside it by brand, the renderer its
# source line names. brand lives on an operator's machine only, so this is no
# step of fix.
["fix:figures"]
description = "When a docs figure's source (docs/images/*/*.fig) changes: render each to the PNG beside it with brand"
hide = true
run = 'for spec in docs/images/*/*.fig; do brand figure "$spec" --scale 1; done'

# The API's examples are responses its tests really received, so they are
# recorded by a serial run of the tests that call the API through a
# ContractClient (test_api_openapi_command.py holds the labels to every one),
# under a clock that stands still and with fixed ids (hq/platform/api/testing.py),
# so a recording reads the same every run. It is not a step of fix, being a
# serial run of the suite; lint:drift-api-examples and lint:drift-api-document
# name this task.
["fix:api-examples"]
description = "When the API's recorded examples no longer match its document: record them again from the tests that call it, then rewrite the document"
hide = true
extends = "django"
# One process, so outside the heavy turn (tools/gate/turn.py). The tests read
# the examples file before the run writes the new one, so an entry whose
# operation is gone is dropped first. A recording written elsewhere
# (HQ_API_RECORD_EXAMPLES_TO, lint:drift-api-examples's) leaves the examples
# file and the document as they are.
run = 'elsewhere="${HQ_API_RECORD_EXAMPLES_TO:-}"; { [ -n "$elsewhere" ] || uv run python manage.py api_openapi --prune-examples; } && HQ_API_RECORD_EXAMPLES=1 uv run python manage.py test hq.platform.api hq.domains.contacts --parallel 1 && { [ -n "$elsewhere" ] || uv run python manage.py api_openapi; }'

["plugin:check"]
description = "One extension package's contract check against this host, as its CI runs it"
hide = true
dir = "{{cwd}}"
run = "{{config_root}}/tools/pipeline/check-plugin.sh"
