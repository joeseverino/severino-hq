# The build job's steps: image:build (mise-tasks/image/), then each
# image:verify:* check, which `mise run build` runs in turn.
# IMAGE names the image under test; the pipeline passes the one it built.

["image:verify:healthy"]
description = "It comes up healthy"
hide = true
extends = "heavy"
depends = ["image:build"]
depends_post = ["image:docker stop"]
run = 'tools/pipeline/image-health.sh "${IMAGE:-severino-hq:ci-local}"'

["image:verify:host-boot"]
description = "It boots under its unit: waits for its environment, survives a crash and a reboot"
hide = true
extends = "heavy"
depends = ["image:build"]
depends_post = ["image:docker stop"]
run = 'tools/pipeline/host-boot-drill.sh "${IMAGE:-severino-hq:ci-local}"'
