# The toolchain and every gate, declared once.
#
#   mise install        the pinned tools (versions here, checksums in mise.lock);
#                       a lazy one installs on its first use
#   mise run fast       the inner loop: only what the change touches
#   mise run check      does my change work
#   mise run ci         will the pipeline accept it: every gate CI runs
#   mise run <gate>     one gate, e.g. `mise run checks:ruff`
#   mise tasks          the list
#
# A gate is a task named <job>:<gate>. Each CI job runs the aggregate of its
# name (`mise run -c checks`), so a gate added here runs locally and in the
# pipeline with no second list to edit. `-c` keeps going past a failure and
# names every gate that failed. No gate declares `sources`: mise judges them by
# file times alone, and a verdict also turns on the environment and on files
# no list would name. A task whose body is more than one line is a file under
# mise-tasks/, declared in its own #MISE header, so checks:shell lints it.
#
# Python dependencies come from uv.lock, which UV_LOCKED below holds every uv
# command to; nothing here needs a virtualenv made by hand. uv itself is one of
# the tools below.

min_version = "2026.10.15"

[settings.task]
# Gates that run together print one after another, each whole and labeled,
# never line by line into each other: an aggregate reads gate by gate, and each
# gate's failures sit under its own verdict.
output = "keep-order"

[env]
# Facts that are not tools: the Python matrix, the coverage floor, the runner
# image. Shell and workflows read the same file.
_.file = "tools/pipeline/toolchain.env"
SEVERINO_LOG_LEVEL = "CRITICAL"
# `uv run`, `uv sync` and `uv export` refuse a uv.lock that pyproject.toml has
# moved past, as `--locked` does. So do `uv lock` and `uv add`: change the lock
# outside mise, or with UV_LOCKED=0.
UV_LOCKED = "1"

[tools]
node = "24.22.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
yq = "4.54.1"
jq = "1.8.2"
# The images copy uv from its own image at this version (checks:toolchain).
uv = "0.13.1"
# The Scorecard the pinned ossf/scorecard-action builds against (its go.mod).
scorecard = "5.6.0"
# Seals a failed Compose run's output (tools/pipeline/seal-failure-logs.sh). Lazy:
# `mise install` leaves it to its first use, held to mise.lock all the same.
age = { version = "1.3.2", lazy = true }

# The code graph the structural bar indexes with. Linux takes the portable
# (static) build so the runner needs no matching libc.
[tools."github:DeusData/codebase-memory-mcp"]
version = "0.12.0"

[tools."github:DeusData/codebase-memory-mcp".platforms]
linux-x64 = { asset_pattern = "codebase-memory-mcp-linux-amd64-portable.tar.gz" }
linux-arm64 = { asset_pattern = "codebase-memory-mcp-linux-arm64-portable.tar.gz" }

# The CodeQL bundle the pinned github/codeql-action defaults to (its
# src/defaults.json), so the local analysis runs the queries CI runs. Bump with
# that action. Lazy, as age is: only scan:codeql runs it.
[tools."github:github/codeql-action"]
version = "2.27.2"
version_prefix = "codeql-bundle-v"
bin_path = "codeql"
lazy = true
lazy_bins = ["codeql"]

[tools."github:github/codeql-action".platforms]
macos-arm64 = { asset_pattern = "codeql-bundle-osx64.tar.zst" }
macos-x64 = { asset_pattern = "codeql-bundle-osx64.tar.zst" }
linux-x64 = { asset_pattern = "codeql-bundle-linux64.tar.zst" }

# ------------------------------------------------------------- templates
# A gate never opens the developer's database: each Django gate extends one of
# these, which make it a new empty file for every task run, so a checkout's own
# data cannot change what a gate reports and gates run side by side never share
# one (two processes making one new file WAL at once: one is refused as
# "database is locked"). It is named as a test run's scratch is, for the mise
# that ran it, so the next test run sweeps it (hq/config/sandbox.py). A gate
# sees no extension set it did not ask for. A task extends one template and a
# template extends none, so composed and django-heavy restate django's env.

[task_templates.django]
env = { SEVERINO_DATABASE_PATH = "{{ exec(command='mktemp \"${TMPDIR:-/tmp}/severino-test-gate-' ~ mise_pid ~ '-XXXXXX\"') }}", DJANGO_DEBUG = "1", DJANGO_SECRET_KEY = "gate-only-key-not-a-real-secret", DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost,testserver", SEVERINO_HQ_PLUGINS = false }

# The extension set mise.local.toml names, loaded as the image loads it: DEBUG
# off, and admission off, since a checkout has no admitted wheels.
[task_templates.composed]
env = { SEVERINO_DATABASE_PATH = "{{ exec(command='mktemp \"${TMPDIR:-/tmp}/severino-test-gate-' ~ mise_pid ~ '-XXXXXX\"') }}", DJANGO_DEBUG = false, DJANGO_SECRET_KEY = "gate-only-key-not-a-real-secret", DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost,testserver", SEVERINO_HQ_REQUIRE_PLUGIN_ADMISSION = "0", SEVERINO_HQ_PLUGINS = "{{ env.HQ_LOCAL_PLUGINS | default(value='') }}", PYTHONPATH = "{{ env.HQ_LOCAL_PYTHONPATH | default(value='') }}" }

# ------------------------------------------------------------------ heavy
# A task that loads the machine (a suite, a browser, a demo build, an aggregate
# of them) runs under tools/lib/heavy.sh: its shell is mise's default behind the
# wrapper. Heavy tasks take turns through one lock every checkout shares; one
# started while another holds the turn names the holder and waits for it, up to
# SEVERINO_HEAVY_WAIT seconds (two hours by default), then exits 75. A heavy
# task inside a turn runs in it. CI takes no lock. The timeout stops a
# hung holder: well above the slowest gate (the suite, a browser gate), and an
# aggregate's above the gates it runs in turn. A file task sources
# tools/lib/heavy-turn.sh and sets its timeout in its header. mise's own
# task.timeout setting would bound the whole run, development servers
# included, so each heavy task carries its own.
[task_templates.heavy]
shell = "tools/lib/heavy.sh sh -o errexit -c"
timeout = "30m"

# A Django gate that loads the machine: django's env inside a heavy turn.
[task_templates.django-heavy]
env = { SEVERINO_DATABASE_PATH = "{{ exec(command='mktemp \"${TMPDIR:-/tmp}/severino-test-gate-' ~ mise_pid ~ '-XXXXXX\"') }}", DJANGO_DEBUG = "1", DJANGO_SECRET_KEY = "gate-only-key-not-a-real-secret", DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost,testserver", SEVERINO_HQ_PLUGINS = false }
shell = "tools/lib/heavy.sh sh -o errexit -c"
timeout = "30m"

# --------------------------------------------------------------- operator

# The development servers. Each profile is a task whose env says where it
# listens and which database it opens; tools/dev/dev.sh refuses what env cannot.

# The long-lived server behind a TLS proxy. Its facts live only in the
# gitignored dev.local.toml (tools/dev/dev.local.example.toml), which no other
# task reads. The profile's invariants come after the file, so it cannot
# change them.
[tasks.dev]
description = "The server behind a TLS proxy: DEBUG off, single sign-on, the bind dev.local.toml names"
raw = true
usage = '''
flag "--fresh" help="Delete its database and migrate a new one"
flag "--plan" help="Print what it would run under, without secrets, and exit"
'''
run = "tools/dev/dev.sh"

[tasks.dev.env]
_.file = "dev.local.toml"
UVICORN_HOST = { required = "Copy tools/dev/dev.local.example.toml to dev.local.toml and fill it in" }
UVICORN_PORT = { required = true }
DJANGO_ALLOWED_HOSTS = { required = true }
DJANGO_CSRF_TRUSTED_ORIGINS = { required = true }
SEVERINO_TRUSTED_PROXIES = { required = true }
SEVERINO_DATABASE_PATH = { required = true }
SEVERINO_OIDC_ISSUER = { required = true }
SEVERINO_OIDC_CLIENT_ID = { required = true }
DJANGO_TIME_ZONE = { required = true }
HQ_DEV_OP = { required = true }
HQ_DEV_SECRET_REF = { required = true }
HQ_DEV_OIDC_SECRET_REF = { required = true }
HQ_DEV_PROFILE = "secure"
DJANGO_DEBUG = "0"
DJANGO_BEHIND_TLS_PROXY = "1"
SEVERINO_OIDC_ENABLED = "1"
# A checkout has no admitted wheels, and admission is required whenever DEBUG is off.
SEVERINO_HQ_REQUIRE_PLUGIN_ADMISSION = "0"
DJANGO_TEMPLATE_CACHE = "0"
DJANGO_WHITENOISE_AUTOREFRESH = "1"
SEVERINO_INFRASTRUCTURE_ENABLE_PUBLIC_DNS = "1"
SEVERINO_LOG_LEVEL = "INFO"
SEVERINO_HQ_PLUGINS = "{{ env.HQ_LOCAL_PLUGINS | default(value='') }}"
PYTHONPATH = "{{ env.HQ_LOCAL_PYTHONPATH | default(value='') }}"
SEVERINO_HQ_REVISION = "{{ exec(command='git rev-parse HEAD') }}"

# Loopback, DEBUG on, a database of this checkout's own under var/dev/scratch,
# so each worktree has its own. Shared by the scratch server and the commands
# that open its database, which read its throwaway key from secret.env.
[task_templates."dev:scratch-env".env]
_.file = "var/dev/scratch/secret.env"
HQ_DEV_PROFILE = "scratch"
DJANGO_DEBUG = "1"
UVICORN_HOST = "127.0.0.1"
UVICORN_PORT = "0"
DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost"
SEVERINO_DATABASE_PATH = "{{ config_root }}/var/dev/scratch/db.sqlite3"
SEVERINO_MEDIA_ROOT = "{{ config_root }}/var/dev/scratch/media"
SEVERINO_EXPORTS_ROOT = "{{ config_root }}/var/dev/scratch/exports"
SEVERINO_HQ_REQUIRE_PLUGIN_ADMISSION = "0"
SEVERINO_INFRASTRUCTURE_ENABLE_PUBLIC_DNS = "1"
SEVERINO_LOG_LEVEL = "INFO"
SEVERINO_HQ_PLUGINS = "{{ env.HQ_LOCAL_PLUGINS | default(value='') }}"
PYTHONPATH = "{{ env.HQ_LOCAL_PYTHONPATH | default(value='') }}"

[tasks."dev:scratch"]
extends = "dev:scratch-env"
raw = true
description = "A throwaway server on loopback: DEBUG on, a new database each start, a port the system picks"
usage = '''
flag "--keep" help="Reuse the last scratch database"
flag "--seed <seed>" help="Fill it with the example estate" {
    choices "showcase" "standard"
}
flag "--port <port>" help="A fixed port instead of a free one"
flag "--plan" help="Print what it would run under and exit"
'''
run = "tools/dev/dev.sh"

[tasks."dev:session"]
extends = "dev:scratch-env"
description = "A signed-in session cookie for this checkout's scratch server"
run = "uv run python manage.py dev_session operator"

[tasks."dev:look"]
extends = "django-heavy"
depends = ["setup:webkit"]
description = "Screenshot HQ pages as the browser gates draw them at a few widths, and run one of their rules there"
usage = '''
arg "<pages>" help="Comma-separated pages: the gate's estate (connections,dense/services), the API reference (api/docs), the example estate's navigation (estate, estate/infrastructure, or estate/all for every page of it), or all"
flag "--widths <widths>" help="Comma-separated widths in CSS pixels; default the phone, 820 and 1360"
flag "--rule <rule>" help="A rule method of LayoutBrowserTests to run on each page"
flag "--css <css>" help="A stylesheet added first: the defect a new rule must catch"
flag "--dark" help="In the dark palette"
flag "--open" help="With every disclosure open"
flag "--expand" help="With every table row opened"
flag "--no-script" help="As the server drew it, before tables.js and the rest run"
flag "--deep" help="Also every page the example estate pages link to: each list's records and the command forms they open"
'''
run = "uv run --group browser python manage.py test hq.platform.core.browser_look.Look.test_look --noinput --parallel 1"

[tasks."dev:manage"]
extends = "dev:scratch-env"
raw = true
description = "manage.py against this checkout's scratch database, extensions loaded: mise run dev:manage -- <command>"
run = "uv run python manage.py"

[tasks.manage]
description = "manage.py with the development settings the gates use: mise run manage -- <command>"
raw = true
extends = "django"
run = "uv run --group browser python manage.py"

[tasks.regen]
description = "Rewrite every derived file from its source; `mise run drift` checks them instead"
# In the order each reads the last: the API document feeds the clients, the
# bridge contract feeds the Go types. Each step takes the heavy turn, the
# contract tools' install among them, so none shares tools/clients'
# node_modules with a drift gate's install.
extends = "django-heavy"
run = [
  "mise run setup:openapi",
  "uv run python manage.py sdk_contract",
  "uv run python manage.py api_openapi",
  "tools/clients/generate.sh --write",
  "uv run python manage.py bridge_contract",
  "cd controller && go generate ./...",
  "uv run python manage.py connections_reference",
]

[tasks.drift]
description = "Every derived file is what its source generates: each drift:* gate, naming every one behind"
# Run-form, so the gates and the installs they depend on run inside one turn.
# The Go types are held by `mise run controller`, which regenerates them
# against a snapshot.
extends = "heavy"
run = "mise run -c 'drift:*'"

# ------------------------------------------------------------- aggregates

[tasks.fast]
description = "Inner loop: the quick gates, and the tests the change reaches"
extends = "django-heavy"
usage = '''
arg "[base]" env="CHECK_BASE" help="The ref to diff against; default origin/main, then main"
flag "--list" help="Print the selected test modules and run nothing"
flag "--parallel <workers>" env="CHECK_PARALLEL" default="auto" help="Test workers per suite; 1 rules out an order or isolation failure"
'''
run = 'uv run python -m tools.gate.fast ${usage_list:+--list} --parallel "$usage_parallel" ${usage_base:+"$usage_base"}'

[tasks.check]
description = "Does my change work: every Checks gate, the Tests gates on one Python, and the suite composed"
# Named by aggregate and glob, so a new gate joins without an edit here. One
# task at a time: each suite starts a worker per core, and two at once exhaust
# a small machine's memory. CI runs each job's aggregate, never this task.
# tools.gate.verdict ends the output on the tasks and tests that failed.
extends = "heavy"
timeout = "2h"
run = "uv run python -m tools.gate.verdict check mise run -c -j 1 checks ::: 'tests:*' ::: suite:as-image"

[tasks.ci]
description = "Every gate the pipeline runs"
# Run-form, so one turn covers the whole run.
extends = "heavy"
timeout = "2h"
run = "mise run -c checks ::: tests ::: browser ::: controller ::: scan ::: image"

[tasks.checks]
description = "CI job Checks"
# Run-form, so the gates and the installs they depend on run inside one turn.
extends = "heavy"
timeout = "2h"
run = "mise run -c 'checks:*' ::: 'drift:*'"

[tasks.browser]
description = "CI job Browser"
# Run-form, so one turn covers every browser gate.
extends = "heavy"
timeout = "2h"
run = "mise run -c 'browser:*'"

[tasks.controller]
description = "CI job Controller"
depends = ["controller:*"]

[tasks.scan]
description = "Code scanning, as CI's CodeQL job runs it"
depends = ["scan:*"]

[tasks.image]
description = "CI job Image: build, then every check an image must pass"
depends = ["image:verify:*"]

# ----------------------------------------------------------------- checks

[tasks."checks:patch"]
description = "No whitespace errors or conflict markers in the working tree"
run = "git diff --check"

[tasks."checks:ruff"]
description = "ruff"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."checks:mypy"]
description = "mypy: the typed seams pyproject.toml names"
# django-stubs loads the host's settings.
extends = "django"
run = "uv run python -m mypy"

[tasks."setup:openapi"]
description = "Install the locked contract tools"
hide = true
sources = ["tools/clients/package-lock.json"]
outputs = ["tools/clients/node_modules/.package-lock.json"]
run = "npm --prefix tools/clients ci"

[tasks."checks:openapi"]
description = "Both OpenAPI descriptions pass specification lint"
depends = ["setup:openapi"]
# Specification rules cover wire contracts. HTTP style recommendations do not
# apply to Django's canonical trailing slashes or the stdin/stdout bridge.
run = [
  "node tools/clients/node_modules/@redocly/cli/bin/cli.js lint --extends=spec --format=summary hq/platform/api/hq-api.openapi.json controller/api/hq-controller.openapi.json controller/api/hq-connections.openapi.json",
  "node --test tools/clients/test-client.mjs",
]

[tasks."checks:lockfile"]
description = "uv.lock matches pyproject.toml"
run = "uv lock --check"

[tasks."checks:toolchain"]
description = "mise.lock has a checksum for every pinned tool on every platform a gate runs on, and the images take the uv mise pins"
run = "uv run python -m tools.pipeline.toolchain_lock"

[tasks."checks:mise-tasks"]
description = "Every task is valid: its usage spec parses, its dependencies exist, its timeout and globs are well formed"
run = "mise tasks validate"

[tasks."checks:mise-format"]
description = "mise.toml is formatted as `mise fmt` writes it"
# Read through stdin: `mise fmt --check` also judges the gitignored mise.local.toml.
run = "mise fmt --stdin <mise.toml | diff -u mise.toml -"

[tasks."checks:workflows"]
description = "The workflows are valid, run: blocks included"
run = "actionlint -color"

[tasks."checks:source"]
description = "The tests that read the repository, run once on the checkout"
# Tagged "source"; a whole-suite run leaves them out (hq/platform/core/test_runner.py),
# so no image or composed pass runs them.
extends = "django-heavy"
usage = 'arg "[labels]..." var=#true help="Test labels, dotted; only their tagged tests run. Every one by default"'
run = "uv run python manage.py test --tag source --noinput --parallel auto ${usage_labels:-}"

[tasks."checks:deploycheck"]
description = "Production settings raise no security warning"
# DEBUG off, a real host. The values mirror a production configuration so the
# check judges how settings.py reads one. The key is a throwaway long enough
# for the strength check.
extends = "django"
env = { DJANGO_DEBUG = "0", DJANGO_SECRET_KEY = "ci-only-deploy-check-key-0123456789abcdef0123456789abcdef", DJANGO_ALLOWED_HOSTS = "hq.example.com", SEVERINO_OIDC_ISSUER = "https://sso.example.com", DJANGO_BEHIND_TLS_PROXY = "1", DJANGO_SESSION_COOKIE_SECURE = "1", DJANGO_CSRF_COOKIE_SECURE = "1", DJANGO_HSTS_SECONDS = "31536000" }
run = "uv run python manage.py check --deploy --fail-level WARNING"

[tasks."checks:structural"]
description = "No new near-duplicate pair outside tests"
usage = 'flag "--record" help="Rewrite the baseline from this tree instead of checking it"'
run = 'uv run python -m tools.structural.bar ${usage_record:+--record}'

# ------------------------------------------------------------------ drift
# Each derived file against its source, run by the Checks job, by `mise run
# fast` side by side, and by `mise run drift`. `mise run regen` rewrites them
# all.

[tasks."drift:sdk-contract"]
description = "hq_sdk's committed shape, text examples and docs/Plugins.md table are what the SDK offers"
extends = "django"
run = "uv run python manage.py sdk_contract --check"

[tasks."drift:api-document"]
description = "The machine API's OpenAPI document is current"
extends = "django"
run = "uv run python manage.py api_openapi --check"

[tasks."drift:clients"]
description = "The generated API clients are what the API document generates"
depends = ["setup:openapi"]
run = "tools/clients/generate.sh --check"

[tasks."drift:bridge-contract"]
description = "The controller's contracts are the ones the registry derives"
extends = "django"
run = "uv run python manage.py bridge_contract --check"

[tasks."drift:connections-reference"]
description = "docs/Connections.md is what the providers declare"
extends = "django"
run = "uv run python manage.py connections_reference --check"

# ------------------------------------------------------------------ tests
# Each runs on the interpreter UV_PYTHON names; `mise run tests` walks the matrix.

[tasks."tests:django"]
description = "Django's system checks"
extends = "django"
run = "uv run python manage.py check"

[tasks."tests:plugins"]
description = "The public plugin contract"
extends = "django"
env = { SEVERINO_HQ_PLUGINS = "tests.fixtures.example_hq_plugin.plugin:plugin" }
run = ["uv run python manage.py check", "uv run python manage.py plugins"]

[tasks."tests:migrations"]
description = "No model change without its migration"
extends = "django"
run = "uv run python manage.py makemigrations --check --dry-run"

[tasks."tests:api-properties"]
description = "Generated API cases through the real WSGI middleware"
extends = "django-heavy"
run = "uv run python manage.py test tests.fuzz.api_properties --noinput --parallel 1"

# ---------------------------------------------------------------- browser

[tasks."docs:screenshot"]
description = "Retake the README's pictures from the showcase demo"
depends = ["setup:webkit", "demo:build"]
extends = "heavy"
run = "uv run --group browser python -m demo.screenshot"

[tasks."browser:demo"]
description = "Build the demo and check it in WebKit"
depends = ["setup:webkit", "demo:build"]
env = { HQ_DEMO_OUT = "{{config_root}}/var/demo" }
extends = "heavy"
run = "uv run --group browser python -m unittest demo.check -v"

# Each browser:* gate is one CI job, the classes split for balance. A new
# browser test class is named in one of them (test_browser_gate_tasks).
[tasks."browser:layout"]
description = "Real-browser layout invariants over the stress estate"
depends = ["setup:webkit"]
extends = "django-heavy"
run = "uv run --group browser python manage.py test hq.platform.core.browser_tests.LayoutBrowserTests --noinput --parallel 1"

[tasks."browser:navigation"]
description = "Real-browser invariants over the example estate, the frame around a page and its fragments"
depends = ["setup:webkit"]
extends = "django-heavy"
run = "uv run --group browser python manage.py test hq.platform.core.estate_browser_tests hq.platform.core.browser_tests.ReferenceBrowserTests hq.platform.core.browser_tests.FragmentBrowserTests --noinput --parallel 1"

# ------------------------------------------------------------- controller

[tasks."controller:check"]
description = "The Go controller: format, generated types, vet, race tests"
run = "controller/scripts/check.sh"

# ------------------------------------------------------------------ image
# IMAGE names the image under test; the pipeline passes the one it built.

[tasks."image:verify:healthy"]
description = "It comes up healthy"
depends = ["image:build"]
run = 'tools/pipeline/image-health.sh "${IMAGE:-severino-hq:ci-local}"'

[tasks."image:verify:host-boot"]
description = "It boots under its unit: waits for its environment, survives a crash and a reboot"
depends = ["image:build"]
run = 'tools/pipeline/host-boot-drill.sh "${IMAGE:-severino-hq:ci-local}"'
