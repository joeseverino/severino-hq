# The toolchain and every gate, declared once.
#
#   mise install        the pinned tools (versions here, checksums in mise.lock);
#                       a lazy one installs on its first use; a github:
#                       one needs lazy_bins for its shim, and `mise which`
#                       finds it only once installed
#   mise run fast       the inner loop: only what the change touches
#   mise run check      every gate CI runs; --release before a release
#   mise run <job>      one of CI's jobs: lint, test, browser, build, scan
#   mise run <gate>     one gate a verdict names, e.g. `mise run lint:ruff`
#   mise tasks          what an agent starts from; --hidden for every task
#
# A gate is a task named <job>:<gate>, declared in its job's file under
# mise-tasks/ (mise-tasks/lint.toml for lint:*), mise's default task
# directory, where it reads every .toml as a task file and every executable as a
# file task. Each CI job runs the task of its name (`mise run lint`), whose
# wildcard reaches every gate of the job, so a gate added there runs locally
# and in the pipeline with no second list to edit. `-c` keeps going past a
# failure and names every gate that failed. A task that a job's task, CI or
# the operator runs is `hide = true`: the job's wildcard and `mise run <name>`,
# which a verdict names, still reach it. No gate
# declares `sources`: mise judges them by file times alone, and a verdict also
# turns on the environment and on files no list would name. A task whose body is
# more than one line is a file under mise-tasks/, declared in its own #MISE
# header, so lint:shell lints it. This file keeps the tools, the environment,
# the templates, the development servers and the lint and scan tasks.
#
# Python dependencies come from uv.lock, which UV_LOCKED below holds every uv
# command to; nothing here needs a virtualenv made by hand. uv itself is one of
# the tools below.

min_version = "2026.10.21"

[settings]
# The runners, which build the images, the machines gates run on by hand, and
# the image an Apple-silicon machine builds for itself in `mise run build`.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]
# Here, in CI and in the images, nothing installs that mise.lock does not record.
locked = true

[settings.task]
# Gates that run together print one after another, each whole and labeled,
# never line by line into each other: an aggregate reads gate by gate, and each
# gate's failures sit under its own verdict.
output = "keep-order"

[env]
# Facts that are not tools: the Python matrix, the Cordon commit, the failure
# logs' key. Shell and workflows read the same file.
_.file = "tools/pipeline/toolchain.env"
# The npm tools setup:lint-tools installs run by name.
_.path = "tools/lint/node_modules/.bin"
SEVERINO_LOG_LEVEL = "CRITICAL"
# `uv run`, `uv sync` and `uv export` refuse a uv.lock that pyproject.toml has
# moved past, as `--locked` does. So do `uv lock` and `uv add`: change the lock
# outside mise, or with UV_LOCKED=0.
UV_LOCKED = "1"
# Go builds with the release mise installs and never downloads one, here and
# in the image.
GOTOOLCHAIN = "local"

[tools]
node = "26.13.0"
# The controller's Go is the release go.mod's toolchain line names, its one
# pin, which Renovate moves; the images install it and uv from mise.lock.
go = '{{ read_file(path="controller/go.mod") | regex_replace(pattern="(?ms).*^toolchain go([0-9.]+)$.*", rep="$1") }}'
shellcheck = "0.11.0"
# The Go linter, its linters chosen in controller/.golangci.yml (lint:controller).
"aqua:golangci/golangci-lint" = "2.15.0"
jactionlint = { version = "2.4.0", workflow = "release.yaml" }
# The workflows' security audit (lint:workflows), offline.
zizmor = "1.31.1"
# The prose linter: HQ's wording rules, in tools/lint/vale/.vale.ini (lint:prose).
# 3.25 no longer masks a template's {% comment %} block, so lint:prose reads
# comments as shown text; renovate.json skips 3.25.x.
vale = "3.24.0"
# Structural rules over the source, in tools/lint/ast-grep/ (lint:ast-grep), and the
# counts Ruff has no rule for (audit:ast).
ast-grep = "0.51.0"
yq = "4.54.1"
jq = "1.8.2"
uv = "0.13.6"
# The Scorecard the pinned ossf/scorecard-action builds against (its go.mod).
# Lazy, as age is: only lint:scorecard runs it.
scorecard = { version = "5.6.0", lazy = true }
# Seals a failed Compose run's output (tools/pipeline/seal-failure-logs.sh). Lazy:
# `mise install` leaves it to its first use, held to mise.lock all the same.
age = { version = "1.3.2", lazy = true }
# The image scan, here (image:trivy) and in Compose. Lazy, as age is.
trivy = { version = "0.76.1", lazy = true }
# Tags a proven image on main: `crane tag` PUTs the manifest's own bytes, so
# the tag names the signed digest. Lazy, as age is.
crane = { version = "0.22.1", lazy = true }

# The code graph the structural bar indexes with. Linux takes the portable
# (static) build so the runner needs no matching libc. Lazy: only
# lint:structural runs it, and its first run of the command installs it.
[tools."github:DeusData/codebase-memory-mcp"]
version = "0.12.1"
lazy = true
lazy_bins = ["codebase-memory-mcp"]

[tools."github:DeusData/codebase-memory-mcp".platforms]
linux-x64 = { asset_pattern = "codebase-memory-mcp-linux-amd64-portable.tar.gz" }
linux-arm64 = { asset_pattern = "codebase-memory-mcp-linux-arm64-portable.tar.gz" }

# The CodeQL bundle the pinned github/codeql-action defaults to (its
# src/defaults.json), so the local analysis runs the queries CI runs. Bump with
# that action. Lazy, as age is: only scan:codeql runs it.
[tools."github:github/codeql-action"]
version = "2.27.3"
version_prefix = "codeql-bundle-v"
bin_path = "codeql"
lazy = true
lazy_bins = ["codeql"]

[tools."github:github/codeql-action".platforms]
macos-arm64 = { asset_pattern = "codeql-bundle-osx64.tar.zst" }
macos-x64 = { asset_pattern = "codeql-bundle-osx64.tar.zst" }
linux-x64 = { asset_pattern = "codeql-bundle-linux64.tar.zst" }

# ------------------------------------------------------------- templates
# A gate never opens the developer's database: each Django gate extends one of
# these, which make it a new empty file for every task run, so a checkout's own
# data cannot change what a gate reports and gates run side by side never share
# one (two processes making one new file WAL at once: one is refused as
# "database is locked"). It is named as a test run's scratch is, for the mise
# that ran it, so the next test run sweeps it (hq/config/sandbox.py). A gate
# sees no extension set it did not ask for. A task extends one template and a
# template extends none, so django-heavy and django-browser restate django's
# env (test_browser_gate_tasks holds them to it): an env file
# could hold it once, but mise reads one as written, never rendered, and the
# database path is an exec. The composed suite extends django and sets what
# it changes in its own header.

[task_templates.django]
env = { SEVERINO_DATABASE_PATH = "{{ exec(command='mktemp \"${TMPDIR:-/tmp}/severino-test-gate-' ~ mise_pid ~ '-XXXXXX\"') }}", DJANGO_DEBUG = "1", DJANGO_SECRET_KEY = "gate-only-key-not-a-real-secret", DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost,testserver", SEVERINO_HQ_PLUGINS = false }

# ------------------------------------------------------------------ heavy
# A task that loads the machine runs under tools/lib/heavy.sh, which says how
# the turn is taken: its shell is mise's default behind the wrapper. Its
# SEVERINO_HEAVY_BOUND stops a hung holder once its turn has started: well
# above the slowest gate (the suite, a browser gate), and an aggregate's above
# the gates it runs in turn. It carries no mise timeout, whose clock would run
# while the task waits for its turn.
[task_templates.heavy]
env = { SEVERINO_HEAVY_BOUND = "30m" }
shell = "tools/lib/heavy.sh sh -o errexit -c"

# A Django gate that loads the machine: django's env inside a heavy turn.
[task_templates.django-heavy]
env = { SEVERINO_DATABASE_PATH = "{{ exec(command='mktemp \"${TMPDIR:-/tmp}/severino-test-gate-' ~ mise_pid ~ '-XXXXXX\"') }}", DJANGO_DEBUG = "1", DJANGO_SECRET_KEY = "gate-only-key-not-a-real-secret", DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost,testserver", SEVERINO_HQ_PLUGINS = false, SEVERINO_HEAVY_BOUND = "30m" }
shell = "tools/lib/heavy.sh sh -o errexit -c"

# A browser gate: django-heavy's env and turn, WebKit installed first, and the
# test classes its task names in `vars.classes`, which mise renders from the
# extending task's own vars.
[task_templates.django-browser]
env = { SEVERINO_DATABASE_PATH = "{{ exec(command='mktemp \"${TMPDIR:-/tmp}/severino-test-gate-' ~ mise_pid ~ '-XXXXXX\"') }}", DJANGO_DEBUG = "1", DJANGO_SECRET_KEY = "gate-only-key-not-a-real-secret", DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost,testserver", SEVERINO_HQ_PLUGINS = false, SEVERINO_HEAVY_BOUND = "30m" }
shell = "tools/lib/heavy.sh sh -o errexit -c"
depends = [{ task = "setup:browser", args = ["webkit"] }]
usage = 'flag "--fallback-face" help="Draw every page in the system face, as a reader sees it before Inter loads"'
run = "HQ_BROWSER_FACE=${usage_fallback_face:+fallback} uv run --group browser python manage.py test {{ vars.classes }} --noinput --parallel auto"

# ---------------------------------------------------------------- servers
# The development servers. Each profile is a task whose env says where it
# listens and which database it opens; tools/dev/dev.sh refuses what env cannot.
# They stay in this file because their env names files by path: mise reads an
# env path, and renders config_root inside env, from the directory of the file
# that declares the task, so the same lines in mise-tasks/ would point under mise-tasks/.

# The long-lived server behind a TLS proxy. Its facts live only in the
# gitignored dev.local.toml (tools/dev/dev.local.example.toml), which no other
# task reads. The profile's invariants come after the file, so it cannot
# change them.
[tasks.dev]
description = "The operator's long-lived server on real data, behind a TLS proxy with single sign-on and 1Password secrets; an agent runs dev:scratch"
raw = true
usage = '''
flag "--fresh" help="Delete its database and migrate a new one"
flag "--plan" help="Print what it would run under, without secrets, and exit"
'''
run = "tools/dev/dev.sh"

[tasks.dev.env]
_.file = "dev.local.toml"
UVICORN_HOST = { required = "Copy tools/dev/dev.local.example.toml to dev.local.toml and fill it in" }
UVICORN_PORT = { required = true }
DJANGO_ALLOWED_HOSTS = { required = true }
DJANGO_CSRF_TRUSTED_ORIGINS = { required = true }
SEVERINO_TRUSTED_PROXIES = { required = true }
SEVERINO_DATABASE_PATH = { required = true }
SEVERINO_OIDC_ISSUER = { required = true }
SEVERINO_OIDC_CLIENT_ID = { required = true }
DJANGO_TIME_ZONE = { required = true }
HQ_DEV_OP = { required = true }
HQ_DEV_SECRET_REF = { required = true }
HQ_DEV_OIDC_SECRET_REF = { required = true }
HQ_DEV_PROFILE = "secure"
DJANGO_DEBUG = "0"
DJANGO_BEHIND_TLS_PROXY = "1"
SEVERINO_OIDC_ENABLED = "1"
# A checkout has no admitted wheels, and admission is required whenever DEBUG is off.
SEVERINO_HQ_REQUIRE_PLUGIN_ADMISSION = "0"
DJANGO_WHITENOISE_AUTOREFRESH = "1"
SEVERINO_INFRASTRUCTURE_ENABLE_PUBLIC_DNS = "1"
SEVERINO_LOG_LEVEL = "INFO"
SEVERINO_HQ_PLUGINS = "{{ env.HQ_LOCAL_PLUGINS | default(value='') }}"
PYTHONPATH = "{{ env.HQ_LOCAL_PYTHONPATH | default(value='') }}"
SEVERINO_HQ_REVISION = "{{ exec(command='git rev-parse HEAD') }}"

# Loopback, DEBUG on, a database of this checkout's own under var/dev/scratch,
# so each worktree has its own. Shared by the scratch server and the commands
# that open its database, which read its throwaway key from secret.env.
[task_templates."dev:scratch-env".env]
_.file = "var/dev/scratch/secret.env"
HQ_DEV_PROFILE = "scratch"
DJANGO_DEBUG = "1"
UVICORN_HOST = "127.0.0.1"
UVICORN_PORT = "0"
DJANGO_ALLOWED_HOSTS = "127.0.0.1,localhost"
SEVERINO_DATABASE_PATH = "{{ config_root }}/var/dev/scratch/db.sqlite3"
SEVERINO_MEDIA_ROOT = "{{ config_root }}/var/dev/scratch/media"
SEVERINO_EXPORTS_ROOT = "{{ config_root }}/var/dev/scratch/exports"
SEVERINO_HQ_REQUIRE_PLUGIN_ADMISSION = "0"
SEVERINO_INFRASTRUCTURE_ENABLE_PUBLIC_DNS = "1"
SEVERINO_LOG_LEVEL = "INFO"
SEVERINO_HQ_PLUGINS = "{{ env.HQ_LOCAL_PLUGINS | default(value='') }}"
PYTHONPATH = "{{ env.HQ_LOCAL_PYTHONPATH | default(value='') }}"

[tasks."dev:scratch"]
extends = "dev:scratch-env"
raw = true
description = "To try a change in a browser: a throwaway server on loopback, DEBUG on, a new database each start (--seed fills it); --demo to browse the saved demo"
usage = '''
flag "--demo" help="Serve the public demo's static site on loopback instead, built first by demo:build when its sources moved: --seed names which, showcase by default"
flag "--keep" help="Reuse the last scratch database"
flag "--seed <seed>" help="Fill it with a named data set (hq/platform/core/seeds.py): the example estate as showcase (advanced posture) or standard, empty, or scale (years of records)" {
    choices "showcase" "standard" "empty" "scale"
}
flag "--port <port>" help="A fixed port instead of a free one"
flag "--reload" negate="--no-reload" help="Restart on each change to Python or a template, as it does by default; --no-reload serves the code it started with, without the reloader's supervising process and its memory"
flag "--plan" help="Print what it would run under and exit"
'''
run = "tools/dev/dev.sh"

[tasks."dev:session"]
extends = "dev:scratch-env"
hide = true
description = "To reach the scratch server from a script: a signed-in session cookie for it"
# A program reads the cookie, so stdout is the command's own, unlabeled.
raw = true
run = "uv run python manage.py dev_session operator"

# `mise run manage --scratch`: the env is the scratch server's, which mise
# fixes per task, so the scratch half is a step of its own.
[tasks."manage:scratch"]
extends = "dev:scratch-env"
hide = true
raw = true
description = "manage.py on this checkout's scratch database, extensions loaded: mise run manage --scratch"
run = "uv run python manage.py"

# ------------------------------------------------------------- aggregates
# A task that runs gates runs them under tools.gate.verdict, which ends its
# output on the tasks and tests that failed and keeps that line, and how long
# each task took, in var/gate/<name>.txt. Those with a body of more than one
# line are files under mise-tasks/: check, test, browser and build.

[tasks.fast]
description = "While editing: the tests the change reaches, and the quick gates that read the paths it touched"
# Its test run alone takes the heavy turn (tools/gate/fast.py), so the quick
# gates of one worktree never wait on another's suite; the bound is that run's.
extends = "django"
env = { SEVERINO_HEAVY_BOUND = "30m" }
# The lint tools the quick gates and the stylesheet tests run.
depends = ["setup:lint-tools"]
usage = '''
arg "[base]" env="CHECK_BASE" help="The ref to diff against; default origin/main, then main"
flag "--list" help="Print the selected test modules and run nothing"
flag "--parallel <workers>" env="CHECK_PARALLEL" default="auto" help="Test workers per suite; 1 rules out an order or isolation failure"
'''
run = "uv run python -m tools.gate.fast"

[tasks.lint]
description = "After editing, or when fast is not enough: CI's lint job, every lint:* gate: lint, types, structure, dependencies, security, derived files"
# Run-form, so the gates and the installs they depend on run inside one turn.
extends = "heavy"
env = { SEVERINO_HEAVY_BOUND = "2h" }
run = "uv run python -m tools.gate.verdict lint mise run -c 'lint:*'"

[tasks.scan]
description = "To reproduce an alert CI's scan job raised: CodeQL's security-and-quality queries find no alert; slow"
depends = ["scan:*"]

# Whether this checkout can compose its extensions: `mise doctor project` names
# each gap with its fix. A check that needs the set depends on it, so without
# one it is reported blocked and one missing file is reported once.
[doctor.checks."local:extensions"]
description = "mise.local.toml names an extension set, so the composed suite and dev servers load it"
run = 'test -n "$HQ_LOCAL_PLUGINS"'
hint = "mise run setup:extensions <checkout>... names the set from your extension checkouts"

[doctor.checks."local:extension-sources"]
description = "Every directory on HQ_LOCAL_PYTHONPATH exists"
depends = "local:extensions"
run = 'IFS=:; for d in $HQ_LOCAL_PYTHONPATH; do test -d "$d" || exit 1; done'
hint = "mise run setup:extensions <checkout>... names each package's src directory again"

[doctor.checks."local:extension-imports"]
description = "Every module HQ_LOCAL_PLUGINS names imports with the host's libraries"
depends = "local:extensions"
run = '''PYTHONPATH="$HQ_LOCAL_PYTHONPATH" uv run --no-sync python -c 'import importlib, os; [importlib.import_module(p.split(":")[0]) for p in os.environ["HQ_LOCAL_PLUGINS"].split(",")]' '''
hint = "Run uv sync; if it still fails, the extension needs a newer host: update both checkouts to main"
timeout = "30s"
