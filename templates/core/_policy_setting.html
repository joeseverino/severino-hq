<div class="policy-setting">
  <span class="policy-setting-name">{{ cell.column }}{% if cell.dormant %} <span class="muted">· off on this server</span>{% endif %}</span>
  {% if cell.unavailable %}
    <span class="muted">{{ cell.unavailable }}</span>
  {% else %}
    <select class="policy-select rule-{{ cell.rule|default:'default' }}{% if cell.dormant %} is-dormant{% endif %}" name="{{ cell.field }}" aria-label="{{ row.label }}, {{ group.label }}, for {{ cell.column }}">
      {% for value, label in cell.options %}
        <option value="{{ value }}"{% if value == cell.rule or not value and not cell.rule %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  {% endif %}
</div>
