<form class="command-center-palette" action="{% url 'search' %}" method="get" data-command-center-form>
  <label class="visually-hidden" for="command-center-query">Find anything</label>
  <div class="command-center-query">
    {% include "partials/_icon.html" with name="search" only %}
    <input id="command-center-query" name="q" type="search"
           placeholder="Try “deploy”, “certificate”, or “unreachable”"
           autocomplete="off" spellcheck="false" role="combobox"
           aria-autocomplete="list" aria-controls="command-center-options"
           aria-expanded="false" data-command-center-input>
    <kbd class="keyboard-only">⌘ K</kbd>
  </div>
  <div class="command-center-results" data-command-center-results data-fragment="{% url 'search' %}" data-fragment-name="palette" data-fragment-failure="Could not load results. Press Enter to search." aria-live="polite">
    <p class="command-center-loading muted">Loading…</p>
  </div>
  <footer class="command-center-footer keyboard-only">
    <span><kbd>↑</kbd><kbd>↓</kbd> choose</span>
    <span><kbd>Enter</kbd> open <span class="command-center-enter-hint">or search everything</span></span>
    <span><kbd>Esc</kbd> close</span>
  </footer>
</form>
