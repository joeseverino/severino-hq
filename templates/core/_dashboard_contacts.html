{% if recent_contacts %}
  <section class="card">
    <div class="section-head">
      <h2>Recent contacts</h2>
      {% if unread_contacts_count %}<span class="count">{{ unread_contacts_count }} unread</span>{% endif %}
    </div>
    {% include "partials/_record_list.html" with rows=recent_contacts %}
    <p class="section-foot"><a href="{% url 'contacts:list' %}">All submissions &rarr;</a></p>
  </section>
{% endif %}
