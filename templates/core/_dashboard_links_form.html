<form method="post" action="{% url 'dashboard_links' %}" data-fragment-target="dashboard-links" data-fragment-busy="Saving…" data-fragment-failure="Could not save.">
  {% write_token %}
  <input type="hidden" name="next" value="{% url 'dashboard' %}">
  <ul class="ext-choices">
    {% for choice in external_choices %}
      <li>
        <label>
          <input type="checkbox" name="href" value="{{ choice.href }}"{% if choice.chosen %} checked{% endif %}>
          <span class="ext-choice-label">{{ choice.label|breakable }}</span>
          <span class="ext-choice-sub muted">{{ choice.sub|breakable }}</span>
        </label>
      </li>
    {% endfor %}
  </ul>
  {% url 'dashboard' as dashboard %}
  {% include "partials/_form_actions.html" with verb="Save" cancel_url=dashboard live=True only %}
</form>
