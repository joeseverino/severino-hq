{% extends "page.html" %}
{% block page %}
<form method="post" class="form">
  {% csrf_token %}
  {% include "partials/_form_errors.html" %}
  {{ form }}
  <div class="form-actions">
    <button type="submit" class="primary">{% if object %}Save changes{% else %}Save document{% endif %}</button>
    <a class="btn" href="{% url 'docs_index:list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
