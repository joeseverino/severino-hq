{% extends "base.html" %}
{% block title %}Something broke{% endblock %}
{% block content %}
<section class="notice-page">
  <p class="notice-code">500</p>
  <h1>Something broke</h1>
  <p class="notice-body">
    The error is in the log{% if request_id %}, under request id <code>{{ request_id }}</code>{% endif %}. Trying again is safe.
  </p>
  <p class="page-actions">
    <a class="btn primary" href="{% url 'dashboard' %}">Back to the dashboard</a>
  </p>
</section>
{% endblock %}
