{% extends "list_page.html" %}
{% block row %}
  <td><a href="{{ row.get_absolute_url }}"><strong>{{ row.name }}</strong></a><br><span class="muted">{{ row.slug }}</span></td>
  <td>{{ row.get_category_display }}</td>
  <td><span class="pill pill-{{ row.status }}">{{ row.get_status_display }}</span></td>
  <td class="muted">{{ row.technologies_used|truncatechars:60 }}</td>
  <td class="muted">{{ row.updated_at }}</td>
  <td class="row-actions"><a href="{% url 'projects:edit' row.slug %}">Edit</a></td>
{% endblock %}
{% block empty %}No projects yet. <a href="{% url 'projects:create' %}">New project</a>{% endblock %}
