{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block content %}
<section class="notice-page">
  <p class="notice-code">404</p>
  <h1>That page isn't here</h1>
  <p class="notice-body">
    The link may be out of date, or the record may have been deleted. Nothing is
    broken — the address just doesn't match anything.
  </p>
  <p class="page-actions">
    <a class="btn primary" href="{% url 'dashboard' %}">Back to the dashboard</a>
  </p>
</section>
{% endblock %}
