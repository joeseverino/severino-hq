<th aria-sort="{{ direction }}">
  <a class="table-sort-link" href="{{ url }}" aria-label="Sort by {{ label }}, {{ next_direction }}">{{ label }}<span aria-hidden="true" class="sort-indicator">{% comment %}
    U+FE0E forces text presentation. Bare arrows render as colour emoji on iOS,
    so a sorted column header came out looking like a sticker.
    {% endcomment %}{% if direction == "ascending" %}↑︎{% elif direction == "descending" %}↓︎{% else %}↕︎{% endif %}</span></a>
</th>
