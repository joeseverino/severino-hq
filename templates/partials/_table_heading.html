<th{% if css %} class="{{ css }}"{% endif %} data-kind="{{ kind }}"{% if drop %} data-drop="{{ drop }}"{% endif %}{% if title %} title="{{ title }}"{% endif %}{% if server_sort %} aria-sort="{{ server_sort.direction }}"{% elif local_sort %} aria-sort="none" data-sort-ready{% endif %}>
  {% if select_all %}<input type="checkbox" data-select-all aria-label="{{ label }}">{% elif server_sort %}<a class="table-sort-link" data-hit href="{% querystring sort=server_sort.next page=None %}" aria-label="Sort by {{ label }}, {{ server_sort.next_direction }}">{{ label|button_words }}<span aria-hidden="true" class="sort-indicator"></span></a>{% elif local_sort %}<button type="button" class="table-sort-link" data-hit data-sort-local aria-label="Sort by {{ label }}">{{ label|button_words }}<span aria-hidden="true" class="sort-indicator"></span></button>{% elif hidden %}<span class="visually-hidden">{{ label|breakable }}</span>{% else %}{{ label|breakable }}{% endif %}
</th>
