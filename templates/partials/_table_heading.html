{% partialdef named %}{{ label|breakable }}{% if note %} <span{% if note_css %} class="{{ note_css }}"{% endif %}>{{ note|breakable }}</span>{% endif %}{% endpartialdef %}<th{% if css %} class="{{ css }}"{% endif %} data-kind="{{ kind }}"{% if drop %} data-drop="{{ drop }}"{% endif %}{% if title %} title="{{ title }}"{% endif %}{% if server_sort %} aria-sort="{{ server_sort.direction }}"{% elif local_sort %} aria-sort="none" data-sort-ready{% endif %}>
  {% if select_all %}<input type="checkbox" data-select-all aria-label="{{ label }}">{% elif server_sort %}<a class="table-sort-link" href="{{ server_sort.url }}" aria-label="Sort by {{ label }}, {{ server_sort.next_direction }}">{% partial named %}<span aria-hidden="true" class="sort-indicator"></span></a>{% elif local_sort %}<button type="button" class="table-sort-link" data-sort-local aria-label="Sort by {{ label }}">{% partial named %}<span aria-hidden="true" class="sort-indicator"></span></button>{% elif hidden %}<span class="visually-hidden">{{ label|breakable }}</span>{% else %}{% partial named %}{% endif %}
</th>
