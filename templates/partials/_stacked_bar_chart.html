<figure class="chart-card card">
  <figcaption>
    <h2>{{ chart.title|breakable }}</h2>
    <p>{{ chart.description|breakable }}</p>
  </figcaption>
  {% if chart.empty %}
    {% include "partials/_empty_state.html" with message="Not enough data to chart yet." %}
  {% else %}
    <div class="chart-legend" aria-label="Legend">
      {% for series in chart.series %}<span><i class="chart-series-{{ series.slot }}" aria-hidden="true"></i>{{ series.label|breakable }}</span>{% endfor %}
    </div>
    <div class="chart-scroll">
      <div class="chart-frame{% if chart.dense %} chart-frame-dense{% endif %}" style="--gutter: {{ chart.gutter }}%">
      {% comment %}
      aria-hidden, with the exact numbers in the data table below. A screen
      reader announcing 60 bars one at a time is worse than a table it can
      navigate, and the table is always rendered.
      {% endcomment %}
      <svg class="bar-chart" preserveAspectRatio="none" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ chart.title }}. {{ chart.description }}" data-chart>
        {% for tick in chart.ticks %}<line class="chart-grid" x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ tick.y }}" y2="{{ tick.y }}"></line>{% endfor %}
        {% for bar in chart.bars %}{% if bar.height %}<rect class="chart-series-{{ bar.slot }}" x="{{ bar.x }}" y="{{ bar.y }}" width="{{ bar.width }}" height="{{ bar.height }}" data-tip="{{ bar.tooltip }}"></rect>{% endif %}{% endfor %}
        
      </svg>
        {% comment %}
        The axis, in HTML. Positioned by the same percentages the geometry above
        is drawn at, so a label sits over its own point at any card width, and
        rendered by the browser rather than by the SVG, so it stays 11px however
        far the drawing has been scaled to fit.
        {% endcomment %}
        {% for tick in chart.axis_y %}<span class="chart-axis chart-tick" style="--at: {{ tick.at }}%">{{ tick.label|breakable }}</span>{% endfor %}
        <div class="chart-cats">{% for category in chart.axis_x %}<span class="chart-axis chart-category" style="--at: {{ category.at }}%">{{ category.label|breakable }}</span>{% endfor %}</div>
      </div>
    </div>
    <details class="chart-data">
      <summary>View chart data</summary>
      {% table_region chart.title pane=True %}
        <table class="data-table compact-table">
          <thead><tr>{% table_heading "Period" "status" %}{% for heading in chart.table_headings %}{% table_heading heading "numeric" %}{% endfor %}</tr></thead>
          <tbody>{% for row in chart.table_rows %}<tr><th>{{ row.label|breakable }}</th>{% for cell in row.cells %}<td>{{ cell|breakable }}</td>{% endfor %}</tr>{% endfor %}</tbody>
        </table>
      {% endtable_region %}
    </details>
  {% endif %}
</figure>
