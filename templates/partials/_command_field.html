<div class="field{% if field.errors %} has-errors{% endif %}{% if field.name == '__confirm_effect' %} command-confirm{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check-row">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {{ field.errors }}
</div>
