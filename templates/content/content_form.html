{% extends "page.html" %}
{% block page %}
<form method="post" class="form">
  {% csrf_token %}
  {% include "partials/_form_errors.html" %}
  {{ form }}
  <div class="form-actions">
    <button type="submit" class="primary">{% if object %}Save changes{% else %}Save {{ noun|breakable }}{% endif %}</button>
    <a class="btn" href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'content:list' %}{% endif %}">Cancel</a>
  </div>
</form>
{% endblock %}
